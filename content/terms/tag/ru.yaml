title: Тег
short_definition: Компактная метка, используемая для классификации, категоризации или описания элемента с коротким
  значением.
analogy: '«Tag» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно проверить.'
mechanism: 'Как работает «Tag»: Компактная метка, используемая для классификации, категоризации или описания элемента
  с коротким значением. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Тег» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Tag» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Tag». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Tag» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
