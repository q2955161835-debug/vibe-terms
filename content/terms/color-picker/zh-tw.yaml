title: "顏色選擇器"
short_definition: "用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制。"
analogy: "將顏色選擇器視為工作坊的 UI/UX 和可存取性部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制項。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解顏色選擇器後，Vibe Coding 初學者可以準確指出相關的 UI/UX 與無障礙問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在 Vibe 術語中，當學習者到達設計階段時，使用 Color Picker 作為術語檢查點；將定義對應到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋顏色選擇器如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語顏色選擇器視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
