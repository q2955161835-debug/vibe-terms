title: Память агента
short_definition: Сохраненная информация, которую агент может получить позже для поддержания полезного состояния
  после немедленного запроса.
analogy: '«Память агента» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «Память агента»: Сохраненная информация, которую агент может получить позже для поддержания
  полезного состояния после немедленного запроса. На практике механизм зависит от конфигурации, потока данных и
  границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Память агента» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Память агента» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Память агента». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Память агента» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
