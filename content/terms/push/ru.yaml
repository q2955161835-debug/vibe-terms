title: Push
short_definition: Отправка локальных коммитов и ссылок Git в удаленный репозиторий.
analogy: 'Представьте «Push» как инструмент в наборе разработчика: он решает задачу в области «Git и совместная
  работа», но результат зависит от настройки.'
mechanism: 'Как работает «Push»: Отправка локальных коммитов и ссылок Git в удаленный репозиторий. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Push» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Push» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Push». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Push» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
