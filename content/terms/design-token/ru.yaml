title: Дизайнерский токен
short_definition: Именованное, многократно используемое значение проекта, такое как цвет, единица измерения, радиус
  или настройка оформления, общая для всех компонентов.
analogy: '«дизайн токен» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «дизайн токен»: Именованное, многократно используемое значение проекта, такое как цвет,
  единица измерения, радиус или настройка оформления, общая для всех компонентов. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Дизайнерский токен» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «дизайн токен» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «дизайн токен». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «дизайн токен» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
