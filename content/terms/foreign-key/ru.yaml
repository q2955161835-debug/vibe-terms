title: Foreign Key
short_definition: 'Foreign Key — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A field or constraint that references a key in another table to represent and protect a relationship.'
analogy: Foreign Key можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Foreign Key — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A field or constraint that references a key in another table to represent and protect a relationship.'
why_it_matters: Понимание Foreign Key помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Foreign Key помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Foreign Key в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Foreign Key доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
