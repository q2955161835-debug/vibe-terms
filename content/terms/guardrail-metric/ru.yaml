title: Метрика защитного ограничения
short_definition: Метрика, отслеживаемая для того, чтобы гарантировать, что улучшение целевой метрики не приведет
  к неприемлемому ущербу где-либо еще.
analogy: 'Проще представить «Метрика защитного ограничения» как правило работы в разделе «Продукт и требования»:
  название задает направление, а код показывает поведение.'
mechanism: 'Как работает «Метрика защитного ограничения»: Метрика, отслеживаемая для того, чтобы гарантировать,
  что улучшение целевой метрики не приведет к неприемлемому ущербу где-либо еще. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Метрика защитного ограничения» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Метрика защитного ограничения» в одном пользовательском потоке или
  тесте, зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Метрика защитного ограничения». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Метрика защитного ограничения» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
