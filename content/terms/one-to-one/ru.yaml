title: Один к одному
short_definition: Отношение, при котором каждая запись на каждой стороне соответствует не более чем одной записи
  на другой стороне.
analogy: 'Проще представить «Связь один-к-одному» как правило работы в разделе «Данные и базы данных»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Связь один-к-одному»: Отношение, при котором каждая запись на каждой стороне соответствует
  не более чем одной записи на другой стороне. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Один к одному» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Связь один-к-одному» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Связь один-к-одному». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Связь один-к-одному» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
