title: Значок приложения
short_definition: Графический идентификатор приложения, используемый операционными системами в средствах запуска,
  на главных экранах, в поиске, магазинах или настройках.
analogy: 'Представьте «Значок приложения» как инструмент в наборе разработчика: он решает задачу в области «UI/UX
  и доступность», но результат зависит от настройки.'
mechanism: 'Как работает «Значок приложения»: Графический идентификатор приложения, используемый операционными системами
  в средствах запуска, на главных экранах, в поиске, магазинах или настройках. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Значок приложения» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Значок приложения» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Значок приложения». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Значок приложения» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
