title: HTTP Method
short_definition: Ein verb such as GET, POST, PUT, PATCH, oder DELETE die Zustände the intended Vorgang von an HTTP Anfrage.
analogy: Betrachte HTTP Method als Orientierungsschild in web network. Es weist auf die richtige technische Stelle, ersetzt
  aber weder die Implementierung noch deren Prüfung.
mechanism: Ein verb such as GET, POST, PUT, PATCH, oder DELETE die Zustände the intended Vorgang von an HTTP Anfrage. In einem
  realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer HTTP Method versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in web network benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient HTTP Method in der Phase environment als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie HTTP Method in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff HTTP Method als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
