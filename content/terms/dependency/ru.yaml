title: Dependency
short_definition: 'Dependency — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: External code, package, service, or component that another part of a system relies on.'
analogy: Dependency можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Dependency — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: External code, package, service, or component that another part of a system relies on.'
why_it_matters: Понимание Dependency помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Dependency помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Dependency в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Dependency доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
