title: "唯一鍵"
short_definition: "確保值或值組合不會在記錄之間重複的資料庫規則。"
analogy: "可以把唯一鍵想成資料表中的身分證號：每筆資料都必須有不重複的識別值，才能避免兩筆資料被當成同一筆。"
mechanism: "確保值或值組合不會在記錄之間重複的資料庫規則。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解唯一鍵後，Vibe Coding 初學者可以準確指出相關的資料與資料庫問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，為唯一鍵指定使用者資料的電子郵件欄位，插入重複值時確認資料庫會拒絕並回傳可處理的錯誤。"
ai_prompt_example: "請檢查這個專案的資料表如何避免重複資料，指出適合建立唯一鍵的欄位或欄位組合，僅修改必要的綱要與測試，並提供驗證命令。"
common_mistake: "實作唯一鍵時只在應用程式中先查詢再新增，卻沒有在資料庫建立唯一限制，因而在並行請求下仍可能寫入重複資料。"
