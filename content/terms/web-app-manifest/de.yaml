title: Web App Manifest
short_definition: Ein JSON Datei describing installable Web-app metadata such as name, icons, start URL, und display mode.
analogy: 'Ordne Web App Manifest im Bereich Frontend-Entwicklung als beschriftetes Werkzeug ein: Die Beschriftung grenzt den
  Prüfbereich ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein JSON Datei describing installable Web-app metadata such as name, icons, start URL, und display mode. In einem
  realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Web App Manifest versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Web App Manifest in der Phase Oberflächenlogik als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Web App Manifest in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Web App Manifest als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
