title: バックエンド
short_definition: データ、権限、ビジネス ルール、統合を処理するサーバー側ロジック。
analogy: 店頭を実際に機能させるキッチンとストックルーム。
why_it_matters: バックエンドがルールを強制しない場合、きれいなインターフェイスでも安全ではない、または偽物になる可能性があります。
ai_prompt_example: バックエンドでリクエストを検証し、無効な入力に対して 400 エラーを返します。ブラウザの検証だけに依存しないでください。
common_mistake: 非表示のフロントエンド コントロールがセキュリティ境界であると仮定します。
status: draft
source_content_version: 1
mechanism: バックエンドはサーバー側で入力を検証し、データアクセスや業務ルールを適用して、クライアント向けの結果を返します。
project_example: Vibe Termsでは、静的サイトにバックエンドを組み込まず、生成済みデータとブラウザ実行の境界を確認します。
