title: 冒烟测试
short_definition: 冒烟测试 是“测试与调试”中的术语。当前为待人工审校的草稿。英文标准定义：A small set of high-value checks run first to confirm a build is basically usable before deeper testing.
analogy: 可以先把 冒烟测试 想成软件开发工具箱里一个有明确用途的标签；真正使用时仍要结合所在代码、数据流和用户场景判断。
mechanism: 冒烟测试 是“测试与调试”中的术语。当前为待人工审校的草稿。英文标准定义：A small set of high-value checks run first to confirm a build is basically usable before deeper testing.
why_it_matters: 理解 冒烟测试 后，你能更准确地告诉 AI 你指的是系统的哪一部分，并要求它给出可验证的实现证据。
project_example: 理解 冒烟测试 后，你能更准确地告诉 AI 你指的是系统的哪一部分，并要求它给出可验证的实现证据。
ai_prompt_example: 解释 冒烟测试 在这个项目中的作用。指出涉及的文件或系统边界，只做最小必要改动，并给出我可以验证结果的步骤。
common_mistake: 只记住 冒烟测试 这个名词，却没有检查它在当前项目里的真实行为、数据流和失败情况。
