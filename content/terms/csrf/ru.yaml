title: CSRF
short_definition: Подделка межсайтового запроса — атака, в результате которой браузер жертвы отправляет нежелательный
  аутентифицированный запрос на другой сайт.
analogy: 'Проще представить «CSRF» как правило работы в разделе «Безопасность и приватность»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «CSRF»: Подделка межсайтового запроса — атака, в результате которой браузер жертвы отправляет
  нежелательный аутентифицированный запрос на другой сайт. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «CSRF» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «CSRF» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «CSRF». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «CSRF» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
