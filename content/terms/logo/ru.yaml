title: Логотип
short_definition: Отличительный визуальный знак или словесный знак, используемый для идентификации бренда, продукта
  или организации.
analogy: 'Проще представить «Logo» как правило работы в разделе «UI/UX и доступность»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Logo»: Отличительный визуальный знак или словесный знак, используемый для идентификации
  бренда, продукта или организации. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Логотип» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Logo» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Logo». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Logo» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
