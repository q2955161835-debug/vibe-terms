title: "詞元（Token）"
short_definition: "詞元（Token）是語言模型讀取或產生的文字單元；單字可以分割成一個或多個詞元。"
analogy: "可以把詞元（Token）想成語言模型閱讀文字時切下來的拼圖片段：模型會依這些片段計算輸入、產生回應並估算用量。"
mechanism: "詞元（Token）是語言模型讀取或產生的文字單元；單字可以分割成一個或多個詞元。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解詞元（Token）後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，針對詞元（Token）記錄一段提示的輸入詞元數、回應詞元數與總成本，調整提示內容後再比較用量與輸出品質。"
ai_prompt_example: "請檢查這個專案如何計算詞元（Token），指出輸入、輸出與成本統計的來源，僅修改必要程式，並提供可重現的驗證命令。"
common_mistake: "把詞元（Token）和完整單字畫上等號，或只看字元數估算模型用量，卻沒有確認實際分詞方式與輸入輸出統計。"
