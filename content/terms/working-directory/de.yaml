title: Arbeitsverzeichnis
short_definition: Das Verzeichnis, das ein Prozess oder eine Shell derzeit als Basis für relative Pfade behandelt.
analogy: 'Ein praktischer Vergleich für Arbeitsverzeichnis: ein markiertes Werkzeug in Computer & Entwicklungsumgebung, dessen
  Zweck erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Das Verzeichnis, das ein Prozess oder eine Shell derzeit als Basis für relative Pfade behandelt. In einem realen
  Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Arbeitsverzeichnis versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Computer & Entwicklungsumgebung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Arbeitsverzeichnis in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Arbeitsverzeichnis in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Arbeitsverzeichnis als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
