title: "最小權限"
short_definition: "僅授予任務所需的權限且不授予超出必要範圍的存取權限的安全原則。"
analogy: "在安全設計中，「最小權限」像一道需要驗證的門檻：它涉及「僅授予任務所需的權限且不授予超出必要範圍的存取權限的安全原則」，不能只看名稱就判定安全。"
mechanism: "僅授予任務所需的權限且不授予超出必要範圍的存取權限的安全原則。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解最小權限後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「最小權限」放進登入流程、權限檢查或安全日誌中：檢查重點是「僅授予任務所需的權限且不授予超出必要範圍的存取權限的安全原則」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「最小權限」為例，說明如何實現「僅授予任務所需的權限且不授予超出必要範圍的存取權限的安全原則」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「最小權限」這個名稱就判定已經正確實作；請根據「僅授予任務所需的權限且不授予超出必要範圍的存取權限的安全原則」檢查實際行為、資料流、錯誤情境與測試結果。"
