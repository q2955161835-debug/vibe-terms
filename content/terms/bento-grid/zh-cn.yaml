title: "Bento 网格（Bento Grid）"
short_definition: "一种布局模式，将内容排列到连贯网格内不同大小的矩形图块中。"
analogy: "可以把 Bento 网格理解为便当盒式的版面：不同大小的卡片像格子一样组合，同时保持整体对齐。"
mechanism: "实现上，这一概念会围绕“一种布局模式，将内容排列到连贯网格内不同大小的矩形图块中。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "Bento 网格能在有限空间里组织不同优先级的内容，但也要检查卡片顺序、窄屏重排和可读性。"
project_example: "在 Vibe Terms 的设计体验阶段，可以用 Bento 网格排列术语卡片，让重点术语占据更大卡片，并验证窄屏下的排列顺序和间距。"
ai_prompt_example: "请检查这个项目的 Bento 网格：指出网格列数、卡片尺寸和响应式规则，只做必要的最小改动，并验证不同屏宽下的排列。"
common_mistake: "不要只把卡片放进 CSS Grid 就称为 Bento 网格；还要确认尺寸层次、对齐关系和窄屏退化策略。"
