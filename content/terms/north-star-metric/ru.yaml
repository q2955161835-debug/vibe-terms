title: Метрика Полярной звезды
short_definition: Основная метрика продукта, предназначенная для представления устойчивой ценности, предоставляемой
  пользователям, и определения долгосрочного направления продукта.
analogy: 'Проще представить «Северная звезда» как правило работы в разделе «Продукт и требования»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Северная звезда»: Основная метрика продукта, предназначенная для представления устойчивой
  ценности, предоставляемой пользователям, и определения долгосрочного направления продукта. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Метрика Полярной звезды» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Северная звезда» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Северная звезда». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Северная звезда» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
