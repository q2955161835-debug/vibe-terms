title: Реляционная база данных
short_definition: Модель базы данных, в которой данные хранятся в таблицах, связанных ключами и запрашиваемых с
  помощью реляционных операций.
analogy: 'Проще представить «Реляционная база данных» как правило работы в разделе «Данные и базы данных»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Реляционная база данных»: Модель базы данных, в которой данные хранятся в таблицах, связанных
  ключами и запрашиваемых с помощью реляционных операций. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Реляционная база данных» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Реляционная база данных» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Реляционная база данных». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Реляционная база данных» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
