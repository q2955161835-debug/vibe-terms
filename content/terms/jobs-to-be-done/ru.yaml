title: Jobs to Be Done
short_definition: Структура для описания прогресса, которого человек пытается достичь в ситуации, а не для определения
  его только с помощью демографических данных.
analogy: '«Jobs to Be Done» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «Jobs to Be Done»: Структура для описания прогресса, которого человек пытается достичь
  в ситуации, а не для определения его только с помощью демографических данных. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Jobs to Be Done» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Jobs to Be Done» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Jobs to Be Done». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Jobs to Be Done» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
