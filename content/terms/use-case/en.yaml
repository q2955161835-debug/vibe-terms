title: Use Case
short_definition: A structured description of how an actor and a system interact to achieve a goal, including important alternatives or failures.
analogy: 'Think of Use Case as a labeled tool in the product & requirements part of a workshop: the label tells you what problem area to inspect, but the real behavior still comes from the implementation.'
mechanism: A structured description of how an actor and a system interact to achieve a goal, including important alternatives or failures. In a real project, its exact behavior depends on the surrounding technology, configuration, and data flow, so verify the concrete implementation rather than relying on the label alone.
why_it_matters: Knowing Use Case lets a Vibe Coding beginner name the exact product & requirements concern they mean and ask an AI coding agent for a change plus evidence that the behavior is correct.
project_example: In Vibe Terms, use Use Case as a vocabulary checkpoint when a learner reaches the requirements stage; connect the definition to one visible page, file, request, data structure, or verification step rather than teaching it in isolation.
ai_prompt_example: Explain how Use Case applies to this project. Point to the exact files or system boundary involved, make only the smallest necessary change, and show the command or user flow I can use to verify the result.
common_mistake: Treating the term Use Case as proof that an implementation is correct without checking actual behavior, data flow, permissions, failure cases, or the relevant test.
quiz:
- question: Which description best matches Use Case?
  options:
  - A structured description of how an actor and a system interact to achieve a goal, including important alternatives or failures.
  - A visual decoration that has no effect on software behavior.
  - A guarantee that every implementation is secure and correct.
  answer: 0
- question: When an AI says it used Use Case, what should you do next?
  options:
  - Accept the label as proof.
  - Check the concrete implementation and verify the relevant behavior.
  - Rename the files so the term appears in the project.
  answer: 1
- question: Which prompt is more useful for working with Use Case?
  options:
  - “Make Use Case better.”
  - “Explain where Use Case appears, change the smallest necessary part, and show how to verify it.”
  - “Rewrite the whole project.”
  answer: 1
