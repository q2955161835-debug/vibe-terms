title: Ausgabekodierung
short_definition: Escaping von Daten für ihren Ausgabekontext, sodass sie als Daten und nicht als ausführbares HTML, JavaScript,
  SQL oder eine andere Sprache behandelt werden.
analogy: 'Für Ausgabekodierung hilft ein Bild aus Sicherheit & Datenschutz: Das Etikett weist auf das Problemfeld, ersetzt
  aber weder den Code noch die Prüfung des Datenflusses.'
mechanism: Escaping von Daten für ihren Ausgabekontext, sodass sie als Daten und nicht als ausführbares HTML, JavaScript,
  SQL oder eine andere Sprache behandelt werden. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Ausgabekodierung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Ausgabekodierung in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Ausgabekodierung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Ausgabekodierung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
