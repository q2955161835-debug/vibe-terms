title: Art Deco
short_definition: 'Art Deco — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A decorative style characterized by geometric ornament, symmetry, strong verticals, luxurious materials, and 1920s–1930s visual references.'
analogy: Art Deco можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Art Deco — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A decorative style characterized by geometric ornament, symmetry, strong verticals, luxurious materials, and 1920s–1930s visual references.'
why_it_matters: Понимание Art Deco помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Art Deco помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Art Deco в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Art Deco доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
