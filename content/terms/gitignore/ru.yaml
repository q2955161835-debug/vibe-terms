title: .gitignore
short_definition: '.gitignore — термин из раздела «Git и совместная работа». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A Git pattern file that tells Git which untracked paths should normally be ignored.'
analogy: .gitignore можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: '.gitignore — термин из раздела «Git и совместная работа». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A Git pattern file that tells Git which untracked paths should normally be ignored.'
why_it_matters: Понимание .gitignore помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание .gitignore помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль .gitignore в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название .gitignore доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
