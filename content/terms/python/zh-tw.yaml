title: "Python"
short_definition: "一種通用程式語言，以可讀語法和廣泛應用於自動化、資料工作、Web 後端和 AI 而聞名。"
analogy: "在開發環境裡，「Python」像一個可重複使用的工作零件；重點是理解「一種通用程式語言，以可讀語法和廣泛應用於自動化、資料工作、Web 後端和 AI 而聞名」如何影響執行結果。"
mechanism: "一種通用程式語言，以可讀語法和廣泛應用於自動化、資料工作、Web 後端和 AI 而聞名。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 Python 後，Vibe Coding 初學者可以準確指出相關的電腦與開發環境問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「Python」放進命令列、設定檔或建置結果中：檢查重點是「一種通用程式語言，以可讀語法和廣泛應用於自動化、資料工作、Web 後端和 AI 而聞名」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「Python」為例，說明如何實現「一種通用程式語言，以可讀語法和廣泛應用於自動化、資料工作、Web 後端和 AI 而聞名」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「Python」這個名稱就判定已經正確實作；請根據「一種通用程式語言，以可讀語法和廣泛應用於自動化、資料工作、Web 後端和 AI 而聞名」檢查實際行為、資料流、錯誤情境與測試結果。"
