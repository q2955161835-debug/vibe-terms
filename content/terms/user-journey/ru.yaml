title: User Journey
short_definition: 'User Journey — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A broader view of a user''s experience across stages, touchpoints, goals, emotions, and friction over time.'
analogy: User Journey можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'User Journey — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A broader view of a user''s experience across stages, touchpoints, goals, emotions, and friction over time.'
why_it_matters: Понимание User Journey помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание User Journey помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль User Journey в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название User Journey доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
