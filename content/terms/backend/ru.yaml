title: Бэкенд
short_definition: Серверная логика, которая обрабатывает данные, права доступа, бизнес-правила и интеграции.
analogy: Как кухня и склад, благодаря которым витрина магазина действительно работает.
why_it_matters: Красивый интерфейс может быть небезопасной декорацией, если бэкенд не обеспечивает соблюдение
  правил.
ai_prompt_example: Проверяй запрос на бэкенде и возвращай ошибку 400 для неверных данных; не полагайся
  только на проверку в браузере.
common_mistake: Считать скрытые элементы фронтенда границей безопасности.
status: draft
source_content_version: 1
