title: Валидация
short_definition: Проверка ввода или данных на соответствие явным правилам перед их принятием, обработкой или сохранением.
analogy: 'Представьте «Validation» как инструмент в наборе разработчика: он решает задачу в области «Бэкенд и API»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Validation»: Проверка ввода или данных на соответствие явным правилам перед их принятием,
  обработкой или сохранением. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Валидация» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Validation» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Validation». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Validation» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
