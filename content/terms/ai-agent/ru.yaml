title: ИИ-агент
short_definition: ИИ-система, которая многократно выбирает следующее действие, использует инструменты,
  проверяет результат и движется к цели.
analogy: Как сотрудник, который читает задание, использует разрешённые инструменты, проверяет результат
  и решает, что делать дальше.
why_it_matters: Агент для программирования может изменять файлы и запускать команды, поэтому важны ограниченные
  права и точки проверки.
ai_prompt_example: Изучи репозиторий, предложи план, изменяй только одобренные файлы, запусти тесты, затем
  остановись и опиши diff.
common_mistake: Давать агенту широкие права и расплывчатую цель без этапов проверки и подтверждения.
status: draft
source_content_version: 1
