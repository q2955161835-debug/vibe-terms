title: "斷點"
short_definition: "偵錯器暫停程式執行的已設定位置或條件。"
analogy: "在測試與除錯中，「斷點」像用來定位問題的檢查工具：它關注「偵錯器暫停程式執行的已設定位置或條件」，結論要以測試結果支持。"
mechanism: "偵錯器暫停程式執行的已設定位置或條件。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解斷點後，Vibe Coding 初學者可以準確指出相關的測試與除錯問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「斷點」放進測試案例、錯誤訊息或除錯紀錄中：檢查重點是「偵錯器暫停程式執行的已設定位置或條件」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「斷點」為例，說明如何實現「偵錯器暫停程式執行的已設定位置或條件」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「斷點」這個名稱就判定已經正確實作；請根據「偵錯器暫停程式執行的已設定位置或條件」檢查實際行為、資料流、錯誤情境與測試結果。"
