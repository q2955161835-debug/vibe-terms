title: Skill
short_definition: 'Skill — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A reusable package of instructions, references, or scripts that teaches an AI agent how to perform a recurring workflow.'
analogy: Skill можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Skill — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A reusable package of instructions, references, or scripts that teaches an AI agent how to perform a recurring workflow.'
why_it_matters: Понимание Skill помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Skill помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Skill в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Skill доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
