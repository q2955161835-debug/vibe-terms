title: Primary Key
short_definition: 'Primary Key — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A column or set of columns whose value uniquely identifies each row in a relational table.'
analogy: Primary Key можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Primary Key — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A column or set of columns whose value uniquely identifies each row in a relational table.'
why_it_matters: Понимание Primary Key помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Primary Key помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Primary Key в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Primary Key доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
