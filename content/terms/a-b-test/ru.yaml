title: A/B-тест
short_definition: Рандомизированный эксперимент, в котором сравниваются два или более вариантов с использованием
  заранее определенной метрики.
analogy: 'Представьте «A/B-тест» как инструмент в наборе разработчика: он решает задачу в области «Продукт и требования»,
  но результат зависит от настройки.'
mechanism: 'Как работает «A/B-тест»: Рандомизированный эксперимент, в котором сравниваются два или более вариантов
  с использованием заранее определенной метрики. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «A/B-тест» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «A/B-тест» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: 'Объясни, где в этом проекте используется «A/B-тест». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки. Сохрани технические токены: /B.'
common_mistake: Частая ошибка — считать само слово «A/B-тест» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
