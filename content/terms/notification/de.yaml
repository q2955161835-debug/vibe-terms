title: Benachrichtigung
short_definition: Eine Nachricht, die ein Ereignis darstellt, das möglicherweise Aufmerksamkeit oder Maßnahmen erfordert und
  häufig in einem Benachrichtigungscenter gesammelt wird.
analogy: 'Ein praktischer Vergleich für Benachrichtigung: ein markiertes Werkzeug in UI/UX & Barrierefreiheit, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine Nachricht, die ein Ereignis darstellt, das möglicherweise Aufmerksamkeit oder Maßnahmen erfordert und häufig
  in einem Benachrichtigungscenter gesammelt wird. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Benachrichtigung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Benachrichtigung in der Phase Design als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Benachrichtigung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Benachrichtigung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
