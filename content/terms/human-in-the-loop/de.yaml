title: Human-in-the-Loop
short_definition: Ein Arbeitsablauf, der bewusst von einer Person verlangt, wichtige Entscheidungspunkte zu überprüfen, zu
  genehmigen, zu korrigieren oder zu übernehmen.
analogy: Betrachte Human-in-the-Loop als Orientierung in KI & Vibe Coding. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Ein Arbeitsablauf, der bewusst von einer Person verlangt, wichtige Entscheidungspunkte zu überprüfen, zu genehmigen,
  zu korrigieren oder zu übernehmen. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und
  Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Human-in-the-Loop versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in KI & Vibe Coding benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Human-in-the-Loop in der Phase Anforderungen als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Human-in-the-Loop in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Human-in-the-Loop als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
