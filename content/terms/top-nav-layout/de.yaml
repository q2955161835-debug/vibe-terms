title: Layout der oberen Navigation
short_definition: Eine Seitenstruktur, bei der die primäre Navigation oben bleibt und der Hauptinhalt den Bereich darunter
  ausfüllt.
analogy: 'Ordne Top-Navigationslayout im Bereich UI/UX & Barrierefreiheit als Werkzeug ein: Die Bezeichnung grenzt die Frage
  ein, doch erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Eine Seitenstruktur, bei der die primäre Navigation oben bleibt und der Hauptinhalt den Bereich darunter ausfüllt.
  In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die
  konkrete Umsetzung.
why_it_matters: Wer Top-Navigationslayout versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Top-Navigationslayout in der Phase Design als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Top-Navigationslayout in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Top-Navigationslayout als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
