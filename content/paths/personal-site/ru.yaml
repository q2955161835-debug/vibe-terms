locale: ru
title: Запустить личный сайт
summary: Спланируйте, соберите, проверьте и опубликуйте личный сайт, который ясно объясняет, кто вы и как с вами
  связаться
status: draft
source_content_version: 1
chapters:
- id: project-goal
  title: Определить цель сайта
  summary: Сформулируйте проблему посетителя, аудиторию и действие, которое должен поддерживать сайт.
  outcome: Цель и главное действие посетителя.
  checkpoint: Понятно, кому помогает сайт и что посетитель может сделать.
- id: audience-and-content
  title: Составить аудиторию и контент
  summary: Превратите потребности посетителей в список материалов и пользовательскую историю.
  outcome: Упорядоченный список содержимого страниц.
  checkpoint: Каждый раздел отвечает на вопрос посетителя или ведет к главному действию.
- id: information-architecture
  title: Устроить информацию
  summary: Сгруппируйте контент в небольшую навигацию и задайте порядок движения посетителя.
  outcome: План страниц с подписями навигации.
  checkpoint: Главное действие доступно без догадок о следующем шаге.
- id: wireframe
  title: Набросать страницу
  summary: Сделайте низкодетализированный вайрфрейм до выбора цветов и декора.
  outcome: Подписанный вайрфрейм для широкого и узкого экрана.
  checkpoint: Иерархия понятна даже в виде простых блоков и текста.
- id: html-structure
  title: Собрать семантическую структуру
  summary: Используйте осмысленные заголовки, landmarks, ссылки и порядок контента.
  outcome: Семантическая HTML-страница с ясной иерархией.
  checkpoint: Порядок документа в исходнике все еще объясняет страницу.
- id: visual-system
  title: Создать визуальную систему
  summary: Задайте правила типографики, отступов, цветов и поверхностей вместо разовых стилей.
  outcome: Повторно используемые CSS-переменные и единый стиль.
  checkpoint: Похожие элементы используют одинаковые визуальные решения.
- id: responsive-accessibility
  title: Сделать сайт удобным везде
  summary: Адаптируйте узкие экраны и проверьте фокус клавиатуры, контраст и понятные ссылки.
  outcome: Адаптивная страница с видимыми при навигации клавиатурой контролами.
  checkpoint: На ширине телефона важный контент не обрезан и доступен.
- id: content-and-seo
  title: Подготовить метаданные страницы
  summary: Добавьте описательные title, summary и метаданные предпросмотра, соответствующие странице.
  outcome: Метаданные страницы для поиска и распространения.
  checkpoint: Заголовок и краткое описание соответствуют видимой странице.
- id: quality-check
  title: Проверить поведение в браузере
  summary: Проверьте ссылки, клавиатурную навигацию, переполнение текста и контактное действие.
  outcome: Короткий ручной чек-лист с результатами.
  checkpoint: Проверки проходят на настольном и телефонном размере окна.
- id: publish-static-site
  title: Опубликовать статический сайт
  summary: Зафиксируйте проверенный исходник, разверните артефакт и перечитайте публичный маршрут.
  outcome: Публичный URL сайта и запись о развертывании.
  checkpoint: Живая страница совпадает с проверенной версией и ее ссылки работают.
