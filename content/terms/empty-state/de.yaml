title: Leerzustand
short_definition: Ein entworfener Zustand, der angezeigt wird, wenn noch kein Inhalt vorhanden ist. Er erklärt, was passiert
  ist und was der Benutzer als Nächstes tun kann.
analogy: 'Für Leerer Staat hilft ein Bild aus UI/UX & Barrierefreiheit: Das Etikett weist auf das Problemfeld, ersetzt aber
  weder den Code noch die Prüfung des Datenflusses.'
mechanism: Ein entworfener Zustand, der angezeigt wird, wenn noch kein Inhalt vorhanden ist. Er erklärt, was passiert ist
  und was der Benutzer als Nächstes tun kann. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Leerer Staat versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Leerer Staat in der Phase Design als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Leerer Staat in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Leerer Staat als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
