title: "標題標籤"
short_definition: "HTML `<title>` 值，用於命名瀏覽器標籤、歷史記錄、書籤和搜尋結果的檔案。"
analogy: "在前端實作中，可把「標題標籤」想成介面的一個可組合零件：它處理「HTML `<title>` 值，用於命名瀏覽器標籤、歷史記錄、書籤和搜尋結果的檔案」，並與畫面狀態互相配合。"
mechanism: "HTML `<title>` 值，用於命名瀏覽器標籤、歷史記錄、書籤和搜尋結果的檔案。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解標題標籤後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立介面與邏輯階段，將「標題標籤」放進頁面、元件或樣式規則中：檢查重點是「HTML `<title>` 值，用於命名瀏覽器標籤、歷史記錄、書籤和搜尋結果的檔案」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「標題標籤」為例，說明如何實現「HTML `<title>` 值，用於命名瀏覽器標籤、歷史記錄、書籤和搜尋結果的檔案」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「標題標籤」這個名稱就判定已經正確實作；請根據「HTML `<title>` 值，用於命名瀏覽器標籤、歷史記錄、書籤和搜尋結果的檔案」檢查實際行為、資料流、錯誤情境與測試結果。"
