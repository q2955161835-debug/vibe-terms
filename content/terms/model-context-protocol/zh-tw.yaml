title: "模型上下文協定"
short_definition: "一種開放協定，讓 AI 應用程式透過標準用戶端－伺服器介面連接外部工具、資源與提示範本。"
analogy: "在 AI 協作中，可以把「模型上下文協定」看成一個檢查點：先確認「一種開放協議，用於透過標準用戶端-伺服器介面將 AI 應用程式連線到外部工具、資源和提示範本」，再用實際輸出檢查結果。"
mechanism: "模型上下文協定以標準用戶端－伺服器介面連接 AI 應用程式與外部工具、資源及提示範本，並定義彼此交換訊息的方式。在實際專案中，請確認實際的伺服器配置、權限與資料流。"
why_it_matters: "了解模型上下文協定後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，讓 AI 應用程式透過模型上下文協定讀取專案文件或呼叫核准工具，並確認每個工具只取得必要的資料與權限。"
ai_prompt_example: "請檢查這個專案的模型上下文協定整合，指出用戶端、伺服器、工具與資源的邊界，只修改必要設定，並提供可驗證的連線與權限測試。"
common_mistake: "只看到用戶端成功連上模型上下文協定伺服器，就以為工具安全可用，卻沒有檢查資源範圍、輸入驗證與權限限制。"
