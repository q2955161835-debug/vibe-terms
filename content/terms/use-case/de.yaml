title: Anwendungs fall
short_definition: Ein strukturierte description von how an actor und a System interact zu achieve a goal, including important
  alternatives oder Fehlerfälle.
analogy: Betrachte Anwendungs fall als Orientierungsschild in Produkt & Anforderungen. Es weist auf die richtige technische
  Stelle, ersetzt aber weder die Implementierung noch deren Prüfung.
mechanism: Ein strukturierte description von how an actor und a System interact zu achieve a goal, including important alternatives
  oder Fehlerfälle. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Anwendungs fall versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Anwendungs fall in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Anwendungs fall in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Anwendungs fall als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
