title: Cherry-pick
short_definition: Применение изменений, внесенных выбранным коммитом, к текущей ветке в качестве нового коммита.
analogy: '«Cherry-pick» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «Cherry-pick»: Применение изменений, внесенных выбранным коммитом, к текущей ветке в качестве
  нового коммита. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и
  наблюдаемый результат.'
why_it_matters: Понимание термина «Cherry-pick» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Cherry-pick» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Cherry-pick». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Cherry-pick» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
