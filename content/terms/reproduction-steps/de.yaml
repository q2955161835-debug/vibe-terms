title: Reproduktionsschritte
short_definition: Eine minimale, wiederholbare Abfolge von Aktionen, die zuverlässig einen Fehler oder Fehler auslöst.
analogy: Betrachte Reproduktionsschritte als Orientierung in Testen & Debugging. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Eine minimale, wiederholbare Abfolge von Aktionen, die zuverlässig einen Fehler oder Fehler auslöst. In einem realen
  Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Reproduktionsschritte versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Testen & Debugging
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Reproduktionsschritte in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Reproduktionsschritte in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Reproduktionsschritte als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
