title: Shell
short_definition: 'Shell — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A command interpreter that accepts commands, expands syntax and variables, launches programs, and connects their input and output.'
analogy: Shell можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Shell — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A command interpreter that accepts commands, expands syntax and variables, launches programs, and connects their input and output.'
why_it_matters: Понимание Shell помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Shell помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Shell в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Shell доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
