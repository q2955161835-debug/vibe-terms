title: TCP
short_definition: Транспортный протокол, ориентированный на соединение, который обеспечивает упорядоченную и надежную
  доставку потока байтов между конечными точками сети.
analogy: 'Представьте «TCP» как инструмент в наборе разработчика: он решает задачу в области «Web и сети», но результат
  зависит от настройки.'
mechanism: 'Как работает «TCP»: Транспортный протокол, ориентированный на соединение, который обеспечивает упорядоченную
  и надежную доставку потока байтов между конечными точками сети. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «TCP» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «TCP» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «TCP». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «TCP» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
