title: "行為驅動開發"
short_definition: "一種開發方法，描述跨技術和產品角色共享的範例和場景中的預期系統行為。"
analogy: "在測試與除錯中，「行為驅動開發」像用來定位問題的檢查工具：它關注「一種開發方法，描述跨技術和產品角色共享的範例和場景中的預期系統行為」，結論要以測試結果支持。"
mechanism: "一種開發方法，描述跨技術和產品角色共享的範例和場景中的預期系統行為。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解行為驅動開發後，Vibe Coding 初學者可以準確指出相關的測試與除錯問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「行為驅動開發」放進測試案例、錯誤訊息或除錯紀錄中：檢查重點是「一種開發方法，描述跨技術和產品角色共享的範例和場景中的預期系統行為」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「行為驅動開發」為例，說明如何實現「一種開發方法，描述跨技術和產品角色共享的範例和場景中的預期系統行為」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「行為驅動開發」這個名稱就判定已經正確實作；請根據「一種開發方法，描述跨技術和產品角色共享的範例和場景中的預期系統行為」檢查實際行為、資料流、錯誤情境與測試結果。"
