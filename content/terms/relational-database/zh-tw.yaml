title: "關聯式資料庫"
short_definition: "將資料儲存在透過鍵連線的表中並使用關係操作進行查詢的資料庫模型。"
analogy: "在資料流程中，「關聯式資料庫」像整理資料的規則：它描述「將資料儲存在透過鍵連線的表中並使用關係操作進行查詢的資料庫模型」，需要用實際資料與查詢結果驗證。"
mechanism: "一種資料庫模型，它將資料儲存在透過鍵連線的表中，並使用關聯操作進行查詢。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解關聯式資料庫後，Vibe Coding 初學者可以準確指出相關的資料與資料庫問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「關聯式資料庫」放進資料表、查詢或一筆資料中：檢查重點是「將資料儲存在透過鍵連線的表中並使用關係操作進行查詢的資料庫模型」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「關聯式資料庫」為例，說明如何實現「將資料儲存在透過鍵連線的表中並使用關係操作進行查詢的資料庫模型」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「關聯式資料庫」這個名稱就判定已經正確實作；請根據「將資料儲存在透過鍵連線的表中並使用關係操作進行查詢的資料庫模型」檢查實際行為、資料流、錯誤情境與測試結果。"
