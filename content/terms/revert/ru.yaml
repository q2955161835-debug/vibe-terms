title: Возвращаться
short_definition: Создание нового коммита, который применяет инверсию предыдущего коммита без удаления истории.
analogy: 'Представьте «Revert» как инструмент в наборе разработчика: он решает задачу в области «Git и совместная
  работа», но результат зависит от настройки.'
mechanism: 'Как работает «Revert»: Создание нового коммита, который применяет инверсию предыдущего коммита без удаления
  истории. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Возвращаться» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Revert» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Revert». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Revert» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
