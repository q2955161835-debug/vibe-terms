title: "價值主張"
short_definition: "簡要解釋產品可以幫助誰、它能帶來什麼有價值的結果以及為什麼它比替代品更可取。"
analogy: "在產品規劃中，可把「價值主張」當成把需求轉成決策的工具：它聚焦於「簡要解釋產品可以幫助誰、它能帶來什麼有價值的結果以及為什麼它比替代品更可取」。"
mechanism: "簡單解釋產品可以幫助誰、它能帶來什麼有價值的結果，以及為什麼它比其他產品更可取。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解價值主張後，Vibe Coding 初學者可以準確指出相關的產品與需求問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「價值主張」放進需求文件、使用者流程或驗收條件中：檢查重點是「簡要解釋產品可以幫助誰、它能帶來什麼有價值的結果以及為什麼它比替代品更可取」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「價值主張」為例，說明如何實現「簡要解釋產品可以幫助誰、它能帶來什麼有價值的結果以及為什麼它比替代品更可取」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「價值主張」這個名稱就判定已經正確實作；請根據「簡要解釋產品可以幫助誰、它能帶來什麼有價值的結果以及為什麼它比替代品更可取」檢查實際行為、資料流、錯誤情境與測試結果。"
