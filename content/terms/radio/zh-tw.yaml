title: "Radio"
short_definition: "一種表單控制元件，當應從一小部分可見集中選擇一個選項時使用。"
analogy: "將 Radio 視為工作坊 UI/UX 和可存取性部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "一種表單控制項，當應從一小部分可見集中選擇一個選項時使用。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "Knowing Radio 讓 Vibe 編碼初學者說出他們所指的確切 UI/UX 和可存取性問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者到達設計階段時，使用 Radio 作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋無線電如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將「無線電」一詞視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
