title: Datenbank Einschränkung
short_definition: Ein Datenbank-enforced Regel die verhindert invalid Daten Zustände, such as erforderlich Werte oder invalid
  relationships.
analogy: 'Ein praktisches Bild für Datenbank Einschränkung: ein markiertes Werkzeug in data databases, dessen Aufschrift die
  Frage schärft, aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein Datenbank-enforced Regel die verhindert invalid Daten Zustände, such as erforderlich Werte oder invalid relationships.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Datenbank Einschränkung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in data databases benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Datenbank Einschränkung in der Phase data identity als Lerncheckpoint: Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Datenbank Einschränkung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Datenbank Einschränkung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
