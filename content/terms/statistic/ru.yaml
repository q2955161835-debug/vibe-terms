title: Statistic
short_definition: 'Statistic — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A prominent display of a key numeric value, usually paired with a label, unit, trend, or comparison.'
analogy: Statistic можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Statistic — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A prominent display of a key numeric value, usually paired with a label, unit, trend, or comparison.'
why_it_matters: Понимание Statistic помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Statistic помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Statistic в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Statistic доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
