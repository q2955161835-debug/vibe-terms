title: Grounding
short_definition: 'Grounding — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Connecting model output to supplied evidence, retrieved sources, or verified data so claims are less likely to be invented.'
analogy: Grounding можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Grounding — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Connecting model output to supplied evidence, retrieved sources, or verified data so claims are less likely to be invented.'
why_it_matters: Понимание Grounding помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Grounding помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Grounding в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Grounding доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
