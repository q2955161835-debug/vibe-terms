title: "JWT"
short_definition: "一種緊湊的簽名權杖格式，包含編碼為 JSON 的宣告，通常用於攜帶身分或授權資訊。"
analogy: "在安全設計中，「JWT」像一道需要驗證的門檻：它涉及「一種緊湊的簽名權杖格式，包含編碼為 JSON 的宣告，通常用於攜帶身分或授權資訊」，不能只看名稱就判定安全。"
mechanism: "一種緊湊的簽名權杖格式，包含編碼為 JSON 的宣告，通常用於攜帶身分或授權資訊。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 JWT 後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「JWT」放進登入流程、權限檢查或安全日誌中：檢查重點是「一種緊湊的簽名權杖格式，包含編碼為 JSON 的宣告，通常用於攜帶身分或授權資訊」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「JWT」為例，說明如何實現「一種緊湊的簽名權杖格式，包含編碼為 JSON 的宣告，通常用於攜帶身分或授權資訊」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「JWT」這個名稱就判定已經正確實作；請根據「一種緊湊的簽名權杖格式，包含編碼為 JSON 的宣告，通常用於攜帶身分或授權資訊」檢查實際行為、資料流、錯誤情境與測試結果。"
