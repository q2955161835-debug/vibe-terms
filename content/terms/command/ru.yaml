title: Команда
short_definition: Инструкция, введенная в оболочку или CLI для вызова программы или встроенной операции.
analogy: '«Command» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Command»: Инструкция, введенная в оболочку или CLI для вызова программы или встроенной
  операции. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Команда» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Command» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Command». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Command» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
