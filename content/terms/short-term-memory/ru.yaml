title: Кратковременная память
short_definition: Временное состояние задачи, используемое во время сеанса или рабочего процесса и обычно впоследствии
  отбрасываемое или суммируемое.
analogy: '«Кратковременная память» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не
  заменяет проверку реализации.'
mechanism: 'Как работает «Кратковременная память»: Временное состояние задачи, используемое во время сеанса или
  рабочего процесса и обычно впоследствии отбрасываемое или суммируемое. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Кратковременная память» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Кратковременная память» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Кратковременная память». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Кратковременная память» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
