title: "Grounding（事實依據）"
short_definition: "將模型輸出與提供的證據、檢索到的來源或經過驗證的資料連結起來，降低捏造說法的可能性。"
analogy: "可以把 Grounding（事實依據）想成研究報告的引文：模型提出說法時，旁邊要有可追溯的資料支撐，而不是只靠語氣判斷可信度。"
mechanism: "將模型輸出與提供的證據、檢索到的來源或經過驗證的資料連結起來，降低模型捏造說法的可能性。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 Grounding（事實依據）後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，針對 Grounding（事實依據）讓回答中的每個重要主張都連到檢索來源或專案文件，並在評估紀錄中標示引用是否真的支持該主張。"
ai_prompt_example: "請檢查這個 AI 功能的 Grounding（事實依據），為回答中的重要主張附上可追溯來源，指出找不到依據的部分，並提供可重現的驗證方式。"
common_mistake: "實作 Grounding（事實依據）時，把模型引用了資料當成已經有事實依據，卻沒有核對來源內容是否真的支持回答，也沒有處理找不到依據的情況。"
