title: Секретное управление
short_definition: Контролируемое хранение, доступ, ротация и аудит учетных данных, таких как ключи API, токены и
  закрытые ключи.
analogy: 'Представьте «Управление секретами» как инструмент в наборе разработчика: он решает задачу в области «Безопасность
  и приватность», но результат зависит от настройки.'
mechanism: 'Как работает «Управление секретами»: Контролируемое хранение, доступ, ротация и аудит учетных данных,
  таких как ключи API, токены и закрытые ключи. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Секретное управление» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Управление секретами» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Управление секретами». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Управление секретами» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
