title: Cascading Select
short_definition: 'Cascading Select — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A hierarchical selector where choosing a parent option reveals the next level of choices.'
analogy: Cascading Select можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Cascading Select — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A hierarchical selector where choosing a parent option reveals the next level of choices.'
why_it_matters: Понимание Cascading Select помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Cascading Select помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Cascading Select в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Cascading Select доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
