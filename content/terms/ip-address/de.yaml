title: IP-Adresse
short_definition: Eine numerische Netzwerkadresse, die zur Identifizierung und Weiterleitung des Datenverkehrs an ein Gerät
  oder eine Schnittstelle verwendet wird.
analogy: 'Ordne IP-Adresse im Bereich Web & Netzwerk als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch erst die
  konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Eine numerische Netzwerkadresse, die zur Identifizierung und Weiterleitung des Datenverkehrs an ein Gerät oder
  eine Schnittstelle verwendet wird. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und
  Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer IP-Adresse versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Web & Netzwerk benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir IP-Adresse in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie IP-Adresse in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff IP-Adresse als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
