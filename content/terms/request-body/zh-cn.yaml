mechanism: "实现上，这一概念会围绕“HTTP 请求内发送的有效负载，通常包含 JSON、表单数据或上传的字节。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“请求正文”后，你能更准确地描述Web 与网络里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的建立环境阶段，可以把“请求正文”放到一个真实项目中：围绕“HTTP 请求内发送的有效负载，通常包含 JSON、表单数据或上传的字节。”定位相关页面、文件、请求、数据结构或验证步骤。"
