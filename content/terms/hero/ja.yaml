title: ヒーローセクション
short_definition: ページ冒頭の領域で、ページの主要メッセージ、主な価値（価値提案）、次に促す行動を伝える。
analogy: ヒーローセクションは、UI/UXとアクセシビリティの課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: ページ冒頭の領域で、ページの主要メッセージ、主な価値（価値提案）、次に促す行動を伝える。実際のプロジェクトでは、見出しや説明、CTAの配置とリンク先を確認してください。
why_it_matters: ヒーローセクションを知ると、Vibe Coding初心者でも、UI/UXとアクセシビリティの課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、ヒーローセクションを設計段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトでヒーローセクションがどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「ヒーローセクション」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
