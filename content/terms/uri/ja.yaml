title: URI
short_definition: リソースの一般的な識別子。 URL は URI の一種で、アクセス方法や場所も説明します。
analogy: URI は、ワークショップの Web およびネットワーキング部分にあるラベル付きツールと考えてください。ラベルはどの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: リソースの一般的な識別子。 URL は URI の一種で、アクセス方法や場所も説明します。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: URI を知ることで、Vibe Codingの初心者は、Web およびネットワークに関する関連する課題を正確に言語化し、AIコーディングエージェントに変更とその動作が正しいという証拠を求めることができます。
project_example: Vibe Termsでは、学習者が環境段階に到達したときに語彙チェックポイントとして URI を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: URI がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: URI という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
