title: CDN
short_definition: 'CDN — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A geographically distributed network that caches and serves content closer to users to reduce latency and origin load.'
analogy: CDN можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'CDN — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A geographically distributed network that caches and serves content closer to users to reduce latency and origin load.'
why_it_matters: Понимание CDN помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание CDN помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль CDN в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название CDN доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
