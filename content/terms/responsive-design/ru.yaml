title: Responsive Design
short_definition: 'Responsive Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Design that adapts layout, content, controls, and typography to different viewport sizes and device capabilities.'
analogy: Responsive Design можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Responsive Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Design that adapts layout, content, controls, and typography to different viewport sizes and device capabilities.'
why_it_matters: Понимание Responsive Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Responsive Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Responsive Design в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Responsive Design доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
