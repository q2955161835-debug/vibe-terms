title: API-Vertrag
short_definition: die agreed Struktur und Verhalten von an API, einschließlich Vorgänge, inputs, outputs, Fehler, und compatibility
  expectations.
analogy: 'Für API-Vertrag hilft ein Vergleich mit einem Werkzeug aus Backend & APIs: Sein Etikett nennt das Problemfeld; verlässlich
  wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: die agreed Struktur und Verhalten von an API, einschließlich Vorgänge, inputs, outputs, Fehler, und compatibility
  expectations. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer API-Vertrag versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient API-Vertrag in der Phase Daten & Identität als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie API-Vertrag in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff API-Vertrag als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
