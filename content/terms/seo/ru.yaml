title: SEO
short_definition: Практика создания веб-контента понятным, доступным для сканирования и полезным для поисковых систем,
  одновременно отвечая реальным намерениям пользователя.
analogy: 'Представьте «SEO» как инструмент в наборе разработчика: он решает задачу в области «Web и сети», но результат
  зависит от настройки.'
mechanism: 'Как работает «SEO»: Практика создания веб-контента понятным, доступным для сканирования и полезным для
  поисковых систем, одновременно отвечая реальным намерениям пользователя. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «SEO» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «SEO» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «SEO». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «SEO» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
