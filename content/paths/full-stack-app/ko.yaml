locale: ko
title: Draft — Ship a Full-Stack App
summary: Draft — not human reviewed. Take one small product from scope to deployment by connecting a browser interface, API, data model, tests, and operations.
status: draft
source_content_version: 1
chapters:
- id: product-scope
  title: Draft — Frame the product slice
  summary: Draft — not human reviewed. Choose a narrow user outcome and write observable acceptance criteria.
  outcome: Draft — not human reviewed. A scoped product brief with acceptance criteria.
  checkpoint: Draft — not human reviewed. You can state what is intentionally excluded from the first release.
- id: architecture
  title: Draft — Map the system boundary
  summary: Draft — not human reviewed. Draw the browser, API, and data responsibilities and name the direction of each important flow.
  outcome: Draft — not human reviewed. A small architecture diagram.
  checkpoint: Draft — not human reviewed. Each responsibility has one owning layer instead of duplicated business rules.
- id: data-model
  title: Draft — Model durable data
  summary: Draft — not human reviewed. Define records, identifiers, relationships, and constraints before building write operations.
  outcome: Draft — not human reviewed. A documented data schema.
  checkpoint: Draft — not human reviewed. The model prevents the duplicate or orphan data the product must not allow.
- id: api-design
  title: Draft — Design the API
  summary: Draft — not human reviewed. Specify resource routes, request validation, response data, and status codes for the product flow.
  outcome: Draft — not human reviewed. An API contract with examples.
  checkpoint: Draft — not human reviewed. A client can complete the main flow without relying on undocumented fields.
- id: authentication
  title: Draft — Protect user access
  summary: Draft — not human reviewed. Decide who can act, authenticate the user, and enforce authorization at the server boundary.
  outcome: Draft — not human reviewed. An access policy and protected endpoint flow.
  checkpoint: Draft — not human reviewed. An unauthenticated or unauthorized request cannot read or change protected data.
- id: frontend-flow
  title: Draft — Build the browser flow
  summary: Draft — not human reviewed. Implement the main task with visible loading, success, and empty states.
  outcome: Draft — not human reviewed. A working screen for the primary user flow.
  checkpoint: Draft — not human reviewed. The browser state stays consistent with the latest successful server response.
- id: validation-and-errors
  title: Draft — Make failures actionable
  summary: Draft — not human reviewed. Validate at the input and server boundaries, then show people what they can fix or retry.
  outcome: Draft — not human reviewed. Field errors and recoverable request errors.
  checkpoint: Draft — not human reviewed. Bad data is rejected with a useful message and no partial write.
- id: testing
  title: Draft — Test the connected system
  summary: Draft — not human reviewed. Cover business rules, API boundaries, and the primary browser journey with the smallest useful test set.
  outcome: Draft — not human reviewed. A repeatable test suite for the key flow.
  checkpoint: Draft — not human reviewed. A regression in the main flow fails a relevant automated test.
- id: deployment
  title: Draft — Deploy with operational checks
  summary: Draft — not human reviewed. Configure non-secret environment names, automate verification, and inspect the running service after release.
  outcome: Draft — not human reviewed. A deployment procedure and health check.
  checkpoint: Draft — not human reviewed. The deployed app completes the primary flow with the expected configuration.
- id: iteration
  title: Draft — Choose the next improvement
  summary: Draft — not human reviewed. Use observed feedback and a measured product signal to prioritize one small follow-up change.
  outcome: Draft — not human reviewed. A prioritized next-iteration note.
  checkpoint: Draft — not human reviewed. The next change connects to evidence rather than a vague feature request.
