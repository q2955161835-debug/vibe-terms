title: Манифест веб-приложения
short_definition: Файл JSON, описывающий устанавливаемые метаданные веб-приложения, такие как имя, значки, начальный
  URL-адрес и режим отображения.
analogy: 'Представьте «Манифест веб-приложения» как инструмент в наборе разработчика: он решает задачу в области
  «Фронтенд-разработка», но результат зависит от настройки.'
mechanism: 'Как работает «Манифест веб-приложения»: Файл JSON, описывающий устанавливаемые метаданные веб-приложения,
  такие как имя, значки, начальный URL-адрес и режим отображения. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Манифест веб-приложения» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Манифест веб-приложения» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Манифест веб-приложения». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Манифест веб-приложения» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
