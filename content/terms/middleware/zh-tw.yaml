title: "中介軟體"
short_definition: "在請求或應用程式管道中執行的程式碼，用於新增共享行為，例如日誌記錄、身分驗證、解析或錯誤處理。"
analogy: "在後端流程中，「中介軟體」像服務之間的處理站：它負責「在請求或應用程式管道中執行的程式碼，用於新增共享行為，例如日誌記錄、身分驗證、解析或錯誤處理」，結果要用 API 請求與回應確認。"
mechanism: "在請求或應用程式管道中執行以新增共享行為（例如日誌記錄、身分驗證、解析或錯誤處理）的程式碼。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解中介軟體後，Vibe Coding 初學者可以準確指出相關的後端與 API 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「中介軟體」放進API 請求、回應或服務日誌中：檢查重點是「在請求或應用程式管道中執行的程式碼，用於新增共享行為，例如日誌記錄、身分驗證、解析或錯誤處理」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「中介軟體」為例，說明如何實現「在請求或應用程式管道中執行的程式碼，用於新增共享行為，例如日誌記錄、身分驗證、解析或錯誤處理」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「中介軟體」這個名稱就判定已經正確實作；請根據「在請求或應用程式管道中執行的程式碼，用於新增共享行為，例如日誌記錄、身分驗證、解析或錯誤處理」檢查實際行為、資料流、錯誤情境與測試結果。"
