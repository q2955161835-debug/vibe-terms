title: Usability
short_definition: 'Usability — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The degree to which intended users can accomplish tasks effectively, efficiently, and satisfactorily in a given context.'
analogy: Usability можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Usability — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The degree to which intended users can accomplish tasks effectively, efficiently, and satisfactorily in a given context.'
why_it_matters: Понимание Usability помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Usability помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Usability в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Usability доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
