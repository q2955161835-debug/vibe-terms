locale: ko
title: 풀스택 앱 출시
summary: 브라우저 인터페이스, API, 데이터 모델, 테스트 및 운영을 연결하여 하나의 작은 제품을 범위에서 배포까지 가져옵니다.
status: draft
source_content_version: 1
chapters:
- id: product-scope
  title: 제품 범위 정의
  summary: 좁은 사용자 결과를 선택하고 관찰 가능한 허용 기준을 작성합니다.
  outcome: 허용 기준이 포함된 범위의 제품 개요입니다.
  checkpoint: 첫 번째 릴리스에서 의도적으로 제외된 내용을 명시할 수 있습니다.
- id: architecture
  title: 시스템 경계 매핑
  summary: 브라우저, API 및 데이터 책임을 그리고 각 중요한 흐름의 방향을 지정합니다.
  outcome: 작은 아키텍처 다이어그램.
  checkpoint: 각 책임에는 중복된 비즈니스 규칙 대신 하나의 소유 계층이 있습니다.
- id: data-model
  title: 내구성 있는 데이터 모델
  summary: 쓰기 작업을 구축하기 전에 레코드, 식별자, 관계 및 제약 조건을 정의하세요.
  outcome: 문서화된 데이터 스키마.
  checkpoint: 이 모델은 제품이 허용해서는 안되는 중복 또는 고아 데이터를 방지합니다.
- id: api-design
  title: API 디자인
  summary: 제품 흐름에 대한 리소스 경로, 요청 유효성 검사, 응답 데이터 및 상태 코드를 지정합니다.
  outcome: 예제가 포함된 API 계약입니다.
  checkpoint: 클라이언트는 문서화되지 않은 필드에 의존하지 않고도 기본 흐름을 완료할 수 있습니다.
- id: authentication
  title: 사용자 액세스 보호
  summary: 누가 행동하고, 사용자를 인증하고, 서버 경계에서 인증을 시행할 수 있는지 결정합니다.
  outcome: 액세스 정책 및 보호된 엔드포인트 흐름.
  checkpoint: 인증되지 않았거나 승인되지 않은 요청은 보호된 데이터를 읽거나 변경할 수 없습니다.
- id: frontend-flow
  title: 브라우저 흐름 구축
  summary: 눈에 보이는 로딩, 성공 및 빈 상태로 기본 작업을 구현합니다.
  outcome: 기본 사용자 흐름에 대한 작업 화면입니다.
  checkpoint: 브라우저 상태는 최근의 성공적인 서버 응답과 일관되게 유지됩니다.
- id: validation-and-errors
  title: 실패를 해결 가능하게 만들기
  summary: 입력 및 서버 경계에서 유효성을 확인한 다음 수정하거나 다시 시도할 수 있는 부분을 사람들에게 보여줍니다.
  outcome: 필드 오류 및 복구 가능한 요청 오류.
  checkpoint: 잘못된 데이터는 유용한 메시지로 거부되며 부분 쓰기는 불가능합니다.
- id: testing
  title: 연결된 시스템 테스트
  summary: 가장 작은 유용한 테스트 세트로 비즈니스 규칙, API 경계 및 기본 브라우저 여정을 다룹니다.
  outcome: 키 흐름에 대한 반복 가능한 테스트 모음입니다.
  checkpoint: 기본 흐름의 회귀는 관련 자동화 테스트에 실패합니다.
- id: deployment
  title: 운영 점검을 통해 배포
  summary: 비밀이 아닌 환경 이름을 구성하고, 확인을 자동화하고, 출시 후 실행 중인 서비스를 검사합니다.
  outcome: 배포 절차 및 상태 확인
  checkpoint: 배포된 앱은 예상 구성으로 기본 흐름을 완료합니다.
- id: iteration
  title: 다음 개선 사항을 선택하세요
  summary: 관찰된 피드백과 측정된 제품 신호를 사용하여 하나의 작은 후속 변경에 우선순위를 둡니다.
  outcome: 우선순위가 지정된 다음 반복 메모입니다.
  checkpoint: 다음 변경 사항은 모호한 기능 요청이 아닌 증거에 연결됩니다.
