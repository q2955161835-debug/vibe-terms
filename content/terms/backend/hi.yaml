title: बैकएंड
short_definition: सर्वर पर चलने वाला लॉजिक जो डेटा, अनुमतियाँ, व्यावसायिक नियम और बाहरी एकीकरण संभालता
  है।
analogy: दुकान के पीछे की रसोई और गोदाम की तरह, जो सामने की दुकान को सच में चलाते हैं।
why_it_matters: यदि बैकएंड नियम लागू नहीं करता, तो सुंदर इंटरफ़ेस भी असुरक्षित या केवल दिखावा हो सकता
  है।
ai_prompt_example: अनुरोध को बैकएंड पर जाँचो और गलत इनपुट पर 400 त्रुटि लौटाओ; केवल ब्राउज़र जाँच पर निर्भर
  मत रहो।
common_mistake: फ्रंटएंड में छिपाए गए नियंत्रणों को सुरक्षा सीमा मान लेना।
