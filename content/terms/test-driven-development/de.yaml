title: Test-Driven Development
short_definition: Ein Entwicklung workflow die writes a failing Test erste, implements the minimum Code zu pass, then refactors
  while keeping Tests green.
analogy: 'Für Test-Driven Development hilft ein Vergleich mit einem Werkzeug aus testing debugging: Sein Etikett nennt das
  Problemfeld; verlässlich wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein Entwicklung workflow die writes a failing Test erste, implements the minimum Code zu pass, then refactors while
  keeping Tests green. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab;
  prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Test-Driven Development versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in testing debugging
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Test-Driven Development in der Phase test protect als Lerncheckpoint: Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Test-Driven Development in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Test-Driven Development als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
