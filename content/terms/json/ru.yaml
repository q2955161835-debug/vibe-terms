title: JSON
short_definition: Текстовый формат для представления структурированных данных с использованием объектов, массивов,
  строк, чисел, логических значений и значений NULL.
analogy: 'Представьте «JSON» как инструмент в наборе разработчика: он решает задачу в области «Бэкенд и API», но
  результат зависит от настройки.'
mechanism: 'Как работает «JSON»: Текстовый формат для представления структурированных данных с использованием объектов,
  массивов, строк, чисел, логических значений и значений NULL. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «JSON» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «JSON» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «JSON». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «JSON» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
