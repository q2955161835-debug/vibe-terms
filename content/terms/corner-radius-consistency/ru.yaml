title: Согласованность углового радиуса
short_definition: Практика системы проектирования, заключающаяся в использовании небольшого, намеренного набора
  угловых радиусов для связанных компонентов.
analogy: 'Проще представить «Единообразие радиусов углов» как правило работы в разделе «Фронтенд-разработка»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Единообразие радиусов углов»: Практика системы проектирования, заключающаяся в использовании
  небольшого, намеренного набора угловых радиусов для связанных компонентов. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Согласованность углового радиуса» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Единообразие радиусов углов» в одном пользовательском потоке или
  тесте, зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Единообразие радиусов углов». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Единообразие радиусов углов» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
