title: Einschränkung
short_definition: Ein boundary the solution must respect, such as a platform, budget, compliance Regel, Leistung Grenze, oder
  fixed integration.
analogy: 'Für Einschränkung hilft ein Vergleich mit einem Werkzeug aus Produkt & Anforderungen: Sein Etikett nennt das Problemfeld;
  verlässlich wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein boundary the solution must respect, such as a platform, budget, compliance Regel, Leistung Grenze, oder fixed
  integration. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Einschränkung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Einschränkung in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Einschränkung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Einschränkung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
