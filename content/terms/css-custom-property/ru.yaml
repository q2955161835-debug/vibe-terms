title: Пользовательское свойство CSS
short_definition: Именованное значение CSS, начинающееся с `--`, которое участвует в каскаде и может быть повторно
  использовано через `var()`.
analogy: 'Представьте «Пользовательское свойство CSS» как инструмент в наборе разработчика: он решает задачу в области
  «Фронтенд-разработка», но результат зависит от настройки.'
mechanism: 'Как работает «Пользовательское свойство CSS»: Именованное значение CSS, начинающееся с `--`, которое
  участвует в каскаде и может быть повторно использовано через `var()`. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Пользовательское свойство CSS» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Пользовательское свойство CSS» в одном пользовательском потоке или
  тесте, зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Пользовательское свойство CSS». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Пользовательское свойство CSS» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
