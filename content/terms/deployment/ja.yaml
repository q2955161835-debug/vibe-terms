title: デプロイ
short_definition: ビルドしたアプリケーションを、利用者がアクセスできる環境へ配置する作業。
analogy: 作品を自分の作業場から、実際に営業する店舗へ移すようなものです。
why_it_matters: 自分のパソコンでしか動かないプロジェクトは、まだ利用可能なWeb製品ではありません。
ai_prompt_example: 静的ビルドを作成し、すべての言語ルートを確認してから、その同じ成果物を本番で再ビルドせずにデプロイしてください。
common_mistake: デプロイ中に設定を変更し、その変更をリポジトリへ記録しないこと。
status: draft
source_content_version: 1
