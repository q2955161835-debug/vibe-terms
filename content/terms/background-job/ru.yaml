title: Фоновое задание
short_definition: Работа, выполняемая асинхронно вне основного запроса пользователя, например отправка электронной
  почты или обработка мультимедиа.
analogy: 'Представьте «Фоновая задача» как инструмент в наборе разработчика: он решает задачу в области «Бэкенд
  и API», но результат зависит от настройки.'
mechanism: 'Как работает «Фоновая задача»: Работа, выполняемая асинхронно вне основного запроса пользователя, например
  отправка электронной почты или обработка мультимедиа. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Фоновое задание» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Фоновая задача» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Фоновая задача». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Фоновая задача» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
