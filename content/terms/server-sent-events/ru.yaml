title: События, отправленные сервером
short_definition: API браузера и формат потоковой передачи HTTP, который позволяет серверу непрерывно передавать
  текстовые события клиенту через одно соединение.
analogy: 'Проще представить «Server-Sent Events» как правило работы в разделе «Web и сети»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Server-Sent Events»: API браузера и формат потоковой передачи HTTP, который позволяет
  серверу непрерывно передавать текстовые события клиенту через одно соединение. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «События, отправленные сервером» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Server-Sent Events» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Server-Sent Events». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Server-Sent Events» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
