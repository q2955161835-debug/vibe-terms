title: Incident
short_definition: 'Incident は「デプロイと運用」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: An unplanned event that degrades or interrupts a service and requires coordinated detection, mitigation, recovery, and learning.'
analogy: Incident は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'Incident は「デプロイと運用」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: An unplanned event that degrades or interrupts a service and requires coordinated detection, mitigation, recovery, and learning.'
why_it_matters: Incident を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: Incident を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
ai_prompt_example: このプロジェクトで Incident がどのように関係するか説明してください。対象ファイルまたは境界を示し、必要最小限の変更と確認手順を提示してください。
common_mistake: Incident という名前だけで実装が正しいと判断し、実際の動作・データフロー・失敗時の挙動を確認しないことです。
