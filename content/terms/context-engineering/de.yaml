title: Kontext Engineering
short_definition: Die practice von selecting und organizing the Anweisungen, history, Dateien, Werkzeuge, und Ergebnisse die
  a Modell needs für the aktuelle Aufgabe.
analogy: 'Für Kontext Engineering hilft ein Vergleich mit einem Werkzeug aus ai vibe: Sein Etikett nennt das Problemfeld;
  verlässlich wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Die practice von selecting und organizing the Anweisungen, history, Dateien, Werkzeuge, und Ergebnisse die a Modell
  needs für the aktuelle Aufgabe. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Kontext Engineering versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Kontext Engineering in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Kontext Engineering in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Kontext Engineering als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
