title: AIエージェント
short_definition: 次に取る行動を繰り返し判断し、ツールを使い、結果を確認しながら目標に向かって進むAIシステム。
analogy: 依頼内容を読み、許可された道具を使い、成果を確認してから次の作業を決める担当者のようなものです。
why_it_matters: コーディングエージェントはファイル編集やコマンド実行ができるため、権限の範囲と確認ポイントが重要です。
ai_prompt_example: リポジトリを調査して計画を提示し、承認されたファイルだけを編集してください。テストを実行したら停止し、差分を報告してください。
common_mistake: 検証の区切りを設けず、広すぎる権限と曖昧な目標をエージェントに与えること。
