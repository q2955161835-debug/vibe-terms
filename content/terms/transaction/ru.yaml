title: Сделка
short_definition: Группа операций с базой данных, рассматриваемая как одна логическая единица, которая либо фиксируется
  вместе, либо откатывается.
analogy: 'Представьте «Transaction» как инструмент в наборе разработчика: он решает задачу в области «Данные и базы
  данных», но результат зависит от настройки.'
mechanism: 'Как работает «Transaction»: Группа операций с базой данных, рассматриваемая как одна логическая единица,
  которая либо фиксируется вместе, либо откатывается. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Сделка» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Transaction» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Transaction». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Transaction» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
