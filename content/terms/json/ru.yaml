title: JSON
short_definition: 'JSON — термин из раздела «Бэкенд и API». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A text format for representing structured data using objects, arrays, strings, numbers, booleans, and null.'
analogy: JSON можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'JSON — термин из раздела «Бэкенд и API». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A text format for representing structured data using objects, arrays, strings, numbers, booleans, and null.'
why_it_matters: Понимание JSON помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание JSON помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль JSON в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название JSON доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
