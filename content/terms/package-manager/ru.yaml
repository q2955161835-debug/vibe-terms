title: Package Manager
short_definition: 'Package Manager — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A tool that installs, updates, resolves, and records software packages and their dependencies.'
analogy: Package Manager можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Package Manager — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A tool that installs, updates, resolves, and records software packages and their dependencies.'
why_it_matters: Понимание Package Manager помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Package Manager помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Package Manager в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Package Manager доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
