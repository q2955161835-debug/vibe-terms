title: CSS Custom Property
short_definition: 'CSS Custom Property은(는) ‘프론트엔드 엔지니어링’에서 사용하는 용어입니다. 현재 한국어 본문은 검토 전 초안입니다. 영어 기준 정의: A named CSS value beginning with `--` that participates in the cascade and can be reused through `var()`.'
analogy: CSS Custom Property을(를) 소프트웨어 개발 도구 상자에 붙은 용도 라벨처럼 생각하면 이해하기 쉽습니다. 실제 사용에서는 코드, 데이터 흐름, 사용자 상황을 함께 확인해야 합니다.
mechanism: 'CSS Custom Property은(는) ‘프론트엔드 엔지니어링’에서 사용하는 용어입니다. 현재 한국어 본문은 검토 전 초안입니다. 영어 기준 정의: A named CSS value beginning with `--` that participates in the cascade and can be reused through `var()`.'
why_it_matters: CSS Custom Property을(를) 이해하면 AI에게 시스템의 어느 부분을 말하는지 더 정확히 전달하고 검증 가능한 결과를 요구할 수 있습니다.
project_example: CSS Custom Property을(를) 이해하면 AI에게 시스템의 어느 부분을 말하는지 더 정확히 전달하고 검증 가능한 결과를 요구할 수 있습니다.
ai_prompt_example: 이 프로젝트에서 CSS Custom Property의 역할을 설명하세요. 관련 파일이나 시스템 경계를 지정하고 최소한의 변경만 수행한 뒤 검증 절차를 제시하세요.
common_mistake: CSS Custom Property이라는 이름만 보고 구현이 올바르다고 가정하고 실제 동작, 데이터 흐름, 실패 조건을 확인하지 않는 것입니다.
