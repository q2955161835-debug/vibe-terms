title: "驗收標準"
short_definition: "具體的、可測試的條件，定義何時認為功能或需求是完整且可接受的。"
analogy: "將驗收標準視為工作坊測試和除錯部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "具體的、可測試的條件，定義何時認為功能或需求是完整且可接受的。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解驗收標準讓 Vibe 編碼初學者可以準確地說出他們所指的測試和除錯問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者到達測試保護階段時，使用接受標準作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋驗收標準如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將「驗收標準」一詞視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
status: draft
source_content_version: 1
