title: Граница радиуса
short_definition: Свойство CSS, которое скругляет углы рамки элемента.
analogy: 'Представьте «Радиус скругления» как инструмент в наборе разработчика: он решает задачу в области «Фронтенд-разработка»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Радиус скругления»: Свойство CSS, которое скругляет углы рамки элемента. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Граница радиуса» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Радиус скругления» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Радиус скругления». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Радиус скругления» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
