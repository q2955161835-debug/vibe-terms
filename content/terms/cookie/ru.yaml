title: Cookie
short_definition: 'Cookie — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A small piece of browser-managed data associated with a website and sent according to scope, security, and SameSite rules.'
analogy: Cookie можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Cookie — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A small piece of browser-managed data associated with a website and sent according to scope, security, and SameSite rules.'
why_it_matters: Понимание Cookie помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Cookie помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Cookie в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Cookie доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
