title: Eins zu eins
short_definition: Eine Beziehung, bei der jeder Datensatz auf einer Seite höchstens einem Datensatz auf der anderen Seite
  entspricht.
analogy: 'Für Eins zu eins hilft ein Bild aus Daten & Datenbanken: Das Etikett weist auf das Problemfeld, ersetzt aber weder
  den Code noch die Prüfung des Datenflusses.'
mechanism: Eine Beziehung, bei der jeder Datensatz auf einer Seite höchstens einem Datensatz auf der anderen Seite entspricht.
  In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die
  konkrete Umsetzung.
why_it_matters: Wer Eins zu eins versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Daten & Datenbanken benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Eins zu eins in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Eins zu eins in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Eins zu eins als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
