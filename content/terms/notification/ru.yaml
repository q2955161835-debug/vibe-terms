title: Уведомление
short_definition: Сообщение, представляющее событие, которое может потребовать уведомления или действия, часто собираемое
  в центре уведомлений.
analogy: '«Notification» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «Notification»: Сообщение, представляющее событие, которое может потребовать уведомления
  или действия, часто собираемое в центре уведомлений. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Уведомление» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Notification» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Notification». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Notification» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
