name: Verify public site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      RUN_HTTP_E2E: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Install Sites build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the Codex Sites adapter
        run: npm run build

      - name: Verify and package the anonymous static site
        run: ./scripts/verify_public_site.sh

      - name: Upload direct-hosting archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/vibe-terms-public-site.zip
          archive: false
