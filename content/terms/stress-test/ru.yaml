title: Stress Test
short_definition: 'Stress Test — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A test that deliberately pushes a system beyond normal capacity to discover breaking points and recovery behavior.'
analogy: Stress Test можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Stress Test — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A test that deliberately pushes a system beyond normal capacity to discover breaking points and recovery behavior.'
why_it_matters: Понимание Stress Test помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Stress Test помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Stress Test в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Stress Test доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
