title: CTA
short_definition: 行動喚起（Call to Action）。ユーザーを重要な次のステップへ導くコピーと操作部品（ボタンなど）。
analogy: CTAは、UI/UXとアクセシビリティの課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: 行動喚起（Call to Action）は、文言（コピー）と操作部品（ボタンなど）を組み合わせ、ユーザーを重要な次のステップへ導きます。実際のプロジェクトでは、文言、操作可能性、遷移先を確認してください。
why_it_matters: CTAを知ると、Vibe Coding初心者でも、UI/UXとアクセシビリティの課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、CTAを設計段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトでCTAがどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「CTA」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
