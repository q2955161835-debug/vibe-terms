title: Event Tracking
short_definition: Recording defined user or system events with consistent properties so behavior can be analyzed later.
analogy: 'Think of Event Tracking as a labeled tool in the product & requirements part of a workshop: the label tells you what problem area to inspect, but the real behavior still comes from the implementation.'
mechanism: Recording defined user or system events with consistent properties so behavior can be analyzed later. In a real project, its exact behavior depends on the surrounding technology, configuration, and data flow, so verify the concrete implementation rather than relying on the label alone.
why_it_matters: Knowing Event Tracking lets a Vibe Coding beginner name the exact product & requirements concern they mean and ask an AI coding agent for a change plus evidence that the behavior is correct.
project_example: In Vibe Terms, use Event Tracking as a vocabulary checkpoint when a learner reaches the requirements stage; connect the definition to one visible page, file, request, data structure, or verification step rather than teaching it in isolation.
ai_prompt_example: Explain how Event Tracking applies to this project. Point to the exact files or system boundary involved, make only the smallest necessary change, and show the command or user flow I can use to verify the result.
common_mistake: Treating the term Event Tracking as proof that an implementation is correct without checking actual behavior, data flow, permissions, failure cases, or the relevant test.
quiz:
- question: Which description best matches Event Tracking?
  options:
  - Recording defined user or system events with consistent properties so behavior can be analyzed later.
  - A visual decoration that has no effect on software behavior.
  - A guarantee that every implementation is secure and correct.
  answer: 0
- question: When an AI says it used Event Tracking, what should you do next?
  options:
  - Accept the label as proof.
  - Check the concrete implementation and verify the relevant behavior.
  - Rename the files so the term appears in the project.
  answer: 1
- question: Which prompt is more useful for working with Event Tracking?
  options:
  - “Make Event Tracking better.”
  - “Explain where Event Tracking appears, change the smallest necessary part, and show how to verify it.”
  - “Rewrite the whole project.”
  answer: 1
