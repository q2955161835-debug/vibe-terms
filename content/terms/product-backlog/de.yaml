title: Produkt-Backlog
short_definition: Eine priorisierte Liste von Produktarbeiten, Problemen, Ideen und technischen Aufgaben, die für die zukünftige
  Lieferung in Betracht gezogen werden könnten.
analogy: 'Für Produkt-Backlog hilft ein Bild aus Produkt & Anforderungen: Das Etikett weist auf das Problemfeld, ersetzt aber
  weder den Code noch die Prüfung des Datenflusses.'
mechanism: Eine priorisierte Liste von Produktarbeiten, Problemen, Ideen und technischen Aufgaben, die für die zukünftige
  Lieferung in Betracht gezogen werden könnten. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Produkt-Backlog versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Produkt-Backlog in der Phase Anforderungen als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Produkt-Backlog in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Produkt-Backlog als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
