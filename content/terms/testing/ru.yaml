title: Тестирование
short_definition: Систематическая проверка того, что программа работает ожидаемо и продолжает работать
  после изменений.
analogy: Как контрольный список, который обнаруживает сломанную дверь до прихода посетителей.
why_it_matters: Vibe Coding становится безопаснее, когда каждое изменение ИИ сопровождается конкретной
  проверкой.
ai_prompt_example: Добавь регрессионный тест, который падает до исправления ошибки и проходит после него.
common_mistake: Один раз пройти только успешный сценарий и считать функцию протестированной.
status: draft
source_content_version: 1
