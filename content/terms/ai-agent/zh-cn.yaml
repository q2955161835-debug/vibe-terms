title: "人工智能代理"
short_definition: "人工智能系统可以反复决定采取什么行动、使用工具、检查结果并继续实现目标。"
analogy: "可以阅读简报、使用批准的工具、检查结果并采取下一步行动的工作人员。"
why_it_matters: "编码代理可以编辑文件和运行命令，因此权限和检查检查点很重要。"
ai_prompt_example: "检查存储库，提出计划，仅编辑批准的文件，运行测试，然后停止并报告差异。"
common_mistake: "给予代理广泛的权限和开放式目标，没有验证门。"
status: draft
source_content_version: 1
