title: "KPI"
short_definition: "選擇用於追蹤重要業務、產品或營運目標的關鍵績效指標。"
analogy: "在產品規劃中，可把「KPI」當成把需求轉成決策的工具：它聚焦於「選擇用於追蹤重要業務、產品或營運目標的關鍵績效指標」。"
mechanism: "選擇用於追蹤重要業務、產品或營運目標的關鍵績效指標。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 KPI 後，Vibe Coding 初學者可以準確指出相關的產品與需求問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「KPI」放進需求文件、使用者流程或驗收條件中：檢查重點是「選擇用於追蹤重要業務、產品或營運目標的關鍵績效指標」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「KPI」為例，說明如何實現「選擇用於追蹤重要業務、產品或營運目標的關鍵績效指標」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「KPI」這個名稱就判定已經正確實作；請根據「選擇用於追蹤重要業務、產品或營運目標的關鍵績效指標」檢查實際行為、資料流、錯誤情境與測試結果。"
