title: Long-Term Speicher
short_definition: Persisted Informationen designed zu be retrieved across sessions, Aufgaben, oder long periods.
analogy: 'Ein praktisches Bild für Long-Term Speicher: ein markiertes Werkzeug in ai vibe, dessen Aufschrift die Frage schärft,
  aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Persisted Informationen designed zu be retrieved across sessions, Aufgaben, oder long periods. In einem realen
  Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Long-Term Speicher versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Long-Term Speicher in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Long-Term Speicher in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Long-Term Speicher als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
