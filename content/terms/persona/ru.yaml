title: Persona
short_definition: 'Persona — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A research-informed representation of a target user type used to summarize relevant goals, behaviors, and constraints.'
analogy: Persona можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Persona — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A research-informed representation of a target user type used to summarize relevant goals, behaviors, and constraints.'
why_it_matters: Понимание Persona помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Persona помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Persona в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Persona доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
