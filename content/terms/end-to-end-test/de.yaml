title: End-to-End-Test
short_definition: Ein Test, der einen vollständigen Benutzer- oder Systemworkflow durch den bereitgestellten oder realistischen
  Anwendungsstapel durchführt.
analogy: 'Ordne End-to-End-Test im Bereich Testen & Debugging als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch
  erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Ein Test, der einen vollständigen Benutzer- oder Systemworkflow durch den bereitgestellten oder realistischen Anwendungsstapel
  durchführt. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer End-to-End-Test versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Testen & Debugging benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir End-to-End-Test in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie End-to-End-Test in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff End-to-End-Test als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
