title: "樣機"
short_definition: "螢幕或視覺設計預期外觀的高保真靜態表示。"
analogy: "在產品規劃中，可把「樣機」當成把需求轉成決策的工具：它聚焦於「螢幕或視覺設計預期外觀的高保真靜態表示」。"
mechanism: "螢幕或視覺設計預期外觀的更高保真度靜態表示。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解樣機後，Vibe Coding 初學者可以準確指出相關的產品與需求問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「樣機」放進需求文件、使用者流程或驗收條件中：檢查重點是「螢幕或視覺設計預期外觀的高保真靜態表示」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「樣機」為例，說明如何實現「螢幕或視覺設計預期外觀的高保真靜態表示」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「樣機」這個名稱就判定已經正確實作；請根據「螢幕或視覺設計預期外觀的高保真靜態表示」檢查實際行為、資料流、錯誤情境與測試結果。"
