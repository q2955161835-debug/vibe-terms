mechanism: "实现上，这一概念会围绕“当按需运行时必须在处理请求之前初始化新实例时，会发生启动延迟。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“冷启动”后，你能更准确地描述部署与运维里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的部署与维护阶段，可以把“冷启动”放到一个真实项目中：围绕“当按需运行时必须在处理请求之前初始化新实例时，会发生启动延迟。”定位相关页面、文件、请求、数据结构或验证步骤。"
