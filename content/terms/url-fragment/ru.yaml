title: Фрагмент URL
short_definition: Часть URL-адреса после `#`, которая идентифицирует местоположение или состояние на стороне клиента
  внутри указанного ресурса.
analogy: 'Проще представить «Фрагмент URL» как правило работы в разделе «Web и сети»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Фрагмент URL»: Часть URL-адреса после `#`, которая идентифицирует местоположение или состояние
  на стороне клиента внутри указанного ресурса. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Фрагмент URL» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Фрагмент URL» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Фрагмент URL». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Фрагмент URL» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
