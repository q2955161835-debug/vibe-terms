title: Mock
short_definition: 'Mock — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A test double typically configured with expected interactions or predefined behavior for verifying how code communicates with a dependency.'
analogy: Mock можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Mock — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A test double typically configured with expected interactions or predefined behavior for verifying how code communicates with a dependency.'
why_it_matters: Понимание Mock помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Mock помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Mock в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Mock доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
