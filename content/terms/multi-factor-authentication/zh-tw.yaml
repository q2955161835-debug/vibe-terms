title: "多因素身分驗證"
short_definition: "需要兩個或更多獨立因素型別（例如密碼和裝置擁有情況）的證據的身分驗證。"
analogy: "在安全設計中，「多因素身分驗證」像一道需要驗證的門檻：它涉及「需要兩個或更多獨立因素型別（例如密碼和裝置擁有情況）的證據的身分驗證」，不能只看名稱就判定安全。"
mechanism: "需要兩個或多個獨立因素型別的證據（例如密碼和裝置擁有）的身分驗證。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解多因素身分驗證後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「多因素身分驗證」放進登入流程、權限檢查或安全日誌中：檢查重點是「需要兩個或更多獨立因素型別（例如密碼和裝置擁有情況）的證據的身分驗證」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「多因素身分驗證」為例，說明如何實現「需要兩個或更多獨立因素型別（例如密碼和裝置擁有情況）的證據的身分驗證」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「多因素身分驗證」這個名稱就判定已經正確實作；請根據「需要兩個或更多獨立因素型別（例如密碼和裝置擁有情況）的證據的身分驗證」檢查實際行為、資料流、錯誤情境與測試結果。"
