title: Tech Stack
short_definition: Набор языков, платформ, библиотек, баз данных и инфраструктуры, выбранных для создания и эксплуатации
  продукта.
analogy: 'Проще представить «Tech Stack» как правило работы в разделе «Компьютеры и среда разработки»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Tech Stack»: Набор языков, платформ, библиотек, баз данных и инфраструктуры, выбранных
  для создания и эксплуатации продукта. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Tech Stack» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Tech Stack» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Tech Stack». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Tech Stack» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
