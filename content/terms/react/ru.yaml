title: React
short_definition: Библиотека JavaScript для создания пользовательских интерфейсов из компонентов, отображаемый вывод
  которых является производным от свойств и состояния.
analogy: 'Проще представить «React» как правило работы в разделе «Фронтенд-разработка»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «React»: Библиотека JavaScript для создания пользовательских интерфейсов из компонентов,
  отображаемый вывод которых является производным от свойств и состояния. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «React» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «React» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «React». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «React» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
