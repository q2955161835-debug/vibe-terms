title: "設計 Token"
short_definition: "命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定。"
analogy: "將 Design Token 視為工作坊前端工程部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自於實作。"
mechanism: "命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解設計 Token 後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在 Vibe 術語中，當學習者達到介面邏輯階段時，使用 Design Token 作為術語檢查點；將定義對應到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋 Design Token 如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「設計 Token」視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
