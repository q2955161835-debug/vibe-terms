analogy: 'Ordne Terminal im Bereich computing env als beschriftetes Werkzeug ein: Die Beschriftung grenzt den Prüfbereich
  ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein Text-based Anwendung für running shell commands, inspecting Ausgabe, und interacting mit Entwicklung Werkzeuge.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
