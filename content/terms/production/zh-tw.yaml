title: "正式環境"
short_definition: "為真實使用者、真實流量或真實業務流程提供服務的即時環境。"
analogy: "在部署與維運中，「正式環境」像發布流程上的控制點：它處理「為真實使用者、真實流量或真實業務流程提供服務的即時環境」，要用日誌、監控或回滾結果確認。"
mechanism: "為真實使用者、真實流量或真實業務流程提供服務的即時環境。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解正式環境後，Vibe Coding 初學者可以準確指出相關的部署與維運問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在部署與維護階段，將「正式環境」放進建置、部署或監控紀錄中：檢查重點是「為真實使用者、真實流量或真實業務流程提供服務的即時環境」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「正式環境」為例，說明如何實現「為真實使用者、真實流量或真實業務流程提供服務的即時環境」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「正式環境」這個名稱就判定已經正確實作；請根據「為真實使用者、真實流量或真實業務流程提供服務的即時環境」檢查實際行為、資料流、錯誤情境與測試結果。"
