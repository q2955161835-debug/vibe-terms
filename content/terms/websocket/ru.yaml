title: WebSocket
short_definition: Протокол, который превращает HTTP-соединение в постоянный двусторонний канал для сообщений с малой
  задержкой.
analogy: '«WebSocket» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «WebSocket»: Протокол, который превращает HTTP-соединение в постоянный двусторонний канал
  для сообщений с малой задержкой. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «WebSocket» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «WebSocket» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «WebSocket». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «WebSocket» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
