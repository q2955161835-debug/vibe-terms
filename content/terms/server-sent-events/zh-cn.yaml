title: "服务器发送的事件"
short_definition: "一种浏览器 API 和 HTTP 流格式，允许服务器通过一个连接将文本事件持续推送到客户端。"
analogy: "将服务器发送事件视为开发工作台的 Web 和网络部分中的带标签的工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自实现。"
mechanism: "一种浏览器 API 和 HTTP 流格式，允许服务器通过一个连接将文本事件持续推送到客户端。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解服务器发送的事件可以让 Vibe Coding 初学者准确说出他们所指的网络与网络问题，并要求 AI 编程代理进行更改以及证明行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者到达环境阶段时，使用服务器发送的事件作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释服务器发送的事件如何应用于此项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将术语“服务器发送的事件”视为实现正确的证据，而不检查实际行为、数据流、权限、失败案例或相关测试。"
