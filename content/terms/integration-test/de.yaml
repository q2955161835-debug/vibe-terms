title: Integrationstest
short_definition: Ein Test, der überprüft, ob mehrere reale Komponenten oder Grenzen korrekt zusammenarbeiten.
analogy: 'Für Integrationstest hilft ein Bild aus Testen & Debugging: Das Etikett weist auf das Problemfeld, ersetzt aber
  weder den Code noch die Prüfung des Datenflusses.'
mechanism: Ein Test, der überprüft, ob mehrere reale Komponenten oder Grenzen korrekt zusammenarbeiten. In einem realen Projekt
  hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Integrationstest versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Testen & Debugging benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Integrationstest in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Integrationstest in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Integrationstest als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
