title: Вебхук
short_definition: Исходящий обратный вызов HTTP, отправляемый при возникновении события, чтобы другая система могла
  отреагировать без непрерывного опроса.
analogy: '«Вебхук» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Вебхук»: Исходящий обратный вызов HTTP, отправляемый при возникновении события, чтобы
  другая система могла отреагировать без непрерывного опроса. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Вебхук» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Вебхук» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Вебхук». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Вебхук» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
