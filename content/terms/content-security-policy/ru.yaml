title: Content Security Policy
short_definition: 'Content Security Policy — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A browser security policy that restricts which sources may supply scripts, styles, frames, and other resources to a page.'
analogy: Content Security Policy можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Content Security Policy — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A browser security policy that restricts which sources may supply scripts, styles, frames, and other resources to a page.'
why_it_matters: Понимание Content Security Policy помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Content Security Policy помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Content Security Policy в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Content Security Policy доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
