title: Фильтр
short_definition: Элемент управления, который сужает видимый набор данных без изменения базовых записей.
analogy: 'Проще представить «Filter» как правило работы в разделе «UI/UX и доступность»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Filter»: Элемент управления, который сужает видимый набор данных без изменения базовых
  записей. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Фильтр» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Filter» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Filter». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Filter» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
