title: Passwort-Hashing
short_definition: Passwörter werden mit einer langsamen Einweg-Passwort-Hashing-Funktion umgewandelt, sodass das ursprüngliche
  Passwort nicht direkt gespeichert wird.
analogy: Betrachte Passwort-Hashing als Orientierung in Sicherheit & Datenschutz. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Passwörter werden mit einer langsamen Einweg-Passwort-Hashing-Funktion umgewandelt, sodass das ursprüngliche Passwort
  nicht direkt gespeichert wird. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Passwort-Hashing versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Passwort-Hashing in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Passwort-Hashing in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Passwort-Hashing als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
