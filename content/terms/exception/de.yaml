title: Ausnahme
short_definition: Ein language oder runtime mechanism für signaling abnormal conditions die may be caught und handled.
analogy: 'Ein praktisches Bild für Ausnahme: ein markiertes Werkzeug in testing debugging, dessen Aufschrift die Frage schärft,
  aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein language oder runtime mechanism für signaling abnormal conditions die may be caught und handled. In einem realen
  Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Ausnahme versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in testing debugging benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Ausnahme in der Phase test protect als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Ausnahme in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Ausnahme als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
