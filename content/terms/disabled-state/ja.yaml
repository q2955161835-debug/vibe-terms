title: 無効状態
short_definition: コントロールが意図的に使用不能になっており、その状態と関連する理由の両方を伝える必要がある状態。
analogy: 無効状態は、ワークショップのフロントエンド エンジニアリング部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: コントロールが意図的に使用不能になっており、その状態と関連する理由の両方を伝える必要がある状態。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: 無効状態を知ることで、Vibe Codingの初心者は、フロントエンド エンジニアリング上の関連する課題を正確に言語化し、AIコーディングエージェントに変更とその動作が正しいという証拠を求めることができます。
project_example: Vibe Termsでは、学習者がインターフェイス ロジック段階に到達したときに語彙チェックポイントとして 無効状態を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: 無効状態がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: 無効状態 という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
