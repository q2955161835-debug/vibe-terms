title: Top Nav Layout
short_definition: 'Top Nav Layout — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A page structure where primary navigation stays across the top and the main content fills the area below.'
analogy: Top Nav Layout можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Top Nav Layout — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A page structure where primary navigation stays across the top and the main content fills the area below.'
why_it_matters: Понимание Top Nav Layout помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Top Nav Layout помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Top Nav Layout в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Top Nav Layout доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
