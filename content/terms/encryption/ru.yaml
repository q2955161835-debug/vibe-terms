title: Шифрование
short_definition: Преобразование данных с помощью криптографического ключа, чтобы несанкционированные лица не могли
  прочитать их без соответствующей возможности дешифрования.
analogy: '«Encryption» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно
  проверить.'
mechanism: 'Как работает «Encryption»: Преобразование данных с помощью криптографического ключа, чтобы несанкционированные
  лица не могли прочитать их без соответствующей возможности дешифрования. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Шифрование» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Encryption» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Encryption». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Encryption» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
