title: Состояние наведения
short_definition: Состояние взаимодействия указателя, которое возникает, когда указательное устройство располагается
  над элементом.
analogy: 'Проще представить «Hover» как правило работы в разделе «Фронтенд-разработка»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Hover»: Состояние взаимодействия указателя, которое возникает, когда указательное устройство
  располагается над элементом. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Состояние наведения» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Hover» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Hover». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Hover» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
