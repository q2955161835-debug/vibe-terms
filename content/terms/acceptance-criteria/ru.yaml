title: Acceptance Criteria
short_definition: 'Acceptance Criteria — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Concrete, testable conditions that define when a feature or requirement is considered complete and acceptable.'
analogy: Acceptance Criteria можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Acceptance Criteria — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Concrete, testable conditions that define when a feature or requirement is considered complete and acceptable.'
why_it_matters: Понимание Acceptance Criteria помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Acceptance Criteria помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Acceptance Criteria в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Acceptance Criteria доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
