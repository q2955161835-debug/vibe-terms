title: AIエージェント
short_definition: 取るべき行動を決定し、ツールを使用し、結果を検証し、目標に向かって継続することを繰り返すことができるAIシステム。
analogy: 要旨を読み、承認されたツールを使用し、結果を確認して次のステップに進むことができる作業者。
why_it_matters: コーディングエージェントはファイルを編集したりコマンドを実行したりできるため、権限とチェックポイントの確認が重要になります。
ai_prompt_example: リポジトリを検査し、計画を提案し、承認されたファイルのみを編集し、テストを実行して、停止して差分を報告します。
common_mistake: エージェントに広範な権限を与え、検証ゲートのない無制限の目標を与えます。
status: draft
source_content_version: 1
mechanism: AIエージェントは目標と現在の状態を読み取り、次に行う推論やツール呼び出しを選び、結果を評価しながら必要な手順を繰り返します。
project_example: Vibe Termsでは、AIエージェントを用語学習の進行を支える役割として扱い、実際の変更は人が確認します。
