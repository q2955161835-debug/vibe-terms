title: Long-Term Memory
short_definition: 'Long-Term Memory — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Persisted information designed to be retrieved across sessions, tasks, or long periods.'
analogy: Long-Term Memory можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Long-Term Memory — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Persisted information designed to be retrieved across sessions, tasks, or long periods.'
why_it_matters: Понимание Long-Term Memory помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Long-Term Memory помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Long-Term Memory в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Long-Term Memory доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
