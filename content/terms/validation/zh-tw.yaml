title: "驗證"
short_definition: "在接受、處理或儲存輸入或資料之前根據明確的規則檢查輸入或資料。"
analogy: "在後端流程中，「驗證」像服務之間的處理站：它負責「在接受、處理或儲存輸入或資料之前根據明確的規則檢查輸入或資料」，結果要用 API 請求與回應確認。"
mechanism: "在接受、處理或儲存輸入或資料之前根據明確的規則檢查輸入或資料。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解驗證後，Vibe Coding 初學者可以準確指出相關的後端與 API 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「驗證」放進API 請求、回應或服務日誌中：檢查重點是「在接受、處理或儲存輸入或資料之前根據明確的規則檢查輸入或資料」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「驗證」為例，說明如何實現「在接受、處理或儲存輸入或資料之前根據明確的規則檢查輸入或資料」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「驗證」這個名稱就判定已經正確實作；請根據「在接受、處理或儲存輸入或資料之前根據明確的規則檢查輸入或資料」檢查實際行為、資料流、錯誤情境與測試結果。"
