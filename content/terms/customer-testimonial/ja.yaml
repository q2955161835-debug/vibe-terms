title: お客様の声
short_definition: 経験または価値の定性的証拠として使用される、顧客またはユーザーからの情報源の記述。
analogy: お客様の声は、ワークショップの UI/UX およびアクセシビリティ部分のラベル付きツールと考えてください。ラベルは、どの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: 経験または価値の定性的証拠として使用される、顧客またはユーザーからの情報源の記述。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: お客様の声を知ることで、Vibe Codingの初心者は、その意味する UI/UX およびアクセシビリティに関する懸念を正確に挙げて、AIコーディングエージェントに変更と、動作が正しいという証拠を求めることができます。
project_example: Vibe Termsでは、学習者が設計段階に到達したときに語彙チェックポイントとして お客様の声を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: お客様の声がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: お客様の声 という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
