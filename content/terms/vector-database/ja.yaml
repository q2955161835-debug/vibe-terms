title: Vector Database
short_definition: 'Vector Database は「AI と Vibe Coding」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A datastore optimized for saving embedding vectors and finding nearby vectors by similarity.'
