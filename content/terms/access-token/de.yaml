title: Access Token
short_definition: Eine an eine API übermittelte Berechtigung, die den Zugriff auf bestimmte Ressourcen oder Vorgänge für einen
  begrenzten Umfang oder eine begrenzte Laufzeit autorisiert.
analogy: 'Ordne Access Token im Bereich Sicherheit & Datenschutz als beschriftetes Werkzeug ein: Die Beschriftung grenzt den
  Prüfbereich ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Eine an eine API übermittelte Berechtigung, die den Zugriff auf bestimmte Ressourcen oder Vorgänge für einen begrenzten
  Umfang oder eine begrenzte Laufzeit autorisiert. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Access Token versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Access Token in der Phase Tests & Schutz als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Access Token in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Access Token als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
