title: "React"
short_definition: "一個 JavaScript 庫，用於從渲染輸出源自 props 和 state 的元件構建使用者介面。"
analogy: "在前端實作中，可把「React」想成介面的一個可組合零件：它處理「一個 JavaScript 庫，用於從渲染輸出源自 props 和 state 的元件構建使用者介面」，並與畫面狀態互相配合。"
mechanism: "一個 JavaScript 庫，用於從渲染輸出源自 props 和 state 的元件構建使用者介面。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 React 後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立介面與邏輯階段，將「React」放進頁面、元件或樣式規則中：檢查重點是「一個 JavaScript 庫，用於從渲染輸出源自 props 和 state 的元件構建使用者介面」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「React」為例，說明如何實現「一個 JavaScript 庫，用於從渲染輸出源自 props 和 state 的元件構建使用者介面」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「React」這個名稱就判定已經正確實作；請根據「一個 JavaScript 庫，用於從渲染輸出源自 props 和 state 的元件構建使用者介面」檢查實際行為、資料流、錯誤情境與測試結果。"
