title: RPC
short_definition: Remote-Prozeduraufruf, ein Ansatz, bei dem ein System eine benannte Operation auf einem anderen System aufruft,
  als würde es eine Funktion aufrufen.
analogy: 'Für RPC hilft ein Bild aus Backend & APIs: Das Etikett weist auf das Problemfeld, ersetzt aber weder den Code noch
  die Prüfung des Datenflusses.'
mechanism: Remote-Prozeduraufruf, ein Ansatz, bei dem ein System eine benannte Operation auf einem anderen System aufruft,
  als würde es eine Funktion aufrufen. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer RPC versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir RPC in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie RPC in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere
  nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff RPC als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
