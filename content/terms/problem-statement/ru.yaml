title: Problem Statement
short_definition: 'Problem Statement — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A concise description of the user or business problem, its context, and why solving it matters without prematurely prescribing a solution.'
analogy: Problem Statement можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Problem Statement — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A concise description of the user or business problem, its context, and why solving it matters without prematurely prescribing a solution.'
why_it_matters: Понимание Problem Statement помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Problem Statement помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Problem Statement в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Problem Statement доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
