title: Titel-Tag
short_definition: Der HTML-Wert „<title>“, der ein Dokument für Browser-Registerkarten, Verlauf, Lesezeichen und Suchergebnisse
  benennt.
analogy: 'Ein praktischer Vergleich für Titel-Tag: ein markiertes Werkzeug in Frontend-Entwicklung, dessen Zweck erst im Zusammenspiel
  mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Der HTML-Wert „<title>“, der ein Dokument für Browser-Registerkarten, Verlauf, Lesezeichen und Suchergebnisse benennt.
  In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die
  konkrete Umsetzung.
why_it_matters: Wer Titel-Tag versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Titel-Tag in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Titel-Tag in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
