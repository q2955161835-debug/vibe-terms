title: Y2K
short_definition: Ein retro-futuristischer visueller Stil, inspiriert von der digitalen Kultur der späten 1990er und frühen
  2000er Jahre, metallischen Oberflächen, glänzenden Kunststoffen und leuchtenden Farben.
analogy: Betrachte Y2K als Orientierung in UI/UX & Barrierefreiheit. Die Bezeichnung führt zur richtigen technischen Stelle,
  garantiert aber noch keine gute Umsetzung.
mechanism: Ein retro-futuristischer visueller Stil, inspiriert von der digitalen Kultur der späten 1990er und frühen 2000er
  Jahre, metallischen Oberflächen, glänzenden Kunststoffen und leuchtenden Farben. In einem realen Projekt hängt die genaue
  Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Y2K versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Y2K in der Phase Design als Lerncheckpoint. Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Y2K in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere
  nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Y2K als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
