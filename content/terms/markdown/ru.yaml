title: Markdown
short_definition: 'Markdown — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A lightweight plain-text markup syntax for headings, lists, links, emphasis, code blocks, and other document structure.'
analogy: Markdown можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Markdown — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A lightweight plain-text markup syntax for headings, lists, links, emphasis, code blocks, and other document structure.'
why_it_matters: Понимание Markdown помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Markdown помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Markdown в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Markdown доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
