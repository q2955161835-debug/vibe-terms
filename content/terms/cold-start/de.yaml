title: Kaltstart
short_definition: Die Startverzögerung, die auftritt, wenn eine On-Demand-Laufzeitumgebung eine neue Instanz initialisieren
  muss, bevor sie eine Anforderung verarbeiten kann.
analogy: 'Für Kaltstart hilft ein Bild aus Deployment & Betrieb: Das Etikett weist auf das Problemfeld, ersetzt aber weder
  den Code noch die Prüfung des Datenflusses.'
mechanism: Die Startverzögerung, die auftritt, wenn eine On-Demand-Laufzeitumgebung eine neue Instanz initialisieren muss,
  bevor sie eine Anforderung verarbeiten kann. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Kaltstart versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Deployment & Betrieb benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Kaltstart in der Phase Deployment & Wartung als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Kaltstart in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Kaltstart als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
