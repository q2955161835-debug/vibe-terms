title: Исходный код
short_definition: Читаемый человеком текст программы, который разработчики и инструменты кодирования редактируют
  перед его выполнением или сборкой.
analogy: 'Проще представить «Исходный код» как правило работы в разделе «Компьютеры и среда разработки»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Исходный код»: Читаемый человеком текст программы, который разработчики и инструменты
  кодирования редактируют перед его выполнением или сборкой. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Исходный код» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Исходный код» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Исходный код». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Исходный код» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
