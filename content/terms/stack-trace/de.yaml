title: Stack Trace
short_definition: Ein diagnostic Datensatz showing the chain von function calls active wenn an Fehler oder exception occurred.
analogy: Betrachte Stack Trace als Orientierungsschild in testing debugging. Es weist auf die richtige technische Stelle,
  ersetzt aber weder die Implementierung noch deren Prüfung.
mechanism: Ein diagnostic Datensatz showing the chain von function calls active wenn an Fehler oder exception occurred. In
  einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Stack Trace versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in testing debugging benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Stack Trace in der Phase test protect als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Stack Trace in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Stack Trace als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
