title: "Cookie"
short_definition: "一小段由瀏覽器管理的資料，與網站關聯，並根據範圍、安全性和 SameSite 規則傳送。"
analogy: "在安全設計中，「Cookie」像一道需要驗證的門檻：它涉及「一小段由瀏覽器管理的資料，與網站關聯，並根據範圍、安全性和 SameSite 規則傳送」，不能只看名稱就判定安全。"
mechanism: "與網站關聯的一小段瀏覽器管理的資料，並根據範圍、安全性和 SameSite 規則傳送。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 Cookie 後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「Cookie」放進登入流程、權限檢查或安全日誌中：檢查重點是「一小段由瀏覽器管理的資料，與網站關聯，並根據範圍、安全性和 SameSite 規則傳送」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「Cookie」為例，說明如何實現「一小段由瀏覽器管理的資料，與網站關聯，並根據範圍、安全性和 SameSite 規則傳送」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「Cookie」這個名稱就判定已經正確實作；請根據「一小段由瀏覽器管理的資料，與網站關聯，並根據範圍、安全性和 SameSite 規則傳送」檢查實際行為、資料流、錯誤情境與測試結果。"
