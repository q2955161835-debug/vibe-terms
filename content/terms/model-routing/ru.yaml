title: Model Routing
short_definition: 'Model Routing — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Selecting among different models at runtime based on task type, capability, cost, latency, or risk.'
analogy: Model Routing можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Model Routing — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Selecting among different models at runtime based on task type, capability, cost, latency, or risk.'
why_it_matters: Понимание Model Routing помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Model Routing помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Model Routing в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Model Routing доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
