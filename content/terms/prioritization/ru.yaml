title: Расстановка приоритетов
short_definition: Процесс заказа возможностей или работы на основе ценности, срочности, риска, усилий, доказательств
  и стратегического соответствия.
analogy: '«Prioritization» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Prioritization»: Процесс заказа возможностей или работы на основе ценности, срочности,
  риска, усилий, доказательств и стратегического соответствия. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Расстановка приоритетов» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Prioritization» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Prioritization». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Prioritization» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
