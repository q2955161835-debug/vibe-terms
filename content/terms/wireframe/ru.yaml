title: Вайрфрейм
short_definition: Макет с низкой точностью, который показывает структуру, иерархию и размещение взаимодействия без
  окончательного визуального оформления.
analogy: 'Представьте «вайрфрейм» как инструмент в наборе разработчика: он решает задачу в области «Продукт и требования»,
  но результат зависит от настройки.'
mechanism: 'Как работает «вайрфрейм»: Макет с низкой точностью, который показывает структуру, иерархию и размещение
  взаимодействия без окончательного визуального оформления. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Вайрфрейм» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «вайрфрейм» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «вайрфрейм». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «вайрфрейм» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
