title: Исследование пользователей
short_definition: Систематическое изучение пользователей, их контекста, поведения, потребностей и проблем посредством
  интервью, наблюдения, опросов или других методов.
analogy: 'Проще представить «Исследование пользователей» как правило работы в разделе «Продукт и требования»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Исследование пользователей»: Систематическое изучение пользователей, их контекста, поведения,
  потребностей и проблем посредством интервью, наблюдения, опросов или других методов. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Исследование пользователей» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Исследование пользователей» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Исследование пользователей». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Исследование пользователей» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
