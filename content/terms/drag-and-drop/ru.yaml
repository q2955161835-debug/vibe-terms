title: Перетащите
short_definition: Взаимодействие, при котором пользователь нажимает на элемент, перемещает его и отпускает в другом
  месте или цели.
analogy: 'Представьте «Drag and Drop» как инструмент в наборе разработчика: он решает задачу в области «Фронтенд-разработка»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Drag and Drop»: Взаимодействие, при котором пользователь нажимает на элемент, перемещает
  его и отпускает в другом месте или цели. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Перетащите» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Drag and Drop» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Drag and Drop». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Drag and Drop» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
