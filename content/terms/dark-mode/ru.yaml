title: Темный режим
short_definition: Тема, использующая темные основные поверхности с скорректированными цветами текста, рамки, семантики,
  изображения и кода для удобства чтения.
analogy: 'Проще представить «Dark Mode» как правило работы в разделе «Фронтенд-разработка»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Dark Mode»: Тема, использующая темные основные поверхности с скорректированными цветами
  текста, рамки, семантики, изображения и кода для удобства чтения. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Темный режим» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Dark Mode» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Dark Mode». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Dark Mode» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
