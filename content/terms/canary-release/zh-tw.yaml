title: "金絲雀發布"
short_definition: "推出策略，將一小部分生產流量送到新版本，然後逐漸擴大曝光。"
analogy: "在部署與維運中，「金絲雀發布」像發布流程上的控制點：它處理「推出策略，將一小部分生產流量送到新版本，然後逐漸擴大曝光」，要用日誌、監控或回滾結果確認。"
mechanism: "一種推出策略，將一小部分生產流量傳送到新版本，然後逐漸擴大曝光。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解金絲雀發布後，Vibe Coding 初學者可以準確指出相關的部署與維運問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在部署與維護階段，將「金絲雀發布」放進建置、部署或監控紀錄中：檢查重點是「推出策略，將一小部分生產流量送到新版本，然後逐漸擴大曝光」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「金絲雀發布」為例，說明如何實現「推出策略，將一小部分生產流量送到新版本，然後逐漸擴大曝光」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「金絲雀發布」這個名稱就判定已經正確實作；請根據「推出策略，將一小部分生產流量送到新版本，然後逐漸擴大曝光」檢查實際行為、資料流、錯誤情境與測試結果。"
