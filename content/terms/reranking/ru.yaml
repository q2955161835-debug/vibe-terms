title: Изменение рейтинга
short_definition: Второй этап оценки, который изменяет порядок извлеченных кандидатов с использованием более строгой
  модели релевантности или дополнительных сигналов.
analogy: 'Представьте «Reranking» как инструмент в наборе разработчика: он решает задачу в области «ИИ и Vibe Coding»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Reranking»: Второй этап оценки, который изменяет порядок извлеченных кандидатов с использованием
  более строгой модели релевантности или дополнительных сигналов. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Изменение рейтинга» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Reranking» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Reranking». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Reranking» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
