title: Barrierefreiheit
short_definition: die practice von designing und engineering products so people mit diverse abilities kann perceive, understand,
  navigate, und operate ihnen.
analogy: 'Ordne Barrierefreiheit im Bereich UI/UX & Barrierefreiheit als beschriftetes Werkzeug ein: Die Beschriftung grenzt
  den Prüfbereich ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: die practice von designing und engineering products so people mit diverse abilities kann perceive, understand,
  navigate, und operate ihnen. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Barrierefreiheit versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Barrierefreiheit in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Barrierefreiheit in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Barrierefreiheit als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
