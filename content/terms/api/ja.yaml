title: API
short_definition: あるソフトウェアが別のソフトウェアにデータまたはアクションを要求するための定義された方法。
analogy: レストランのメニューには、キッチンに入らなくても注文できるものが記載されています。
why_it_matters: AIコーディングでは、APIを通じてフロントエンド、データベース、モデルプロバイダー、サードパーティサービスが接続されることがよくあります。
ai_prompt_example: 実装する前に、リクエストパラメーター、応答フィールド、エラーケースを含むGET /api/termsエンドポイントコントラクトを作成します。
common_mistake: APIコントラクトとそれを実装する内部コードを混同します。
status: draft
source_content_version: 1
mechanism: APIは公開された操作、入力、出力、エラー形式を境界として定め、呼び出し側と提供側をその契約に沿って接続します。
project_example: Vibe Termsでは、ブラウザが用語データを取得する境界をAPIの例として読み、リクエストと応答を確認します。
