title: Schritte
short_definition: Ein progress/navigation Komponente die zeigt the ordered stages von a multi-step process und the Benutzer's
  aktuelle stage.
analogy: 'Ein praktisches Bild für Schritte: ein markiertes Werkzeug in ui ux, dessen Aufschrift die Frage schärft, aber keine
  Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein progress/navigation Komponente die zeigt the ordered stages von a multi-step process und the Benutzer's aktuelle
  stage. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Schritte versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von einem KI-Coding-Agenten
  eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Schritte in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Schritte in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Schritte als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
