title: "序列化"
short_definition: "将内存中的数据转换为传输或存储表示形式，例如 JSON、字节或消息格式。"
analogy: "可以把“序列化”看成后端与 API 里的一个概念标签：它提醒你先找“将内存中的数据转换为传输或存储表示形式，例如 JSON、字节或消息格式。”对应的实现，最后仍要以代码、配置和实际行为为准。"
mechanism: "实现上，这一概念会围绕“将内存中的数据转换为传输或存储表示形式，例如 JSON、字节或消息格式。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“序列化”后，你能更准确地描述后端与 API 里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的接入数据与身份阶段，可以把“序列化”放到一个真实项目中：围绕“将内存中的数据转换为传输或存储表示形式，例如 JSON、字节或消息格式。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“序列化”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“将内存中的数据转换为传输或存储表示形式，例如 JSON、字节或消息格式”。"
common_mistake: "不要把“序列化”这个名称当成正确性的证明；请检查实际行为、数据流、权限、失败场景和相关测试。"
