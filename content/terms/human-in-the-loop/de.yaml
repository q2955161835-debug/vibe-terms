title: Human-in-the-loop
short_definition: Ein workflow die deliberately requires a person zu review, approve, korrekt, oder take over at important
  decision points.
analogy: Betrachte Human-in-the-loop als Orientierungsschild in ai vibe. Es weist auf die richtige technische Stelle, ersetzt
  aber weder die Implementierung noch deren Prüfung.
mechanism: Ein workflow die deliberately requires a person zu review, approve, korrekt, oder take over at important decision
  points. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Human-in-the-loop versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Human-in-the-loop in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Human-in-the-loop in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Human-in-the-loop als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
