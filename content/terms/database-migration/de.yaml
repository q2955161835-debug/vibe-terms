title: Datenbankmigration
short_definition: Eine versionierte Änderung der Datenbankstruktur oder der Daten, die umgebungsübergreifend konsistent angewendet
  werden kann.
analogy: 'Ordne Datenbankmigration im Bereich Daten & Datenbanken als Werkzeug ein: Die Bezeichnung grenzt die Frage ein,
  doch erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Eine versionierte Änderung der Datenbankstruktur oder der Daten, die umgebungsübergreifend konsistent angewendet
  werden kann. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Datenbankmigration versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Daten & Datenbanken benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Datenbankmigration in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Datenbankmigration in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Datenbankmigration als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
