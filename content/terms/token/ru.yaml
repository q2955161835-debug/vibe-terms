title: Токен
short_definition: Единица текста, которую считывает или генерирует языковая модель; слова могут быть разделены на
  один или несколько токенов.
analogy: 'Проще представить «токен» как правило работы в разделе «ИИ и Vibe Coding»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «токен»: Единица текста, которую считывает или генерирует языковая модель; слова могут
  быть разделены на один или несколько токенов. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Токен» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «токен» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «токен». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «токен» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
