title: XSS
short_definition: 'XSS は「セキュリティとプライバシー」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: Cross-site scripting, a vulnerability where untrusted content is interpreted as executable browser script in another user''s context.'
analogy: XSS は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'XSS は「セキュリティとプライバシー」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: Cross-site scripting, a vulnerability where untrusted content is interpreted as executable browser script in another user''s context.'
why_it_matters: XSS を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: XSS を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
ai_prompt_example: このプロジェクトで XSS がどのように関係するか説明してください。対象ファイルまたは境界を示し、必要最小限の変更と確認手順を提示してください。
common_mistake: XSS という名前だけで実装が正しいと判断し、実際の動作・データフロー・失敗時の挙動を確認しないことです。
