title: Адаптивный дизайн
short_definition: Дизайн, который адаптирует макет, контент, элементы управления и типографику к различным размерам
  области просмотра и возможностям устройства.
analogy: '«Адаптивный дизайн» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все
  равно нужно проверить.'
mechanism: 'Как работает «Адаптивный дизайн»: Дизайн, который адаптирует макет, контент, элементы управления и типографику
  к различным размерам области просмотра и возможностям устройства. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Адаптивный дизайн» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Адаптивный дизайн» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Адаптивный дизайн». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Адаптивный дизайн» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
