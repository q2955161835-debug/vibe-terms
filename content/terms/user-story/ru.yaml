title: История пользователя
short_definition: Краткое требование, написанное с точки зрения пользователя, в котором указывается, кому что-то
  нужно, что им нужно и почему это важно.
analogy: '«Пользовательская история» похож на понятную табличку на нужном ящике: она направляет, однако содержимое
  все равно нужно проверить.'
mechanism: 'Как работает «Пользовательская история»: Краткое требование, написанное с точки зрения пользователя,
  в котором указывается, кому что-то нужно, что им нужно и почему это важно. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «История пользователя» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Пользовательская история» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Пользовательская история». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Пользовательская история» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
