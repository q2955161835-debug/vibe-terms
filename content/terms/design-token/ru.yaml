title: Design Token
short_definition: 'Design Token — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A named, reusable design value such as a color, spacing unit, radius, or typography setting shared across components.'
analogy: Design Token можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Design Token — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A named, reusable design value such as a color, spacing unit, radius, or typography setting shared across components.'
why_it_matters: Понимание Design Token помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Design Token помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Design Token в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Design Token доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
