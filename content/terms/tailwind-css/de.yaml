title: Tailwind CSS
short_definition: Ein utility-erste CSS Framework die composes kleine vordefiniert classes directly in markup zu Erstellen
  benutzerdefinierte designs.
analogy: Betrachte Tailwind CSS als Orientierungsschild in Frontend-Entwicklung. Es weist auf die richtige technische Stelle,
  ersetzt aber weder die Implementierung noch deren Prüfung.
mechanism: Ein utility-erste CSS Framework die composes kleine vordefiniert classes directly in markup zu Erstellen benutzerdefinierte
  designs. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Tailwind CSS versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Tailwind CSS in der Phase Oberflächenlogik als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Tailwind CSS in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Tailwind CSS als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
