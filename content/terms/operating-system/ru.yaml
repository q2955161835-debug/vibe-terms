title: Operating System
short_definition: 'Operating System — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The foundational software that manages hardware, processes, files, networking, and application execution on a computer.'
analogy: Operating System можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Operating System — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The foundational software that manages hardware, processes, files, networking, and application execution on a computer.'
why_it_matters: Понимание Operating System помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Operating System помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Operating System в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Operating System доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
