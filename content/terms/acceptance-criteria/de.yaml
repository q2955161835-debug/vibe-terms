title: Akzeptanzkriterien
short_definition: Concrete, testable conditions die definieren wenn a feature oder requirement is considered complete und
  acceptable.
analogy: 'Ein praktisches Bild für Akzeptanzkriterien: ein markiertes Werkzeug in Tests & Debugging, dessen Aufschrift die
  Frage schärft, aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Concrete, testable conditions die definieren wenn a feature oder requirement is considered complete und acceptable.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Akzeptanzkriterien versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Tests & Debugging benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Akzeptanzkriterien in der Phase Tests & Schutz als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Akzeptanzkriterien in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Akzeptanzkriterien als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
