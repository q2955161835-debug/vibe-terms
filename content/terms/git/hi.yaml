title: Git
short_definition: एक संस्करण नियंत्रण प्रणाली जो कोड बदलाव दर्ज करती है और ब्रांचों के साथ सुरक्षित काम
  करने देती है।
analogy: लेबल लगे सेव-पॉइंट वाली प्रोजेक्ट की टाइम मशीन जैसा।
why_it_matters: एआई बहुत-सी फ़ाइलें जल्दी बदल सकता है; Git से बदलाव देखना और भरोसेमंद तरीके से वापस करना
  संभव है।
ai_prompt_example: केवल इस फ़ीचर के लिए एक छोटा, केंद्रित कमिट बनाओ और आगे बढ़ने से पहले diff दिखाओ।
common_mistake: कई असंबंधित एआई बदलावों को एक ही बहुत बड़े कमिट में डाल देना।
status: draft
source_content_version: 1
