title: Abfrage
short_definition: Eine Anforderung zum Abrufen oder Bearbeiten von Daten gemäß angegebenen Bedingungen.
analogy: Betrachte Abfrage als Orientierung in Daten & Datenbanken. Die Bezeichnung führt zur richtigen technischen Stelle,
  garantiert aber noch keine gute Umsetzung.
mechanism: Eine Anforderung zum Abrufen oder Bearbeiten von Daten gemäß angegebenen Bedingungen. In einem realen Projekt hängt
  die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Abfrage versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Daten & Datenbanken benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Abfrage in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Abfrage in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Abfrage als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
