title: Медиа-запрос
short_definition: Условное правило CSS, которое применяет стили на основе таких характеристик, как ширина области
  просмотра, предпочтения пользователя или возможности устройства.
analogy: '«Медиазапрос» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Медиазапрос»: Условное правило CSS, которое применяет стили на основе таких характеристик,
  как ширина области просмотра, предпочтения пользователя или возможности устройства. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Медиа-запрос» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Медиазапрос» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Медиазапрос». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Медиазапрос» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
