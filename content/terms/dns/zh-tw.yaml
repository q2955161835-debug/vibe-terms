title: "DNS"
short_definition: "將網域轉換為 IP 位址和服務目標等記錄的分散式命名系統。"
analogy: "在 Web 流程裡，「DNS」像連接兩個步驟的交通規則：它處理「將網域轉換為 IP 位址和服務目標等記錄的分散式命名系統」，實際效果要用請求與回應驗證。"
mechanism: "將網域轉換為 IP 位址和服務目標等記錄的分散式命名系統。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 DNS 後，Vibe Coding 初學者可以準確指出相關的 Web 與網路問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「DNS」放進瀏覽器畫面、HTTP 請求或回應中：檢查重點是「將網域轉換為 IP 位址和服務目標等記錄的分散式命名系統」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「DNS」為例，說明如何實現「將網域轉換為 IP 位址和服務目標等記錄的分散式命名系統」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「DNS」這個名稱就判定已經正確實作；請根據「將網域轉換為 IP 位址和服務目標等記錄的分散式命名系統」檢查實際行為、資料流、錯誤情境與測試結果。"
