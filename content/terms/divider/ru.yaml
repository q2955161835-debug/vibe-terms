title: Разделитель
short_definition: Тонкий визуальный разделитель, используемый для разделения соседних групп или разделов без создания
  тяжелого контейнера.
analogy: 'Проще представить «Divider» как правило работы в разделе «Фронтенд-разработка»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Divider»: Тонкий визуальный разделитель, используемый для разделения соседних групп или
  разделов без создания тяжелого контейнера. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Разделитель» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Divider» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Divider». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Divider» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
