title: Index
short_definition: 'Index — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An auxiliary database structure that speeds selected lookups or ordering at the cost of storage and write overhead.'
analogy: Index можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Index — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An auxiliary database structure that speeds selected lookups or ordering at the cost of storage and write overhead.'
why_it_matters: Понимание Index помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Index помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Index в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Index доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
