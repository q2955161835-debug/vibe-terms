title: Bereinigung
short_definition: Transformieren oder Entfernen unsicherer Teile nicht vertrauenswürdiger Eingaben für ein bestimmtes Ziel
  oder zulässiges Format.
analogy: 'Für Bereinigung hilft ein Bild aus Sicherheit & Datenschutz: Das Etikett weist auf das Problemfeld, ersetzt aber
  weder den Code noch die Prüfung des Datenflusses.'
mechanism: Transformieren oder Entfernen unsicherer Teile nicht vertrauenswürdiger Eingaben für ein bestimmtes Ziel oder zulässiges
  Format. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Bereinigung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Bereinigung in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Bereinigung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Bereinigung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
