title: Идемпотентность
short_definition: Свойство, при котором повторение одной и той же операции имеет тот же предполагаемый эффект, что
  и ее однократное выполнение.
analogy: 'Проще представить «Idempotency» как правило работы в разделе «Бэкенд и API»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Idempotency»: Свойство, при котором повторение одной и той же операции имеет тот же предполагаемый
  эффект, что и ее однократное выполнение. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Идемпотентность» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Idempotency» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Idempotency». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Idempotency» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
