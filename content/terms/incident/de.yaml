title: Vorfall
short_definition: Ein ungeplantes Ereignis, das einen Dienst beeinträchtigt oder unterbricht und eine koordinierte Erkennung,
  Schadensbegrenzung, Wiederherstellung und Schulung erfordert.
analogy: Betrachte Vorfall als Orientierung in Deployment & Betrieb. Die Bezeichnung führt zur richtigen technischen Stelle,
  garantiert aber noch keine gute Umsetzung.
mechanism: Ein ungeplantes Ereignis, das einen Dienst beeinträchtigt oder unterbricht und eine koordinierte Erkennung, Schadensbegrenzung,
  Wiederherstellung und Schulung erfordert. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Vorfall versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Deployment & Betrieb benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Vorfall in der Phase Deployment & Wartung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Vorfall in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Vorfall als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
