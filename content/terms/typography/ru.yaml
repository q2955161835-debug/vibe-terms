title: Typography
short_definition: 'Typography — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The system of typefaces, sizes, weights, spacing, line heights, and hierarchy used to make text readable and meaningful.'
analogy: Typography можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Typography — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The system of typefaces, sizes, weights, spacing, line heights, and hierarchy used to make text readable and meaningful.'
why_it_matters: Понимание Typography помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Typography помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Typography в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Typography доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
