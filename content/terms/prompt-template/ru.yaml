title: Prompt Template
short_definition: 'Prompt Template — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A reusable prompt structure with placeholders that are filled with task-specific values at runtime.'
analogy: Prompt Template можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Prompt Template — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A reusable prompt structure with placeholders that are filled with task-specific values at runtime.'
why_it_matters: Понимание Prompt Template помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Prompt Template помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Prompt Template в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Prompt Template доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
