title: "Worktree"
short_definition: "一項 Git 功能，可從同一儲存庫中檢出額外的工作樹，以便可以同時處理多個分支。"
analogy: "在 Git 協作中，可把「Worktree」想成變更管理上的一個記錄點：它關乎「一項 Git 功能，可從同一儲存庫中檢出額外的工作樹，以便可以同時處理多個分支」，仍需檢查實際差異與歷史。"
mechanism: "一項 Git 功能，可從同一儲存庫中檢出額外的工作樹，以便可以同時處理多個分支。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 Worktree 後，Vibe Coding 初學者可以準確指出相關的 Git 與協作問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「Worktree」放進提交、分支或差異檔中：檢查重點是「一項 Git 功能，可從同一儲存庫中檢出額外的工作樹，以便可以同時處理多個分支」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「Worktree」為例，說明如何實現「一項 Git 功能，可從同一儲存庫中檢出額外的工作樹，以便可以同時處理多個分支」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「Worktree」這個名稱就判定已經正確實作；請根據「一項 Git 功能，可從同一儲存庫中檢出額外的工作樹，以便可以同時處理多個分支」檢查實際行為、資料流、錯誤情境與測試結果。"
