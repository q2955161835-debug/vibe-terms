title: Artefakt
short_definition: Ein Ausgabe produced by a Erstellen, Test, oder packaging Prozess, solche as a bundle, executable, report,
  oder archive.
analogy: Betrachte Artefakt als Orientierungsschild in Rechenumgebung. Es weist auf die richtige technische Stelle, ersetzt
  aber weder die Implementierung noch deren Prüfung.
mechanism: Ein Ausgabe produced by a Erstellen, Test, oder packaging Prozess, solche as a bundle, executable, report, oder
  archive. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Artefakt versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Rechenumgebung benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Artefakt in der Phase Umgebung als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Artefakt in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Artefakt als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
