title: データベース
short_definition: 構造化されたアプリケーションデータを継続的に保存し、検索するための仕組み。
analogy: 索引が整った書庫のように、すべての箱を開けなくても必要な記録を探せます。
why_it_matters: ユーザーアカウント、コンテンツ、学習履歴、製品データには通常、永続的な保存先が必要です。
ai_prompt_example: まずテーブルと関係を設計し、マイグレーションを示してからアプリケーションコードを書いてください。
common_mistake: データモデルを作らず、データベースを巨大で雑然としたJSON置き場として使うこと。
status: draft
source_content_version: 1
