title: Request-Body
short_definition: Die innerhalb einer HTTP-Anfrage gesendete Nutzlast, die üblicherweise JSON, Formulardaten oder hochgeladene
  Bytes enthält.
analogy: 'Ordne Anforderungstext im Bereich Web & Netzwerk als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch erst
  die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Die innerhalb einer HTTP-Anfrage gesendete Nutzlast, die üblicherweise JSON, Formulardaten oder hochgeladene Bytes
  enthält. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Anforderungstext versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Web & Netzwerk benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Anforderungstext in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Anforderungstext in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Anforderungstext als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
