title: डेटाबेस
short_definition: संरचित एप्लिकेशन डेटा को लंबे समय तक सहेजने और खोजने वाला सिस्टम।
analogy: अच्छी तरह सूचीबद्ध अभिलेख कक्ष की तरह, जहाँ हर फ़ोल्डर खोले बिना रिकॉर्ड मिल जाता है।
why_it_matters: उपयोगकर्ता खाते, सामग्री, सीखने की प्रगति और उत्पाद डेटा को आम तौर पर स्थायी संग्रह चाहिए।
ai_prompt_example: पहले टेबल और उनके संबंध डिज़ाइन करो, फिर माइग्रेशन दिखाओ, उसके बाद एप्लिकेशन कोड लिखो।
common_mistake: डेटा मॉडल के बिना डेटाबेस को अव्यवस्थित JSON से भरी बड़ी दराज़ की तरह इस्तेमाल करना।
