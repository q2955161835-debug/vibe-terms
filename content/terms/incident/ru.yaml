title: Инцидент
short_definition: Незапланированное событие, которое ухудшает качество или прерывает работу службы и требует скоординированного
  обнаружения, смягчения последствий, восстановления и обучения.
analogy: 'Представьте «Incident» как инструмент в наборе разработчика: он решает задачу в области «Развертывание
  и эксплуатация», но результат зависит от настройки.'
mechanism: 'Как работает «Incident»: Незапланированное событие, которое ухудшает качество или прерывает работу службы
  и требует скоординированного обнаружения, смягчения последствий, восстановления и обучения. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Инцидент» помогает точно назвать проблему в области «Развертывание и эксплуатация», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Incident» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Incident». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Incident» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
