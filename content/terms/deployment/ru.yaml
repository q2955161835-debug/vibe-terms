title: Развёртывание
short_definition: Процесс размещения собранного приложения в среде, доступной пользователям.
analogy: Как перенос продукта из мастерской в настоящий открытый магазин.
why_it_matters: Проект, который работает только на вашем ноутбуке, ещё не является доступным веб-продуктом.
ai_prompt_example: Создай статическую сборку, проверь все языковые маршруты и разверни именно этот артефакт
  без повторной сборки в продакшене.
common_mistake: Менять конфигурацию во время развёртывания и не фиксировать изменения в репозитории.
status: draft
source_content_version: 1
