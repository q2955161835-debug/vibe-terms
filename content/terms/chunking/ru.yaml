title: Chunking
short_definition: Разделение длинных документов или данных на более мелкие блоки, чтобы их можно было индексировать,
  извлекать или помещать в контекст модели.
analogy: 'Представьте «Chunking» как инструмент в наборе разработчика: он решает задачу в области «ИИ и Vibe Coding»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Chunking»: Разделение длинных документов или данных на более мелкие блоки, чтобы их можно
  было индексировать, извлекать или помещать в контекст модели. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Chunking» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Chunking» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Chunking». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Chunking» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
