title: Schritte
short_definition: Eine Fortschritts-/Navigationskomponente, die die geordneten Phasen eines mehrstufigen Prozesses und die
  aktuelle Phase des Benutzers anzeigt.
analogy: 'Ein praktischer Vergleich für Schritte: ein markiertes Werkzeug in UI/UX & Barrierefreiheit, dessen Zweck erst im
  Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine Fortschritts-/Navigationskomponente, die die geordneten Phasen eines mehrstufigen Prozesses und die aktuelle
  Phase des Benutzers anzeigt. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Schritte versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Schritte in der Phase Design als Lerncheckpoint. Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Schritte in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Schritte als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
