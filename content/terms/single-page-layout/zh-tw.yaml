title: "單頁版面配置"
short_definition: "一種頁面結構，將主要故事或工作流程放置在一個長滾動檔案中，而不是多個路線中。"
analogy: "在介面設計中，「單頁版面配置」像畫面上的一個互動零件：它對應「一種頁面結構，將主要故事或工作流程放置在一個長滾動檔案中，而不是多個路線中」，也要透過實際操作檢查。"
mechanism: "一種頁面結構，將主要故事或工作流程放置在一個長捲動文件中，而不是多個路線中。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解單頁版面配置後，Vibe Coding 初學者可以準確指出相關的 UI/UX 與無障礙問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在設計體驗階段，將「單頁版面配置」放進頁面、互動元件或設計稿中：檢查重點是「一種頁面結構，將主要故事或工作流程放置在一個長滾動檔案中，而不是多個路線中」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「單頁版面配置」為例，說明如何實現「一種頁面結構，將主要故事或工作流程放置在一個長滾動檔案中，而不是多個路線中」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「單頁版面配置」這個名稱就判定已經正確實作；請根據「一種頁面結構，將主要故事或工作流程放置在一個長滾動檔案中，而不是多個路線中」檢查實際行為、資料流、錯誤情境與測試結果。"
