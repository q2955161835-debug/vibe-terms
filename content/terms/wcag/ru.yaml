title: WCAG
short_definition: 'WCAG — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The Web Content Accessibility Guidelines, a W3C standard defining testable accessibility success criteria for web content.'
analogy: WCAG можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'WCAG — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The Web Content Accessibility Guidelines, a W3C standard defining testable accessibility success criteria for web content.'
why_it_matters: Понимание WCAG помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание WCAG помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль WCAG в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название WCAG доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
