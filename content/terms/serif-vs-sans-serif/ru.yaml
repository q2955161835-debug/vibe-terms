title: Serif vs Sans Serif
short_definition: Две широкие категории шрифтов, отличающиеся наличием или отсутствием завершающих штрихов на буквах.
analogy: '«Serif vs Sans Serif» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все
  равно нужно проверить.'
mechanism: 'Как работает «Serif vs Sans Serif»: Две широкие категории шрифтов, отличающиеся наличием или отсутствием
  завершающих штрихов на буквах. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Serif vs Sans Serif» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Serif vs Sans Serif» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Serif vs Sans Serif». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Serif vs Sans Serif» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
