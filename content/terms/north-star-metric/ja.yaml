title: North Star Metric
short_definition: 'North Star Metric は「プロダクトと要件」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A primary product metric intended to represent sustained value delivered to users and guide long-term product direction.'
analogy: North Star Metric は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'North Star Metric は「プロダクトと要件」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A primary product metric intended to represent sustained value delivered to users and guide long-term product direction.'
why_it_matters: North Star Metric を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: North Star Metric を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
