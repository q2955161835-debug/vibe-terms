title: AI 智能體
short_definition: 能反覆判斷下一步行動、使用工具、檢查結果，並持續朝目標前進的 AI 系統。
analogy: 像一名能閱讀任務說明、使用獲准工具、檢查成果，再決定下一步的工作者。
why_it_matters: 編程智能體能修改檔案和執行指令，因此權限範圍與人工檢查節點非常重要。
ai_prompt_example: 先檢查程式碼庫並提出計畫，只修改已核准的檔案，執行測試後停止，最後回報差異。
common_mistake: 給智能體過大的權限和模糊的開放式目標，卻沒有任何驗證關卡。
