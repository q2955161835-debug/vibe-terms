title: Фронтенд
short_definition: Часть приложения, которую пользователи видят и с которой взаимодействуют напрямую.
analogy: 'Представьте «Frontend» как инструмент в наборе разработчика: он решает задачу в области «Фронтенд-разработка»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Frontend»: Часть приложения, которую пользователи видят и с которой взаимодействуют напрямую.
  На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Фронтенд» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Frontend» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Frontend». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Frontend» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
source_content_version: 1
