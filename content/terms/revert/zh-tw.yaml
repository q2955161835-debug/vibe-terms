title: "恢復"
short_definition: "建立一個新的提交，應用先前提交的相反內容，而不刪除歷史記錄。"
analogy: "在 Git 協作中，可把「恢復」想成變更管理上的一個記錄點：它關乎「建立一個新的提交，應用先前提交的相反內容，而不刪除歷史記錄」，仍需檢查實際差異與歷史。"
mechanism: "建立一個新的提交，應用先前提交的相反內容而不刪除歷史記錄。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解恢復後，Vibe Coding 初學者可以準確指出相關的 Git 與協作問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「恢復」放進提交、分支或差異檔中：檢查重點是「建立一個新的提交，應用先前提交的相反內容，而不刪除歷史記錄」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「恢復」為例，說明如何實現「建立一個新的提交，應用先前提交的相反內容，而不刪除歷史記錄」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「恢復」這個名稱就判定已經正確實作；請根據「建立一個新的提交，應用先前提交的相反內容，而不刪除歷史記錄」檢查實際行為、資料流、錯誤情境與測試結果。"
