title: Откат
short_definition: Возврат продукта к ранее заведомо исправной версии или состоянию после выпуска вызывает неприемлемые
  проблемы.
analogy: '«Rollback» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно
  проверить.'
mechanism: 'Как работает «Rollback»: Возврат продукта к ранее заведомо исправной версии или состоянию после выпуска
  вызывает неприемлемые проблемы. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Откат» помогает точно назвать проблему в области «Развертывание и эксплуатация», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Rollback» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Rollback». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Rollback» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
