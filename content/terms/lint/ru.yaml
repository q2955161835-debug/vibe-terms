title: Линтинг
short_definition: Статический анализ, который проверяет исходный код на наличие подозрительных шаблонов, нарушений
  стиля или распространенных ошибок без запуска программы.
analogy: '«Lint» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Lint»: Статический анализ, который проверяет исходный код на наличие подозрительных шаблонов,
  нарушений стиля или распространенных ошибок без запуска программы. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Линтинг» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Lint» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Lint». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Lint» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
