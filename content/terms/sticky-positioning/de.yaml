title: Sticky Positioning
short_definition: CSS-Positionierung, die sich relativ verhält, bis ein Scroll-Schwellenwert erreicht ist, und das Element
  dann in seinem Container fixiert hält.
analogy: 'Ein praktischer Vergleich für Klebrige Positionierung: ein markiertes Werkzeug in Frontend-Entwicklung, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: CSS-Positionierung, die sich relativ verhält, bis ein Scroll-Schwellenwert erreicht ist, und das Element dann in
  seinem Container fixiert hält. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Klebrige Positionierung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Klebrige Positionierung in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Klebrige Positionierung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Klebrige Positionierung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
