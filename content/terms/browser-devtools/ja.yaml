title: ブラウザ開発ツール
short_definition: DOM、CSS、ネットワークリクエスト、ストレージ、パフォーマンス、コンソール出力、デバッグを検査するためのブラウザ統合ツール。
analogy: ブラウザ開発ツールは、テストとデバッグの課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: DOM、CSS、ネットワークリクエスト、ストレージ、パフォーマンス、コンソール出力、デバッグを検査するためのブラウザ統合ツール。実際のプロジェクトでは、周囲の技術、設定、データフローによって具体的な挙動が変わるため、ラベルだけで判断せず、実装を確認してください。
why_it_matters: ブラウザ開発ツールを知ると、Vibe Coding初心者でも、テストとデバッグの課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、ブラウザ開発ツールをテストと保護の段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトでブラウザ開発ツールがどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「ブラウザ開発ツール」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
