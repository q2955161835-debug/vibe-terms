title: CD
short_definition: 'Continuous Delivery oder Continuous Deployment: Automatisierung des Pfads von einer validierten Änderung
  zu einer freigabefähigen oder automatisch freigegebenen Version.'
analogy: 'Ein praktischer Vergleich für CD: ein markiertes Werkzeug in Deployment & Betrieb, dessen Zweck erst im Zusammenspiel
  mit Code, Daten und Nutzung sichtbar wird.'
mechanism: 'Continuous Delivery oder Continuous Deployment: Automatisierung des Pfads von einer validierten Änderung zu einer
  freigabefähigen oder automatisch freigegebenen Version. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.'
why_it_matters: Wer CD versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Deployment & Betrieb benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir CD in der Phase Deployment & Wartung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie CD in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere
  nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff CD als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
