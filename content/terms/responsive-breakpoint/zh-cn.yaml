title: "响应式断点"
short_definition: "选定的范围边界，其中布局或组件行为发生变化，以在不同的视口大小下保持可用。"
analogy: "将响应断点视为开发工作台前端工程部分中的带标签的工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自实现。"
mechanism: "选定的范围边界，其中布局或组件行为发生变化，以在不同的视口大小下保持可用。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解响应断点可以让 Vibe Coding 初学者说出他们想要的确切前端工程问题，并要求 AI 编程代理进行更改以及行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者到达界面逻辑阶段时，使用响应断点作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释响应式断点如何应用于该项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将术语响应断点视为实现正确的证据，而不检查实际行为、数据流、权限、故障案例或相关测试。"
