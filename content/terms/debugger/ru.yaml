title: Debugger
short_definition: 'Debugger — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A tool that pauses and inspects a running program so variables, call stacks, and execution flow can be examined.'
analogy: Debugger можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Debugger — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A tool that pauses and inspects a running program so variables, call stacks, and execution flow can be examined.'
why_it_matters: Понимание Debugger помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Debugger помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Debugger в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Debugger доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
