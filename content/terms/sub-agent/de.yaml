title: Sub-agent
short_definition: Ein separate Agent instance delegated a bounded subtask whose Ergebnis is returned zu a coordinating Agent.
analogy: Betrachte Sub-agent als Orientierungsschild in ai vibe. Es weist auf die richtige technische Stelle, ersetzt aber
  weder die Implementierung noch deren Prüfung.
mechanism: Ein separate Agent instance delegated a bounded subtask whose Ergebnis is returned zu a coordinating Agent. In
  einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Sub-agent versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Sub-agent in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Sub-agent in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Sub-agent als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
