title: Ответ
short_definition: Ответ сервера на запрос, включая статус, заголовки и, возможно, тело.
analogy: 'Проще представить «ответ» как правило работы в разделе «Web и сети»: название задает направление, а код
  показывает поведение.'
mechanism: 'Как работает «ответ»: Ответ сервера на запрос, включая статус, заголовки и, возможно, тело. На практике
  механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Ответ» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «ответ» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «ответ». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «ответ» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
