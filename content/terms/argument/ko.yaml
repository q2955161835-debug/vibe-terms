title: 인수
short_definition: 작동할 데이터나 대상을 알려주기 위해 명령, 함수 또는 프로그램에 전달되는 값입니다.
analogy: 인수를 워크숍의 컴퓨팅 및 개발 환경 부분에 있는 라벨이 붙은 도구로 생각해 보세요. 라벨은 검사해야 할 문제 영역을 알려주지만 실제 동작은 구현에서 결정됩니다.
mechanism: 인수의 작동은 기술 스택, 구성 및 데이터 흐름에 따라 달라집니다. 관련 코드와 테스트를 확인해 실제 동작을 검증하세요.
why_it_matters: 인수를 알면 Vibe Coding 초보자는 그것이 의미하는 정확한 컴퓨팅 및 개발 환경 문제를 지정하고 AI 코딩 에이전트에 변경 사항과 동작이 정확하다는 증거를 요청할 수 있습니다.
project_example: Vibe Terms에서는 학습자가 환경 단계에 도달했을 때 어휘 체크포인트로 인수를 사용합니다. 정의를 따로 가르치기보다는 눈에 보이는 하나의 페이지, 파일, 요청, 데이터 구조 또는 검증
  단계에 정의를 연결하세요.
ai_prompt_example: 인수가 이 프로젝트에 어떻게 적용되는지 설명하세요. 관련된 정확한 파일이나 시스템 경계를 가리키고, 필요한 최소한의 변경만 수행하고, 결과를 확인하는 데 사용할 수 있는 명령이나 사용자
  흐름을 보여 주세요.
common_mistake: 실제 동작, 데이터 흐름, 권한, 실패 사례 또는 관련 테스트를 확인하지 않고 구현이 정확하다는 증거로 인수라는 용어를 취급합니다.
