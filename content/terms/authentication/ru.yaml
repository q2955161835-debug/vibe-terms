title: Аутентификация
short_definition: Процесс проверки того, что пользователь действительно является тем, за кого себя выдаёт.
analogy: Как предъявление удостоверения на входе, чтобы система поняла, какой аккаунт принадлежит вам.
why_it_matters: Вход в систему связан с безопасностью, поэтому не стоит позволять ИИ бездумно изобретать
  собственную схему.
ai_prompt_example: Используй существующего провайдера аутентификации и выполняй проверки прав на сервере.
  Не создавай собственную систему паролей.
common_mistake: 'Путать аутентификацию «кто вы?» с авторизацией «что вам разрешено?». '
status: draft
source_content_version: 1
