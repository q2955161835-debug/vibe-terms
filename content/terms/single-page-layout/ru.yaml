title: Одностраничный макет
short_definition: Структура страницы, которая помещает основную историю или рабочий процесс в один документ с длинной
  прокруткой, а не в несколько маршрутов.
analogy: 'Проще представить «Одностраничный макет» как правило работы в разделе «UI/UX и доступность»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Одностраничный макет»: Структура страницы, которая помещает основную историю или рабочий
  процесс в один документ с длинной прокруткой, а не в несколько маршрутов. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Одностраничный макет» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Одностраничный макет» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Одностраничный макет». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Одностраничный макет» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
