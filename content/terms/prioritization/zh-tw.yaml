title: "優先順序"
short_definition: "根據價值、緊迫性、風險、努力、證據和策略性匹配對機會或工作進行排序的過程。"
analogy: "將優先劃分視為工作坊產品和需求部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "根據價值、緊迫性、風險、努力、證據和策略契合度對機會或工作進行排序的過程。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解優先順序可以讓 Vibe 編碼初學者準確命名他們所指的產品和需求問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到要求階段時，使用優先順序作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋優先順序如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語優先視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
status: draft
source_content_version: 1
