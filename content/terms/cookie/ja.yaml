title: Cookie
short_definition: Webサイトに関連付けられ、スコープ、セキュリティ、SameSiteルールに従って送信される、ブラウザー管理の小さなデータ。
analogy: Cookie は、ワークショップのセキュリティとプライバシーの部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査する必要があるかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: Cookieはブラウザーが保存し、指定されたドメインやパス、属性に応じてリクエストへ付加します。実際のプロジェクトでは、HttpOnly、Secure、SameSiteなどの設定を確認してください。
why_it_matters: Cookie を知ることで、Vibe Codingの初心者は、セキュリティとプライバシーに関する懸念を正確に挙げて、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がテスト保護段階に到達したときに語彙チェックポイントとして Cookie を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: Cookie がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: Cookie という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
