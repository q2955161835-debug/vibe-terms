title: Dark UI
short_definition: 'Dark UI — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An interface direction built primarily on dark surfaces with carefully tuned text, border, illustration, and semantic colors.'
analogy: Dark UI можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Dark UI — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An interface direction built primarily on dark surfaces with carefully tuned text, border, illustration, and semantic colors.'
why_it_matters: Понимание Dark UI помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Dark UI помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Dark UI в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Dark UI доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
