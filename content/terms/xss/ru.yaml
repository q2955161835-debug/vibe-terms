title: XSS
short_definition: Межсайтовый скриптинг — уязвимость, при которой ненадежный контент интерпретируется как исполняемый
  скрипт браузера в контексте другого пользователя.
analogy: '«XSS» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно проверить.'
mechanism: 'Как работает «XSS»: Межсайтовый скриптинг — уязвимость, при которой ненадежный контент интерпретируется
  как исполняемый скрипт браузера в контексте другого пользователя. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «XSS» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «XSS» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «XSS». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «XSS» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
