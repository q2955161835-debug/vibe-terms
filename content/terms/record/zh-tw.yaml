title: "記錄"
short_definition: "表示資料集中的實體、事件或事實的一筆儲存資料。"
analogy: "可以把記錄想成資料表中的一張資料卡：它保存一個實體、事件或事實的欄位，之後能透過識別碼找回並更新。"
mechanism: "一筆記錄會以欄位保存某個實體、事件或事實，並可透過識別碼或查詢在資料集中讀取與更新。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解記錄後，Vibe Coding 初學者可以準確指出相關的資料與資料庫問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，為每位使用者建立一筆資料記錄，透過識別碼查詢、更新，再確認欄位與資料庫內容一致。"
ai_prompt_example: "請檢查這個專案如何保存一筆記錄，指出實體、事件或事實對應的欄位與識別碼，僅做必要修改，並提供查詢結果的驗證方式。"
common_mistake: "把資料表、欄位和記錄混為一談，或只看到一筆資料就認為它能被正確識別、查詢與更新。"
