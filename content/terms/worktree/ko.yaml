title: 워크트리
short_definition: 여러 분기를 동시에 작업할 수 있도록 동일한 저장소에서 추가 워크트리를 체크아웃하는 Git 기능입니다.
analogy: 워크트리를 워크숍의 Git 및 협업 부분에 있는 라벨이 붙은 도구로 생각해 보세요. 라벨은 검사해야 할 문제 영역을 알려주지만 실제 동작은 구현에서 결정됩니다.
mechanism: 워크트리의 작동은 기술 스택, 구성 및 데이터 흐름에 따라 달라집니다. 관련 코드와 테스트를 확인해 실제 동작을 검증하세요.
why_it_matters: 워크트리를 알면 Vibe Coding 초보자가 의미하는 정확한 Git 및 협업 문제를 지정하고 AI 코딩 에이전트에 변경 사항과 동작이 정확하다는 증거를 요청할 수 있습니다.
project_example: Vibe Terms에서는 학습자가 환경 단계에 도달했을 때 어휘 체크포인트로 워크트리를 사용합니다. 정의를 따로 가르치기보다는 눈에 보이는 하나의 페이지, 파일, 요청, 데이터 구조 또는
  검증 단계에 정의를 연결하세요.
ai_prompt_example: 워크트리가 이 프로젝트에 어떻게 적용되는지 설명하세요. 관련된 정확한 파일이나 시스템 경계를 가리키고, 필요한 최소한의 변경만 수행하고, 결과를 확인하는 데 사용할 수 있는 명령이나 사용자
  흐름을 보여 주세요.
common_mistake: 실제 동작, 데이터 흐름, 권한, 실패 사례 또는 관련 테스트를 확인하지 않고 구현이 정확하다는 증거로 워크트리라는 용어를 취급합니다.
