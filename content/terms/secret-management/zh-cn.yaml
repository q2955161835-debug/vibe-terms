mechanism: "实现上，这一概念会围绕“API 密钥、令牌和私钥等凭证的受控存储、访问、轮换和审核。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“秘密管理”后，你能更准确地描述安全与隐私里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的测试与保护阶段，可以把“秘密管理”放到一个真实项目中：围绕“API 密钥、令牌和私钥等凭证的受控存储、访问、轮换和审核。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“秘密管理”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“API 密钥、令牌和私钥等凭证的受控存储、访问、轮换和审核”。"
