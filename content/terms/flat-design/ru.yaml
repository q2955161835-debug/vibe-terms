title: Flat Design
short_definition: 'Flat Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A visual style favoring simple shapes, solid colors, and minimal simulated depth or physical texture.'
analogy: Flat Design можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Flat Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A visual style favoring simple shapes, solid colors, and minimal simulated depth or physical texture.'
why_it_matters: Понимание Flat Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Flat Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Flat Design в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Flat Design доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
