title: XSS
short_definition: 'XSS — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Cross-site scripting, a vulnerability where untrusted content is interpreted as executable browser script in another user''s context.'
analogy: XSS можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'XSS — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Cross-site scripting, a vulnerability where untrusted content is interpreted as executable browser script in another user''s context.'
why_it_matters: Понимание XSS помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание XSS помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль XSS в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название XSS доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
