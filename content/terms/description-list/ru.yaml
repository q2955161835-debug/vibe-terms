title: Список описаний
short_definition: Структурированное представление имен и соответствующих значений, полезное для компактных подробных
  сводок.
analogy: '«Список описаний» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «Список описаний»: Структурированное представление имен и соответствующих значений, полезное
  для компактных подробных сводок. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Список описаний» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Список описаний» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Список описаний». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Список описаний» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
source_content_version: 1
