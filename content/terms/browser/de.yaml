title: Browser
short_definition: 'Browser ist ein Begriff aus „Web & Netzwerk“. Der deutsche Text ist derzeit ein noch nicht redigierter Entwurf. Englische Referenzdefinition: A client application that resolves web addresses, requests resources, executes web code, and renders pages for users.'
analogy: Man kann Browser zunächst wie ein beschriftetes Werkzeug im Software-Werkzeugkasten betrachten; in der Praxis zählen jedoch Code, Datenfluss und Nutzungskontext.
mechanism: 'Browser ist ein Begriff aus „Web & Netzwerk“. Der deutsche Text ist derzeit ein noch nicht redigierter Entwurf. Englische Referenzdefinition: A client application that resolves web addresses, requests resources, executes web code, and renders pages for users.'
why_it_matters: Wer Browser versteht, kann einem KI-Coding-Agenten genauer sagen, welcher Teil des Systems gemeint ist, und überprüfbare Nachweise verlangen.
project_example: Wer Browser versteht, kann einem KI-Coding-Agenten genauer sagen, welcher Teil des Systems gemeint ist, und überprüfbare Nachweise verlangen.
ai_prompt_example: Erkläre, wie Browser in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere nur das Nötige und beschreibe die Verifikation.
common_mistake: Den Begriff Browser als Beweis für eine korrekte Implementierung zu behandeln, ohne Verhalten, Datenfluss und Fehlerfälle zu prüfen.
status: draft
