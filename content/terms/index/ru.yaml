title: Индекс
short_definition: Вспомогательная структура базы данных, которая ускоряет выборочный поиск или упорядочивание за
  счет затрат на хранение и запись.
analogy: 'Проще представить «Index» как правило работы в разделе «Данные и базы данных»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Index»: Вспомогательная структура базы данных, которая ускоряет выборочный поиск или упорядочивание
  за счет затрат на хранение и запись. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Индекс» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Index» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Index». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Index» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
