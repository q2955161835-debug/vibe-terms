title: Схема
short_definition: Структурное определение хранимых данных, включая поля, типы, отношения, ограничения или другие
  правила.
analogy: '«Schema» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Schema»: Структурное определение хранимых данных, включая поля, типы, отношения, ограничения
  или другие правила. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код
  и наблюдаемый результат.'
why_it_matters: Понимание термина «Схема» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Schema» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Schema». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Schema» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
source_content_version: 1
