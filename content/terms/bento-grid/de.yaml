title: Bento-Raster
short_definition: Ein Layoutmuster, das Inhalte in unterschiedlich großen rechteckigen Kacheln innerhalb eines zusammenhängenden
  Rasters anordnet.
analogy: 'Ein praktischer Vergleich für Bento-Gitter: ein markiertes Werkzeug in UI/UX & Barrierefreiheit, dessen Zweck erst
  im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Ein Layoutmuster, das Inhalte in unterschiedlich großen rechteckigen Kacheln innerhalb eines zusammenhängenden
  Rasters anordnet. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab;
  prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Bento-Gitter versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Bento-Gitter in der Phase Design als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Bento-Gitter in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Bento-Gitter als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
