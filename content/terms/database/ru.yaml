title: База данных
short_definition: Система для постоянного хранения и поиска структурированных данных приложения.
analogy: Как хорошо индексированный архив, где запись можно найти, не открывая каждую папку.
why_it_matters: Учётные записи, контент, прогресс обучения и данные продукта обычно требуют постоянного
  хранилища.
ai_prompt_example: Сначала спроектируй таблицы и связи, затем покажи миграцию и только после этого пиши
  код приложения.
common_mistake: Использовать базу данных как огромный ящик с неструктурированным JSON без модели данных.
status: draft
source_content_version: 1
