title: Инъекция промпта
short_definition: Режим атаки или сбоя, в котором ненадежный контент пытается переопределить инструкции или манипулировать
  поведением системы искусственного интеллекта.
analogy: 'Представьте «Инъекция промпта» как инструмент в наборе разработчика: он решает задачу в области «ИИ и
  Vibe Coding», но результат зависит от настройки.'
mechanism: 'Как работает «Инъекция промпта»: Режим атаки или сбоя, в котором ненадежный контент пытается переопределить
  инструкции или манипулировать поведением системы искусственного интеллекта. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Инъекция промпта» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Инъекция промпта» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Инъекция промпта». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Инъекция промпта» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
