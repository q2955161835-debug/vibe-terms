title: Tailwind CSS
short_definition: Платформа CSS, ориентированная на утилиты, которая объединяет небольшие предопределенные классы
  непосредственно в разметке для создания индивидуальных проектов.
analogy: '«Tailwind CSS» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «Tailwind CSS»: Платформа CSS, ориентированная на утилиты, которая объединяет небольшие
  предопределенные классы непосредственно в разметке для создания индивидуальных проектов. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Tailwind CSS» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Tailwind CSS» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Tailwind CSS». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Tailwind CSS» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
