title: アンカー
short_definition: ページ内の特定のセクションまたはフラグメントへのリンク。長い文書や目次でよく使用されます。
analogy: アンカー は、ワークショップの UI/UX およびアクセシビリティ部分のラベル付きツールと考えてください。ラベルは、どの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: ページ内の特定のセクションまたはフラグメントへのリンク。長い文書や目次でよく使用されます。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: アンカー を知ることで、Vibe Codingの初心者は、その意味する UI/UX およびアクセシビリティに関する懸念を正確に挙げて、AIコーディングエージェントに変更と、動作が正しいという証拠を求めることができます。
project_example: Vibe Termsでは、学習者が設計段階に到達したときに語彙チェックポイントとして アンカー を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: アンカー がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: アンカー という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
