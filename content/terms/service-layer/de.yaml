title: Service Schicht
short_definition: Ein layer die concentrates reusable business Vorgänge separately aus transport, UI, oder persistence details.
analogy: 'Ein praktisches Bild für Service Schicht: ein markiertes Werkzeug in backend apis, dessen Aufschrift die Frage schärft,
  aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein layer die concentrates reusable business Vorgänge separately aus transport, UI, oder persistence details. In
  einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Service Schicht versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in backend apis benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Service Schicht in der Phase data identity als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Service Schicht in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Service Schicht als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
