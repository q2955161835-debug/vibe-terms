title: バックエンド
short_definition: データ、権限、業務ルール、外部連携を処理するサーバー側のロジック。
analogy: 店頭を実際に機能させる、裏側の厨房や倉庫のようなものです。
why_it_matters: バックエンドがルールを強制しなければ、見た目が整った画面でも安全でなかったり、実際には機能していなかったりします。
ai_prompt_example: リクエストはバックエンドで検証し、不正な入力には400エラーを返してください。ブラウザー側の検証だけに頼らないでください。
common_mistake: フロントエンドで非表示にした操作を、セキュリティ境界だと思い込むこと。
status: draft
source_content_version: 1
