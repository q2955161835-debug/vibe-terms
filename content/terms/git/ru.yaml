title: Git
short_definition: Система контроля версий, которая фиксирует изменения кода и позволяет безопасно работать с ветками.
analogy: '«Git» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно проверить.'
mechanism: 'Как работает «Git»: Система контроля версий, которая фиксирует изменения кода и позволяет безопасно
  работать с ветками. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код
  и наблюдаемый результат.'
why_it_matters: Понимание термина «Git» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Git» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Git». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Git» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
