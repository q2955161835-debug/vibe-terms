title: Человек в курсе
short_definition: Рабочий процесс, который намеренно требует от человека проверки, утверждения, исправления или
  принятия на себя ответственность на важных этапах принятия решений.
analogy: '«Человек в контуре» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все
  равно нужно проверить.'
mechanism: 'Как работает «Человек в контуре»: Рабочий процесс, который намеренно требует от человека проверки, утверждения,
  исправления или принятия на себя ответственность на важных этапах принятия решений. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Человек в курсе» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Человек в контуре» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Человек в контуре». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Человек в контуре» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
