title: Spinner
short_definition: 'Spinner — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An indeterminate loading indicator used when work is in progress but the remaining duration is unknown.'
analogy: Spinner можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Spinner — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An indeterminate loading indicator used when work is in progress but the remaining duration is unknown.'
why_it_matters: Понимание Spinner помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Spinner помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Spinner в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Spinner доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
