locale: de
title: Eine persönliche Website entwickeln
summary: Eine persönliche Website mit klarer Positionierung, zugänglicher Gestaltung, belastbaren Inhalten und sicheren Release-Prüfungen
  erstellen
status: draft
source_content_version: 1
chapters:
- id: project-goal
  title: Zweck und Zielgruppe definieren
  summary: Wähle eine Zielgruppe und formuliere, welche Information oder Handlung die Website unterstützt.
  outcome: Ein begrenztes Inhaltsbriefing.
  checkpoint: Anfragen außerhalb des Zwecks erhalten eine klare Ablehnung oder Weiterleitung.
- id: audience-and-content
  title: Zielgruppe und Inhalte planen
  summary: Ordne Inhalte den Bedürfnissen der Zielgruppe zu und trenne belegte Aussagen von Annahmen.
  outcome: Eine priorisierte Inhaltsliste.
  checkpoint: Jeder zentrale Inhalt hat eine Zielgruppe und einen nachvollziehbaren Zweck.
- id: information-architecture
  title: Die Informationsarchitektur strukturieren
  summary: Ordne Seiten, Navigation und Begriffe so, dass Besucher relevante Inhalte ohne Umwege finden.
  outcome: Eine nachvollziehbare Seitenstruktur.
  checkpoint: Die Navigation führt zu jedem Kerninhalt und zeigt den aktuellen Ort.
- id: wireframe
  title: Ein Wireframe erstellen
  summary: Skizziere Layout, Hierarchie und wichtige Zustände, bevor du visuelle Details ausarbeitest.
  outcome: Ein prüfbarer Wireframe.
  checkpoint: Die wichtigsten Aufgaben sind im Entwurf ohne visuelle Dekoration nachvollziehbar.
- id: html-structure
  title: Die HTML-Struktur bauen
  summary: Verwende semantische Elemente und eine sinnvolle Überschriftenhierarchie für Inhalt und Navigation.
  outcome: Eine semantische Seitenstruktur.
  checkpoint: Screenreader und Tastatur können die Kerninhalte sinnvoll erschließen.
- id: visual-system
  title: Das visuelle System festlegen
  summary: Definiere Typografie, Farben, Abstände und wiederverwendbare Design-Tokens.
  outcome: Ein konsistentes visuelles System.
  checkpoint: Komponenten verwenden die festgelegten Tokens statt zufälliger Einzelwerte.
- id: responsive-accessibility
  title: Responsivität und Barrierefreiheit prüfen
  summary: Teste verschiedene Viewports, Tastaturbedienung, Kontrast, Fokus und Textvergrößerung.
  outcome: Eine responsive und zugängliche Seite.
  checkpoint: Kernaufgaben bleiben auf kleinen Bildschirmen und ohne Maus möglich.
- id: content-and-seo
  title: Inhalte und SEO ausarbeiten
  summary: Pflege klare Seitentitel, Metadaten, strukturierte Inhalte und belegte Aussagen.
  outcome: Ein überprüfbarer Inhalts- und SEO-Satz.
  checkpoint: Jede wichtige Seite hat passende Metadaten und verständlichen Inhalt.
- id: quality-check
  title: Die Qualität prüfen
  summary: Führe Inhalts-, Link-, Visual-, Browser- und Performance-Prüfungen vor dem Release aus.
  outcome: Eine wiederholbare Qualitätscheckliste.
  checkpoint: Bekannte Fehler sind vor der Veröffentlichung dokumentiert oder behoben.
- id: publish-static-site
  title: Die statische Website veröffentlichen
  summary: Baue die Website reproduzierbar, prüfe die öffentliche Navigation und veröffentliche einen kleinen Release.
  outcome: Ein verifizierter statischer Release.
  checkpoint: Die öffentliche Website lädt Kernseiten und zeigt bekannte Grenzen korrekt.
