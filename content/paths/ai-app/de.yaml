locale: de
title: Eine KI-Assistenten-App entwickeln
summary: Einen klar begrenzten KI-Assistenten mit nützlichem Chat-Erlebnis, transparentem Datenfluss, Evaluation und sicheren
  Release-Prüfungen entwerfen
status: draft
source_content_version: 1
chapters:
- id: problem-and-scope
  title: Problem und Umfang definieren
  summary: Wähle ein konkretes Nutzerproblem und halte fest, welche Funktionen in den ersten Release gehören und welche nicht.
  outcome: Ein begrenztes Produktbriefing.
  checkpoint: Anfragen außerhalb des Umfangs werden klar abgelehnt oder weitergeleitet.
- id: model-and-prompt
  title: Technische Leitplanken festlegen
  summary: Dokumentiere Architekturentscheidungen, Schnittstellen und Regeln, nach denen Änderungen geprüft werden.
  outcome: Versionierte technische Leitplanken.
  checkpoint: Eine Änderung lässt sich einem begründeten Architekturentscheid zuordnen.
- id: conversation-ui
  title: Die Benutzeroberfläche bauen
  summary: Erstelle eine lesbare Oberfläche mit klaren Eingabe-, Lade-, Erfolgs-, Leer- und Fehlerzuständen.
  outcome: Eine zugängliche Anwendungsoberfläche.
  checkpoint: Benutzer können Aktion, Ergebnis und laufende Verarbeitung unterscheiden.
- id: application-state
  title: Anwendungszustand verwalten
  summary: Entscheide, welche Daten lokal bleiben, welche vom Server kommen und welche jede Anfrage enthalten muss.
  outcome: Ein dokumentiertes Zustandsmodell.
  checkpoint: Aktualisieren und erneutes Laden zeigen für jede Datenart das beabsichtigte Verhalten.
- id: api-contract
  title: Den API-Vertrag definieren
  summary: Spezifiziere Anfragefelder, Antwortform, Statuscodes und Fehler-Payload, bevor die Oberfläche angeschlossen wird.
  outcome: Ein Beispielvertrag für Anfrage und Antwort.
  checkpoint: Ungültige Eingaben liefern eine nützliche, dokumentierte Fehlerform.
- id: context-and-retrieval
  title: Fundierten Kontext hinzufügen
  summary: Wähle freigegebene Datenquellen und rufe relevante Passagen oder Datensätze nachvollziehbar ab, bevor eine Antwort
    erzeugt wird.
  outcome: Ein nachvollziehbarer Kontextauswahl-Flow.
  checkpoint: Ergebnisse können ihre Eingabequelle benennen, statt Datenherkunft zu erfinden.
- id: tool-safety
  title: Werkzeuge und Eingaben begrenzen
  summary: Erlaube nur erforderliche Operationen mit engen Parametern und prüfe nicht vertrauenswürdige Eingaben an jeder
    Systemgrenze.
  outcome: Eine dokumentierte Allowlist und Sicherheitsfälle.
  checkpoint: Nicht vertrauenswürdiger Text kann Berechtigungen nicht erweitern.
- id: evaluation
  title: Verhalten evaluieren
  summary: Erstelle repräsentative Fälle für Erfolg, leere Ergebnisse, ungültige Eingaben und erwartete Fehler.
  outcome: Ein kleiner wiederholbarer Evaluationsdatensatz.
  checkpoint: Die Evaluation unterscheidet hilfreiche Ergebnisse von unbelegten oder fehlerhaften Antworten.
- id: error-and-observability
  title: Fehler und Betriebssignale sichtbar machen
  summary: Zeige wiederherstellbare Fehler und erfasse strukturierte Signale ohne unnötige Nutzdaten zu sammeln.
  outcome: Fehlerzustände und ein minimaler Observability-Plan.
  checkpoint: Timeouts, Limits und Netzwerkfehler führen zu verständlichen Hinweisen.
- id: release-and-feedback
  title: Mit Feedback-Grenzen veröffentlichen
  summary: Prüfe die wichtigsten Nutzerflüsse, veröffentliche einen kleinen Release und sammle nur aufgabenbezogenes Feedback.
  outcome: Eine Release-Checkliste und Feedbackfragen.
  checkpoint: Der Release hat die Kernprüfungen bestanden und bekannte Grenzen sind sichtbar.
