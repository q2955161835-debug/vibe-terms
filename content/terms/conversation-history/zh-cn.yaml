title: 对话历史
short_definition: 对话历史 是“AI 与 Vibe Coding”中的术语。当前为待人工审校的草稿。英文标准定义：Earlier messages included with a new model request so the model can resolve references and continue the task.
analogy: 可以先把 对话历史 想成软件开发工具箱里一个有明确用途的标签；真正使用时仍要结合所在代码、数据流和用户场景判断。
mechanism: 对话历史 是“AI 与 Vibe Coding”中的术语。当前为待人工审校的草稿。英文标准定义：Earlier messages included with a new model request so the model can resolve references and continue the task.
why_it_matters: 理解 对话历史 后，你能更准确地告诉 AI 你指的是系统的哪一部分，并要求它给出可验证的实现证据。
project_example: 理解 对话历史 后，你能更准确地告诉 AI 你指的是系统的哪一部分，并要求它给出可验证的实现证据。
ai_prompt_example: 解释 对话历史 在这个项目中的作用。指出涉及的文件或系统边界，只做最小必要改动，并给出我可以验证结果的步骤。
common_mistake: 只记住 对话历史 这个名词，却没有检查它在当前项目里的真实行为、数据流和失败情况。
