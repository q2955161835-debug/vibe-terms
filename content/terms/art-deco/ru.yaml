title: Арт Деко
short_definition: Декоративный стиль, характеризующийся геометрическим орнаментом, симметрией, сильными вертикалями,
  роскошными материалами и визуальными отсылками к 1920–1930-м годам.
analogy: '«Art Deco» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно
  проверить.'
mechanism: 'Как работает «Art Deco»: Декоративный стиль, характеризующийся геометрическим орнаментом, симметрией,
  сильными вертикалями, роскошными материалами и визуальными отсылками к 1920–1930-м годам. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Арт Деко» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Art Deco» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Art Deco». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Art Deco» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
