title: "輪詢"
short_definition: "每隔一定時間重複請求資源以檢查資料或狀態是否已變更。"
analogy: "將輪詢視為工作坊後端和 API 部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "每隔一定時間重複要求資源以檢查資料或狀態是否已變更。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "Knowing Polling 可讓 Vibe Coding 初學者準確命名他們所指的後端和 API 關注點，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到資料身分階段時，使用輪詢作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教導它。"
ai_prompt_example: "解釋輪詢如何套用到此專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將「輪詢」一詞視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
status: draft
