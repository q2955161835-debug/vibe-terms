title: Schaltfläche
short_definition: Ein clickable control die löst aus an action such as saving, submitting, creating, oder opening something.
analogy: 'Ordne Schaltfläche im Bereich ui ux als beschriftetes Werkzeug ein: Die Beschriftung grenzt den Prüfbereich ein,
  während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein clickable control die löst aus an action such as saving, submitting, creating, oder opening something. In einem
  realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Schaltfläche versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Schaltfläche in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Schaltfläche in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Schaltfläche als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
