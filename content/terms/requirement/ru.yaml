title: Требование
short_definition: Заявление о поведении, возможностях, качестве или ограничениях, которым должно удовлетворять решение.
analogy: 'Проще представить «Requirement» как правило работы в разделе «Продукт и требования»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Requirement»: Заявление о поведении, возможностях, качестве или ограничениях, которым
  должно удовлетворять решение. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Требование» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Requirement» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Requirement». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Requirement» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
