title: 컨텍스트 창
short_definition: 모델이 한 번에 고려할 수 있는 텍스트와 기타 입력의 양에 대한 한도.
analogy: 작업 책상과 같습니다. 책상이 가득 차면 새 자료를 놓기 전에 오래된 자료를 치워야 합니다.
mechanism: 컨텍스트 창은 모델이 한 요청에서 처리할 수 있는 입력과 출력 토큰의 한도를 정하며, 대화나 검색 결과가 이를 함께 사용합니다.
why_it_matters: 코딩 대화가 길어지면 중요한 요구사항이 모델의 현재 컨텍스트 밖으로 밀려날 수 있습니다.
project_example: 긴 용어 목록을 모델에 보낼 때는 필요한 항목만 선택하고 입력 크기를 측정해 컨텍스트 창을 관리합니다.
ai_prompt_example: 계속하기 전에 현재 구조, 제약 조건, 완료한 작업, 다음 할 일을 요약하세요.
common_mistake: 모델이 이전에 본 모든 파일과 결정을 영원히 기억한다고 생각하는 것.
status: draft
