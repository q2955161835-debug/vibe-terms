title: Stack Trace
short_definition: Ein Diagnosedatensatz, der die Kette der Funktionsaufrufe zeigt, die aktiv waren, als ein Fehler oder eine
  Ausnahme auftrat.
analogy: Betrachte Stack-Trace als Orientierung in Testen & Debugging. Die Bezeichnung führt zur richtigen technischen Stelle,
  garantiert aber noch keine gute Umsetzung.
mechanism: Ein Diagnosedatensatz, der die Kette der Funktionsaufrufe zeigt, die aktiv waren, als ein Fehler oder eine Ausnahme
  auftrat. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Stack-Trace versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Testen & Debugging benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Stack-Trace in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Stack-Trace in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Stack-Trace als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
