title: "設計 Token"
short_definition: "命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定。"
analogy: "在前端實作中，可把「設計 Token」想成介面的一個可組合零件：它處理「命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定」，並與畫面狀態互相配合。"
mechanism: "命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解設計 Token 後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立介面與邏輯階段，將「設計 Token」放進頁面、元件或樣式規則中：檢查重點是「命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「設計 Token」為例，說明如何實現「命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「設計 Token」這個名稱就判定已經正確實作；請根據「命名的、可重複使用的設計值，例如跨元件共享的顏色、間距單位、半徑或版式設定」檢查實際行為、資料流、錯誤情境與測試結果。"
