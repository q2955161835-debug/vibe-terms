title: Schema
short_definition: 'Schema は「データとデータベース」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: The structural definition of stored data, including fields, types, relationships, constraints, or other rules.'
analogy: Schema は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'Schema は「データとデータベース」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: The structural definition of stored data, including fields, types, relationships, constraints, or other rules.'
why_it_matters: Schema を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: Schema を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
ai_prompt_example: このプロジェクトで Schema がどのように関係するか説明してください。対象ファイルまたは境界を示し、必要最小限の変更と確認手順を提示してください。
common_mistake: Schema という名前だけで実装が正しいと判断し、実際の動作・データフロー・失敗時の挙動を確認しないことです。
