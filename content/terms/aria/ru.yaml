title: ARIA
short_definition: 'ARIA — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Accessible Rich Internet Applications attributes and roles that supplement native HTML semantics when custom widgets need additional accessibility information.'
analogy: ARIA можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'ARIA — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Accessible Rich Internet Applications attributes and roles that supplement native HTML semantics when custom widgets need additional accessibility information.'
why_it_matters: Понимание ARIA помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание ARIA помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль ARIA в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название ARIA доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
