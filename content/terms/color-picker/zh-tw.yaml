title: "顏色選擇器"
short_definition: "用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制。"
analogy: "在介面設計中，「顏色選擇器」像畫面上的一個互動零件：它對應「用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制」，也要透過實際操作檢查。"
mechanism: "用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制項。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解顏色選擇器後，Vibe Coding 初學者可以準確指出相關的 UI/UX 與無障礙問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在設計體驗階段，將「顏色選擇器」放進頁面、互動元件或設計稿中：檢查重點是「用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「顏色選擇器」為例，說明如何實現「用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「顏色選擇器」這個名稱就判定已經正確實作；請根據「用於透過調色盤、光譜、樣本或數位顏色值選擇顏色的控制」檢查實際行為、資料流、錯誤情境與測試結果。"
