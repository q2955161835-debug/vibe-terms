title: デプロイ
short_definition: 構築されたアプリケーションを、ユーザーがアクセスできる環境に配置するプロセス。
analogy: 作業場から実際の店頭へ移動します。
why_it_matters: ラップトップ上でのみ動作するプロジェクトは、まだ使用可能なWeb製品ではありません。
ai_prompt_example: 静的ビルドを生成し、すべてのロケールルートを確認してから、本番環境でリビルドせずに正確なビルドアーティファクトをデプロイします。
common_mistake: デプロイ中にリポジトリに記録せずに構成を変更する。
status: draft
source_content_version: 1
mechanism: デプロイは検証済みの成果物を対象環境へ配置し、設定・ルーティング・ヘルスチェックを確認して利用可能な状態にします。
project_example: Vibe Termsでは、生成済みの静的アーカイブをCodex Sitesへ届ける工程と、公開状態の確認を分けて記録します。
