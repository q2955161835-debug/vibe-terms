title: "麵包屑導覽"
short_definition: "以階層路徑顯示使用者目前位置，並提供前往上層頁面的連結。"
analogy: "可以把麵包屑導覽想成網站上的「你在這裡」路標：它把目前頁面放進階層路徑，並提供回到上層頁面的連結。"
mechanism: "它通常依照資訊架構產生由目前頁面回溯至上層頁面的導覽鏈，讓使用者能快速理解所在層級並返回上一層。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解麵包屑導覽後，Vibe Coding 初學者可以準確指出相關的 UI/UX 與無障礙問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在設計體驗階段，於產品詳情頁加入麵包屑導覽，依序顯示首頁、分類與目前頁面，並逐一點擊上層連結確認路徑正確。"
ai_prompt_example: "請檢查這個專案的麵包屑導覽，指出目前頁面、分類與首頁之間的階層關係，僅修改必要的導覽標記或路由，並提供可驗證的操作流程。"
common_mistake: "只把麵包屑導覽當成裝飾文字，卻沒有確認每一層連結是否指向正確的上層頁面，也沒有測試鍵盤操作與目前位置提示。"
status: draft
source_content_version: 1
