title: "時間選擇器"
short_definition: "使用結構化小時和分鐘選項選擇時間值的控制項。"
analogy: "將時間選擇器視為工作坊的 UI/UX 和可存取性部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "使用結構化小時和分鐘選項選擇時間值的控制項。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解時間選擇器讓 Vibe 編碼初學者可以準確命名他們所指的 UI/UX 和可存取性問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者到達設計階段時，使用時間選擇器作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋時間選擇器如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「時間選擇器」視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
