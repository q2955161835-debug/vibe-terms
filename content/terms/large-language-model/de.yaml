title: Large Language Model
short_definition: Ein Modell für maschinelles Lernen, das auf großen Textkorpora trainiert wird, um Sprache vorherzusagen
  und zu generieren und viele sprachbasierte Aufgaben auszuführen.
analogy: Betrachte Large Language Model als Orientierung in KI & Vibe Coding. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Ein Modell für maschinelles Lernen, das auf großen Textkorpora trainiert wird, um Sprache vorherzusagen und zu
  generieren und viele sprachbasierte Aufgaben auszuführen. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Large Language Model versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in KI & Vibe Coding benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Large Language Model in der Phase Anforderungen als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Large Language Model in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Large Language Model als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
