title: "多因素身分驗證"
short_definition: "需要兩個或更多獨立因素型別（例如密碼和裝置擁有情況）的證據的身分驗證。"
analogy: "將多因素身分驗證視為工作坊安全和隱私部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自於實作。"
mechanism: "需要兩個或多個獨立因素型別的證據（例如密碼和裝置擁有）的身分驗證。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解多因素身分驗證可讓 Vibe 編碼初學者說出他們所指的確切安全和隱私問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者到達測試保護階段時，使用多重身分驗證作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋多重身分驗證如何應用於此專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將「多因素身分驗證」一詞視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
status: draft
