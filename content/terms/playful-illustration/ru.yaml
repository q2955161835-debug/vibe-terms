title: Игривая иллюстрация
short_definition: Визуальное направление с использованием выразительных иллюстраций, дружественных форм или символов,
  которые делают интерфейс более легким и доступным.
analogy: 'Проще представить «Игривые иллюстрации» как правило работы в разделе «UI/UX и доступность»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Игривые иллюстрации»: Визуальное направление с использованием выразительных иллюстраций,
  дружественных форм или символов, которые делают интерфейс более легким и доступным. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Игривая иллюстрация» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Игривые иллюстрации» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Игривые иллюстрации». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Игривые иллюстрации» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
