title: CORS
short_definition: Ein Browser Sicherheit mechanism die uses HTTP headers zu control die origins may read responses aus a verschiedene
  origin.
analogy: 'Ein praktisches Bild für CORS: ein markiertes Werkzeug in backend apis, dessen Aufschrift die Frage schärft, aber
  keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein Browser Sicherheit mechanism die uses HTTP headers zu control die origins may read responses aus a verschiedene
  origin. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer CORS versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in backend apis benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient CORS in der Phase data identity als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie CORS in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff CORS als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
