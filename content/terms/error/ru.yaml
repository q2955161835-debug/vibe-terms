title: Ошибка
short_definition: Условие, указывающее, что операция завершилась неудачно или привела к недопустимому результату.
analogy: 'Проще представить «ошибка» как правило работы в разделе «Тестирование и отладка»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «ошибка»: Условие, указывающее, что операция завершилась неудачно или привела к недопустимому
  результату. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Ошибка» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «ошибка» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «ошибка». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «ошибка» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
