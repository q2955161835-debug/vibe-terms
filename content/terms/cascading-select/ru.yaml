title: Каскадный выбор
short_definition: Иерархический селектор, в котором выбор родительского варианта открывает следующий уровень выбора.
analogy: 'Представьте «Каскадный список» как инструмент в наборе разработчика: он решает задачу в области «UI/UX
  и доступность», но результат зависит от настройки.'
mechanism: 'Как работает «Каскадный список»: Иерархический селектор, в котором выбор родительского варианта открывает
  следующий уровень выбора. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Каскадный выбор» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Каскадный список» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Каскадный список». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Каскадный список» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
