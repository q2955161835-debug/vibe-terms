title: Upload
short_definition: Ein control oder flow die lets Benutzer choose lokal Dateien und send them zu an Anwendung oder Speicher
  Dienst.
analogy: 'Für Upload hilft ein Vergleich mit einem Werkzeug aus ui ux: Sein Etikett nennt das Problemfeld; verlässlich wird
  die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein control oder flow die lets Benutzer choose lokal Dateien und send them zu an Anwendung oder Speicher Dienst.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Upload versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von einem KI-Coding-Agenten
  eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Upload in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer sichtbaren
  Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Upload in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Upload als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
