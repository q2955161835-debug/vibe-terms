title: "JSON"
short_definition: "使用物件、陣列、字串、數字、布林值和 null 表示結構化資料的文字格式。"
analogy: "在後端流程中，「JSON」像服務之間的處理站：它負責「使用物件、陣列、字串、數字、布林值和 null 表示結構化資料的文字格式」，結果要用 API 請求與回應確認。"
mechanism: "使用物件、陣列、字串、數字、布林值和 null 表示結構化資料的文字格式。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 JSON 後，Vibe Coding 初學者可以準確指出相關的後端與 API 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「JSON」放進API 請求、回應或服務日誌中：檢查重點是「使用物件、陣列、字串、數字、布林值和 null 表示結構化資料的文字格式」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「JSON」為例，說明如何實現「使用物件、陣列、字串、數字、布林值和 null 表示結構化資料的文字格式」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「JSON」這個名稱就判定已經正確實作；請根據「使用物件、陣列、字串、數字、布林值和 null 表示結構化資料的文字格式」檢查實際行為、資料流、錯誤情境與測試結果。"
