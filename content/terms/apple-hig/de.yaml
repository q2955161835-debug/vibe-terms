title: Apple HIG
short_definition: Apple's Human Oberfläche Guidelines, a Satz von platform Design principles und Interaktion conventions für
  Apple Software.
analogy: 'Ein praktisches Bild für Apple HIG: ein markiertes Werkzeug in UI/UX & Barrierefreiheit, dessen Aufschrift die Frage
  schärft, aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Apple's Human Oberfläche Guidelines, a Satz von platform Design principles und Interaktion conventions für Apple
  Software. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Apple HIG versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Apple HIG in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Apple HIG in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Apple HIG als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
