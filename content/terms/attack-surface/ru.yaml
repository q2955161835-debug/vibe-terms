title: Поверхность атаки
short_definition: Совокупность доступных интерфейсов, входов, привилегий и компонентов, с помощью которых система
  может быть атакована.
analogy: '«Поверхность атаки» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Поверхность атаки»: Совокупность доступных интерфейсов, входов, привилегий и компонентов,
  с помощью которых система может быть атакована. На практике механизм зависит от конфигурации, потока данных и
  границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Поверхность атаки» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Поверхность атаки» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Поверхность атаки». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Поверхность атаки» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
