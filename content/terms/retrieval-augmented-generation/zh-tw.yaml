title: "檢索增強生成"
short_definition: "一種檢索相關外部資訊並在生成模型回答之前將其提供給生成模型的模式。"
analogy: "在 AI 協作中，可以把「檢索增強生成」看成一個檢查點：先確認「一種檢索相關外部資訊並在生成模型回答之前將其提供給生成模型的模式」，再用實際輸出檢查結果。"
mechanism: "一種模式，用於檢索相關外部資訊並在回答之前提供給生成模型。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解檢索增強生成後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「檢索增強生成」放進提示、模型輸出或評估紀錄中：檢查重點是「一種檢索相關外部資訊並在生成模型回答之前將其提供給生成模型的模式」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「檢索增強生成」為例，說明如何實現「一種檢索相關外部資訊並在生成模型回答之前將其提供給生成模型的模式」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「檢索增強生成」這個名稱就判定已經正確實作；請根據「一種檢索相關外部資訊並在生成模型回答之前將其提供給生成模型的模式」檢查實際行為、資料流、錯誤情境與測試結果。"
