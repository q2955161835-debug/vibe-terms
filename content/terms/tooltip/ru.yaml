title: Подсказка
short_definition: Короткая контекстная метка или объяснение, отображаемое рядом с элементом при наведении курсора
  или фокусе клавиатуры.
analogy: 'Представьте «Tooltip» как инструмент в наборе разработчика: он решает задачу в области «UI/UX и доступность»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Tooltip»: Короткая контекстная метка или объяснение, отображаемое рядом с элементом при
  наведении курсора или фокусе клавиатуры. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Подсказка» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Tooltip» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Tooltip». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Tooltip» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
source_content_version: 1
