title: Юнит-тест
short_definition: Автоматизированный тест, проверяющий небольшую единицу логики изолированно от ненужных внешних
  систем.
analogy: 'Проще представить «Модульный тест» как правило работы в разделе «Тестирование и отладка»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Модульный тест»: Автоматизированный тест, проверяющий небольшую единицу логики изолированно
  от ненужных внешних систем. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Юнит-тест» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Модульный тест» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Модульный тест». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Модульный тест» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
