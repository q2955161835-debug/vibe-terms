title: App Icon
short_definition: 'App Icon — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The application identity graphic used by operating systems in launchers, home screens, search, stores, or settings.'
analogy: App Icon можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'App Icon — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The application identity graphic used by operating systems in launchers, home screens, search, stores, or settings.'
why_it_matters: Понимание App Icon помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание App Icon помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль App Icon в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название App Icon доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
