title: Нагрузочный тест
short_definition: Тест производительности, который измеряет поведение при ожидаемом или растущем объеме одновременных
  запросов или работы.
analogy: '«Нагрузочный тест» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Нагрузочный тест»: Тест производительности, который измеряет поведение при ожидаемом или
  растущем объеме одновременных запросов или работы. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Нагрузочный тест» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Нагрузочный тест» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Нагрузочный тест». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Нагрузочный тест» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
