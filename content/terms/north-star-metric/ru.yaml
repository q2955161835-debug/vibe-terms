title: North Star Metric
short_definition: 'North Star Metric — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A primary product metric intended to represent sustained value delivered to users and guide long-term product direction.'
analogy: North Star Metric можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'North Star Metric — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A primary product metric intended to represent sustained value delivered to users and guide long-term product direction.'
why_it_matters: Понимание North Star Metric помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание North Star Metric помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль North Star Metric в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название North Star Metric доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
