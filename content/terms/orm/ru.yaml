title: ОРМ
short_definition: Объектно-реляционное сопоставление — уровень, который сопоставляет объекты или модели приложения
  с таблицами и запросами реляционной базы данных.
analogy: 'Проще представить «ORM» как правило работы в разделе «Данные и базы данных»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «ORM»: Объектно-реляционное сопоставление — уровень, который сопоставляет объекты или модели
  приложения с таблицами и запросами реляционной базы данных. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «ОРМ» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «ORM» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «ORM». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «ORM» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
