title: "基础设施即代码"
short_definition: "通过版本化、可审查的代码而不是手动控制台更改来管理基础架构配置。"
analogy: "可以把“基础设施即代码”看成部署与运维里的一个概念标签：它提醒你先找“通过版本化、可审查的代码而不是手动控制台更改来管理基础架构配置。”对应的实现，最后仍要以代码、配置和实际行为为准。"
mechanism: "实现上，这一概念会围绕“通过版本化、可审查的代码而不是手动控制台更改来管理基础架构配置。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“基础设施即代码”后，你能更准确地描述部署与运维里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的部署与维护阶段，可以把“基础设施即代码”放到一个真实项目中：围绕“通过版本化、可审查的代码而不是手动控制台更改来管理基础架构配置。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“基础设施即代码”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“通过版本化、可审查的代码而不是手动控制台更改来管理基础架构配置”。"
common_mistake: "不要把“基础设施即代码”这个名称当成正确性的证明；请检查实际行为、数据流、权限、失败场景和相关测试。"
