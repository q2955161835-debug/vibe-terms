title: Пакет
short_definition: Версионная единица многократно используемого программного обеспечения, распространяемая через
  реестр пакетов или репозиторий.
analogy: 'Представьте «Package» как инструмент в наборе разработчика: он решает задачу в области «Компьютеры и среда
  разработки», но результат зависит от настройки.'
mechanism: 'Как работает «Package»: Версионная единица многократно используемого программного обеспечения, распространяемая
  через реестр пакетов или репозиторий. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Пакет» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Package» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Package». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Package» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
