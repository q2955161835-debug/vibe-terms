title: 可観測性
short_definition: ログ、メトリクス、トレース、プロファイル、イベントなどの出力からシステムの内部状態を理解する機能。
analogy: 可観測性は、ワークショップの展開と運用の部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査する必要があるかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: ログ、メトリクス、トレース、プロファイル、イベントなどの出力からシステムの内部状態を理解する機能。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: 可観測性を知ることで、Vibe Codingの初心者は、デプロイと運用に関する関連する課題を正確に言語化し、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者が展開と維持の段階に到達したときの語彙チェックポイントとして 可観測性を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: 可観測性がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: 可観測性 という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
