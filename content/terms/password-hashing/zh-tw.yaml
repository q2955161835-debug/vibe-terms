title: "密碼雜湊"
short_definition: "使用緩慢的單向密碼雜湊功能轉換密碼，因此不會直接儲存原始密碼。"
analogy: "將密碼雜湊視為工作坊安全和隱私部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "使用緩慢的單向密碼雜湊函式轉換密碼，因此不會直接儲存原始密碼。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解密碼雜湊可以讓 Vibe 編碼初學者說出他們所指的確切安全和隱私問題，並要求 AI 編碼代理進行修改並提供行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到測試保護階段時，使用密碼雜湊作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋密碼雜湊如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「密碼雜湊」視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
