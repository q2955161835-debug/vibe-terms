title: Controller
short_definition: Ein Anwendung layer die translates incoming requests in calls zu business logic und maps Ergebnisse in responses.
analogy: 'Ordne Controller im Bereich backend apis als beschriftetes Werkzeug ein: Die Beschriftung grenzt den Prüfbereich
  ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein Anwendung layer die translates incoming requests in calls zu business logic und maps Ergebnisse in responses.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Controller versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in backend apis benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Controller in der Phase data identity als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Controller in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Controller als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
