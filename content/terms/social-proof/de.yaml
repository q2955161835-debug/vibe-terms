title: Social Proof
short_definition: Beweise von echten Benutzern, Kunden, Nutzung, Bewertungen oder anerkannten Organisationen, die das Vertrauen
  stärken sollen.
analogy: Betrachte Sozialer Beweis als Orientierung in UI/UX & Barrierefreiheit. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Beweise von echten Benutzern, Kunden, Nutzung, Bewertungen oder anerkannten Organisationen, die das Vertrauen stärken
  sollen. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Sozialer Beweis versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Sozialer Beweis in der Phase Design als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Sozialer Beweis in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Sozialer Beweis als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
