title: Top Nav Layout
short_definition: 'Top Nav Layout は「UI/UX とアクセシビリティ」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A page structure where primary navigation stays across the top and the main content fills the area below.'
analogy: Top Nav Layout は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'Top Nav Layout は「UI/UX とアクセシビリティ」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A page structure where primary navigation stays across the top and the main content fills the area below.'
why_it_matters: Top Nav Layout を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: Top Nav Layout を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
