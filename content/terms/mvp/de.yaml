title: MVP
short_definition: Die kleinste viable Version von a product die can Test the core Wert proposition mit real Benutzer oder
  evidence.
analogy: 'Ein praktisches Bild für MVP: ein markiertes Werkzeug in Produkt & Anforderungen, dessen Aufschrift die Frage schärft,
  aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Die kleinste viable Version von a product die can Test the core Wert proposition mit real Benutzer oder evidence.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer MVP versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient MVP in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie MVP in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere
  nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff MVP als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
