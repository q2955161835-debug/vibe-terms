title: "產品路線圖"
short_definition: "產品方向和預期結果的以時間為導向的檢視，傳達優先順序，而不是將每個專案變成固定的承諾。"
analogy: "將產品路線圖視為工作坊產品和需求部分中的標籤工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "以時間為導向的產品方向和預期結果檢視，傳達優先順序，而不會將每一項都變成固定的承諾。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解產品路線圖後，Vibe Coding 初學者可以準確指出相關的產品與需求問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在 Vibe 術語中，當學習者達到需求階段時，使用產品路線圖作為術語檢查點；將定義對應到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋產品路線圖如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「產品路線圖」視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
