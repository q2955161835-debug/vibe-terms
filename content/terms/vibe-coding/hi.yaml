title: वाइब कोडिंग
short_definition: एआई कोडिंग सहायक को इच्छित परिणाम बताकर, उसके बनाए काम की जाँच और बार-बार सुधार करते
  हुए सॉफ़्टवेयर बनाना।
analogy: बहुत तेज़ जूनियर डेवलपर को काम समझाकर हर डिलीवरी की समीक्षा करने जैसा।
why_it_matters: यह शुरुआती लोगों को असली सॉफ़्टवेयर बनाने देता है, लेकिन एआई ने क्या बदला यह समझने के
  लिए मूल शब्दावली फिर भी चाहिए।
ai_prompt_example: इस फ़ीचर को छोटे चरणों में बनाओ। संपादन से पहले बताओ कि कौन-सी फ़ाइलें बदलोगे और परिणाम
  कैसे जाँचा जाएगा।
common_mistake: “चल रहा है” को सही डिज़ाइन और सुरक्षा का प्रमाण मान लेना।
