title: Отзывы клиентов
short_definition: Заявление клиента или пользователя, используемое в качестве качественного доказательства опыта
  или ценности.
analogy: 'Проще представить «Customer Testimonial» как правило работы в разделе «UI/UX и доступность»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Customer Testimonial»: Заявление клиента или пользователя, используемое в качестве качественного
  доказательства опыта или ценности. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Отзывы клиентов» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Customer Testimonial» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Customer Testimonial». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Customer Testimonial» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
