title: Y2K
short_definition: Ein retro-futurist visual style inspired by late-1990s und early-2000s digital culture, metallic Flächen,
  glossy plastics, und bright Farben.
analogy: Betrachte Y2K als Orientierungsschild in ui ux. Es weist auf die richtige technische Stelle, ersetzt aber weder die
  Implementierung noch deren Prüfung.
mechanism: Ein retro-futurist visual style inspired by late-1990s und early-2000s digital culture, metallic Flächen, glossy
  plastics, und bright Farben. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Y2K versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von einem KI-Coding-Agenten
  eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Y2K in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer sichtbaren
  Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Y2K in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere
  nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Y2K als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
