title: Open Graph
short_definition: URLが共有されるときに豊富なプレビューを構築するためにソーシャルプラットフォームやメッセージングプラットフォームで使用されるメタデータ規則。
analogy: Open Graphは、フロントエンド開発の課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: URLが共有されるときに豊富なプレビューを構築するためにソーシャルプラットフォームやメッセージングプラットフォームで使用されるメタデータ規則。実際のプロジェクトでは、周囲の技術、設定、データフローによって具体的な挙動が変わるため、ラベルだけで判断せず、実装を確認してください。
why_it_matters: Open Graphを知ると、Vibe Coding初心者でも、フロントエンド開発の課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、Open Graphを画面とロジックの実装段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトでOpen Graphがどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「Open Graph」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
