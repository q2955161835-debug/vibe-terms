title: "构建"
short_definition: "将源文件转换为可以运行、测试或部署的构建产物的过程。"
analogy: "可以把构建理解为把源代码加工成可运行、可测试或可部署构建产物的流水线。"
mechanism: "构建会读取源文件和依赖，执行编译、打包、转译或生成静态资源，最终产出可供测试或部署的构建产物；具体步骤取决于项目脚本和工具链。"
why_it_matters: "掌握“构建”后，你能更准确地描述计算机与开发环境里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的建立环境阶段，可以运行项目的构建命令，检查输出目录中的构建产物，并确认它能被本地预览或部署流程正确使用。"
ai_prompt_example: "请检查这个项目的构建脚本：说明源文件如何生成构建产物，只做必要的最小改动，并运行构建命令验证输出。"
common_mistake: "不要把“构建”这个名称当成正确性的证明；请检查实际行为、数据流、权限、失败场景和相关测试。"
