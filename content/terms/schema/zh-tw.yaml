title: "綱要"
short_definition: "儲存資料的結構定義，包括欄位、型別、關係、約束或其他規則。"
analogy: "在資料流程中，「綱要」像整理資料的規則：它描述「儲存資料的結構定義，包括欄位、型別、關係、約束或其他規則」，需要用實際資料與查詢結果驗證。"
mechanism: "儲存資料的結構定義，包括欄位、型別、關係、約束或其他規則。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解綱要後，Vibe Coding 初學者可以準確指出相關的資料與資料庫問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「綱要」放進資料表、查詢或一筆資料中：檢查重點是「儲存資料的結構定義，包括欄位、型別、關係、約束或其他規則」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「綱要」為例，說明如何實現「儲存資料的結構定義，包括欄位、型別、關係、約束或其他規則」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「綱要」這個名稱就判定已經正確實作；請根據「儲存資料的結構定義，包括欄位、型別、關係、約束或其他規則」檢查實際行為、資料流、錯誤情境與測試結果。"
