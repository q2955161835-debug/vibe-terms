title: Runtime
short_definition: Среда и вспомогательная система, в которой фактически выполняется программа.
analogy: 'Проще представить «Runtime» как правило работы в разделе «Компьютеры и среда разработки»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Runtime»: Среда и вспомогательная система, в которой фактически выполняется программа.
  На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Runtime» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Runtime» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Runtime». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Runtime» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
