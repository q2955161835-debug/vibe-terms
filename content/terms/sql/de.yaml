title: SQL
short_definition: Ein language für defining, querying, und modifying Daten in relational Datenbank Systeme.
analogy: 'Ordne SQL im Bereich data databases als beschriftetes Werkzeug ein: Die Beschriftung grenzt den Prüfbereich ein,
  während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein language für defining, querying, und modifying Daten in relational Datenbank Systeme. In einem realen Projekt
  hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer SQL versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in data databases benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient SQL in der Phase data identity als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie SQL in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere
  nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff SQL als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
