title: Prinzip der geringsten Rechte
short_definition: Das Sicherheitsprinzip, nur die für eine Aufgabe erforderlichen Berechtigungen und keinen weitergehenden
  Zugriff als nötig zu gewähren.
analogy: 'Für Prinzip der geringsten Rechte hilft ein Bild aus Sicherheit & Datenschutz: Das Etikett weist auf das Problemfeld,
  ersetzt aber weder den Code noch die Prüfung des Datenflusses.'
mechanism: Das Sicherheitsprinzip, nur die für eine Aufgabe erforderlichen Berechtigungen und keinen weitergehenden Zugriff
  als nötig zu gewähren. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Prinzip der geringsten Rechte versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit
  & Datenschutz benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Prinzip der geringsten Rechte in der Phase Tests & Schutz als Lerncheckpoint.
  Verknüpfe die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Prinzip der geringsten Rechte in diesem Projekt angewendet wird. Nenne die betroffenen Dateien
  oder Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Prinzip der geringsten Rechte als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
