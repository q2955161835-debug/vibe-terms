title: एआई एजेंट
short_definition: ऐसा एआई सिस्टम जो बार-बार अगला कदम तय करता है, औज़ार इस्तेमाल करता है, परिणाम जाँचता
  है और लक्ष्य की ओर बढ़ता रहता है।
analogy: ऐसे कर्मचारी की तरह जो काम का निर्देश पढ़े, अनुमत औज़ार इस्तेमाल करे, नतीजा जाँचे और फिर अगला
  कदम चुने।
why_it_matters: कोडिंग एजेंट फ़ाइलें बदल और कमांड चला सकते हैं, इसलिए सीमित अनुमतियाँ और समीक्षा के पड़ाव
  ज़रूरी हैं।
ai_prompt_example: रिपॉज़िटरी की जाँच करो, योजना बताओ, केवल स्वीकृत फ़ाइलें बदलो, टेस्ट चलाओ, फिर रुककर
  diff की रिपोर्ट दो।
common_mistake: बिना किसी सत्यापन पड़ाव के एजेंट को बहुत व्यापक अनुमति और अस्पष्ट लक्ष्य दे देना।
