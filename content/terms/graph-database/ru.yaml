title: База данных графов
short_definition: База данных, специализирующаяся на объектах и ​​связях между ними, представленных в виде узлов
  и ребер.
analogy: 'Проще представить «Графовая база данных» как правило работы в разделе «Данные и базы данных»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Графовая база данных»: База данных, специализирующаяся на объектах и ​​связях между ними,
  представленных в виде узлов и ребер. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «База данных графов» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Графовая база данных» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Графовая база данных». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Графовая база данных» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
