title: Уценка
short_definition: Облегченный синтаксис разметки открытого текста для заголовков, списков, ссылок, выделения, блоков
  кода и другой структуры документа.
analogy: 'Проще представить «Markdown» как правило работы в разделе «Фронтенд-разработка»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Markdown»: Облегченный синтаксис разметки открытого текста для заголовков, списков, ссылок,
  выделения, блоков кода и другой структуры документа. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Уценка» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Markdown» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Markdown». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Markdown» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
