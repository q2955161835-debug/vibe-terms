title: Dockerfile
short_definition: Декларативный текстовый файл, содержащий упорядоченные инструкции по созданию образа контейнера.
analogy: '«Dockerfile» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Dockerfile»: Декларативный текстовый файл, содержащий упорядоченные инструкции по созданию
  образа контейнера. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код
  и наблюдаемый результат.'
why_it_matters: Понимание термина «Dockerfile» помогает точно назвать проблему в области «Развертывание и эксплуатация», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Dockerfile» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Dockerfile». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Dockerfile» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
