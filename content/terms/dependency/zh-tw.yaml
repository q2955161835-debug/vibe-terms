title: "依賴關係"
short_definition: "系統其他部分所依賴的外部程式碼、套件、服務或元件。"
analogy: "在開發環境裡，「依賴關係」像一個可重複使用的工作零件；重點是理解「系統其他部分所依賴的外部程式碼、套件、服務或元件」如何影響執行結果。"
mechanism: "系統其他部分所依賴的外部程式碼、套件、服務或元件。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解依賴關係後，Vibe Coding 初學者可以準確指出相關的電腦與開發環境問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「依賴關係」放進命令列、設定檔或建置結果中：檢查重點是「系統其他部分所依賴的外部程式碼、套件、服務或元件」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「依賴關係」為例，說明如何實現「系統其他部分所依賴的外部程式碼、套件、服務或元件」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「依賴關係」這個名稱就判定已經正確實作；請根據「系統其他部分所依賴的外部程式碼、套件、服務或元件」檢查實際行為、資料流、錯誤情境與測試結果。"
