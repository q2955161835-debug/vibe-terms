title: Breadcrumb
short_definition: 'Breadcrumb — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A hierarchical trail showing the user''s current location and links to broader parent levels.'
analogy: Breadcrumb можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Breadcrumb — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A hierarchical trail showing the user''s current location and links to broader parent levels.'
why_it_matters: Понимание Breadcrumb помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Breadcrumb помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Breadcrumb в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Breadcrumb доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
