title: ReAct
short_definition: 'ReAct — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An agent pattern that alternates reasoning about the next action with acting through tools and observing the result.'
analogy: ReAct можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'ReAct — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An agent pattern that alternates reasoning about the next action with acting through tools and observing the result.'
why_it_matters: Понимание ReAct помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание ReAct помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль ReAct в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название ReAct доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
