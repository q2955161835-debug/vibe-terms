title: Reverse Proxy
short_definition: Ein Server die receives requests auf behalf von backend Dienste und forwards them based auf routing, Sicherheit,
  oder load Regeln.
analogy: 'Ein praktisches Bild für Reverse Proxy: ein markiertes Werkzeug in web network, dessen Aufschrift die Frage schärft,
  aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein Server die receives requests auf behalf von backend Dienste und forwards them based auf routing, Sicherheit,
  oder load Regeln. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Reverse Proxy versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in web network benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Reverse Proxy in der Phase environment als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Reverse Proxy in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Reverse Proxy als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
