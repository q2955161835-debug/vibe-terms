title: 테스트
short_definition: 소프트웨어가 예상대로 동작하고 변경 후에도 계속 그러한지 체계적으로 확인하는 과정.
analogy: 고객이 건물에 들어오기 전에 고장 난 문을 찾아내는 점검표와 같습니다.
why_it_matters: AI가 만든 모든 변경에 구체적인 검증 단계를 두면 Vibe Coding이 더 안전해집니다.
ai_prompt_example: 버그 수정 전에는 실패하고 수정 후에는 통과하는 회귀 테스트를 추가하세요.
common_mistake: 정상 경로를 한 번 눌러 본 뒤 기능 테스트가 끝났다고 생각하는 것.
status: draft
source_content_version: 1
