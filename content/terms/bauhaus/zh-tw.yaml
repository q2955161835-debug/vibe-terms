title: "包浩斯"
short_definition: "現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成。"
analogy: "將包浩斯視為工作坊的 UI/UX 和可存取性部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自於實作。"
mechanism: "現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解包浩斯讓 Vibe 編碼初學者說出他們所指的確切 UI/UX 和可存取性問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者到達設計階段時，使用包浩斯作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋包浩斯如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將包浩斯一詞視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
