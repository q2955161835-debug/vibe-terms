title: API Gateway
short_definition: A service placed in front of APIs to centralize routing, authentication, rate limits, observability, or protocol translation.
analogy: 'Think of API Gateway as a labeled tool in the backend & apis part of a workshop: the label tells you what problem area to inspect, but the real behavior still comes from the implementation.'
mechanism: A service placed in front of APIs to centralize routing, authentication, rate limits, observability, or protocol translation. In a real project, its exact behavior depends on the surrounding technology, configuration, and data flow, so verify the concrete implementation rather than relying on the label alone.
why_it_matters: Knowing API Gateway lets a Vibe Coding beginner name the exact backend & apis concern they mean and ask an AI coding agent for a change plus evidence that the behavior is correct.
project_example: In Vibe Terms, use API Gateway as a vocabulary checkpoint when a learner reaches the data-identity stage; connect the definition to one visible page, file, request, data structure, or verification step rather than teaching it in isolation.
ai_prompt_example: Explain how API Gateway applies to this project. Point to the exact files or system boundary involved, make only the smallest necessary change, and show the command or user flow I can use to verify the result.
common_mistake: Treating the term API Gateway as proof that an implementation is correct without checking actual behavior, data flow, permissions, failure cases, or the relevant test.
quiz:
- question: Which description best matches API Gateway?
  options:
  - A service placed in front of APIs to centralize routing, authentication, rate limits, observability, or protocol translation.
  - A visual decoration that has no effect on software behavior.
  - A guarantee that every implementation is secure and correct.
  answer: 0
- question: When an AI says it used API Gateway, what should you do next?
  options:
  - Accept the label as proof.
  - Check the concrete implementation and verify the relevant behavior.
  - Rename the files so the term appears in the project.
  answer: 1
- question: Which prompt is more useful for working with API Gateway?
  options:
  - “Make API Gateway better.”
  - “Explain where API Gateway appears, change the smallest necessary part, and show how to verify it.”
  - “Rewrite the whole project.”
  answer: 1
