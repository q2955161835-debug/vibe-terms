title: "响应式设计"
short_definition: "设计使布局、内容、控件和排版适应不同的视口大小和设备功能。"
analogy: "可以把“响应式设计”理解为UI/UX 与无障碍中的一个概念：在项目里先找到它对应的页面、代码、配置或数据，再结合实际运行结果确认含义。"
mechanism: "实现上，这一概念会围绕“设计使布局、内容、控件和排版适应不同的视口大小和设备功能。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "理解“响应式设计”，有助于你在UI/UX 与无障碍语境中准确描述问题，指导 AI 检查具体实现，并要求用可复现的步骤验证结果。"
project_example: "在 Vibe Terms 的设计体验阶段，可以把“响应式设计”放到一个真实项目中：围绕“设计使布局、内容、控件和排版适应不同的视口大小和设备功能。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“响应式设计”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“设计使布局、内容、控件和排版适应不同的视口大小和设备功能”。"
common_mistake: "不要把“响应式设计”这个名称当成正确性的证明；请检查实际行为、数据流、权限、失败场景和相关测试。"
