title: "根本原因"
short_definition: "產生故障的根本條件或設計缺陷，而非下游症狀。"
analogy: "將根本原因視為工作坊測試和除錯部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "產生故障的根本條件或設計缺陷，而不是下游症狀。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解根本原因讓 Vibe 編碼初學者說出他們想要的確切測試和除錯問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到測試保護階段時，使用 Root Cause 作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋根本原因如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「根本原因」視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
status: draft
source_content_version: 1
