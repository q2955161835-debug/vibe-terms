title: "HTTP 协议"
short_definition: "浏览器和 Web 服务用于交换请求和响应的应用程序协议。"
analogy: "可以把“HTTP 协议”看成Web 与网络里的一个概念标签：它提醒你先找“浏览器和 Web 服务用于交换请求和响应的应用程序协议。”对应的实现，最后仍要以代码、配置和实际行为为准。"
mechanism: "实现上，这一概念会围绕“浏览器和 Web 服务用于交换请求和响应的应用程序协议。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“HTTP 协议”后，你能更准确地描述Web 与网络里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的建立环境阶段，可以把“HTTP 协议”放到一个真实项目中：围绕“浏览器和 Web 服务用于交换请求和响应的应用程序协议。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“HTTP 协议”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“浏览器和 Web 服务用于交换请求和响应的应用程序协议”。"
common_mistake: "不要把“HTTP 协议”这个名称当成正确性的证明；请检查实际行为、数据流、权限、失败场景和相关测试。"
