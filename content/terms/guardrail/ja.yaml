title: Guardrail
short_definition: 'Guardrail は「AI と Vibe Coding」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A technical or procedural control that constrains, validates, filters, or requires approval for risky AI behavior.'
