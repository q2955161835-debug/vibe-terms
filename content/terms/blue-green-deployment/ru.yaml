title: Сине-зеленое развертывание
short_definition: Стратегия выпуска, которая поддерживает две производственные среды и переключает трафик с текущей
  версии на проверенную новую.
analogy: '«Сине-зеленое развертывание» похож на маршрутную отметку в проекте: она помогает найти нужное место, но
  не заменяет проверку реализации.'
mechanism: 'Как работает «Сине-зеленое развертывание»: Стратегия выпуска, которая поддерживает две производственные
  среды и переключает трафик с текущей версии на проверенную новую. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Сине-зеленое развертывание» помогает точно назвать проблему в области «Развертывание и эксплуатация», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Сине-зеленое развертывание» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Сине-зеленое развертывание». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Сине-зеленое развертывание» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
