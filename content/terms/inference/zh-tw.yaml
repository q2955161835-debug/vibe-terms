title: "推理"
short_definition: "在新輸入上執行經過訓練的模型以產生預測、完成、嵌入、影象或其他輸出。"
analogy: "將推理視為工作坊的人工智慧和氛圍編碼部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自於實作。"
mechanism: "在新輸入上執行經過訓練的模型以產生預測、完成、嵌入、影象或其他輸出。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "Knowing Inference 讓 Vibe 編碼初學者能夠準確地說出他們所指的 AI 和 vibe 編碼問題，並要求 AI 編碼代理進行修改以及證明行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到要求階段時，使用推理作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋推理如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「推理」視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
status: draft
