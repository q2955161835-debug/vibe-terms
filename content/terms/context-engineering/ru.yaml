title: Контекстная инженерия
short_definition: Практика выбора и организации инструкций, истории, файлов, инструментов и результатов, необходимых
  модели для текущей задачи.
analogy: 'Представьте «Контекстная инженерия» как инструмент в наборе разработчика: он решает задачу в области «ИИ
  и Vibe Coding», но результат зависит от настройки.'
mechanism: 'Как работает «Контекстная инженерия»: Практика выбора и организации инструкций, истории, файлов, инструментов
  и результатов, необходимых модели для текущей задачи. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Контекстная инженерия» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Контекстная инженерия» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Контекстная инженерия». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Контекстная инженерия» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
