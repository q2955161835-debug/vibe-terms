title: Staging-Bereich
short_definition: Der Git-Index, der die genauen Änderungen enthält, die für den nächsten Commit ausgewählt wurden.
analogy: 'Ein praktischer Vergleich für Staging-Bereich: ein markiertes Werkzeug in Git & Zusammenarbeit, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Der Git-Index, der die genauen Änderungen enthält, die für den nächsten Commit ausgewählt wurden. In einem realen
  Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Staging-Bereich versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Git & Zusammenarbeit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Staging-Bereich in der Phase Umgebung als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Staging-Bereich in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Staging-Bereich als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
