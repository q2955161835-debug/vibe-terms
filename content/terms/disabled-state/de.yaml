title: Deaktivierter Zustand
short_definition: Ein Zustand in die a control is intentionally unavailable und must communicate both its condition und any
  relevante reason.
analogy: Betrachte Deaktivierter Zustand als Orientierungsschild in Frontend-Entwicklung. Es weist auf die richtige technische
  Stelle, ersetzt aber weder die Implementierung noch deren Prüfung.
mechanism: Ein Zustand in die a control is intentionally unavailable und must communicate both its condition und any relevante
  reason. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Deaktivierter Zustand versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Deaktivierter Zustand in der Phase Oberflächenlogik als Lerncheckpoint: Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Deaktivierter Zustand in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Deaktivierter Zustand als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
