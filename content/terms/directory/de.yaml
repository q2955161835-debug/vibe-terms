title: Verzeichnis
short_definition: Ein Datei-System container verwendet zu organize Dateien und nested directories.
analogy: 'Für Verzeichnis hilft ein Vergleich mit einem Werkzeug aus computing env: Sein Etikett nennt das Problemfeld; verlässlich
  wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein Datei-System container verwendet zu organize Dateien und nested directories. In einem realen Projekt hängt
  das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Verzeichnis versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in computing env benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Verzeichnis in der Phase environment als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Verzeichnis in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Verzeichnis als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
