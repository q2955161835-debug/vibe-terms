title: Content-Security-Policy
short_definition: Ein Browser Sicherheit policy die restricts die sources may supply scripts, styles, frames, und other Ressourcen
  zu a Seite.
analogy: 'Für Content-Security-Policy hilft ein Vergleich mit einem Werkzeug aus Sicherheit & Datenschutz: Sein Etikett nennt
  das Problemfeld; verlässlich wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein Browser Sicherheit policy die restricts die sources may supply scripts, styles, frames, und other Ressourcen
  zu a Seite. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Content-Security-Policy versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Content-Security-Policy in der Phase test protect als Lerncheckpoint: Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Content-Security-Policy in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Content-Security-Policy als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
