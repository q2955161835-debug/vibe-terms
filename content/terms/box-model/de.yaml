title: Box-Modell
short_definition: Das CSS-Modell, das jedes Element als Inhalt behandelt, der von Innenabstand, Rahmen und Rand umgeben ist.
analogy: 'Ein praktischer Vergleich für Box-Modell: ein markiertes Werkzeug in Frontend-Entwicklung, dessen Zweck erst im
  Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Das CSS-Modell, das jedes Element als Inhalt behandelt, der von Innenabstand, Rahmen und Rand umgeben ist. In einem
  realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Box-Modell versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Box-Modell in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Box-Modell in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Box-Modell als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
