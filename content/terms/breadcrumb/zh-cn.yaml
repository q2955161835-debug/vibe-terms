title: "面包屑导航"
short_definition: "以层级路径展示用户当前位置，并提供通往上级页面的链接。"
analogy: "可以把面包屑导航理解为页面层级的路线图：它告诉用户当前位于哪里，并提供返回上级页面的入口。"
mechanism: "实现上，组件会根据当前路由或页面层级生成路径项，为每一级上级页面提供链接，并将当前位置标为不可跳转或当前项；具体行为应结合路由配置和实际交互验证。"
why_it_matters: "面包屑导航能降低复杂站点中的迷路成本，也能让用户和搜索引擎更清楚地理解页面层级；实现时还要检查键盘操作、语义标记和当前项状态。"
project_example: "在 Vibe Terms 的设计体验阶段，可以在术语详情页加入面包屑导航，例如“首页 / 设计体验 / 面包屑导航”，并验证每个上级链接、当前页面标记和窄屏布局。"
ai_prompt_example: "请检查这个项目的面包屑导航：指出路由层级来自哪里，确认上级链接、当前项语义和键盘可达性，只做必要的最小改动，并说明如何验证。"
common_mistake: "不要只把页面标题串起来就称为面包屑导航；还要确认层级顺序正确、链接可用，并清楚标识当前页面。"
