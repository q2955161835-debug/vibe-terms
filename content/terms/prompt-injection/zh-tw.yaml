title: "提示注入"
short_definition: "一種攻擊或故障模式，其中不受信任的內容嘗試覆蓋指令或操縱 AI 系統的行為。"
analogy: "在 AI 協作中，可以把「提示注入」看成一個檢查點：先確認「一種攻擊或故障模式，其中不受信任的內容嘗試覆蓋指令或操縱 AI 系統的行為」，再用實際輸出檢查結果。"
mechanism: "一種攻擊或故障模式，其中不受信任的內容嘗試覆蓋指令或操縱 AI 系統的行為。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解提示注入後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「提示注入」放進提示、模型輸出或評估紀錄中：檢查重點是「一種攻擊或故障模式，其中不受信任的內容嘗試覆蓋指令或操縱 AI 系統的行為」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「提示注入」為例，說明如何實現「一種攻擊或故障模式，其中不受信任的內容嘗試覆蓋指令或操縱 AI 系統的行為」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「提示注入」這個名稱就判定已經正確實作；請根據「一種攻擊或故障模式，其中不受信任的內容嘗試覆蓋指令或操縱 AI 系統的行為」檢查實際行為、資料流、錯誤情境與測試結果。"
