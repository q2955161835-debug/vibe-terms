title: Schweizer Style
short_definition: Ein modernist graphic-design approach emphasizing grids, strong typography, asymmetry, clarity, und disciplined
  alignment.
analogy: 'Ein praktisches Bild für Schweizer Style: ein markiertes Werkzeug in ui ux, dessen Aufschrift die Frage schärft,
  aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein modernist graphic-design approach emphasizing grids, strong typography, asymmetry, clarity, und disciplined
  alignment. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Schweizer Style versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Schweizer Style in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Schweizer Style in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Schweizer Style als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
