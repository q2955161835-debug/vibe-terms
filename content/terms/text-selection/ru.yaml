title: Выбор текста
short_definition: Выделенный текстовый диапазон, выбранный пользователем для копирования, редактирования или другой
  операции.
analogy: 'Представьте «Text Selection» как инструмент в наборе разработчика: он решает задачу в области «Фронтенд-разработка»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Text Selection»: Выделенный текстовый диапазон, выбранный пользователем для копирования,
  редактирования или другой операции. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Выбор текста» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Text Selection» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Text Selection». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Text Selection» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
source_content_version: 1
