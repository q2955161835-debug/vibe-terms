title: CSRF
short_definition: 'CSRF — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Cross-site request forgery, an attack that causes a victim''s browser to send an unwanted authenticated request to another site.'
analogy: CSRF можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'CSRF — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Cross-site request forgery, an attack that causes a victim''s browser to send an unwanted authenticated request to another site.'
why_it_matters: Понимание CSRF помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание CSRF помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль CSRF в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название CSRF доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
