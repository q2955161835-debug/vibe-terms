title: "技能"
short_definition: "可重複使用的指令、參考或指令碼包，用於教導 AI 代理程式如何執行重複工作流程。"
analogy: "將 Skill 視為工作坊的 AI 與 Vibe Coding 部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "可重複使用的指令、參考或指令碼包，用於教導 AI 代理程式如何執行重複工作流程。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解技能後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在 Vibe 術語中，當學習者達到要求階段時，使用技能作為術語檢查點；將定義對應到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋技能如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「技能」視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
