title: "页头（Header）"
short_definition: "页面的顶部结构区域，通常包含品牌标识、导航和关键实用程序。"
analogy: "可以把页头（Header）理解为页面的门楣：品牌、主导航和关键操作通常集中在这里。"
mechanism: "实现上，页头（Header）通常由品牌标识、主导航和关键操作组成，并根据路由、登录状态和屏幕宽度调整内容；具体行为应结合组件结构和实际交互验证。"
why_it_matters: "页头（Header）往往决定用户能否快速找到主要入口；还要检查导航顺序、响应式布局和键盘可达性。"
project_example: "在 Vibe Terms 的设计体验阶段，可以在术语详情页实现页头（Header），检查品牌入口、主导航、移动端折叠菜单和键盘焦点顺序。"
ai_prompt_example: "请检查这个项目的页头（Header）：指出品牌、导航和关键操作的实现位置，保持现有布局，只做必要的最小改动，并验证键盘导航和窄屏显示。"
common_mistake: "不要把页头（Header）只当成装饰区域；还要检查导航语义、响应式行为和键盘可达性。"
