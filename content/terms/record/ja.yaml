title: レコード
short_definition: データセット内のエンティティ、イベント、事実を表す、1件の保存済みデータ。
analogy: レコードは、ワークショップのデータとデータベースの部分にあるラベル付きツールと考えてください。ラベルはどの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: レコードは識別子と複数のフィールドを持つ保存単位で、データベースの行やドキュメントとして読み書きされます。実際のプロジェクトでは、スキーマと一意性の扱いを確認してください。
why_it_matters: レコードを知ることで、Vibe Codingの初心者は、それらが意味する正確なデータとデータベースの懸念事項に名前を付け、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がデータ同一性段階に到達したときに語彙チェックポイントとして レコードを使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: レコードがこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: レコード という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
