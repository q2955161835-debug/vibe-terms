title: TLS
short_definition: Криптографический протокол, обеспечивающий шифрование, целостность и одноранговую аутентификацию
  для сетевых подключений, таких как HTTPS.
analogy: 'Представьте «TLS» как инструмент в наборе разработчика: он решает задачу в области «Web и сети», но результат
  зависит от настройки.'
mechanism: 'Как работает «TLS»: Криптографический протокол, обеспечивающий шифрование, целостность и одноранговую
  аутентификацию для сетевых подключений, таких как HTTPS. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «TLS» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «TLS» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «TLS». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «TLS» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
