title: "指令"
short_definition: "輸入到 shell 或 CLI 中以呼叫程式或內建操作的指令。"
analogy: "在開發環境裡，「指令」像一個可重複使用的工作零件；重點是理解「輸入到 shell 或 CLI 中以呼叫程式或內建操作的指令」如何影響執行結果。"
mechanism: "輸入到 shell 或 CLI 中以呼叫程式或內建操作的指令。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解指令後，Vibe Coding 初學者可以準確指出相關的電腦與開發環境問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「指令」放進命令列、設定檔或建置結果中：檢查重點是「輸入到 shell 或 CLI 中以呼叫程式或內建操作的指令」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「指令」為例，說明如何實現「輸入到 shell 或 CLI 中以呼叫程式或內建操作的指令」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「指令」這個名稱就判定已經正確實作；請根據「輸入到 shell 或 CLI 中以呼叫程式或內建操作的指令」檢查實際行為、資料流、錯誤情境與測試結果。"
