title: .gitignore
short_definition: Файл шаблонов Git, который сообщает Git, какие неотслеживаемые пути обычно следует игнорировать.
analogy: 'Представьте «.gitignore» как инструмент в наборе разработчика: он решает задачу в области «Git и совместная
  работа», но результат зависит от настройки.'
mechanism: 'Как работает «.gitignore»: Файл шаблонов Git, который сообщает Git, какие неотслеживаемые пути обычно
  следует игнорировать. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «.gitignore» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «.gitignore» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «.gitignore». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «.gitignore» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
