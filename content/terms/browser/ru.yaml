title: Browser
short_definition: 'Browser — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A client application that resolves web addresses, requests resources, executes web code, and renders pages for users.'
analogy: Browser можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Browser — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A client application that resolves web addresses, requests resources, executes web code, and renders pages for users.'
why_it_matters: Понимание Browser помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Browser помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Browser в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Browser доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
