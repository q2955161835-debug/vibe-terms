title: バイブコーディング
short_definition: AIコーディングアシスタントに結果を記述し、生成されたものを反復処理することでソフトウェアを構築します。
analogy: 非常に早い若手開発者に自分の要望を伝え、納品されるたびにチェックするようなものです。
why_it_matters: 初心者でも実際のソフトウェアを作成できますが、AIが何を変更したかを判断するには十分な語彙が必要です。
ai_prompt_example: この機能は小さなステップで構築してください。編集する前に、どのファイルを変更するか、およびその結果をどのように確認できるかを説明してください。
common_mistake: 「動く」ということは、設計が正しいか安全であるという証拠として扱われます。
status: draft
source_content_version: 1
mechanism: Vibe Codingでは、自然言語で目的と制約を伝え、AIが提案・生成した変更を小さく適用して、実装と検証を反復します。
project_example: Vibe Termsでは、用語を手掛かりにAIへ変更範囲と確認手順を依頼し、生成結果をGit差分とブラウザで確かめます。
