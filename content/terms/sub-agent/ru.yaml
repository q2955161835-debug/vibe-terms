title: Sub-agent
short_definition: 'Sub-agent — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A separate agent instance delegated a bounded subtask whose result is returned to a coordinating agent.'
analogy: Sub-agent можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Sub-agent — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A separate agent instance delegated a bounded subtask whose result is returned to a coordinating agent.'
why_it_matters: Понимание Sub-agent помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Sub-agent помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Sub-agent в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Sub-agent доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
