title: "防護機制（Guardrail）"
short_definition: "一種技術或程式控制，用於限制、驗證、過濾或要求批准有風險的 AI 行為。"
analogy: "在 AI 協作中，可以把「防護機制（Guardrail）」看成一個檢查點：先確認「一種技術或程式控制，用於限制、驗證、過濾或要求批准有風險的 AI 行為」，再用實際輸出檢查結果。"
mechanism: "限制、驗證、過濾或要求批准有風險的 AI 行為的技術或程式控制。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解防護機制（Guardrail）後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「防護機制（Guardrail）」放進提示、模型輸出或評估紀錄中：檢查重點是「一種技術或程式控制，用於限制、驗證、過濾或要求批准有風險的 AI 行為」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「防護機制（Guardrail）」為例，說明如何實現「一種技術或程式控制，用於限制、驗證、過濾或要求批准有風險的 AI 行為」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「防護機制（Guardrail）」這個名稱就判定已經正確實作；請根據「一種技術或程式控制，用於限制、驗證、過濾或要求批准有風險的 AI 行為」檢查實際行為、資料流、錯誤情境與測試結果。"
