title: Kontingent
short_definition: Ein festes Kontingent an Anfragen, Speicher, Rechenleistung, Token oder einer anderen Ressource über einen
  definierten Zeitraum.
analogy: Betrachte Kontingent als Orientierung in Backend & APIs. Die Bezeichnung führt zur richtigen technischen Stelle, garantiert
  aber noch keine gute Umsetzung.
mechanism: Ein festes Kontingent an Anfragen, Speicher, Rechenleistung, Token oder einer anderen Ressource über einen definierten
  Zeitraum. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Kontingent versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Kontingent in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Kontingent in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Kontingent als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
