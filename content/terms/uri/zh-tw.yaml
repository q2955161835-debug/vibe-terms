title: "URI"
short_definition: "資源的通用識別碼； URL 是 URI 的一種，也描述如何或在何處存取它。"
analogy: "在 Web 流程裡，「URI」像連接兩個步驟的交通規則：它處理「資源的通用識別碼； URL 是 URI 的一種，也描述如何或在何處存取它」，實際效果要用請求與回應驗證。"
mechanism: "資源的通用識別碼； URL 是 URI 的一種，也描述如何或在何處存取它。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 URI 後，Vibe Coding 初學者可以準確指出相關的 Web 與網路問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「URI」放進瀏覽器畫面、HTTP 請求或回應中：檢查重點是「資源的通用識別碼； URL 是 URI 的一種，也描述如何或在何處存取它」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「URI」為例，說明如何實現「資源的通用識別碼； URL 是 URI 的一種，也描述如何或在何處存取它」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「URI」這個名稱就判定已經正確實作；請根據「資源的通用識別碼； URL 是 URI 的一種，也描述如何或在何處存取它」檢查實際行為、資料流、錯誤情境與測試結果。"
