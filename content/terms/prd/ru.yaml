title: PRD
short_definition: Документ с требованиями к продукту, в котором описываются проблема, целевые пользователи, область
  применения, поведение, ограничения и ожидания приемлемости продукта или функции.
analogy: 'Представьте «PRD» как инструмент в наборе разработчика: он решает задачу в области «Продукт и требования»,
  но результат зависит от настройки.'
mechanism: 'Как работает «PRD»: Документ с требованиями к продукту, в котором описываются проблема, целевые пользователи,
  область применения, поведение, ограничения и ожидания приемлемости продукта или функции. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «PRD» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «PRD» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «PRD». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «PRD» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
