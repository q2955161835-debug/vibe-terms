title: ORM
short_definition: 'ORM — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Object-relational mapping, a layer that maps application objects or models to relational database tables and queries.'
analogy: ORM можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'ORM — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Object-relational mapping, a layer that maps application objects or models to relational database tables and queries.'
why_it_matters: Понимание ORM помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание ORM помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль ORM в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название ORM доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
