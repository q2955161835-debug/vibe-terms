title: Хеширование паролей
short_definition: Преобразование паролей с помощью медленной односторонней функции хеширования паролей, поэтому
  исходный пароль не сохраняется напрямую.
analogy: '«Хеширование паролей» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Хеширование паролей»: Преобразование паролей с помощью медленной односторонней функции
  хеширования паролей, поэтому исходный пароль не сохраняется напрямую. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Хеширование паролей» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Хеширование паролей» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Хеширование паролей». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Хеширование паролей» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
