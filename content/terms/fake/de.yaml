title: Fake
short_definition: Eine leichtgewichtige, funktionierende Implementierung einer Schnittstelle, die in Tests anstelle einer
  Produktionsabhängigkeit verwendet wird.
analogy: 'Ein praktischer Vergleich für Fake: ein markiertes Werkzeug in Testen & Debugging, dessen Zweck erst im Zusammenspiel
  mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine leichtgewichtige, funktionierende Implementierung einer Schnittstelle, die in Tests anstelle einer Produktionsabhängigkeit
  verwendet wird. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Fake versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Testen & Debugging benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Fake in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Fake in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Fake als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
