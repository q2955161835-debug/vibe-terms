title: CSS Custom Property
short_definition: 'CSS Custom Property は「フロントエンド開発」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A named CSS value beginning with `--` that participates in the cascade and can be reused through `var()`.'
