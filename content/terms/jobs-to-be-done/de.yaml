title: Zu erledigende Aufgaben
short_definition: Ein Rahmen zur Beschreibung des Fortschritts, den eine Person in einer Situation zu machen versucht, anstatt
  ihn nur anhand demografischer Merkmale zu definieren.
analogy: 'Für Zu erledigende Aufgaben hilft ein Bild aus Produkt & Anforderungen: Das Etikett weist auf das Problemfeld, ersetzt
  aber weder den Code noch die Prüfung des Datenflusses.'
mechanism: Ein Rahmen zur Beschreibung des Fortschritts, den eine Person in einer Situation zu machen versucht, anstatt ihn
  nur anhand demografischer Merkmale zu definieren. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Zu erledigende Aufgaben versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Zu erledigende Aufgaben in der Phase Anforderungen als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Zu erledigende Aufgaben in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Zu erledigende Aufgaben als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
