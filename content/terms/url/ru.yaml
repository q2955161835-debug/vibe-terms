title: URL-адрес
short_definition: Веб-адрес, идентифицирующий ресурс с использованием таких компонентов, как схема, хост, путь,
  запрос и фрагмент.
analogy: 'Проще представить «URL» как правило работы в разделе «Web и сети»: название задает направление, а код
  показывает поведение.'
mechanism: 'Как работает «URL»: Веб-адрес, идентифицирующий ресурс с использованием таких компонентов, как схема,
  хост, путь, запрос и фрагмент. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «URL-адрес» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «URL» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «URL». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «URL» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
