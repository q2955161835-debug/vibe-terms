title: Modellrouting
short_definition: Auswahl zwischen verschiedenen Modellen zur Laufzeit basierend auf Aufgabentyp, Fähigkeit, Kosten, Latenz
  oder Risiko.
analogy: Betrachte Modellrouting als Orientierung in KI & Vibe Coding. Die Bezeichnung führt zur richtigen technischen Stelle,
  garantiert aber noch keine gute Umsetzung.
mechanism: Auswahl zwischen verschiedenen Modellen zur Laufzeit basierend auf Aufgabentyp, Fähigkeit, Kosten, Latenz oder
  Risiko. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Modellrouting versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in KI & Vibe Coding benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Modellrouting in der Phase Anforderungen als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Modellrouting in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Modellrouting als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
