title: Темный интерфейс
short_definition: Направление интерфейса, построенное преимущественно на темных поверхностях с тщательно настроенными
  текстом, рамкой, иллюстрациями и смысловыми цветами.
analogy: '«Dark UI» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Dark UI»: Направление интерфейса, построенное преимущественно на темных поверхностях с
  тщательно настроенными текстом, рамкой, иллюстрациями и смысловыми цветами. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Темный интерфейс» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Dark UI» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Dark UI». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Dark UI» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
