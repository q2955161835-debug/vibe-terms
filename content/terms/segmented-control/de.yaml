title: Segmentierte Control
short_definition: Ein compact row von mutually exclusive options verwendet zu switch zwischen a few closely related modes
  oder views.
analogy: Betrachte Segmentierte Control als Orientierungsschild in ui ux. Es weist auf die richtige technische Stelle, ersetzt
  aber weder die Implementierung noch deren Prüfung.
mechanism: Ein compact row von mutually exclusive options verwendet zu switch zwischen a few closely related modes oder views.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Segmentierte Control versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Segmentierte Control in der Phase Design als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Segmentierte Control in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Segmentierte Control als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
