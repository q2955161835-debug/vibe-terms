title: फ्रंटएंड
short_definition: एप्लिकेशन का वह हिस्सा जिसे उपयोगकर्ता सीधे देखते और इस्तेमाल करते हैं।
analogy: दुकान का वह सामने वाला भाग जहाँ ग्राहक चलते हैं, पीछे का गोदाम नहीं।
why_it_matters: अधिकांश दृश्य Vibe Coding अनुरोध फ्रंटएंड कोड बदलते हैं, इसलिए यह शब्द काम की सीमा स्पष्ट
  करता है।
ai_prompt_example: केवल फ्रंटएंड के शब्द-कार्ड लेआउट को बदलो। API उत्तर या डेटाबेस टेबल मत बदलो।
common_mistake: पूरी वेबसाइट को “फ्रंटएंड” कहना, जबकि काम में सर्वर-साइड बदलाव भी चाहिए।
