title: Промпт
short_definition: Инструкция или контекст, которые задают направление следующему ответу или действию модели
  ИИ.
analogy: Как техническое задание, которое вы передаёте исполнителю до начала работы.
why_it_matters: Чёткий промпт уменьшает число догадок и облегчает проверку изменений, сделанных ИИ.
ai_prompt_example: Добавь строку поиска с фильтрацией по названию, псевдонимам и определению. Сохрани
  существующую компоновку.
common_mistake: Пытаться исправить расплывчатое требование более длинным, а не более ясным промптом.
status: draft
source_content_version: 1
