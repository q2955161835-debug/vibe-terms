title: Inline-Bestätigung
short_definition: Eine kompakte Bestätigungsaufforderung, die in der Nähe der auslösenden Aktion platziert wird und üblicherweise
  vor einer kleinen destruktiven Aktion verwendet wird.
analogy: 'Für Inline-Bestätigung hilft ein Bild aus UI/UX & Barrierefreiheit: Das Etikett weist auf das Problemfeld, ersetzt
  aber weder den Code noch die Prüfung des Datenflusses.'
mechanism: Eine kompakte Bestätigungsaufforderung, die in der Nähe der auslösenden Aktion platziert wird und üblicherweise
  vor einer kleinen destruktiven Aktion verwendet wird. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Inline-Bestätigung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Inline-Bestätigung in der Phase Design als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Inline-Bestätigung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Inline-Bestätigung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
