title: Modell Provider
short_definition: Ein company oder Dienst die hosts Modelle und exposes them durch products oder APIs.
analogy: 'Für Modell Provider hilft ein Vergleich mit einem Werkzeug aus ai vibe: Sein Etikett nennt das Problemfeld; verlässlich
  wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein company oder Dienst die hosts Modelle und exposes them durch products oder APIs. In einem realen Projekt hängt
  das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Modell Provider versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Modell Provider in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Modell Provider in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Modell Provider als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
