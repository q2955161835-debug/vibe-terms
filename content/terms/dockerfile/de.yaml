title: Dockerfile
short_definition: Eine deklarative Textdatei mit geordneten Anweisungen zum Erstellen eines Container-Images.
analogy: 'Ordne Dockerfile im Bereich Deployment & Betrieb als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch erst
  die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Eine deklarative Textdatei mit geordneten Anweisungen zum Erstellen eines Container-Images. In einem realen Projekt
  hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Dockerfile versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Deployment & Betrieb benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Dockerfile in der Phase Deployment & Wartung als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Dockerfile in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Dockerfile als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
