title: プロンプト
short_definition: AIモデルに次の応答やアクションを導くために与える指示やコンテキスト。
analogy: プロンプトとは、工事が始まる前に請負業者に渡す概要書です。
why_it_matters: 明確なプロンプトにより推測による推測が減り、AI編集のレビューが容易になります。
ai_prompt_example: タイトル、別名、定義で用語をフィルターする検索ボックスを追加します。既存のレイアウトを変更しないでください。
common_mistake: 曖昧な要件を明確にするのではなく、プロンプトを長くして修正しようとします。
status: draft
source_content_version: 1
mechanism: Promptはモデルへの目的・制約・入力形式を文章化し、指示の優先順位と期待する出力をリクエスト内で伝えます。
project_example: Vibe Termsでは、用語ページの説明をAIに依頼する際、対象ファイルと検証手順をPromptに明記します。
