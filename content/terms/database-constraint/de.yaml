title: Datenbankeinschränkung
short_definition: Eine von der Datenbank erzwungene Regel, die ungültige Datenzustände wie erforderliche Werte oder ungültige
  Beziehungen verhindert.
analogy: 'Ein praktischer Vergleich für Datenbankeinschränkung: ein markiertes Werkzeug in Daten & Datenbanken, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine von der Datenbank erzwungene Regel, die ungültige Datenzustände wie erforderliche Werte oder ungültige Beziehungen
  verhindert. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Datenbankeinschränkung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Daten & Datenbanken
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Datenbankeinschränkung in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Datenbankeinschränkung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Datenbankeinschränkung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
