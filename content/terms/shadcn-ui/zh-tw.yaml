title: "shadcn/ui"
short_definition: "一種收集和分發方法，用於將可存取的 React 元件來源複製到專案中，以便應用程式擁有並自訂程式碼。"
analogy: "將 shadcn/ui 視為工作坊前端工程部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "一種收集和分發方法，用於將可存取的 React 元件來源複製到專案中，以便應用程式擁有並自訂程式碼。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解 shadcn/ui 後，Vibe 編碼初學者可以準確地說出他們所指的前端工程問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到介面邏輯階段時，使用 shadcn/ui 作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教導它。"
ai_prompt_example: "解釋一下 shadcn/ui 如何應用於這個專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語 shadcn/ui 視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
