title: Server-Sent Events
short_definition: 'Server-Sent Events — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A browser API and HTTP streaming format that lets a server continuously push text events to a client over one connection.'
analogy: Server-Sent Events можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Server-Sent Events — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A browser API and HTTP streaming format that lets a server continuously push text events to a client over one connection.'
why_it_matters: Понимание Server-Sent Events помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Server-Sent Events помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Server-Sent Events в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Server-Sent Events доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
