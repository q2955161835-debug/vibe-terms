title: "測試金字塔"
short_definition: "一種測試策略，使用許多快速的低階測試、較少的整合測試和較少數量的較慢的端到端測試。"
analogy: "將測試金字塔視為工作坊測試和除錯部分中的標籤工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "一種測試策略，使用許多快速的低階測試、較少的整合測試和較少數量的較慢的端到端測試。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解測試金字塔讓 Vibe 編碼初學者說出他們想要的確切測試和除錯問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到測試保護階段時，使用測試金字塔作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋測試金字塔如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語測試金字塔視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
