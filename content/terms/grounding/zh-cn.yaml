title: "Grounding（事实依据）"
short_definition: "将模型输出与提供的证据、检索到的来源或经过验证的数据连接起来，从而减少发明主张的可能性。"
analogy: "将 Grounding（事实依据） 视为开发工作台的 AI 与 Vibe Coding 部分中的带标签的工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自于实现。"
mechanism: "将模型输出与提供的证据、检索到的来源或经过验证的数据连接起来，从而减少发明主张的可能性。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解 Grounding（事实依据）可以让 Vibe Coding 初学者准确说明他们关心的 AI 与 Vibe Coding 问题，并要求 AI 编程代理提供行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者达到需求阶段时，使用 Grounding（事实依据）作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释 Grounding（事实依据）如何应用于该项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "把 Grounding（事实依据）误认为模型已经有依据，而不检查实际引用的证据、检索来源、数据流和失败案例。"
