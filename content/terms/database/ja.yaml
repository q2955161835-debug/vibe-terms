title: データベース
short_definition: 構造化されたアプリケーション データを永続的に保存およびクエリするためのシステム。
analogy: すべてのフォルダーを開かなくても記録を見つけることができる、適切にインデックスが付けられたファイリング ルーム。
why_it_matters: 通常、ユーザー アカウント、コンテンツ、進捗状況、製品データには永続的なストレージが必要です。
ai_prompt_example: 最初にテーブルとリレーションシップを設計し、次にアプリケーション コードを記述する前に移行を示します。
common_mistake: データ モデルを使用せずに、巨大な非構造化 JSON ドロワーのようなデータベースを使用します。
status: draft
source_content_version: 1
mechanism: データベースは定められたスキーマとクエリ操作を使ってデータを保存し、検索・更新・整合性検査を再現可能に実行します。
project_example: Vibe Termsではクラウドデータベースを採用せず、静的コンテンツとブラウザ内の学習データだけを扱います。
