title: Agent Memory
short_definition: 'Agent Memory — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Stored information that an agent can retrieve later to maintain useful state beyond the immediate request.'
analogy: Agent Memory можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Agent Memory — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Stored information that an agent can retrieve later to maintain useful state beyond the immediate request.'
why_it_matters: Понимание Agent Memory помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Agent Memory помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Agent Memory в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Agent Memory доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
