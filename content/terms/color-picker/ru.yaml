title: Color Picker
short_definition: 'Color Picker — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A control for selecting a color through a palette, spectrum, swatches, or numeric color values.'
analogy: Color Picker можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Color Picker — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A control for selecting a color through a palette, spectrum, swatches, or numeric color values.'
why_it_matters: Понимание Color Picker помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Color Picker помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Color Picker в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Color Picker доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
