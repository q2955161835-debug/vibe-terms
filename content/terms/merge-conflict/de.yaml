title: Merge Conflict
short_definition: Ein situation wo Git cannot automatically reconcile competing ändert und requires a person oder Werkzeug
  zu choose the intended Ergebnis.
analogy: 'Ein praktisches Bild für Merge Conflict: ein markiertes Werkzeug in git collaboration, dessen Aufschrift die Frage
  schärft, aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein situation wo Git cannot automatically reconcile competing ändert und requires a person oder Werkzeug zu choose
  the intended Ergebnis. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Merge Conflict versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in git collaboration benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Merge Conflict in der Phase environment als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Merge Conflict in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Merge Conflict als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
