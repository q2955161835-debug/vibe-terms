title: Контрактный тест
short_definition: Тест, проверяющий соответствие интерфейса между компонентами или службами согласованному контракту
  запроса, ответа или сообщения.
analogy: 'Проще представить «Контрактный тест» как правило работы в разделе «Тестирование и отладка»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Контрактный тест»: Тест, проверяющий соответствие интерфейса между компонентами или службами
  согласованному контракту запроса, ответа или сообщения. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Контрактный тест» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Контрактный тест» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Контрактный тест». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Контрактный тест» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
