title: GraphQL
short_definition: Eine Abfragesprache und API-Laufzeit, bei der Clients genau die Felder anfordern, die sie aus einem typisierten
  Schema benötigen.
analogy: 'Ein praktischer Vergleich für GraphQL: ein markiertes Werkzeug in Backend & APIs, dessen Zweck erst im Zusammenspiel
  mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine Abfragesprache und API-Laufzeit, bei der Clients genau die Felder anfordern, die sie aus einem typisierten
  Schema benötigen. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab;
  prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer GraphQL versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir GraphQL in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie GraphQL in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff GraphQL als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
