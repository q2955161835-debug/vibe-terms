title: Sanitization
short_definition: 'Sanitization — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Transforming or removing unsafe parts of untrusted input for a specific destination or allowed format.'
analogy: Sanitization можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Sanitization — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Transforming or removing unsafe parts of untrusted input for a specific destination or allowed format.'
why_it_matters: Понимание Sanitization помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Sanitization помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Sanitization в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Sanitization доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
