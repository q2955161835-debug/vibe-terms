title: Shell
short_definition: Ein command interpreter die accepts commands, expands syntax und variables, launches programs, und connects
  their Eingabe und Ausgabe.
analogy: 'Ordne Shell im Bereich computing env als beschriftetes Werkzeug ein: Die Beschriftung grenzt den Prüfbereich ein,
  während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein command interpreter die accepts commands, expands syntax und variables, launches programs, und connects their
  Eingabe und Ausgabe. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab;
  prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Shell versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in computing env benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Shell in der Phase environment als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Shell in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Shell als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
