title: HEAD
short_definition: Git's reference zu the currently checked-out commit oder branch tip.
analogy: Betrachte HEAD als Orientierungsschild in git collaboration. Es weist auf die richtige technische Stelle, ersetzt
  aber weder die Implementierung noch deren Prüfung.
mechanism: Git's reference zu the currently checked-out commit oder branch tip. In einem realen Projekt hängt das genaue Verhalten
  von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer HEAD versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in git collaboration benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient HEAD in der Phase environment als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie HEAD in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff HEAD als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
