title: SQL
short_definition: Язык для определения, запроса и изменения данных в системах реляционных баз данных.
analogy: 'Проще представить «SQL» как правило работы в разделе «Данные и базы данных»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «SQL»: Язык для определения, запроса и изменения данных в системах реляционных баз данных.
  На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «SQL» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «SQL» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «SQL». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «SQL» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
