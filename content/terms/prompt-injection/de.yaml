title: Prompt Injection
short_definition: Ein attack oder Fehlerfall mode in die nicht vertrauenswürdig Inhalte attempts zu override Anweisungen oder
  manipulate an AI System's Verhalten.
analogy: Betrachte Prompt Injection als Orientierungsschild in ai vibe. Es weist auf die richtige technische Stelle, ersetzt
  aber weder die Implementierung noch deren Prüfung.
mechanism: Ein attack oder Fehlerfall mode in die nicht vertrauenswürdig Inhalte attempts zu override Anweisungen oder manipulate
  an AI System's Verhalten. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Prompt Injection versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Prompt Injection in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Prompt Injection in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Prompt Injection als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
