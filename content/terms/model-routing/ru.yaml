title: Маршрутизация моделей
short_definition: Выбор между различными моделями во время выполнения на основе типа задачи, возможностей, стоимости,
  задержки или риска.
analogy: '«Маршрутизация моделей» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не
  заменяет проверку реализации.'
mechanism: 'Как работает «Маршрутизация моделей»: Выбор между различными моделями во время выполнения на основе
  типа задачи, возможностей, стоимости, задержки или риска. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Маршрутизация моделей» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Маршрутизация моделей» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Маршрутизация моделей». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Маршрутизация моделей» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
