title: Git
short_definition: Система контроля версий, которая записывает изменения кода и позволяет безопасно работать
  с ветками.
analogy: Как машина времени для проекта с подписанными точками сохранения.
why_it_matters: ИИ может быстро изменить множество файлов; Git позволяет проверить эти изменения и надёжно
  их отменить.
ai_prompt_example: Создай отдельный небольшой коммит только для этой функции и покажи diff перед продолжением.
common_mistake: Складывать несколько несвязанных изменений ИИ в один огромный коммит.
status: draft
source_content_version: 1
