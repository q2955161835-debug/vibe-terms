title: One-to-one
short_definition: A relationship where each record on either side corresponds to at most one record on the other side.
analogy: 'Think of One-to-one as a labeled tool in the data & databases part of a workshop: the label tells you what problem area to inspect, but the real behavior still comes from the implementation.'
mechanism: A relationship where each record on either side corresponds to at most one record on the other side. In a real project, its exact behavior depends on the surrounding technology, configuration, and data flow, so verify the concrete implementation rather than relying on the label alone.
why_it_matters: Knowing One-to-one lets a Vibe Coding beginner name the exact data & databases concern they mean and ask an AI coding agent for a change plus evidence that the behavior is correct.
project_example: In Vibe Terms, use One-to-one as a vocabulary checkpoint when a learner reaches the data-identity stage; connect the definition to one visible page, file, request, data structure, or verification step rather than teaching it in isolation.
ai_prompt_example: Explain how One-to-one applies to this project. Point to the exact files or system boundary involved, make only the smallest necessary change, and show the command or user flow I can use to verify the result.
common_mistake: Treating the term One-to-one as proof that an implementation is correct without checking actual behavior, data flow, permissions, failure cases, or the relevant test.
quiz:
- question: Which description best matches One-to-one?
  options:
  - A relationship where each record on either side corresponds to at most one record on the other side.
  - A visual decoration that has no effect on software behavior.
  - A guarantee that every implementation is secure and correct.
  answer: 0
- question: When an AI says it used One-to-one, what should you do next?
  options:
  - Accept the label as proof.
  - Check the concrete implementation and verify the relevant behavior.
  - Rename the files so the term appears in the project.
  answer: 1
- question: Which prompt is more useful for working with One-to-one?
  options:
  - “Make One-to-one better.”
  - “Explain where One-to-one appears, change the smallest necessary part, and show how to verify it.”
  - “Rewrite the whole project.”
  answer: 1
