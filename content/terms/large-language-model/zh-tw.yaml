title: "大型語言模型"
short_definition: "在大型文字語料庫上訓練的機器學習模型，用於預測和生成語言並執行許多基於語言的任務。"
analogy: "在 AI 協作中，可以把「大型語言模型」看成一個檢查點：先確認「在大型文字語料庫上訓練的機器學習模型，用於預測和生成語言並執行許多基於語言的任務」，再用實際輸出檢查結果。"
mechanism: "在大型文字語料庫上訓練的機器學習模型，用於預測和生成語言並執行許多基於語言的任務。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解大型語言模型後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「大型語言模型」放進提示、模型輸出或評估紀錄中：檢查重點是「在大型文字語料庫上訓練的機器學習模型，用於預測和生成語言並執行許多基於語言的任務」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「大型語言模型」為例，說明如何實現「在大型文字語料庫上訓練的機器學習模型，用於預測和生成語言並執行許多基於語言的任務」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「大型語言模型」這個名稱就判定已經正確實作；請根據「在大型文字語料庫上訓練的機器學習模型，用於預測和生成語言並執行許多基於語言的任務」檢查實際行為、資料流、錯誤情境與測試結果。"
