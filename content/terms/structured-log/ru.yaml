title: Структурированный журнал
short_definition: Событие журнала, хранящееся в машиночитаемых полях, а не только в тексте произвольной формы.
analogy: 'Проще представить «Структурированный лог» как правило работы в разделе «Тестирование и отладка»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Структурированный лог»: Событие журнала, хранящееся в машиночитаемых полях, а не только
  в тексте произвольной формы. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Структурированный журнал» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Структурированный лог» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Структурированный лог». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Структурированный лог» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
