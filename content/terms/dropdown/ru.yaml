title: Dropdown
short_definition: 'Dropdown — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A floating menu opened from a trigger to expose actions, navigation, or choices that do not need to remain visible.'
analogy: Dropdown можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Dropdown — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A floating menu opened from a trigger to expose actions, navigation, or choices that do not need to remain visible.'
why_it_matters: Понимание Dropdown помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Dropdown помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Dropdown в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Dropdown доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
