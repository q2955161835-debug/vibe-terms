title: Навигация с помощью клавиатуры
short_definition: Возможность доступа к интерактивным функциям и управления ими без использования указывающего устройства.
analogy: '«Навигация с клавиатуры» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не
  заменяет проверку реализации.'
mechanism: 'Как работает «Навигация с клавиатуры»: Возможность доступа к интерактивным функциям и управления ими
  без использования указывающего устройства. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Навигация с помощью клавиатуры» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Навигация с клавиатуры» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Навигация с клавиатуры». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Навигация с клавиатуры» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
