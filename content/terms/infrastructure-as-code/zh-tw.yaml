title: "基礎架構即程式碼"
short_definition: "透過版本化、可審查的程式碼而不是手動主控臺變更來管理基礎設施設定。"
analogy: "將基礎架構即程式碼視為工作坊部署和操作部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自於實作。"
mechanism: "透過版本化、可審查的程式碼而不是手動主控臺變更來管理基礎架構設定。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解基礎架構即程式碼後，Vibe Coding 初學者可以準確指出相關的部署與維運問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在 Vibe 術語中，當學習者到達部署維護階段時，使用基礎設施即程式碼作為術語檢查點；將定義對應到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋基礎架構即程式碼如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「基礎設施即程式碼」視為實作正確的證據，而無需檢查實際行為、資料流、權限、故障案例或相關測試。"
