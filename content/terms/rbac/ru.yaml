title: РБАК
short_definition: Управление доступом на основе ролей, при котором разрешения назначаются ролям, а пользователи
  или службы получают разрешения через эти роли.
analogy: '«RBAC» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно проверить.'
mechanism: 'Как работает «RBAC»: Управление доступом на основе ролей, при котором разрешения назначаются ролям,
  а пользователи или службы получают разрешения через эти роли. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «РБАК» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «RBAC» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «RBAC». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «RBAC» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
