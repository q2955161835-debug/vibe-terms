title: Grounding
short_definition: Verknüpfung der Modellausgabe mit bereitgestellten Beweisen, abgerufenen Quellen oder verifizierten Daten,
  sodass die Wahrscheinlichkeit geringer ist, dass Behauptungen erfunden werden.
analogy: 'Für Grounding hilft ein Bild aus KI & Vibe Coding: Das Etikett weist auf das Problemfeld, ersetzt aber weder den Code
  noch die Prüfung des Datenflusses.'
mechanism: Verknüpfung der Modellausgabe mit bereitgestellten Beweisen, abgerufenen Quellen oder verifizierten Daten, sodass
  die Wahrscheinlichkeit geringer ist, dass Behauptungen erfunden werden. In einem realen Projekt hängt die genaue Ausprägung
  von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Grounding versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in KI & Vibe Coding benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Grounding in der Phase Anforderungen als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Grounding in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Grounding als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
