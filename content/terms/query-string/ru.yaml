title: Строка запроса
short_definition: Часть URL-адреса после `?`, которая передает именованные параметры серверному или клиентскому
  приложению.
analogy: '«Строка запроса» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Строка запроса»: Часть URL-адреса после `?`, которая передает именованные параметры серверному
  или клиентскому приложению. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Строка запроса» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Строка запроса» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Строка запроса». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Строка запроса» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
