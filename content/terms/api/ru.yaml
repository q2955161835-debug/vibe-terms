title: API
short_definition: Определённый способ, с помощью которого одна программа запрашивает данные или действие
  у другой.
analogy: Меню показывает, что можно заказать, не заходя на кухню ресторана.
why_it_matters: При программировании с ИИ через API часто связывают фронтенд, базы данных, поставщиков
  моделей и внешние сервисы.
ai_prompt_example: 'До реализации опиши контракт GET /api/terms: параметры запроса, поля ответа и возможные
  ошибки.'
common_mistake: Путать контракт API с внутренним кодом, который этот контракт реализует.
status: draft
source_content_version: 1
