title: Short-Term Memory
short_definition: 'Short-Term Memory — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Temporary task state used during a session or workflow and usually discarded or summarized afterward.'
analogy: Short-Term Memory можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Short-Term Memory — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Temporary task state used during a session or workflow and usually discarded or summarized afterward.'
why_it_matters: Понимание Short-Term Memory помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Short-Term Memory помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Short-Term Memory в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Short-Term Memory доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
