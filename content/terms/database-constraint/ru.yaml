title: Database Constraint
short_definition: 'Database Constraint — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A database-enforced rule that prevents invalid data states, such as required values or invalid relationships.'
analogy: Database Constraint можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Database Constraint — термин из раздела «Данные и базы данных». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A database-enforced rule that prevents invalid data states, such as required values or invalid relationships.'
why_it_matters: Понимание Database Constraint помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Database Constraint помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Database Constraint в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Database Constraint доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
