title: OAuth
short_definition: Ein authorization Framework die lets a Benutzer grant eine Anwendung begrenzte Zugriff zu another Dienst
  ohne sharing the Benutzer's password.
analogy: 'Für OAuth hilft ein Vergleich mit einem Werkzeug aus Sicherheit & Datenschutz: Sein Etikett nennt das Problemfeld;
  verlässlich wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein authorization Framework die lets a Benutzer grant eine Anwendung begrenzte Zugriff zu another Dienst ohne sharing
  the Benutzer's password. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer OAuth versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient OAuth in der Phase test protect als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie OAuth in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff OAuth als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
