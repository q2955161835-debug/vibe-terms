title: Lint
short_definition: 'Lint — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Static analysis that checks source code for suspicious patterns, style violations, or common mistakes without running the program.'
analogy: Lint можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Lint — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Static analysis that checks source code for suspicious patterns, style violations, or common mistakes without running the program.'
why_it_matters: Понимание Lint помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Lint помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Lint в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Lint доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
