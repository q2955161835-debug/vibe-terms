title: Eindeutiger Schlüssel
short_definition: Ein Datenbank Regel ensuring die a Wert oder combination von Werte does not repeat across Datensätze.
analogy: 'Für Eindeutiger Schlüssel hilft ein Vergleich mit einem Werkzeug aus data databases: Sein Etikett nennt das Problemfeld;
  verlässlich wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein Datenbank Regel ensuring die a Wert oder combination von Werte does not repeat across Datensätze. In einem
  realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Eindeutiger Schlüssel versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in data databases benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Eindeutiger Schlüssel in der Phase data identity als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Eindeutiger Schlüssel in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Eindeutiger Schlüssel als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
