title: Kubernetes
short_definition: Система оркестрации контейнеров для развертывания, масштабирования, работы в сети, обновления
  и восстановления контейнеризованных рабочих нагрузок.
analogy: '«Kubernetes» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно
  проверить.'
mechanism: 'Как работает «Kubernetes»: Система оркестрации контейнеров для развертывания, масштабирования, работы
  в сети, обновления и восстановления контейнеризованных рабочих нагрузок. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Kubernetes» помогает точно назвать проблему в области «Развертывание и эксплуатация», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Kubernetes» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Kubernetes». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Kubernetes» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
