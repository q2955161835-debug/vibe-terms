title: Testgetriebene Entwicklung
short_definition: Ein Entwicklungsworkflow, der zuerst einen fehlgeschlagenen Test schreibt, den mindestens zu bestehenden
  Code implementiert und dann umgestaltet, während die Tests grün bleiben.
analogy: 'Für Testgetriebene Entwicklung hilft ein Bild aus Testen & Debugging: Das Etikett weist auf das Problemfeld, ersetzt
  aber weder den Code noch die Prüfung des Datenflusses.'
mechanism: Ein Entwicklungsworkflow, der zuerst einen fehlgeschlagenen Test schreibt, den mindestens zu bestehenden Code implementiert
  und dann umgestaltet, während die Tests grün bleiben. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Testgetriebene Entwicklung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Testen & Debugging
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Testgetriebene Entwicklung in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Testgetriebene Entwicklung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien
  oder Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Testgetriebene Entwicklung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
