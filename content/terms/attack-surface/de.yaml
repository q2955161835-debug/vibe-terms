title: Angriffsfläche
short_definition: Die Sammlung erreichbarer Schnittstellen, Eingaben, Berechtigungen und Komponenten, über die ein System
  angegriffen werden könnte.
analogy: Betrachte Angriffsfläche als Orientierung in Sicherheit & Datenschutz. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Die Sammlung erreichbarer Schnittstellen, Eingaben, Berechtigungen und Komponenten, über die ein System angegriffen
  werden könnte. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Angriffsfläche versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Angriffsfläche in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Angriffsfläche in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Angriffsfläche als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
