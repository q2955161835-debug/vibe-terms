title: "CLI"
short_definition: "命令列介面，允許使用者透過鍵入命令和選項而不是使用圖形介面來控制程式。"
analogy: "在開發環境裡，「CLI」像一個可重複使用的工作零件；重點是理解「命令列介面，允許使用者透過鍵入命令和選項而不是使用圖形介面來控制程式」如何影響執行結果。"
mechanism: "命令列介面，允許使用者透過鍵入命令和選項而不是使用圖形介面來控制程式。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 CLI 後，Vibe Coding 初學者可以準確指出相關的電腦與開發環境問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「CLI」放進命令列、設定檔或建置結果中：檢查重點是「命令列介面，允許使用者透過鍵入命令和選項而不是使用圖形介面來控制程式」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「CLI」為例，說明如何實現「命令列介面，允許使用者透過鍵入命令和選項而不是使用圖形介面來控制程式」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「CLI」這個名稱就判定已經正確實作；請根據「命令列介面，允許使用者透過鍵入命令和選項而不是使用圖形介面來控制程式」檢查實際行為、資料流、錯誤情境與測試結果。"
