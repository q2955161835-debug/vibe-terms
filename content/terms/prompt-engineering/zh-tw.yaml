title: "提示工程"
short_definition: "設計提示、範例、限制和輸出格式以提高模型回應的可靠性。"
analogy: "在 AI 協作中，可以把「提示工程」看成一個檢查點：先確認「設計提示、範例、限制和輸出格式以提高模型回應的可靠性」，再用實際輸出檢查結果。"
mechanism: "設計提示、範例、限制和輸出格式以提高模型回應的可靠性。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解提示工程後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「提示工程」放進提示、模型輸出或評估紀錄中：檢查重點是「設計提示、範例、限制和輸出格式以提高模型回應的可靠性」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「提示工程」為例，說明如何實現「設計提示、範例、限制和輸出格式以提高模型回應的可靠性」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「提示工程」這個名稱就判定已經正確實作；請根據「設計提示、範例、限制和輸出格式以提高模型回應的可靠性」檢查實際行為、資料流、錯誤情境與測試結果。"
