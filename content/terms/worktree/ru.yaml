title: Worktree
short_definition: 'Worktree — термин из раздела «Git и совместная работа». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A Git feature that checks out an additional working tree from the same repository so multiple branches can be worked on simultaneously.'
analogy: Worktree можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Worktree — термин из раздела «Git и совместная работа». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A Git feature that checks out an additional working tree from the same repository so multiple branches can be worked on simultaneously.'
why_it_matters: Понимание Worktree помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Worktree помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Worktree в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Worktree доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
