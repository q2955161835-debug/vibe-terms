title: Привязка к источникам (Grounding)
short_definition: Связывание результатов модели с предоставленными доказательствами, источниками или проверенными
  данными, чтобы снизить вероятность появления неподтвержденных утверждений.
analogy: '«Grounding» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно
  проверить.'
mechanism: 'Как работает «Grounding»: Результат модели связывается с предоставленными доказательствами, источниками
  или проверенными данными, чтобы снизить вероятность появления неподтвержденных утверждений. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Привязка к источникам (Grounding)» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Grounding» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Grounding». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Grounding» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
