title: API-Gateway
short_definition: Ein Dienst placed in front von APIs zu centralize routing, authentication, rate Grenzen, observability,
  oder Protokoll translation.
analogy: 'Für API-Gateway hilft ein Vergleich mit einem Werkzeug aus Backend & APIs: Sein Etikett nennt das Problemfeld; verlässlich
  wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein Dienst placed in front von APIs zu centralize routing, authentication, rate Grenzen, observability, oder Protokoll
  translation. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer API-Gateway versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient API-Gateway in der Phase Daten & Identität als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie API-Gateway in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff API-Gateway als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
