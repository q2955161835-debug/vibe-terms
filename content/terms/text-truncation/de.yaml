title: Textkürzung
short_definition: Beschränken Sie den sichtbaren Text auf einen festen Bereich, häufig mithilfe von Ausschnitten oder Auslassungspunkten,
  und behalten Sie bei Bedarf den Zugriff auf den vollen Wert bei.
analogy: 'Für Textkürzung hilft ein Bild aus Frontend-Entwicklung: Das Etikett weist auf das Problemfeld, ersetzt aber weder
  den Code noch die Prüfung des Datenflusses.'
mechanism: Beschränken Sie den sichtbaren Text auf einen festen Bereich, häufig mithilfe von Ausschnitten oder Auslassungspunkten,
  und behalten Sie bei Bedarf den Zugriff auf den vollen Wert bei. In einem realen Projekt hängt die genaue Ausprägung von
  Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Textkürzung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Textkürzung in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Textkürzung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Textkürzung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
