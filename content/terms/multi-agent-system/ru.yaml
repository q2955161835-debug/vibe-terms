title: Multi-agent System
short_definition: 'Multi-agent System — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A system where multiple agents with separate roles or contexts coordinate to solve a larger task.'
analogy: Multi-agent System можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Multi-agent System — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A system where multiple agents with separate roles or contexts coordinate to solve a larger task.'
why_it_matters: Понимание Multi-agent System помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Multi-agent System помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Multi-agent System в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Multi-agent System доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
