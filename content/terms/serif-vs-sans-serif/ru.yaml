title: Serif vs Sans Serif
short_definition: 'Serif vs Sans Serif — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Two broad typeface categories distinguished by the presence or absence of finishing strokes on letterforms.'
analogy: Serif vs Sans Serif можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Serif vs Sans Serif — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Two broad typeface categories distinguished by the presence or absence of finishing strokes on letterforms.'
why_it_matters: Понимание Serif vs Sans Serif помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Serif vs Sans Serif помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Serif vs Sans Serif в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Serif vs Sans Serif доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
