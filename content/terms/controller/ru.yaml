title: Контроллер
short_definition: Уровень приложения, который преобразует входящие запросы в вызовы бизнес-логики и отображает результаты
  в ответы.
analogy: 'Проще представить «Controller» как правило работы в разделе «Бэкенд и API»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Controller»: Уровень приложения, который преобразует входящие запросы в вызовы бизнес-логики
  и отображает результаты в ответы. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Контроллер» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Controller» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Controller». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Controller» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
