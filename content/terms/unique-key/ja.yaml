title: Unique Key
short_definition: 'Unique Key は「データとデータベース」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A database rule ensuring that a value or combination of values does not repeat across records.'
analogy: Unique Key は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'Unique Key は「データとデータベース」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: A database rule ensuring that a value or combination of values does not repeat across records.'
why_it_matters: Unique Key を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: Unique Key を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
ai_prompt_example: このプロジェクトで Unique Key がどのように関係するか説明してください。対象ファイルまたは境界を示し、必要最小限の変更と確認手順を提示してください。
common_mistake: Unique Key という名前だけで実装が正しいと判断し、実際の動作・データフロー・失敗時の挙動を確認しないことです。
