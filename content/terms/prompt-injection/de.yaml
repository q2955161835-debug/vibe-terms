title: Prompt Injection
short_definition: Ein Angriffs- oder Fehlermodus, bei dem nicht vertrauenswürdige Inhalte versuchen, Anweisungen außer Kraft
  zu setzen oder das Verhalten eines KI-Systems zu manipulieren.
analogy: Betrachte Schnelle Injektion als Orientierung in KI & Vibe Coding. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Ein Angriffs- oder Fehlermodus, bei dem nicht vertrauenswürdige Inhalte versuchen, Anweisungen außer Kraft zu setzen
  oder das Verhalten eines KI-Systems zu manipulieren. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Schnelle Injektion versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in KI & Vibe Coding benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Schnelle Injektion in der Phase Anforderungen als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Schnelle Injektion in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Schnelle Injektion als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
