title: "产品路线图"
short_definition: "以时间为导向的产品方向和预期结果的视图，传达优先级，而不是将每个项目变成固定的承诺。"
analogy: "可以把“产品路线图”看成产品与需求里的一个概念标签：它提醒你先找“以时间为导向的产品方向和预期结果的视图，传达优先级，而不是将每个项目变成固定的承诺。”对应的实现，最后仍要以代码、配置和实际行为为准。"
mechanism: "实现上，这一概念会围绕“以时间为导向的产品方向和预期结果的视图，传达优先级，而不是将每个项目变成固定的承诺。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“产品路线图”后，你能更准确地描述产品与需求里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的定义需求阶段，可以把“产品路线图”放到一个真实项目中：围绕“以时间为导向的产品方向和预期结果的视图，传达优先级，而不是将每个项目变成固定的承诺。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“产品路线图”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“以时间为导向的产品方向和预期结果的视图，传达优先级，而不是将每个项目变成固定的承诺”。"
common_mistake: "不要把“产品路线图”这个名称当成正确性的证明；请检查实际行为、数据流、权限、失败场景和相关测试。"
