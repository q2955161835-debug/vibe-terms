title: Отслеживание событий
short_definition: Запись определенных пользовательских или системных событий с согласованными свойствами, чтобы
  поведение можно было проанализировать позже.
analogy: 'Представьте «Отслеживание событий» как инструмент в наборе разработчика: он решает задачу в области «Продукт
  и требования», но результат зависит от настройки.'
mechanism: 'Как работает «Отслеживание событий»: Запись определенных пользовательских или системных событий с согласованными
  свойствами, чтобы поведение можно было проанализировать позже. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Отслеживание событий» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Отслеживание событий» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Отслеживание событий». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Отслеживание событий» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
