title: レコード
short_definition: データセット内のエンティティ、イベント、事実を表す、1件の保存済みデータ。
analogy: レコードは、データとデータベースの課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: レコードは識別子と複数のフィールドを持つ保存単位で、データベースの行やドキュメントとして読み書きされます。実際のプロジェクトでは、スキーマと一意性の扱いを確認してください。
why_it_matters: レコードを知ると、Vibe Coding初心者でも、データとデータベースの課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、レコードをデータと認証をつなぐ段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトでレコードがどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「レコード」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
