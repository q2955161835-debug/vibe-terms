title: "输入清理（Sanitization）"
short_definition: "转换或删除特定目标或允许格式的不受信任输入的不安全部分。"
analogy: "将消毒视为开发工作台安全和隐私部分中的带标签的工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自于实现。"
mechanism: "转换或删除特定目标或允许格式的不受信任输入的不安全部分。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解清理后，Vibe Coding 初学者可以准确说出他们所指的安全和隐私问题，并要求 AI 编程代理进行更改以及证明行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者达到测试保护阶段时，使用清理作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释清理如何应用于该项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将术语清理视为实现正确的证据，而不检查实际行为、数据流、权限、失败案例或相关测试。"
