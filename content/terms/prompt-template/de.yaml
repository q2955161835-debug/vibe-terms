title: Prompt-Template
short_definition: Eine wiederverwendbare Eingabeaufforderungsstruktur mit Platzhaltern, die zur Laufzeit mit aufgabenspezifischen
  Werten gefüllt werden.
analogy: 'Ein praktischer Vergleich für Eingabeaufforderungsvorlage: ein markiertes Werkzeug in KI & Vibe Coding, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine wiederverwendbare Eingabeaufforderungsstruktur mit Platzhaltern, die zur Laufzeit mit aufgabenspezifischen
  Werten gefüllt werden. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Eingabeaufforderungsvorlage versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in KI & Vibe Coding
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Eingabeaufforderungsvorlage in der Phase Anforderungen als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Eingabeaufforderungsvorlage in diesem Projekt angewendet wird. Nenne die betroffenen Dateien
  oder Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Eingabeaufforderungsvorlage als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
