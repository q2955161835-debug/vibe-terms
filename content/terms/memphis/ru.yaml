title: Memphis
short_definition: 'Memphis — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A postmodern visual style using energetic geometric shapes, squiggles, dots, and contrasting colors.'
analogy: Memphis можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Memphis — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A postmodern visual style using energetic geometric shapes, squiggles, dots, and contrasting colors.'
why_it_matters: Понимание Memphis помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Memphis помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Memphis в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Memphis доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
