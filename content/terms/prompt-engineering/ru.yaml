title: Промпт-инжиниринг
short_definition: Разработка подсказок, примеров, ограничений и выходных форматов для повышения надежности ответов
  модели.
analogy: 'Представьте «Промпт-инжиниринг» как инструмент в наборе разработчика: он решает задачу в области «ИИ и
  Vibe Coding», но результат зависит от настройки.'
mechanism: 'Как работает «Промпт-инжиниринг»: Разработка подсказок, примеров, ограничений и выходных форматов для
  повышения надежности ответов модели. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Промпт-инжиниринг» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Промпт-инжиниринг» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Промпт-инжиниринг». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Промпт-инжиниринг» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
