title: Karte
short_definition: Ein begrenzter UI-Container, der verwandte Informationen und Aktionen in einer wiederverwendbaren visuellen
  Einheit gruppiert.
analogy: Betrachte Karte als Orientierung in UI/UX & Barrierefreiheit. Die Bezeichnung führt zur richtigen technischen Stelle,
  garantiert aber noch keine gute Umsetzung.
mechanism: Ein begrenzter UI-Container, der verwandte Informationen und Aktionen in einer wiederverwendbaren visuellen Einheit
  gruppiert. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Karte versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Karte in der Phase Design als Lerncheckpoint. Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Karte in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Karte als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
