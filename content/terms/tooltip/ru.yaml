title: Tooltip
short_definition: 'Tooltip — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A short contextual label or explanation shown near an element on hover or keyboard focus.'
analogy: Tooltip можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Tooltip — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A short contextual label or explanation shown near an element on hover or keyboard focus.'
why_it_matters: Понимание Tooltip помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Tooltip помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Tooltip в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Tooltip доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
