title: Merge-Konflikt
short_definition: Eine Situation, in der Git konkurrierende Änderungen nicht automatisch abgleichen kann und eine Person oder
  ein Tool benötigt, um das gewünschte Ergebnis auszuwählen.
analogy: 'Ein praktischer Vergleich für Konflikt zusammenführen: ein markiertes Werkzeug in Git & Zusammenarbeit, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine Situation, in der Git konkurrierende Änderungen nicht automatisch abgleichen kann und eine Person oder ein
  Tool benötigt, um das gewünschte Ergebnis auszuwählen. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Konflikt zusammenführen versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Git & Zusammenarbeit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Konflikt zusammenführen in der Phase Umgebung als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Konflikt zusammenführen in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Konflikt zusammenführen als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
