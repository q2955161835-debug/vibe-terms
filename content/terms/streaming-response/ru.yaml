title: Потоковый ответ
short_definition: Ответ доставляется частями по мере его создания, а не после завершения всего ответа.
analogy: '«Потоковый ответ» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Потоковый ответ»: Ответ доставляется частями по мере его создания, а не после завершения
  всего ответа. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Потоковый ответ» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Потоковый ответ» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Потоковый ответ». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Потоковый ответ» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
