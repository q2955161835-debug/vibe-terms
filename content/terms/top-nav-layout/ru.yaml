title: Верхний макет навигации
short_definition: Структура страницы, в которой основная навигация находится вверху, а основной контент заполняет
  область ниже.
analogy: 'Представьте «Верхняя навигация» как инструмент в наборе разработчика: он решает задачу в области «UI/UX
  и доступность», но результат зависит от настройки.'
mechanism: 'Как работает «Верхняя навигация»: Структура страницы, в которой основная навигация находится вверху,
  а основной контент заполняет область ниже. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Верхний макет навигации» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Верхняя навигация» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Верхняя навигация». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Верхняя навигация» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
