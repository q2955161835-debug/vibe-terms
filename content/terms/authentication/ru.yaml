title: Аутентификация
short_definition: Процесс подтверждения того, кто является пользователем.
analogy: 'Представьте «Authentication» как инструмент в наборе разработчика: он решает задачу в области «Безопасность
  и приватность», но результат зависит от настройки.'
mechanism: 'Как работает «Authentication»: Процесс подтверждения того, кто является пользователем. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Аутентификация» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Authentication» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Authentication». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Authentication» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
