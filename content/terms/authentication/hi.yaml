title: प्रमाणीकरण
short_definition: यह साबित करने की प्रक्रिया कि उपयोगकर्ता वास्तव में वही है जो वह होने का दावा करता है।
analogy: प्रवेश द्वार पर पहचान पत्र दिखाने जैसा, ताकि सिस्टम जान सके कि कौन-सा खाता आपका है।
why_it_matters: लॉगिन सुरक्षा-संवेदनशील है, इसलिए एआई को मनमाना प्रमाणीकरण तरीका नहीं बनाना चाहिए।
ai_prompt_example: मौजूदा प्रमाणीकरण प्रदाता का उपयोग करो और अनुमति की जाँच सर्वर पर रखो। अपना पासवर्ड
  सिस्टम मत बनाओ।
common_mistake: प्रमाणीकरण “आप कौन हैं?” और प्राधिकरण “आप क्या कर सकते हैं?” को एक समझ लेना।
