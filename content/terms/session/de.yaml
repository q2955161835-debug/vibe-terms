title: Sitzung
short_definition: Server- oder Clientstatus, der eine Folge von Anforderungen mit derselben authentifizierten oder laufenden
  Interaktion verknüpft.
analogy: 'Ordne Sitzung im Bereich Sicherheit & Datenschutz als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch erst
  die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Server- oder Clientstatus, der eine Folge von Anforderungen mit derselben authentifizierten oder laufenden Interaktion
  verknüpft. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Sitzung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Sitzung in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Sitzung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Sitzung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
