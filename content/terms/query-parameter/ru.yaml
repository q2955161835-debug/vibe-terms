title: Параметр запроса
short_definition: Именованное значение, закодированное в строке запроса URL-адреса, обычно используемое для фильтров,
  сортировки, поиска или дополнительных настроек запроса.
analogy: '«Параметр запроса» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Параметр запроса»: Именованное значение, закодированное в строке запроса URL-адреса, обычно
  используемое для фильтров, сортировки, поиска или дополнительных настроек запроса. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Параметр запроса» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Параметр запроса» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Параметр запроса». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Параметр запроса» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
