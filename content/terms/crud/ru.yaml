title: CRUD
short_definition: 'Четыре основные операции с данными: создание, чтение, обновление и удаление.'
analogy: 'Представьте «CRUD» как инструмент в наборе разработчика: он решает задачу в области «Бэкенд и API», но
  результат зависит от настройки.'
mechanism: 'Как работает «CRUD»: Четыре основные операции с данными: создание, чтение, обновление и удаление. На
  практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «CRUD» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «CRUD» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «CRUD». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «CRUD» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
