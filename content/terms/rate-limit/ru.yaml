title: Ограничение скорости
short_definition: Установленное поставщиком ограничение на количество запросов или токенов, которые могут быть обработаны
  в течение временного окна.
analogy: 'Проще представить «Лимит запросов» как правило работы в разделе «ИИ и Vibe Coding»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Лимит запросов»: Установленное поставщиком ограничение на количество запросов или токенов,
  которые могут быть обработаны в течение временного окна. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Ограничение скорости» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Лимит запросов» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Лимит запросов». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Лимит запросов» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
