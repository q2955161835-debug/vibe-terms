title: "整合測試"
short_definition: "驗證多個真實元件或邊界是否正確協同工作的測試。"
analogy: "在測試與除錯中，「整合測試」像用來定位問題的檢查工具：它關注「驗證多個真實元件或邊界是否正確協同工作的測試」，結論要以測試結果支持。"
mechanism: "驗證多個真實元件或邊界正確協同工作的測試。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解整合測試後，Vibe Coding 初學者可以準確指出相關的測試與除錯問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「整合測試」放進測試案例、錯誤訊息或除錯紀錄中：檢查重點是「驗證多個真實元件或邊界是否正確協同工作的測試」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「整合測試」為例，說明如何實現「驗證多個真實元件或邊界是否正確協同工作的測試」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「整合測試」這個名稱就判定已經正確實作；請根據「驗證多個真實元件或邊界是否正確協同工作的測試」檢查實際行為、資料流、錯誤情境與測試結果。"
