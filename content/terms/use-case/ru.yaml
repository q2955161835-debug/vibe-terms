title: Вариант использования
short_definition: Структурированное описание того, как действующее лицо и система взаимодействуют для достижения
  цели, включая важные альтернативы или неудачи.
analogy: '«Сценарий использования» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не
  заменяет проверку реализации.'
mechanism: 'Как работает «Сценарий использования»: Структурированное описание того, как действующее лицо и система
  взаимодействуют для достижения цели, включая важные альтернативы или неудачи. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Вариант использования» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Сценарий использования» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Сценарий использования». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Сценарий использования» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
