title: "檔案資料庫"
short_definition: "將記錄儲存為靈活的文件結構（通常是類似 JSON 的物件）的資料庫。"
analogy: "在資料流程中，「檔案資料庫」像整理資料的規則：它描述「將記錄儲存為靈活的文件結構（通常是類似 JSON 的物件）的資料庫」，需要用實際資料與查詢結果驗證。"
mechanism: "將記錄儲存為靈活的文件結構（通常是類似 JSON 的物件）的資料庫。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解檔案資料庫後，Vibe Coding 初學者可以準確指出相關的資料與資料庫問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「檔案資料庫」放進資料表、查詢或一筆資料中：檢查重點是「將記錄儲存為靈活的文件結構（通常是類似 JSON 的物件）的資料庫」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「檔案資料庫」為例，說明如何實現「將記錄儲存為靈活的文件結構（通常是類似 JSON 的物件）的資料庫」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「檔案資料庫」這個名稱就判定已經正確實作；請根據「將記錄儲存為靈活的文件結構（通常是類似 JSON 的物件）的資料庫」檢查實際行為、資料流、錯誤情境與測試結果。"
