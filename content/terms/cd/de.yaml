title: CD
short_definition: 'Continuous delivery oder continuous Deployment: automating the Pfad aus a validated ändern zu a releasable
  oder automatically released Version.'
analogy: 'Ein praktisches Bild für CD: ein markiertes Werkzeug in deployment operations, dessen Aufschrift die Frage schärft,
  aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: 'Continuous delivery oder continuous Deployment: automating the Pfad aus a validated ändern zu a releasable oder
  automatically released Version. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.'
why_it_matters: Wer CD versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in deployment operations benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient CD in der Phase deploy maintain als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie CD in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere
  nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff CD als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
