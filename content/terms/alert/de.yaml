title: Warnhinweis
short_definition: Ein persistent oder prominent Nachricht die communicates wichtig Status, warning, Fehler, oder informational
  Kontext.
analogy: 'Ordne Warnhinweis im Bereich UI/UX & Barrierefreiheit als beschriftetes Werkzeug ein: Die Beschriftung grenzt den
  Prüfbereich ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein persistent oder prominent Nachricht die communicates wichtig Status, warning, Fehler, oder informational Kontext.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Warnhinweis versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Warnhinweis in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Warnhinweis in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Warnhinweis als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
