title: Таблица базы данных
short_definition: Структура реляционной базы данных, в которой хранятся строки с определенным набором столбцов.
analogy: 'Проще представить «Таблица базы данных» как правило работы в разделе «Данные и базы данных»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Таблица базы данных»: Структура реляционной базы данных, в которой хранятся строки с определенным
  набором столбцов. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код
  и наблюдаемый результат.'
why_it_matters: Понимание термина «Таблица базы данных» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Таблица базы данных» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Таблица базы данных». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Таблица базы данных» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
