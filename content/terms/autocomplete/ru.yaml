title: AutoComplete
short_definition: 'AutoComplete — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A text input that shows suggestions as the user types to speed selection or entry.'
analogy: AutoComplete можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'AutoComplete — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A text input that shows suggestions as the user types to speed selection or entry.'
why_it_matters: Понимание AutoComplete помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание AutoComplete помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль AutoComplete в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название AutoComplete доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
