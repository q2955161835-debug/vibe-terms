title: Сегментированное управление
short_definition: Компактный ряд взаимоисключающих опций, используемый для переключения между несколькими тесно
  связанными режимами или представлениями.
analogy: 'Проще представить «Segmented Control» как правило работы в разделе «UI/UX и доступность»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Segmented Control»: Компактный ряд взаимоисключающих опций, используемый для переключения
  между несколькими тесно связанными режимами или представлениями. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Сегментированное управление» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Segmented Control» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Segmented Control». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Segmented Control» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
