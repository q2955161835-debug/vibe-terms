title: Модальный
short_definition: Диалоговое окно, расположенное над текущей страницей, которое временно требует целенаправленного
  взаимодействия, прежде чем вернуться к основному контексту.
analogy: '«Modal» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Modal»: Диалоговое окно, расположенное над текущей страницей, которое временно требует
  целенаправленного взаимодействия, прежде чем вернуться к основному контексту. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Модальный» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Modal» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Modal». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Modal» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
