title: Семантическое версионирование
short_definition: Соглашение о нумерации версий с использованием основных, второстепенных номеров и номеров исправлений
  для обозначения совместимости и области изменений.
analogy: '«Семантическое версионирование» похож на маршрутную отметку в проекте: она помогает найти нужное место,
  но не заменяет проверку реализации.'
mechanism: 'Как работает «Семантическое версионирование»: Соглашение о нумерации версий с использованием основных,
  второстепенных номеров и номеров исправлений для обозначения совместимости и области изменений. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Семантическое версионирование» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Семантическое версионирование» в одном пользовательском потоке или
  тесте, зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Семантическое версионирование». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Семантическое версионирование» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
