title: System Prompt
short_definition: 'System Prompt — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: High-priority instructions supplied by an application to define an AI assistant''s role, behavior, and constraints.'
analogy: System Prompt можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'System Prompt — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: High-priority instructions supplied by an application to define an AI assistant''s role, behavior, and constraints.'
why_it_matters: Понимание System Prompt помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание System Prompt помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль System Prompt в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название System Prompt доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
