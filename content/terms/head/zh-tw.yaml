title: "HEAD"
short_definition: "Git 對目前簽出的提交或分支提示的引用。"
analogy: "在 Git 協作中，可把「HEAD」想成變更管理上的一個記錄點：它關乎「Git 對目前簽出的提交或分支提示的引用」，仍需檢查實際差異與歷史。"
mechanism: "Git 對目前簽出的提交或分支提示的引用。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 HEAD 後，Vibe Coding 初學者可以準確指出相關的 Git 與協作問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立環境階段，將「HEAD」放進提交、分支或差異檔中：檢查重點是「Git 對目前簽出的提交或分支提示的引用」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「HEAD」為例，說明如何實現「Git 對目前簽出的提交或分支提示的引用」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「HEAD」這個名稱就判定已經正確實作；請根據「Git 對目前簽出的提交或分支提示的引用」檢查實際行為、資料流、錯誤情境與測試結果。"
