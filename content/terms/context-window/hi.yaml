title: संदर्भ विंडो
short_definition: टेक्स्ट और अन्य इनपुट की वह सीमित मात्रा जिसे मॉडल एक समय में देख और समझ सकता है।
analogy: काम की मेज़ की तरह; मेज़ भर जाए तो नई फ़ाइल रखने से पहले पुरानी हटानी पड़ती है।
why_it_matters: लंबे कोडिंग सत्र में महत्वपूर्ण आवश्यकताएँ मॉडल के सक्रिय संदर्भ से बाहर हो सकती हैं।
ai_prompt_example: आगे बढ़ने से पहले मौजूदा आर्किटेक्चर, सीमाएँ, पूरा हुआ काम और अगला कार्य संक्षेप में
  बताओ।
common_mistake: यह मान लेना कि मॉडल हर पुरानी फ़ाइल और निर्णय हमेशा याद रखता है।
