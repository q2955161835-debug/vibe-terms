title: Constraint
short_definition: 'Constraint — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A boundary the solution must respect, such as a platform, budget, compliance rule, performance limit, or fixed integration.'
analogy: Constraint можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Constraint — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A boundary the solution must respect, such as a platform, budget, compliance rule, performance limit, or fixed integration.'
why_it_matters: Понимание Constraint помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Constraint помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Constraint в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Constraint доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
