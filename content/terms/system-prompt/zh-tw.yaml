title: "系統提示"
short_definition: "由應用程式提供的高優先指令，用於定義 AI 助手的角色、行為和約束。"
analogy: "在 AI 協作中，可以把「系統提示」看成一個檢查點：先確認「由應用程式提供的高優先指令，用於定義 AI 助手的角色、行為和約束」，再用實際輸出檢查結果。"
mechanism: "應用程式提供的高優先權指令，用於定義 AI 助手的角色、行為和約束。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解系統提示後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「系統提示」放進提示、模型輸出或評估紀錄中：檢查重點是「由應用程式提供的高優先指令，用於定義 AI 助手的角色、行為和約束」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「系統提示」為例，說明如何實現「由應用程式提供的高優先指令，用於定義 AI 助手的角色、行為和約束」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「系統提示」這個名稱就判定已經正確實作；請根據「由應用程式提供的高優先指令，用於定義 AI 助手的角色、行為和約束」檢查實際行為、資料流、錯誤情境與測試結果。"
