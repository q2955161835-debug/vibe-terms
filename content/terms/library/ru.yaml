title: Библиотека
short_definition: Многоразовый код, который приложение вызывает для выполнения определенного набора задач.
analogy: 'Проще представить «Library» как правило работы в разделе «Компьютеры и среда разработки»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Library»: Многоразовый код, который приложение вызывает для выполнения определенного набора
  задач. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Библиотека» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Library» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Library». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Library» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
