title: "行为驱动开发"
short_definition: "一种开发方法，描述跨技术和产品角色共享的示例和场景中的预期系统行为。"
analogy: "可以把“行为驱动开发”看成测试与调试里的一个概念标签：它提醒你先找“一种开发方法，描述跨技术和产品角色共享的示例和场景中的预期系统行为。”对应的实现，最后仍要以代码、配置和实际行为为准。"
mechanism: "实现上，这一概念会围绕“一种开发方法，描述跨技术和产品角色共享的示例和场景中的预期系统行为。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“行为驱动开发”后，你能更准确地描述测试与调试里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的测试与保护阶段，可以把“行为驱动开发”放到一个真实项目中：围绕“一种开发方法，描述跨技术和产品角色共享的示例和场景中的预期系统行为。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“行为驱动开发”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“一种开发方法，描述跨技术和产品角色共享的示例和场景中的预期系统行为”。"
common_mistake: "不要把“行为驱动开发”这个名称当成正确性的证明；请检查实际行为、数据流、权限、失败场景和相关测试。"
