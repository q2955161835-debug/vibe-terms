title: डिप्लॉयमेंट
short_definition: बने हुए एप्लिकेशन को ऐसे वातावरण में रखना जहाँ उपयोगकर्ता उसे खोल सकें।
analogy: उत्पाद को अपनी कार्यशाला से असली खुली दुकान तक ले जाने जैसा।
why_it_matters: जो प्रोजेक्ट केवल आपके लैपटॉप पर चलता है, वह अभी उपयोग योग्य वेब उत्पाद नहीं है।
ai_prompt_example: स्टैटिक बिल्ड बनाओ, सभी भाषा मार्ग जाँचो और उसी बिल्ड आर्टिफ़ैक्ट को तैनात करो; प्रोडक्शन
  में दोबारा बिल्ड मत करो।
common_mistake: डिप्लॉयमेंट के समय कॉन्फ़िगरेशन बदलना और उस बदलाव को रिपॉज़िटरी में दर्ज न करना।
