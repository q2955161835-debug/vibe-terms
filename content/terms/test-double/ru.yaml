title: Test Double
short_definition: 'Test Double — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A controllable substitute for a real dependency used during testing, including mocks, stubs, fakes, and spies.'
analogy: Test Double можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Test Double — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A controllable substitute for a real dependency used during testing, including mocks, stubs, fakes, and spies.'
why_it_matters: Понимание Test Double помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Test Double помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Test Double в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Test Double доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
