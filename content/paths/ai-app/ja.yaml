locale: ja
title: AI アシスタント アプリを構築する
summary: 使いやすいチャット体験、明示的なデータフロー、評価、安全なリリース確認を備えた、範囲の明確なAIアシスタントを設計します。
status: draft
source_content_version: 1
chapters:
- id: problem-and-scope
  title: アシスタントの仕事を定義する
  summary: 聴衆の問題を 1 つ選択し、アシスタントが何をするか、何をしないかを書きます。
  outcome: 境界のある製品概要。
  checkpoint: 範囲外のリクエストには明確な拒否またはハンドオフがあります。
- id: model-and-prompt
  title: モデル命令の設定
  summary: 焦点を絞ったシステム プロンプトを作成し、選択したタスクに対して予測可能なモデル設定を選択します。
  outcome: バージョン管理されたモデルの手順と設定。
  checkpoint: アシスタントは意図された口調に従い、裏付けのない主張を拒否します。
- id: conversation-ui
  title: 会話の場を構築する
  summary: 明確な入力、応答、読み込み、空の状態を備えた読みやすいチャット インターフェイスを作成します。
  outcome: アクセスしやすい会話画面。
  checkpoint: ユーザーは、自分のメッセージ、アシスタントの応答、保留中の作業を区別できます。
- id: application-state
  title: ローカル会話状態を管理する
  summary: 現在のビューに何を含めるか、ローカルに保持できるものは何か、各リクエストに何を含める必要があるかを決定します。
  outcome: 文書化されたクライアント状態モデル。
  checkpoint: 更新は、各種の会話データに意図した影響を与えます。
- id: api-contract
  title: リクエストコントラクトを定義する
  summary: ユーザー インターフェイスを配線する前に、要求フィールド、応答形状、およびエラー ペイロードを指定します。
  outcome: リクエストとレスポンスのコントラクトの例。
  checkpoint: 無効な入力は、文書化された有用なエラー形状を返します。
- id: context-and-retrieval
  title: 根拠のあるコンテキストを追加する
  summary: 承認済みの小さな知識セットを選び、回答を生成する前に関連する箇所を取得します。
  outcome: 追跡可能なコンテキスト選択フロー。
  checkpoint: 回答では、ソースを作成する代わりに、提供されたコンテキストを特定できます。
- id: tool-safety
  title: ツールと入力を制限する
  summary: 狭いパラメーターを持つ名前付きツールのみを許可し、タスク境界と競合する命令を拒否します。
  outcome: 文書化されたツールの許可リストと安全ケース。
  checkpoint: 信頼できないテキストは、ツールの権限を拡張したり、システムの目標をオーバーライドしたりすることはできません。
- id: evaluation
  title: 有用な動作を評価する
  summary: 代表的なプロンプトと予期されるプロパティを作成します。これには、アシスタントが「わからない」と答える必要がある場合も含まれます。
  outcome: 小規模な反復可能な評価セット。
  checkpoint: 評価では、役立つ回答とサポートされていない回答が区別されます。
- id: error-and-observability
  title: 障害を視覚的に処理する
  summary: ユーザーに回復可能なエラー状態を提供し、不必要なコンテンツを収集することなく構造化された操作信号を記録します。
  outcome: エラー状態と最小限の操作ログ計画。
  checkpoint: タイムアウト、制限、ネットワーク障害については、理解できるユーザー メッセージが表示されます。
- id: release-and-feedback
  title: フィードバック境界を設けたリリース
  summary: 主要なプロセスを検証し、小規模なリリースをデプロイし、定義されたジョブを改善するフィードバックのみを収集します。
  outcome: リリースのチェックリストとフィードバックの質問。
  checkpoint: デプロイされたアシスタントは評価に合格しており、既知の制限が表示されています。
