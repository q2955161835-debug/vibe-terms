title: shadcn/ui
short_definition: Подход к сбору и распространению, позволяющий копировать доступный исходный код компонента React
  в проект, чтобы приложение владело кодом и настраивало его.
analogy: '«shadcn/ui» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «shadcn/ui»: Подход к сбору и распространению, позволяющий копировать доступный исходный
  код компонента React в проект, чтобы приложение владело кодом и настраивало его. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «shadcn/ui» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «shadcn/ui» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: 'Объясни, где в этом проекте используется «shadcn/ui». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки. Сохрани технические токены: /ui.'
common_mistake: Частая ошибка — считать само слово «shadcn/ui» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
