title: Reverse-Proxy
short_definition: Ein Server, der Anfragen im Namen von Back-End-Diensten empfängt und sie basierend auf Routing-, Sicherheits-
  oder Lastregeln weiterleitet.
analogy: 'Ein praktischer Vergleich für Reverse-Proxy: ein markiertes Werkzeug in Web & Netzwerk, dessen Zweck erst im Zusammenspiel
  mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Ein Server, der Anfragen im Namen von Back-End-Diensten empfängt und sie basierend auf Routing-, Sicherheits- oder
  Lastregeln weiterleitet. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Reverse-Proxy versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Web & Netzwerk benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Reverse-Proxy in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Reverse-Proxy in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Reverse-Proxy als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
