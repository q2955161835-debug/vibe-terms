title: "Flexbox"
short_definition: "一種一維 CSS 佈局系統，用於沿行或列分佈、對齊和排序項目。"
analogy: "可以把 Flexbox 想成可伸縮的收納架：項目沿著主軸排列，空間改變時仍能調整對齊、間距與換行。"
mechanism: "一維 CSS 佈局系統會沿行或列配置項目，並依規則處理對齊、間距與換行。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 Flexbox 後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立介面與邏輯階段，用 Flexbox 排列導覽列與卡片清單，測試項目數量增加、換行及手機寬度變窄時的對齊結果。"
ai_prompt_example: "請檢查這個專案使用 Flexbox 的版面，指出主軸、交叉軸、間距與換行設定，僅修改必要的 CSS，並提供桌面與手機寬度的驗證方式。"
common_mistake: "只調整寬度或加入硬編碼的邊距，卻沒有確認 Flexbox 的主軸、交叉軸、換行與不同內容長度下的排列結果。"
