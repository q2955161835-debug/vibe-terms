title: Крон Джоб
short_definition: Задача, запуск которой запланирован на определенное время или через определенные промежутки времени
  с использованием планировщика в стиле cron.
analogy: 'Представьте «Задача Cron» как инструмент в наборе разработчика: он решает задачу в области «Бэкенд и API»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Задача Cron»: Задача, запуск которой запланирован на определенное время или через определенные
  промежутки времени с использованием планировщика в стиле cron. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Крон Джоб» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Задача Cron» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Задача Cron». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Задача Cron» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
