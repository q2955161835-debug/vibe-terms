title: Шаблон промпта
short_definition: Многоразовая структура подсказок с заполнителями, которые заполняются значениями, специфичными
  для задачи, во время выполнения.
analogy: 'Представьте «Шаблон промпта» как инструмент в наборе разработчика: он решает задачу в области «ИИ и Vibe
  Coding», но результат зависит от настройки.'
mechanism: 'Как работает «Шаблон промпта»: Многоразовая структура подсказок с заполнителями, которые заполняются
  значениями, специфичными для задачи, во время выполнения. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Шаблон промпта» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Шаблон промпта» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Шаблон промпта». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Шаблон промпта» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
