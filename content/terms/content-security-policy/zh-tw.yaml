title: "內容安全性政策"
short_definition: "一種瀏覽器安全策略，用於限制哪些來源可以提供頁面指令碼、樣式、框架和其他資源。"
analogy: "在安全設計中，「內容安全性政策」像一道需要驗證的門檻：它涉及「一種瀏覽器安全策略，用於限制哪些來源可以提供頁面指令碼、樣式、框架和其他資源」，不能只看名稱就判定安全。"
mechanism: "一種瀏覽器安全策略，用於限制哪些來源可以提供頁面指令碼、樣式、框架和其他資源。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解內容安全性政策後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「內容安全性政策」放進登入流程、權限檢查或安全日誌中：檢查重點是「一種瀏覽器安全策略，用於限制哪些來源可以提供頁面指令碼、樣式、框架和其他資源」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「內容安全性政策」為例，說明如何實現「一種瀏覽器安全策略，用於限制哪些來源可以提供頁面指令碼、樣式、框架和其他資源」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「內容安全性政策」這個名稱就判定已經正確實作；請根據「一種瀏覽器安全策略，用於限制哪些來源可以提供頁面指令碼、樣式、框架和其他資源」檢查實際行為、資料流、錯誤情境與測試結果。"
