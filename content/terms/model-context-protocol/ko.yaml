title: Model Context Protocol
short_definition: 표준 클라이언트-서버 인터페이스를 통해 AI 애플리케이션을 외부 도구, 리소스 및 프롬프트 템플릿에 연결하기 위한 개방형 프로토콜입니다.
analogy: Model Context Protocol를 워크숍의 AI 및 Vibe Coding 부분에 있는 라벨이 붙은 도구로 생각해 보세요. 라벨은 검사해야 할 문제 영역을 알려주지만 실제 동작은 구현에서 결정됩니다.
mechanism: Model Context Protocol의 작동은 기술 스택, 구성 및 데이터 흐름에 따라 달라집니다. 관련 코드와 테스트를 확인해 실제 동작을 검증하세요.
why_it_matters: Model Context Protocol를 알면 Vibe Coding 초보자는 AI 및 Vibe 코딩 문제가 의미하는 정확한 이름을 지정하고 AI 코딩 에이전트에게 변경 사항과 동작이 정확하다는
  증거를 요청할 수 있습니다.
project_example: Vibe Terms에서는 학습자가 요구사항 단계에 도달하면 Model Context Protocol를 어휘 체크포인트로 사용합니다. 정의를 따로 가르치기보다는 눈에 보이는 하나의 페이지,
  파일, 요청, 데이터 구조 또는 검증 단계에 정의를 연결하세요.
ai_prompt_example: Model Context Protocol가 이 프로젝트에 어떻게 적용되는지 설명하세요. 관련된 정확한 파일이나 시스템 경계를 가리키고, 필요한 최소한의 변경만 수행하고, 결과를 확인하는
  데 사용할 수 있는 명령이나 사용자 흐름을 보여 주세요.
common_mistake: 실제 동작, 데이터 흐름, 권한, 실패 사례 또는 관련 테스트를 확인하지 않고 구현이 정확하다는 증거로 Model Context Protocol라는 용어를 취급합니다.
