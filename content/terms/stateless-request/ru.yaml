title: Запрос без сохранения состояния
short_definition: Запрос, который должен содержать необходимый ему контекст, поскольку конечная точка модели не
  запоминает автоматически предыдущие вызовы.
analogy: '«Запрос без состояния» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все
  равно нужно проверить.'
mechanism: 'Как работает «Запрос без состояния»: Запрос, который должен содержать необходимый ему контекст, поскольку
  конечная точка модели не запоминает автоматически предыдущие вызовы. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Запрос без сохранения состояния» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Запрос без состояния» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Запрос без состояния». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Запрос без состояния» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
