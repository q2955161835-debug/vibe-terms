title: Primärschlüssel
short_definition: Eine Spalte oder ein Satz von Spalten, deren Wert jede Zeile in einer relationalen Tabelle eindeutig identifiziert.
analogy: Betrachte Primärschlüssel als Orientierung in Daten & Datenbanken. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Eine Spalte oder ein Satz von Spalten, deren Wert jede Zeile in einer relationalen Tabelle eindeutig identifiziert.
  In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die
  konkrete Umsetzung.
why_it_matters: Wer Primärschlüssel versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Daten & Datenbanken benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Primärschlüssel in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Primärschlüssel in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Primärschlüssel als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
