title: Бенчмарк
short_definition: Стандартизированный набор данных или набор задач, используемый для сравнения моделей или систем
  в одинаковых условиях оценки.
analogy: '«Benchmark» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно
  проверить.'
mechanism: 'Как работает «Benchmark»: Стандартизированный набор данных или набор задач, используемый для сравнения
  моделей или систем в одинаковых условиях оценки. На практике механизм зависит от конфигурации, потока данных и
  границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Бенчмарк» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Benchmark» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Benchmark». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Benchmark» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
