title: Model Context Protocol
short_definition: Открытый протокол для подключения приложений ИИ к внешним инструментам, ресурсам и шаблонам подсказок
  через стандартный клиент-серверный интерфейс.
analogy: '«Model Context Protocol» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не
  заменяет проверку реализации.'
mechanism: 'Как работает «Model Context Protocol»: Открытый протокол для подключения приложений ИИ к внешним инструментам,
  ресурсам и шаблонам подсказок через стандартный клиент-серверный интерфейс. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Model Context Protocol» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Model Context Protocol» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Model Context Protocol». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Model Context Protocol» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
