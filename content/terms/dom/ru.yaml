title: DOM
short_definition: 'DOM — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The browser''s in-memory object tree representing a document so scripts can read and change elements, attributes, and text.'
analogy: DOM можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'DOM — термин из раздела «Фронтенд-разработка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The browser''s in-memory object tree representing a document so scripts can read and change elements, attributes, and text.'
why_it_matters: Понимание DOM помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание DOM помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль DOM в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название DOM доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
