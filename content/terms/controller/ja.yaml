title: Controller
short_definition: 'Controller は「バックエンドと API」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: An application layer that translates incoming requests into calls to business logic and maps results into responses.'
analogy: Controller は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'Controller は「バックエンドと API」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: An application layer that translates incoming requests into calls to business logic and maps results into responses.'
why_it_matters: Controller を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: Controller を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
ai_prompt_example: このプロジェクトで Controller がどのように関係するか説明してください。対象ファイルまたは境界を示し、必要最小限の変更と確認手順を提示してください。
common_mistake: Controller という名前だけで実装が正しいと判断し、実際の動作・データフロー・失敗時の挙動を確認しないことです。
