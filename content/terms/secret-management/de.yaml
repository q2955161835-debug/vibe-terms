title: Geheimnisverwaltung
short_definition: Die kontrollierte Speicherung, der Zugriff, die Rotation und die Prüfung von Anmeldeinformationen wie API-Schlüsseln,
  Token und privaten Schlüsseln.
analogy: 'Ordne Geheimes Management im Bereich Sicherheit & Datenschutz als Werkzeug ein: Die Bezeichnung grenzt die Frage
  ein, doch erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Die kontrollierte Speicherung, der Zugriff, die Rotation und die Prüfung von Anmeldeinformationen wie API-Schlüsseln,
  Token und privaten Schlüsseln. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Geheimes Management versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit & Datenschutz
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Geheimes Management in der Phase Tests & Schutz als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Geheimes Management in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Geheimes Management als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
