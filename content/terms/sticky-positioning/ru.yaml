title: Sticky Positioning
short_definition: Позиционирование CSS, которое ведет себя относительно до тех пор, пока не будет достигнут порог
  прокрутки, а затем удерживает элемент внутри контейнера.
analogy: '«Sticky Positioning» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работает «Sticky Positioning»: Позиционирование CSS, которое ведет себя относительно до тех пор,
  пока не будет достигнут порог прокрутки, а затем удерживает элемент внутри контейнера. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Sticky Positioning» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Sticky Positioning» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Sticky Positioning». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Sticky Positioning» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
