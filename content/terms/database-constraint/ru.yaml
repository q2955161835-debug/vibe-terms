title: Ограничение базы данных
short_definition: Правило, применяемое базой данных, которое предотвращает недопустимые состояния данных, такие
  как обязательные значения или недопустимые связи.
analogy: '«Ограничение базы данных» похож на понятную табличку на нужном ящике: она направляет, однако содержимое
  все равно нужно проверить.'
mechanism: 'Как работает «Ограничение базы данных»: Правило, применяемое базой данных, которое предотвращает недопустимые
  состояния данных, такие как обязательные значения или недопустимые связи. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Ограничение базы данных» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Ограничение базы данных» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Ограничение базы данных». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Ограничение базы данных» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
