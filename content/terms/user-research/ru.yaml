title: User Research
short_definition: 'User Research — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The systematic study of users, their context, behavior, needs, and problems through interviews, observation, surveys, or other methods.'
analogy: User Research можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'User Research — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The systematic study of users, their context, behavior, needs, and problems through interviews, observation, surveys, or other methods.'
why_it_matters: Понимание User Research помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание User Research помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль User Research в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название User Research доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
