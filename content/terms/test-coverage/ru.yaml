title: Тестовое покрытие
short_definition: Мера того, какой код, ветки, требования или сценарии риска выполняются набором тестов.
analogy: 'Проще представить «Покрытие тестами» как правило работы в разделе «Тестирование и отладка»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Покрытие тестами»: Мера того, какой код, ветки, требования или сценарии риска выполняются
  набором тестов. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и
  наблюдаемый результат.'
why_it_matters: Понимание термина «Тестовое покрытие» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Покрытие тестами» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Покрытие тестами». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Покрытие тестами» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
