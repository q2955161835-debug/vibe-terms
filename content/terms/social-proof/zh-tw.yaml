title: "社會證明"
short_definition: "來自真實使用者、客戶、使用情況、評論或旨在增加信任的公認組織的證據。"
analogy: "將社交證明視為工作坊的 UI/UX 和可存取性部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "來自真實使用者、客戶、使用情況、評論或旨在增加信任的公認組織的證據。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解社交證明可以讓 Vibe 編碼初學者說出他們所指的確切 UI/UX 和可存取性問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者到達設計階段時，使用社交證明作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋社會認同如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將「社會證明」一詞視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
status: draft
