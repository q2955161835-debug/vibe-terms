locale: ja
title: フルスタック アプリを出荷する
summary: ブラウザ インターフェイス、API、データ モデル、テスト、操作を接続することで、1 つの小さな製品をスコープからデプロイメントまで実行します。
status: draft
source_content_version: 1
chapters:
- id: product-scope
  title: 製品の最初のスライスを定義する
  summary: 狭いユーザー結果を選択し、観察可能な受け入れ基準を作成します。
  outcome: 合格基準を含む対象範囲を定めた製品概要。
  checkpoint: 最初のリリースから意図的に除外したものを明記できます。
- id: architecture
  title: システム境界をマッピングする
  summary: ブラウザー、API、およびデータの責任を描き、それぞれの重要なフローの方向に名前を付けます。
  outcome: 小さなアーキテクチャ図。
  checkpoint: 各責任には、重複するビジネス ルールの代わりに 1 つの所有レイヤーがあります。
- id: data-model
  title: 耐久性のあるデータをモデル化する
  summary: 書き込み操作を構築する前に、レコード、識別子、関係、および制約を定義します。
  outcome: 文書化されたデータスキーマ。
  checkpoint: このモデルは、製品が許可してはならない重複データや孤立したデータを防ぎます。
- id: api-design
  title: APIを設計する
  summary: 製品フローのリソース ルート、リクエストの検証、応答データ、ステータス コードを指定します。
  outcome: 例を含む API コントラクト。
  checkpoint: クライアントは、文書化されていないフィールドに依存せずにメイン フローを完了できます。
- id: authentication
  title: ユーザーアクセスを保護する
  summary: サーバー境界で誰が行動し、ユーザーを認証し、認可を強制できるかを決定します。
  outcome: アクセス ポリシーと保護されたエンドポイント フロー。
  checkpoint: 認証されていないリクエストまたは許可されていないリクエストは、保護されたデータを読み取ったり変更したりすることはできません。
- id: frontend-flow
  title: ブラウザフローを構築する
  summary: ロード、成功、空の状態が表示されるメイン タスクを実装します。
  outcome: プライマリ ユーザー フローの作業画面。
  checkpoint: ブラウザの状態は、最新の正常なサーバー応答と一貫性を保ちます。
- id: validation-and-errors
  title: 失敗をアクション可能にする
  summary: 入力とサーバーの境界で検証し、修正または再試行できるものを人々に示します。
  outcome: フィールドエラーと回復可能なリクエストエラー。
  checkpoint: 不正なデータは拒否され、有用なメッセージが表示され、部分的な書き込みは行われません。
- id: testing
  title: 接続されたシステムをテストする
  summary: ビジネス ルール、API 境界、および主要なブラウザーの利用を、最小限の有用なテスト セットでカバーします。
  outcome: 主要なフローの反復可能なテスト スイート。
  checkpoint: メイン フローで回帰が発生すると、関連する自動テストが失敗します。
- id: deployment
  title: 動作確認を行いながら導入
  summary: 非機密の環境名を構成し、検証を自動化し、リリース後に実行中のサービスを検査します。
  outcome: 導入手順とヘルスチェック。
  checkpoint: デプロイされたアプリは、予想される構成で主要なフローを完了します。
- id: iteration
  title: 次の改善点を選択してください
  summary: 観察されたフィードバックと測定された製品シグナルを使用して、1 つの小さなフォローアップ変更を優先します。
  outcome: 優先順位が付けられた次のイテレーションのメモ。
  checkpoint: 次の変更は、漠然とした機能リクエストではなく証拠につながります。
