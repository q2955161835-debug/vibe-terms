title: 서버에서 보낸 이벤트
short_definition: 서버가 하나의 연결을 통해 텍스트 이벤트를 클라이언트에 지속적으로 푸시할 수 있게 해주는 브라우저 API 및 HTTP 스트리밍 형식입니다.
analogy: 서버에서 보낸 이벤트를 워크숍의 웹 및 네트워킹 부분에 있는 라벨이 붙은 도구로 생각해 보세요. 라벨은 검사해야 할 문제 영역을 알려주지만 실제 동작은 구현에서 결정됩니다.
mechanism: 서버에서 보낸 이벤트의 작동은 기술 스택, 구성 및 데이터 흐름에 따라 달라집니다. 관련 코드와 테스트를 확인해 실제 동작을 검증하세요.
why_it_matters: 서버에서 보낸 이벤트를 알면 Vibe Coding 초보자는 그것이 의미하는 정확한 웹 및 네트워킹 문제를 지정하고 AI 코딩 에이전트에 변경 사항과 동작이 정확하다는 증거를 요청할 수 있습니다.
project_example: Vibe Terms에서는 학습자가 환경 단계에 도달했을 때 어휘 체크포인트로 서버에서 보낸 이벤트를 사용합니다. 정의를 따로 가르치기보다는 눈에 보이는 하나의 페이지, 파일, 요청, 데이터
  구조 또는 검증 단계에 정의를 연결하세요.
ai_prompt_example: 서버에서 보낸 이벤트가 이 프로젝트에 어떻게 적용되는지 설명하세요. 관련된 정확한 파일이나 시스템 경계를 가리키고, 필요한 최소한의 변경만 수행하고, 결과를 확인하는 데 사용할 수 있는
  명령이나 사용자 흐름을 보여 주세요.
common_mistake: 실제 동작, 데이터 흐름, 권한, 실패 사례 또는 관련 테스트를 확인하지 않고 구현이 정확하다는 증거로 서버에서 보낸 이벤트라는 용어를 취급합니다.
