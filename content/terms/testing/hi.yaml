title: परीक्षण
short_definition: व्यवस्थित रूप से जाँचना कि सॉफ़्टवेयर अपेक्षा के अनुसार चलता है और बदलाव के बाद भी चलता
  रहे।
analogy: ग्राहकों के आने से पहले टूटा दरवाज़ा पकड़ लेने वाली जाँच सूची की तरह।
why_it_matters: हर एआई बदलाव के साथ ठोस सत्यापन कदम हो तो Vibe Coding अधिक सुरक्षित बनता है।
ai_prompt_example: ऐसा रिग्रेशन टेस्ट जोड़ो जो बग ठीक होने से पहले असफल हो और बाद में सफल हो।
common_mistake: सिर्फ़ सफल रास्ते को एक बार क्लिक करके फ़ीचर को पूरी तरह परीक्षित मान लेना।
