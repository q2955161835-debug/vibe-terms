title: 变基
short_definition: 变基 是「Git 與協作」中的術語。目前為待人工審校的草稿。英文標準定義：Replaying commits onto a different base commit to create a new linearized history.
analogy: 可以先把 变基 想成軟體開發工具箱裡一個有明確用途的標籤；真正使用時仍要結合所在程式碼、資料流與使用者情境判斷。
mechanism: 变基 是「Git 與協作」中的術語。目前為待人工審校的草稿。英文標準定義：Replaying commits onto a different base commit to create a new linearized history.
why_it_matters: 理解 变基 後，你能更準確地告訴 AI 你指的是系統的哪一部分，並要求它提供可驗證的實作證據。
project_example: 理解 变基 後，你能更準確地告訴 AI 你指的是系統的哪一部分，並要求它提供可驗證的實作證據。
ai_prompt_example: 解釋 变基 在這個專案中的作用。指出涉及的檔案或系統邊界，只做最小必要修改，並給出我可以驗證結果的步驟。
common_mistake: 只記住 变基 這個名詞，卻沒有檢查它在目前專案裡的真實行為、資料流與失敗情況。
