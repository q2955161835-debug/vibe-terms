title: Textauswahl
short_definition: Der hervorgehobene Textbereich, den ein Benutzer zum Kopieren, Bearbeiten oder für einen anderen Vorgang
  ausgewählt hat.
analogy: 'Ordne Textauswahl im Bereich Frontend-Entwicklung als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch erst
  die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Der hervorgehobene Textbereich, den ein Benutzer zum Kopieren, Bearbeiten oder für einen anderen Vorgang ausgewählt
  hat. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Textauswahl versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Textauswahl in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Textauswahl in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Textauswahl als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
