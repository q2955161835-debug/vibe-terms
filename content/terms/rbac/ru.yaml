title: RBAC
short_definition: 'RBAC — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Role-based access control, where permissions are assigned to roles and users or services receive permissions through those roles.'
analogy: RBAC можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'RBAC — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Role-based access control, where permissions are assigned to roles and users or services receive permissions through those roles.'
why_it_matters: Понимание RBAC помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание RBAC помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль RBAC в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название RBAC доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
