title: Функция
short_definition: Особая возможность или поведение продукта, которое представляет ценность для пользователя или
  поддерживает эксплуатационные потребности.
analogy: 'Проще представить «функция» как правило работы в разделе «Продукт и требования»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «функция»: Особая возможность или поведение продукта, которое представляет ценность для
  пользователя или поддерживает эксплуатационные потребности. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Функция» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «функция» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «функция». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «функция» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
