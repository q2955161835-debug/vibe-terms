title: HEAD
short_definition: 'HEAD — термин из раздела «Git и совместная работа». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Git''s reference to the currently checked-out commit or branch tip.'
analogy: HEAD можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'HEAD — термин из раздела «Git и совместная работа». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Git''s reference to the currently checked-out commit or branch tip.'
why_it_matters: Понимание HEAD помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание HEAD помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль HEAD в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название HEAD доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
