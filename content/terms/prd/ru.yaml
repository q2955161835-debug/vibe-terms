title: PRD
short_definition: 'PRD — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A product requirements document that explains the problem, target users, scope, behavior, constraints, and acceptance expectations for a product or feature.'
analogy: PRD можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'PRD — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A product requirements document that explains the problem, target users, scope, behavior, constraints, and acceptance expectations for a product or feature.'
why_it_matters: Понимание PRD помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание PRD помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль PRD в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название PRD доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
