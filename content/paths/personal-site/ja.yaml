locale: ja
title: 個人サイトを立ち上げる
summary: 自分が誰なのか、連絡方法を説明する小さな個人サイトを計画、構築、テスト、公開します。
status: draft
source_content_version: 1
chapters:
- id: project-goal
  title: サイトの主目的を定める
  summary: 訪問者の問題、対象者、サイトがサポートする必要があるアクションを1つずつ述べます。
  outcome: 一文の目標と訪問者の主なアクション。
  checkpoint: サイトが誰を助けるのか、その訪問者が何ができるのかを説明できます。
- id: audience-and-content
  title: 対象読者とコンテンツをリストアップする
  summary: 訪問者のニーズを短いコンテンツ一覧とシンプルなユーザーストーリーに落とし込みます。
  outcome: 訪問者のニーズに応じて並べられたページコンテンツのリスト。
  checkpoint: 各セクションは訪問者の質問に答えたり、主要なアクションにつながります。
- id: information-architecture
  title: 情報を整理する
  summary: コンテンツを小さなナビゲーション単位にまとめ、訪問者がたどる順序を定義します。
  outcome: ナビゲーションラベルを含むページ構成。
  checkpoint: 次にどこに行くかを推測することなく、メインのアクションに到達できます。
- id: wireframe
  title: ページをスケッチする
  summary: 色や視覚的な装飾を選択する前に、忠実度の低いワイヤーフレームを作成します。
  outcome: デスクトップおよび狭い画面用のラベル付きワイヤーフレーム。
  checkpoint: 無地のボックスとテキストでも階層が理解できます。
- id: html-structure
  title: セマンティック構造の構築
  summary: 意味のある見出し、ランドマーク、リンク、コンテンツの順序を使用してページを作成します。
  outcome: 明確な見出しのアウトラインを持つセマンティックHTMLページ。
  checkpoint: ドキュメントをソース順に読んでも、ページの構造と意味が伝わります。
- id: visual-system
  title: ビジュアルシステムを作成する
  summary: 1回限りのスタイル設定ではなく、タイプ、間隔、色、表面ルールの小さなセットを適用します。
  outcome: 再利用可能なCSS変数と一貫したセクションスタイル。
  checkpoint: 同様の要素では、同じ視覚的な決定が使用されます。
- id: responsive-accessibility
  title: どこでも使えるサイトにする
  summary: 狭い画面にレイアウトを適応させ、キーボードフォーカス、十分なコントラスト、分かりやすいリンクテキストを確認します。
  outcome: キーボードに表示されるコントロールを備えた応答性の高いページ。
  checkpoint: スマートフォン幅でも、重要なコンテンツが切り取られたり、操作できなくなったりしません。
- id: content-and-seo
  title: 共有可能なページのメタデータを準備する
  summary: 実際のページと一致する、説明的なタイトル、概要、プレビュー用メタデータを追加します。
  outcome: 検索と共有のためのページのメタデータ。
  checkpoint: タイトルと概要は、表示されているページと同じストーリーを伝えます。
- id: quality-check
  title: 実際のブラウザの動作を確認する
  summary: ブラウザーで主要リンク、キーボード操作、テキストのはみ出し、連絡先への導線をテストします。
  outcome: 結果を含む簡潔な手動テストチェックリスト。
  checkpoint: すべての確認項目をデスクトップとスマートフォン幅のビューポートで実施します。
- id: publish-static-site
  title: 静的サイトを公開する
  summary: 検証済みのソースをコミットし、静的アーティファクトをデプロイして、公開URLを確認します。
  outcome: 公開済み個人サイトのURLとデプロイ記録。
  checkpoint: 公開ページは検証済みのローカル版と一致しており、そのリンクも機能します。
