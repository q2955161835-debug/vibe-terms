locale: en
title: Build an AI Assistant App
summary: Design a bounded AI assistant with a useful chat experience, explicit data flow, evaluation, and safe release checks.
status: published
source_content_version: 1
chapters:
- id: problem-and-scope
  title: Define the assistant's job
  summary: Choose one audience problem and write what the assistant will and will not do.
  outcome: A bounded product brief.
  checkpoint: A request outside the scope has a clear refusal or handoff.
- id: model-and-prompt
  title: Set model instructions
  summary: Write a focused system prompt and select predictable model settings for the chosen task.
  outcome: Versioned model instructions and settings.
  checkpoint: The assistant follows the intended tone and declines unsupported claims.
- id: conversation-ui
  title: Build the conversation surface
  summary: Create a readable chat interface with clear input, response, loading, and empty states.
  outcome: An accessible conversation screen.
  checkpoint: A user can distinguish their message, the assistant reply, and pending work.
- id: application-state
  title: Manage local conversation state
  summary: Decide what belongs in the current view, what can persist locally, and what each request must include.
  outcome: A documented client-state model.
  checkpoint: Refreshing has the intended effect on each kind of conversation data.
- id: api-contract
  title: Define the request contract
  summary: Specify the request fields, response shape, and error payload before wiring the user interface.
  outcome: An example request and response contract.
  checkpoint: Invalid input returns a useful, documented error shape.
- id: context-and-retrieval
  title: Add grounded context
  summary: Choose a small approved knowledge set and retrieve relevant passages before generating an answer.
  outcome: A traceable context-selection flow.
  checkpoint: Answers can identify the supplied context instead of inventing a source.
- id: tool-safety
  title: Constrain tools and inputs
  summary: Allow only named tools with narrow parameters and reject instructions that conflict with the task boundary.
  outcome: A documented tool allowlist and safety cases.
  checkpoint: Untrusted text cannot expand tool permissions or override the system goal.
- id: evaluation
  title: Evaluate useful behavior
  summary: Create representative prompts and expected properties, including a case where the assistant should say it does not know.
  outcome: A small repeatable evaluation set.
  checkpoint: The evaluation distinguishes helpful answers from unsupported ones.
- id: error-and-observability
  title: Handle failures visibly
  summary: Give users recoverable error states and record structured operational signals without collecting unnecessary content.
  outcome: Error states and a minimal operational log plan.
  checkpoint: Timeouts, limits, and network failures have understandable user messages.
- id: release-and-feedback
  title: Release with feedback boundaries
  summary: Verify the main journeys, deploy a small release, and collect only feedback that improves the defined job.
  outcome: A release checklist and feedback questions.
  checkpoint: The deployed assistant has passed its evaluation and known limitations are visible.
