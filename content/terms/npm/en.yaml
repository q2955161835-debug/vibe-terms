title: npm
short_definition: The default package manager and script runner distributed with Node.js, commonly used to install JavaScript dependencies and run project commands.
analogy: 'Think of npm as a labeled tool in the computing & development environment part of a workshop: the label tells you what problem area to inspect, but the real behavior still comes from the implementation.'
mechanism: The default package manager and script runner distributed with Node.js, commonly used to install JavaScript dependencies and run project commands. In a real project, its exact behavior depends on the surrounding technology, configuration, and data flow, so verify the concrete implementation rather than relying on the label alone.
why_it_matters: Knowing npm lets a Vibe Coding beginner name the exact computing & development environment concern they mean and ask an AI coding agent for a change plus evidence that the behavior is correct.
project_example: In Vibe Terms, use npm as a vocabulary checkpoint when a learner reaches the environment stage; connect the definition to one visible page, file, request, data structure, or verification step rather than teaching it in isolation.
ai_prompt_example: Explain how npm applies to this project. Point to the exact files or system boundary involved, make only the smallest necessary change, and show the command or user flow I can use to verify the result.
common_mistake: Treating the term npm as proof that an implementation is correct without checking actual behavior, data flow, permissions, failure cases, or the relevant test.
quiz:
- question: Which description best matches npm?
  options:
  - The default package manager and script runner distributed with Node.js, commonly used to install JavaScript dependencies and run project commands.
  - A visual decoration that has no effect on software behavior.
  - A guarantee that every implementation is secure and correct.
  answer: 0
- question: When an AI says it used npm, what should you do next?
  options:
  - Accept the label as proof.
  - Check the concrete implementation and verify the relevant behavior.
  - Rename the files so the term appears in the project.
  answer: 1
- question: Which prompt is more useful for working with npm?
  options:
  - “Make npm better.”
  - “Explain where npm appears, change the smallest necessary part, and show how to verify it.”
  - “Rewrite the whole project.”
  answer: 1
