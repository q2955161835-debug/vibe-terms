title: Web-App-Manifest
short_definition: Eine JSON-Datei, die installierbare Web-App-Metadaten wie Name, Symbole, Start-URL und Anzeigemodus beschreibt.
analogy: 'Ordne Web-App-Manifest im Bereich Frontend-Entwicklung als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch
  erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Eine JSON-Datei, die installierbare Web-App-Metadaten wie Name, Symbole, Start-URL und Anzeigemodus beschreibt.
  In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die
  konkrete Umsetzung.
why_it_matters: Wer Web-App-Manifest versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Web-App-Manifest in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Web-App-Manifest in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Web-App-Manifest als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
