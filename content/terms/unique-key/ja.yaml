title: 一意キー
short_definition: 値または値の組み合わせがレコード間で繰り返されないことを保証するデータベース ルール。
analogy: 一意キー は、ワークショップのデータとデータベースの部分にあるラベル付きツールと考えてください。ラベルはどの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: 値または値の組み合わせがレコード間で繰り返されないことを保証するデータベース ルール。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: 一意キー を知ることで、Vibe Codingの初心者は、それらが意味する正確なデータとデータベースの懸念事項に名前を付け、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がデータ同一性段階に到達したときに語彙チェックポイントとして 一意キー を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: 一意キー がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: 一意キー という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
