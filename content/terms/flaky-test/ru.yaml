title: Flaky Test
short_definition: 'Flaky Test — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A test that sometimes passes and sometimes fails without a meaningful change to the code under test.'
analogy: Flaky Test можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Flaky Test — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A test that sometimes passes and sometimes fails without a meaningful change to the code under test.'
why_it_matters: Понимание Flaky Test помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Flaky Test помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Flaky Test в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Flaky Test доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
