project_example: 'In Vibe Terms dient Bento-Raster in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Bento-Raster in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
