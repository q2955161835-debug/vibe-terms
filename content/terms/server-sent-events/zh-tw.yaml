title: "伺服器傳送事件"
short_definition: "一種瀏覽器 API 和 HTTP 串流格式，允許伺服器透過一個連線將文字事件持續推送到用戶端。"
analogy: "將伺服器傳送事件視為工作坊的 Web 和網路部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "一種瀏覽器 API 和 HTTP 串流格式，允許伺服器透過一個連線將文字事件持續推送到用戶端。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解伺服器傳送的事件讓 Vibe 編碼初學者能夠準確地說出他們所指的網路和網路問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者到達環境階段時，使用伺服器傳送事件作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋伺服器傳送的事件如何應用於此專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將「伺服器傳送的事件」一詞視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
status: draft
