title: Первичный ключ
short_definition: Столбец или набор столбцов, значение которых уникально идентифицирует каждую строку в реляционной
  таблице.
analogy: 'Представьте «Первичный ключ» как инструмент в наборе разработчика: он решает задачу в области «Данные
  и базы данных», но результат зависит от настройки.'
mechanism: 'Как работает «Первичный ключ»: Столбец или набор столбцов, значение которых уникально идентифицирует
  каждую строку в реляционной таблице. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Первичный ключ» помогает точно назвать проблему в области «Данные и базы данных», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Первичный ключ» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Первичный ключ». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Первичный ключ» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
