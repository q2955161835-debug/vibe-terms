title: Weiterleitung
short_definition: Eine HTTP-Antwort oder Anwendungsregel, die einen Client anweist, eine andere URL anzufordern.
analogy: Betrachte Weiterleitung als Orientierung in Web & Netzwerk. Die Bezeichnung führt zur richtigen technischen Stelle, garantiert
  aber noch keine gute Umsetzung.
mechanism: Eine HTTP-Antwort oder Anwendungsregel, die einen Client anweist, eine andere URL anzufordern. In einem realen
  Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Weiterleitung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Web & Netzwerk benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Weiterleitung in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Weiterleitung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Weiterleitung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
