title: "CORS"
short_definition: "一種瀏覽器安全機制，使用 HTTP 標頭來控制哪些來源可以讀取來自不同來源的回應。"
analogy: "將 CORS 視為工作坊後端和 API 部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "一種瀏覽器安全機制，使用 HTTP 標頭來控制哪些來源可以讀取來自不同來源的回應。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解 CORS 讓 Vibe 編碼初學者可以準確命名他們所指的後端和 API 關注點，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到資料身分階段時，使用 CORS 作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教導它。"
ai_prompt_example: "解釋 CORS 如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語 CORS 視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
status: draft
