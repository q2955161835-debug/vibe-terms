title: フロントエンド
short_definition: ユーザーが直接見て、操作するアプリケーションの部分。
analogy: 背後にある在庫室ではなく、店舗の顧客が通り抜けるのです。
why_it_matters: ほとんどのビジュアルVibe Codingリクエストはフロントエンドコードを変更するため、この用語は範囲を説明するのに役立ちます。
ai_prompt_example: フロントエンド用語カードのレイアウトのみを変更します。API応答やデータベーステーブルを変更しないでください。
common_mistake: リクエストが実際にサーバー側の作業も必要とする場合、Webサイト全体を「フロントエンド」と呼びます。
status: draft
source_content_version: 1
mechanism: フロントエンドはブラウザで表示を構築し、入力イベントを状態やAPI境界へ伝え、応答に応じて画面を更新します。
project_example: Vibe Termsでは、用語ページのHTML、ロケール切り替え、学習操作をフロントエンドの責務として確認します。
