locale: ru
title: Собрать приложение с ИИ-ассистентом
summary: Спроектируйте ограниченного ИИ-ассистента с полезным чатом, явным потоком данных, оцениванием и безопасными
  проверками релиза
status: draft
source_content_version: 1
chapters:
- id: problem-and-scope
  title: Определить задачу ассистента
  summary: Выберите проблему аудитории и запишите, что ассистент будет и не будет делать.
  outcome: Ограниченный продуктовый бриф.
  checkpoint: Запрос вне области получает ясный отказ или передачу человеку.
- id: model-and-prompt
  title: Задать инструкции модели
  summary: Напишите сфокусированный системный промпт и выберите предсказуемые настройки.
  outcome: Версионированные инструкции и настройки модели.
  checkpoint: Ассистент сохраняет нужный тон и отклоняет неподтвержденные утверждения.
- id: conversation-ui
  title: Собрать поверхность диалога
  summary: Создайте читаемый чат с ясными состояниями ввода, ответа, загрузки и пустого результата.
  outcome: Доступный экран диалога.
  checkpoint: Пользователь различает свое сообщение, ответ ассистента и ожидающую работу.
- id: application-state
  title: Управлять локальным состоянием диалога
  summary: Решите, что относится к виду, что хранится локально и что входит в каждый запрос.
  outcome: Документированная модель состояния клиента.
  checkpoint: Обновление дает ожидаемый результат для каждого типа данных.
- id: api-contract
  title: Определить контракт запроса
  summary: Опишите поля запроса, форму ответа и payload ошибки до подключения интерфейса.
  outcome: Пример контракта запроса и ответа.
  checkpoint: Некорректный ввод возвращает документированную форму ошибки.
- id: context-and-retrieval
  title: Добавить заземленный контекст
  summary: Выберите одобренный набор знаний и получите фрагменты до генерации ответа.
  outcome: Прослеживаемый поток выбора контекста.
  checkpoint: Ответы называют предоставленный контекст, а не придумывают источник.
- id: tool-safety
  title: Ограничить инструменты и ввод
  summary: Разрешайте именованные инструменты с узкими параметрами и отклоняйте конфликтующие инструкции.
  outcome: Документированный allowlist инструментов.
  checkpoint: Ненадежный текст не расширяет права инструментов.
- id: evaluation
  title: Оценить полезное поведение
  summary: Создайте типичные промпты и ожидаемые свойства, включая случай «не знаю».
  outcome: Небольшой повторяемый набор оценивания.
  checkpoint: Оценивание отличает полезные ответы от неподтвержденных.
- id: error-and-observability
  title: Сделать сбои видимыми
  summary: Показывайте восстанавливаемые ошибки и записывайте структурированные сигналы без лишних данных.
  outcome: Состояния ошибок и минимальный план логов.
  checkpoint: Тайм-ауты, лимиты и сетевые сбои имеют понятные сообщения.
- id: release-and-feedback
  title: Выпустить с границами обратной связи
  summary: Проверьте основные пути, разверните релиз и собирайте обратную связь только для задачи.
  outcome: Чек-лист релиза и вопросы обратной связи.
  checkpoint: Ассистент прошел оценивание, а известные ограничения видимы.
