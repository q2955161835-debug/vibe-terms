title: Изображение
short_definition: Визуальное растровое или векторное содержимое, отображаемое в интерфейсе с намеренным размером,
  поведением обрезки и альтернативным текстом, где это необходимо.
analogy: 'Представьте «Image» как инструмент в наборе разработчика: он решает задачу в области «UI/UX и доступность»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Image»: Визуальное растровое или векторное содержимое, отображаемое в интерфейсе с намеренным
  размером, поведением обрезки и альтернативным текстом, где это необходимо. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Изображение» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Image» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Image». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Image» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
