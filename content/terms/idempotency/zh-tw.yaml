title: "冪等性"
short_definition: "重複相同操作與執行一次具有相同預期效果的屬性。"
analogy: "在後端流程中，「冪等性」像服務之間的處理站：它負責「重複相同操作與執行一次具有相同預期效果的屬性」，結果要用 API 請求與回應確認。"
mechanism: "重複相同操作與執行一次具有相同預期效果的屬性。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解冪等性後，Vibe Coding 初學者可以準確指出相關的後端與 API 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「冪等性」放進API 請求、回應或服務日誌中：檢查重點是「重複相同操作與執行一次具有相同預期效果的屬性」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「冪等性」為例，說明如何實現「重複相同操作與執行一次具有相同預期效果的屬性」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「冪等性」這個名稱就判定已經正確實作；請根據「重複相同操作與執行一次具有相同預期效果的屬性」檢查實際行為、資料流、錯誤情境與測試結果。"
