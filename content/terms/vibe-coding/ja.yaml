title: バイブコーディング
short_definition: AIコーディング支援へ望む結果を説明し、生成された内容を確認しながら繰り返し改善してソフトウェアを作る方法。
analogy: 非常に速い新人開発者へ要望を伝え、納品のたびに内容を確認するようなものです。
why_it_matters: 初心者でも実用的なソフトウェアを作れますが、AIが何を変えたか判断するための基本用語は必要です。
ai_prompt_example: この機能を小さな手順に分けてください。編集前に、変更するファイルと結果の確認方法を説明してください。
common_mistake: 「動いた」ことを、設計が正しく安全である証拠だと考えること。
status: draft
source_content_version: 1
