title: "Origin（来源）"
short_definition: "Git 默认使用的远程仓库名称，通常指向克隆项目时所用的远程仓库。"
analogy: "可以把 Origin（来源）理解为本地仓库通讯录里保存的远程仓库地址：它通常是默认的协作对象，但也可以改名或改指向。"
mechanism: "Git 将远程仓库以名称和 URL 的形式写入本地配置，git fetch、git pull 等命令再通过 Origin（来源）定位远程；实际指向应检查 .git/config 和远程仓库响应。"
why_it_matters: "理解 Origin（来源）能帮助你区分本地分支、远程跟踪分支和远程仓库地址，排查拉取、推送或仓库迁移问题时也不容易指错对象。"
project_example: "在 Vibe Terms 的建立环境阶段，可以运行 git remote -v 检查 Origin（来源）的 URL，再用 git fetch origin 验证本地记录是否能访问目标仓库。"
ai_prompt_example: "请检查这个项目的 Origin（来源）：读取 Git 远程配置，说明它指向哪个仓库，不要修改远程地址，并用只读命令验证结果。"
common_mistake: "不要把 Origin（来源）误认为当前分支或远程跟踪分支；它只是本地配置中的远程仓库名称和地址。"
