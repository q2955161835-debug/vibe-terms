title: 認証
short_definition: ユーザーが誰であるかを証明するプロセス。
analogy: システムがどのアカウントがあなたのものであるかを認識する前に、入り口でIDを提示します。
why_it_matters: ログイン機能はセキュリティに配慮したものであり、AIによって無造作に発明されるべきではありません。
ai_prompt_example: 既存の認証プロバイダーを使用し、サーバー側で承認チェックを行います。カスタムのパスワードシステムを作成しないでください。
common_mistake: 認証 (あなたは誰ですか?) と認可 (何ができるの?) を混同しています。
status: draft
source_content_version: 1
mechanism: Authenticationは資格情報や認証プロバイダーの検証結果から本人性を確かめ、後続処理で使えるidentityを確立します。
project_example: Vibe Termsではアカウント機能を未導入のため、認証を追加せず、匿名利用との境界を要件として確認します。
