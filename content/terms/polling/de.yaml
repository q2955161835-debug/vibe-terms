title: Umfrage
short_definition: Wiederholtes Anfordern einer Ressource in regelmäßigen Abständen, um zu überprüfen, ob sich Daten oder Status
  geändert haben.
analogy: 'Für Umfrage hilft ein Bild aus Backend & APIs: Das Etikett weist auf das Problemfeld, ersetzt aber weder den Code
  noch die Prüfung des Datenflusses.'
mechanism: Wiederholtes Anfordern einer Ressource in regelmäßigen Abständen, um zu überprüfen, ob sich Daten oder Status geändert
  haben. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Umfrage versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Umfrage in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Umfrage in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Umfrage als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
