title: "有机设计"
short_definition: "使用自然形式、朴实的调色板、纹理、不对称和柔和的几何形状的视觉方向。"
analogy: "将有机设计视为开发工作台的 UI/UX 与无障碍部分中的带标签的工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自于实现。"
mechanism: "使用自然形式、朴实的调色板、纹理、不对称和柔和的几何形状的视觉方向。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解有机设计可以让 Vibe Coding 初学者说出他们所指的确切 UI/UX 与无障碍问题，并要求 AI 编程代理进行更改以及行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者到达设计阶段时，使用有机设计作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释有机设计如何应用于该项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将有机设计一词视为实现正确的证据，而不检查实际行为、数据流、权限、失败案例或相关测试。"
status: draft
