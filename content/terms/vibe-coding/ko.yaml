title: 바이브 코딩
short_definition: AI 코딩 도우미에게 원하는 결과를 설명하고, 생성된 내용을 검토하며 반복적으로 개선해 소프트웨어를 만드는 방식.
analogy: 매우 빠른 초급 개발자에게 원하는 것을 말하고, 결과물을 받을 때마다 확인하는 것과 같습니다.
why_it_matters: 초보자도 실제 소프트웨어를 만들 수 있지만 AI가 무엇을 바꿨는지 판단할 기본 용어는 여전히 필요합니다.
ai_prompt_example: 이 기능을 작은 단계로 나누세요. 수정하기 전에 어떤 파일을 바꿀지와 결과를 확인하는 방법을 설명하세요.
common_mistake: “실행된다”는 사실을 설계가 올바르고 안전하다는 증거로 보는 것.
status: draft
source_content_version: 1
