title: Retrieval-Augmented Generation
short_definition: 'Retrieval-Augmented Generation — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A pattern that retrieves relevant external information and provides it to a generative model before it answers.'
analogy: Retrieval-Augmented Generation можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Retrieval-Augmented Generation — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A pattern that retrieves relevant external information and provides it to a generative model before it answers.'
why_it_matters: Понимание Retrieval-Augmented Generation помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Retrieval-Augmented Generation помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Retrieval-Augmented Generation в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Retrieval-Augmented Generation доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
