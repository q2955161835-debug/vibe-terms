title: Активное состояние
short_definition: Визуальное или поведенческое состояние элемента управления во время его активации, например при
  нажатии мыши или сенсорном нажатии.
analogy: 'Проще представить «Активное состояние» как правило работы в разделе «Фронтенд-разработка»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Активное состояние»: Визуальное или поведенческое состояние элемента управления во время
  его активации, например при нажатии мыши или сенсорном нажатии. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Активное состояние» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Активное состояние» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Активное состояние». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Активное состояние» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
