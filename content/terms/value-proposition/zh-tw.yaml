title: "價值主張"
short_definition: "簡要解釋產品可以幫助誰、它能帶來什麼有價值的結果以及為什麼它比替代品更可取。"
analogy: "將價值主張視為工作坊產品和需求部分中的標記工具：標籤告訴您要檢查哪些問題領域，但真正的行為仍然來自實作。"
mechanism: "簡單解釋產品可以幫助誰、它能帶來什麼有價值的結果，以及為什麼它比其他產品更可取。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解價值主張讓 Vibe 編碼初學者能夠準確地說出他們所指的產品和要求問題，並向 AI 編碼代理請求修改並提供行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到要求階段時，使用價值主張作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋價值主張如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「價值主張」視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
