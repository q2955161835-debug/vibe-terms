title: प्रॉम्प्ट
short_definition: वह निर्देश या संदर्भ जो एआई मॉडल की अगली प्रतिक्रिया या कार्रवाई को दिशा देता है।
analogy: काम शुरू होने से पहले ठेकेदार को दी गई स्पष्ट कार्य-सूचना की तरह।
why_it_matters: स्पष्ट प्रॉम्प्ट अनुमान कम करते हैं और एआई के बदलावों की समीक्षा आसान बनाते हैं।
ai_prompt_example: ऐसा सर्च बॉक्स जोड़ो जो शीर्षक, उपनाम और परिभाषा से शब्द फ़िल्टर करे। मौजूदा लेआउट
  न बदलो।
common_mistake: अस्पष्ट आवश्यकता को स्पष्ट करने के बजाय केवल प्रॉम्प्ट लंबा करते जाना।
