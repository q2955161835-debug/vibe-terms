title: 出力エンコーディング
short_definition: 出力コンテキストのデータをエスケープして、実行可能な HTML、JavaScript、SQL、または別の言語ではなくデータとして扱われるようにします。
analogy: 出力エンコーディングは、ワークショップのセキュリティとプライバシーの部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査する必要があるかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: 出力コンテキストのデータをエスケープして、実行可能な HTML、JavaScript、SQL、または別の言語ではなくデータとして扱われるようにします。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: 出力エンコーディングを知ることで、Vibe Codingの初心者は、セキュリティとプライバシーに関する懸念を正確に挙げて、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がテスト保護段階に到達したときに語彙チェックポイントとして 出力エンコーディングを使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: 出力エンコーディングがこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー
  フローを示します。
common_mistake: 出力エンコーディング という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
