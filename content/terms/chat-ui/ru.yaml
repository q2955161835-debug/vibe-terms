title: Chat UI
short_definition: 'Chat UI — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An interface pattern combining conversation history, message composition, sending state, and failure or retry behavior.'
analogy: Chat UI можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Chat UI — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An interface pattern combining conversation history, message composition, sending state, and failure or retry behavior.'
why_it_matters: Понимание Chat UI помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Chat UI помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Chat UI в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Chat UI доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
