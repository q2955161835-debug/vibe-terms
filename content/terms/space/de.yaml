title: Abstand
short_definition: Bewusster leerer Abstand, der verwendet wird, um verwandte Elemente zu gruppieren, nicht verwandte Elemente
  zu trennen und einen lesbaren visuellen Rhythmus zu schaffen.
analogy: 'Ordne Raum im Bereich Frontend-Entwicklung als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch erst die
  konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Bewusster leerer Abstand, der verwendet wird, um verwandte Elemente zu gruppieren, nicht verwandte Elemente zu
  trennen und einen lesbaren visuellen Rhythmus zu schaffen. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Raum versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Raum in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Raum in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Raum als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
