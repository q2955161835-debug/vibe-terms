title: OpenID Connect
short_definition: Уровень идентификации, созданный на основе OAuth 2.0, который стандартизирует данные для входа
  и идентификации.
analogy: '«OpenID Connect» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «OpenID Connect»: Уровень идентификации, созданный на основе OAuth 2.0, который стандартизирует
  данные для входа и идентификации. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «OpenID Connect» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «OpenID Connect» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «OpenID Connect». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «OpenID Connect» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
