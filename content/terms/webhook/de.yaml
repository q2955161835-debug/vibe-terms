title: Webhook
short_definition: Ein ausgehender HTTP-Rückruf, der gesendet wird, wenn ein Ereignis eintritt, damit ein anderes System ohne
  kontinuierliche Abfrage reagieren kann.
analogy: 'Ein praktischer Vergleich für Webhook: ein markiertes Werkzeug in Backend & APIs, dessen Zweck erst im Zusammenspiel
  mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Ein ausgehender HTTP-Rückruf, der gesendet wird, wenn ein Ereignis eintritt, damit ein anderes System ohne kontinuierliche
  Abfrage reagieren kann. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Webhook versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Webhook in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Webhook in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Webhook als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
