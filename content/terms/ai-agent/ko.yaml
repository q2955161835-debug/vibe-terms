title: AI 에이전트
short_definition: 다음 행동을 반복해서 판단하고, 도구를 사용하며, 결과를 확인하면서 목표를 향해 진행하는 AI 시스템.
analogy: 업무 설명을 읽고 허용된 도구를 사용한 뒤 결과를 확인하고 다음 단계를 정하는 작업자와 비슷합니다.
why_it_matters: 코딩 에이전트는 파일을 수정하고 명령을 실행할 수 있으므로 권한 범위와 검토 지점이 중요합니다.
ai_prompt_example: 저장소를 조사해 계획을 제안하고, 승인된 파일만 수정하세요. 테스트를 실행한 뒤 멈추고 변경 사항을 보고하세요.
common_mistake: 검증 단계 없이 에이전트에게 넓은 권한과 모호한 목표를 주는 것.
status: draft
source_content_version: 1
