title: Защитные ограничения (Guardrail)
short_definition: Технический или процедурный контроль, который ограничивает, проверяет, фильтрует или требует одобрения
  рискованного поведения ИИ.
analogy: 'Проще представить «Защитное ограничение» как правило работы в разделе «ИИ и Vibe Coding»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «Защитное ограничение»: Технический или процедурный контроль, который ограничивает, проверяет,
  фильтрует или требует одобрения рискованного поведения ИИ. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Защитные ограничения (Guardrail)» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Защитное ограничение» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Защитное ограничение». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Защитное ограничение» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
