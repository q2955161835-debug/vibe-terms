title: "使用者需求"
short_definition: "以使用者為中心的產品應協助滿足的目標、問題或功能的陳述。"
analogy: "在產品規劃中，可把「使用者需求」當成把需求轉成決策的工具：它聚焦於「以使用者為中心的產品應協助滿足的目標、問題或功能的陳述」。"
mechanism: "以使用者為中心的產品應協助滿足的目標、問題或功能的陳述。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解使用者需求後，Vibe Coding 初學者可以準確指出相關的產品與需求問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「使用者需求」放進需求文件、使用者流程或驗收條件中：檢查重點是「以使用者為中心的產品應協助滿足的目標、問題或功能的陳述」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「使用者需求」為例，說明如何實現「以使用者為中心的產品應協助滿足的目標、問題或功能的陳述」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「使用者需求」這個名稱就判定已經正確實作；請根據「以使用者為中心的產品應協助滿足的目標、問題或功能的陳述」檢查實際行為、資料流、錯誤情境與測試結果。"
