title: "SQL 注入"
short_definition: "不可信输入更改数据库查询结构而不是剩余数据的漏洞。"
analogy: "可以把“SQL 注入”看成安全与隐私里的一个概念标签：它提醒你先找“不可信输入更改数据库查询结构而不是剩余数据的漏洞。”对应的实现，最后仍要以代码、配置和实际行为为准。"
mechanism: "实现上，这一概念会围绕“不可信输入更改数据库查询结构而不是剩余数据的漏洞。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“SQL 注入”后，你能更准确地描述安全与隐私里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的测试与保护阶段，可以把“SQL 注入”放到一个真实项目中：围绕“不可信输入更改数据库查询结构而不是剩余数据的漏洞。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“SQL 注入”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“不可信输入更改数据库查询结构而不是剩余数据的漏洞”。"
