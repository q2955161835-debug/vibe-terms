title: OpenID Connect
short_definition: 'OpenID Connect ist ein Begriff aus „Sicherheit & Datenschutz“. Der deutsche Text ist derzeit ein noch nicht redigierter Entwurf. Englische Referenzdefinition: An identity layer built on OAuth 2.0 that standardizes sign-in and identity information.'
analogy: Man kann OpenID Connect zunächst wie ein beschriftetes Werkzeug im Software-Werkzeugkasten betrachten; in der Praxis zählen jedoch Code, Datenfluss und Nutzungskontext.
mechanism: 'OpenID Connect ist ein Begriff aus „Sicherheit & Datenschutz“. Der deutsche Text ist derzeit ein noch nicht redigierter Entwurf. Englische Referenzdefinition: An identity layer built on OAuth 2.0 that standardizes sign-in and identity information.'
why_it_matters: Wer OpenID Connect versteht, kann einem KI-Coding-Agenten genauer sagen, welcher Teil des Systems gemeint ist, und überprüfbare Nachweise verlangen.
project_example: Wer OpenID Connect versteht, kann einem KI-Coding-Agenten genauer sagen, welcher Teil des Systems gemeint ist, und überprüfbare Nachweise verlangen.
ai_prompt_example: Erkläre, wie OpenID Connect in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen, ändere nur das Nötige und beschreibe die Verifikation.
common_mistake: Den Begriff OpenID Connect als Beweis für eine korrekte Implementierung zu behandeln, ohne Verhalten, Datenfluss und Fehlerfälle zu prüfen.
