title: "假設"
short_definition: "將介入或產品變更與預期使用者或業務成果連結起來的可測試預測。"
analogy: "將假設視為工作坊產品和需求部分中的標籤工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "將介入或產品變更與預期使用者或業務成果連結起來的可測試預測。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "已知假設讓 Vibe 編碼初學者能夠準確命名他們所指的產品和需求問題，並要求 AI 編碼代理進行修改以及證明行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到要求階段時，使用假設作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋假設如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「假設」視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
status: draft
source_content_version: 1
