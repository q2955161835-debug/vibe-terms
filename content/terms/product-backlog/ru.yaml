title: Product Backlog
short_definition: 'Product Backlog — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A prioritized list of product work, problems, ideas, and technical tasks that may be considered for future delivery.'
analogy: Product Backlog можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Product Backlog — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A prioritized list of product work, problems, ideas, and technical tasks that may be considered for future delivery.'
why_it_matters: Понимание Product Backlog помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Product Backlog помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Product Backlog в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Product Backlog доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
