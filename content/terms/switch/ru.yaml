title: Выключатель
short_definition: Элемент управления с двумя состояниями, используемый для включения или выключения параметра или
  возможности.
analogy: 'Представьте «Switch» как инструмент в наборе разработчика: он решает задачу в области «UI/UX и доступность»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Switch»: Элемент управления с двумя состояниями, используемый для включения или выключения
  параметра или возможности. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Выключатель» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Switch» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Switch». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Switch» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
