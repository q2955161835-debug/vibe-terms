title: Brotkrümelnavigation
short_definition: Ein hierarchischer Pfad, der den aktuellen Standort des Benutzers und Links zu übergeordneten
  Ebenen anzeigt.
analogy: 'Ein praktischer Vergleich für Brotkrümelnavigation: ein markiertes Werkzeug in UI/UX & Barrierefreiheit, dessen
  Zweck erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Ein hierarchischer Pfad, der den aktuellen Standort des Benutzers und Links zu übergeordneten Ebenen
  anzeigt. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Brotkrümelnavigation versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Brotkrümelnavigation in der Phase Design als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Brotkrümelnavigation in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Brotkrümelnavigation als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
