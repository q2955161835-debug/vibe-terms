title: CRUD
short_definition: 'Die vier grundlegenden Datenoperationen: Erstellen, Lesen, Aktualisieren und Löschen.'
analogy: Betrachte CRUD als Orientierung in Backend & APIs. Die Bezeichnung führt zur richtigen technischen Stelle, garantiert
  aber noch keine gute Umsetzung.
mechanism: 'Die vier grundlegenden Datenoperationen: Erstellen, Lesen, Aktualisieren und Löschen. In einem realen Projekt
  hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.'
why_it_matters: Wer CRUD versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Backend & APIs benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir CRUD in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie CRUD in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff CRUD als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
