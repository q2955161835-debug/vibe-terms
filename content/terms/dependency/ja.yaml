title: 依存関係
short_definition: システムの別の部分が依存する外部コード、パッケージ、サービス、またはコンポーネント。
analogy: 依存関係は、ワークショップのコンピューティングおよび開発環境の一部にあるラベル付きツールであると考えてください。ラベルは、どの問題領域を検査するかを示しますが、実際の動作は依然として実装から得られます。
mechanism: システムの別の部分が依存する外部コード、パッケージ、サービス、またはコンポーネント。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: 依存関係を知ることで、Vibe Codingの初心者は、コンピューティングおよび開発環境に関する関連する課題を正確に言語化し、AIコーディングエージェントに変更とその動作が正しいという証拠を求めることができます。
project_example: Vibe Termsでは、学習者が環境段階に到達したときに語彙チェックポイントとして 依存関係を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: 依存関係がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: 依存関係 という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
