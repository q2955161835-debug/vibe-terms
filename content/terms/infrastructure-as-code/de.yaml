title: Infrastruktur als Code
short_definition: Verwaltung der Infrastrukturkonfiguration durch versionierten, überprüfbaren Code statt manueller Konsolenänderungen.
analogy: Betrachte Infrastruktur als Code als Orientierung in Deployment & Betrieb. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Verwaltung der Infrastrukturkonfiguration durch versionierten, überprüfbaren Code statt manueller Konsolenänderungen.
  In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die
  konkrete Umsetzung.
why_it_matters: Wer Infrastruktur als Code versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Deployment & Betrieb
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Infrastruktur als Code in der Phase Deployment & Wartung als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Infrastruktur als Code in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Infrastruktur als Code als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
