title: Выходное кодирование
short_definition: Экранирование данных для выходного контекста, чтобы они обрабатывались как данные, а не как исполняемый
  файл HTML, JavaScript, SQL или другой язык.
analogy: 'Проще представить «Кодирование вывода» как правило работы в разделе «Безопасность и приватность»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Кодирование вывода»: Экранирование данных для выходного контекста, чтобы они обрабатывались
  как данные, а не как исполняемый файл HTML, JavaScript, SQL или другой язык. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Выходное кодирование» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Кодирование вывода» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Кодирование вывода». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Кодирование вывода» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
