title: Benchmark
short_definition: 'Benchmark — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A standardized dataset or task suite used to compare models or systems under the same evaluation conditions.'
analogy: Benchmark можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Benchmark — термин из раздела «ИИ и Vibe Coding». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A standardized dataset or task suite used to compare models or systems under the same evaluation conditions.'
why_it_matters: Понимание Benchmark помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Benchmark помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Benchmark в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Benchmark доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
