title: User Flow
short_definition: 'User Flow — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A diagram or sequence showing the steps and branches a user takes to complete one task.'
analogy: User Flow можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'User Flow — термин из раздела «Продукт и требования». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A diagram or sequence showing the steps and branches a user takes to complete one task.'
why_it_matters: Понимание User Flow помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание User Flow помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль User Flow в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название User Flow доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
