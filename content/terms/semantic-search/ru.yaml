title: Семантический поиск
short_definition: Поиск, который использует значения или встраивания, а не полагается только на точные совпадения
  ключевых слов.
analogy: 'Представьте «Семантический поиск» как инструмент в наборе разработчика: он решает задачу в области «ИИ
  и Vibe Coding», но результат зависит от настройки.'
mechanism: 'Как работает «Семантический поиск»: Поиск, который использует значения или встраивания, а не полагается
  только на точные совпадения ключевых слов. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Семантический поиск» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Семантический поиск» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Семантический поиск». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Семантический поиск» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
