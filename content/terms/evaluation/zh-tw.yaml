title: "評估"
short_definition: "用於測量模型或 AI 系統根據定義的範例、標準或評分器執行情況的可重複流程。"
analogy: "在 AI 協作中，可以把「評估」看成一個檢查點：先確認「用於測量模型或 AI 系統根據定義的範例、標準或評分器執行情況的可重複流程」，再用實際輸出檢查結果。"
mechanism: "一個可重複的過程，用於測量模型或 AI 系統針對定義的範例、標準或評分器的效能。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解評估後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「評估」放進提示、模型輸出或評估紀錄中：檢查重點是「用於測量模型或 AI 系統根據定義的範例、標準或評分器執行情況的可重複流程」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「評估」為例，說明如何實現「用於測量模型或 AI 系統根據定義的範例、標準或評分器執行情況的可重複流程」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「評估」這個名稱就判定已經正確實作；請根據「用於測量模型或 AI 系統根據定義的範例、標準或評分器執行情況的可重複流程」檢查實際行為、資料流、錯誤情境與測試結果。"
