title: Генерация с дополнением поиска
short_definition: Шаблон, который извлекает соответствующую внешнюю информацию и передает ее генеративной модели,
  прежде чем она ответит.
analogy: 'Проще представить «Генерация с дополнением поиска» как правило работы в разделе «ИИ и Vibe Coding»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Генерация с дополнением поиска»: Шаблон, который извлекает соответствующую внешнюю информацию
  и передает ее генеративной модели, прежде чем она ответит. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Генерация с дополнением поиска» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Генерация с дополнением поиска» в одном пользовательском потоке или
  тесте, зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Генерация с дополнением поиска». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Генерация с дополнением поиска» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
