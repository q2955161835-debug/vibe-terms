title: "威脅模型"
short_definition: "對系統的資產、信任邊界、攻擊者、濫用案例和緩解措施的結構化分析。"
analogy: "在安全設計中，「威脅模型」像一道需要驗證的門檻：它涉及「對系統的資產、信任邊界、攻擊者、濫用案例和緩解措施的結構化分析」，不能只看名稱就判定安全。"
mechanism: "對系統的資產、信任邊界、攻擊者、濫用案例和緩解措施的結構化分析。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解威脅模型後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「威脅模型」放進登入流程、權限檢查或安全日誌中：檢查重點是「對系統的資產、信任邊界、攻擊者、濫用案例和緩解措施的結構化分析」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「威脅模型」為例，說明如何實現「對系統的資產、信任邊界、攻擊者、濫用案例和緩解措施的結構化分析」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「威脅模型」這個名稱就判定已經正確實作；請根據「對系統的資產、信任邊界、攻擊者、濫用案例和緩解措施的結構化分析」檢查實際行為、資料流、錯誤情境與測試結果。"
