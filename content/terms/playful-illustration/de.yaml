title: Verspielte Illustration
short_definition: Eine visuelle Ausrichtung mit ausdrucksstarken Illustrationen, freundlichen Formen oder Charakteren, um
  eine Benutzeroberfläche leichter und zugänglicher wirken zu lassen.
analogy: 'Ordne Verspielte Illustration im Bereich UI/UX & Barrierefreiheit als Werkzeug ein: Die Bezeichnung grenzt die Frage
  ein, doch erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Eine visuelle Ausrichtung mit ausdrucksstarken Illustrationen, freundlichen Formen oder Charakteren, um eine Benutzeroberfläche
  leichter und zugänglicher wirken zu lassen. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Verspielte Illustration versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Verspielte Illustration in der Phase Design als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Verspielte Illustration in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Verspielte Illustration als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
