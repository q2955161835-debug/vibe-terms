title: "终端"
short_definition: "一个基于文本的应用程序，用于运行 shell 命令、检查输出以及与开发工具交互。"
analogy: "可以把“终端”看成计算机与开发环境里的一个概念标签：它提醒你先找“一个基于文本的应用程序，用于运行 shell 命令、检查输出以及与开发工具交互。”对应的实现，最后仍要以代码、配置和实际行为为准。"
mechanism: "实现上，这一概念会围绕“一个基于文本的应用程序，用于运行 shell 命令、检查输出以及与开发工具交互。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "掌握“终端”后，你能更准确地描述计算机与开发环境里的问题，让 AI 知道要检查或修改什么，并要求它给出可复现的验证结果。"
project_example: "在 Vibe Terms 的建立环境阶段，可以把“终端”放到一个真实项目中：围绕“一个基于文本的应用程序，用于运行 shell 命令、检查输出以及与开发工具交互。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“终端”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“一个基于文本的应用程序，用于运行 shell 命令、检查输出以及与开发工具交互”。"
