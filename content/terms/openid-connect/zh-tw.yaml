title: "OpenID Connect"
short_definition: "基於 OAuth 2.0 所建置的身分層，用於標準化登入和識別資訊。"
analogy: "在安全設計中，「OpenID Connect」像一道需要驗證的門檻：它涉及「基於 OAuth 2.0 所建置的身分層，用於標準化登入和識別資訊」，不能只看名稱就判定安全。"
mechanism: "基於 OAuth 2.0 建構的身分層，用於標準化登入和識別資訊。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 OpenID Connect 後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「OpenID Connect」放進登入流程、權限檢查或安全日誌中：檢查重點是「基於 OAuth 2.0 所建置的身分層，用於標準化登入和識別資訊」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「OpenID Connect」為例，說明如何實現「基於 OAuth 2.0 所建置的身分層，用於標準化登入和識別資訊」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「OpenID Connect」這個名稱就判定已經正確實作；請根據「基於 OAuth 2.0 所建置的身分層，用於標準化登入和識別資訊」檢查實際行為、資料流、錯誤情境與測試結果。"
