locale: ru
title: Выпустить full-stack-приложение
summary: Проведите небольшой продукт от интерфейса и API до модели данных, тестов и проверки работающего релиза
status: draft
source_content_version: 1
chapters:
- id: product-scope
  title: Определить границы продукта
  summary: Выберите узкий результат пользователя и запишите наблюдаемые критерии приемки.
  outcome: Ограниченный продуктовый бриф с критериями приемки.
  checkpoint: Можно назвать исключенное из первого релиза.
- id: architecture
  title: Нанести границу системы
  summary: Покажите обязанности браузера, API и данных и направление важных потоков.
  outcome: Небольшая архитектурная схема.
  checkpoint: У каждой обязанности один владелец без дублирования правил.
- id: data-model
  title: Смоделировать долговечные данные
  summary: Определите записи, идентификаторы, связи и ограничения до операций записи.
  outcome: Документированная схема данных.
  checkpoint: Модель не допускает дубликаты и осиротевшие данные.
- id: api-design
  title: Спроектировать API
  summary: Опишите маршруты, валидацию запросов, ответы и коды состояния.
  outcome: Контракт API с примерами.
  checkpoint: Клиент проходит основной поток без недокументированных полей.
- id: authentication
  title: Защитить доступ пользователей
  summary: Определите права, аутентифицируйте пользователя и примените авторизацию на серверной границе.
  outcome: Политика доступа и поток защищенной конечной точки.
  checkpoint: Неавторизованный запрос не читает и не меняет защищенные данные.
- id: frontend-flow
  title: Собрать поток в браузере
  summary: Реализуйте задачу с видимыми состояниями загрузки, успеха и пустого результата.
  outcome: Рабочий экран главного потока.
  checkpoint: Состояние браузера соответствует последнему успешному ответу сервера.
- id: validation-and-errors
  title: Сделать ошибки исправимыми
  summary: Проверяйте ввод на границах клиента и сервера и показывайте, что исправить или повторить.
  outcome: Ошибки полей и восстанавливаемые ошибки запросов.
  checkpoint: Плохие данные отклоняются без частичной записи.
- id: testing
  title: Проверить связанную систему
  summary: Покройте правила, API и основной путь браузера минимальным полезным набором тестов.
  outcome: Повторяемый набор тестов ключевого потока.
  checkpoint: Регрессия основного пути ломает соответствующий тест.
- id: deployment
  title: Развернуть с операционными проверками
  summary: Задайте имена несекретных переменных, автоматизируйте проверку и осмотрите сервис после релиза.
  outcome: Процедура развертывания и проверка здоровья.
  checkpoint: Развернутое приложение проходит основной поток.
- id: iteration
  title: Выбрать следующее улучшение
  summary: Используйте обратную связь и измеряемый сигнал для одной небольшой доработки.
  outcome: Приоритетная заметка следующей итерации.
  checkpoint: Изменение связано с доказательством, а не с расплывчатым запросом.
