title: Serif vs. Sans Serif
short_definition: Zwei große Schriftkategorien, die sich durch das Vorhandensein bzw. Fehlen von Abschlussstrichen auf Buchstabenformen
  unterscheiden.
analogy: 'Ein praktischer Vergleich für Serif vs. Sans Serif: ein markiertes Werkzeug in Frontend-Entwicklung, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Zwei große Schriftkategorien, die sich durch das Vorhandensein bzw. Fehlen von Abschlussstrichen auf Buchstabenformen
  unterscheiden. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Serif vs. Sans Serif versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Serif vs. Sans Serif in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Serif vs. Sans Serif in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Serif vs. Sans Serif als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
