title: Запрос
short_definition: Сообщение, отправляемое клиентом серверу с просьбой получить, создать, изменить или обработать
  что-либо.
analogy: '«запрос» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «запрос»: Сообщение, отправляемое клиентом серверу с просьбой получить, создать, изменить
  или обработать что-либо. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Запрос» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «запрос» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «запрос». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «запрос» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
