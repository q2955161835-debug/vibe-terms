title: "上下文視窗"
short_definition: "模型一次可以考慮的文字和其他輸入的數量有限。"
analogy: "辦公桌：一旦裝滿，必須先將舊檔案移走，然後才能放置新檔案。"
why_it_matters: "了解上下文視窗後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
ai_prompt_example: "在繼續之前，先總結目前的架構、限制、已完成的工作以及下一步的任務。"
common_mistake: "假設模型永遠記住每個早期的檔案和決策。"
status: draft
source_content_version: 1
