title: "模型路由"
short_definition: "在執行時會根據任務型別、功能、成本、延遲或風險在不同模型之間進行選擇。"
analogy: "將模型路由視為工作坊的 AI & vibe 編碼部分中的標記工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "在執行時根據任務型別、功能、成本、延遲或風險在不同模型之間進行選擇。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解模型路由讓 Vibe 編碼初學者能夠準確命名他們所指的 AI 和 vibe 編碼問題，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到需求階段時，使用模型路由作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋模型路由如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「模型路由」視為實作正確的證據，而不檢查實際行為、資料流、權限、故障案例或相關測試。"
