title: Keyboard Navigation
short_definition: 'Keyboard Navigation — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The ability to reach and operate interactive functionality without requiring a pointing device.'
analogy: Keyboard Navigation можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Keyboard Navigation — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The ability to reach and operate interactive functionality without requiring a pointing device.'
why_it_matters: Понимание Keyboard Navigation помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Keyboard Navigation помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Keyboard Navigation в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Keyboard Navigation доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
