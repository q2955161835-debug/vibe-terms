title: API
short_definition: एक तय तरीका जिससे एक सॉफ़्टवेयर दूसरे सॉफ़्टवेयर से डेटा या कोई काम करने का अनुरोध करता
  है।
analogy: रेस्तराँ का मेन्यू बताता है कि आप क्या मँगवा सकते हैं, बिना रसोई में गए।
why_it_matters: एआई कोडिंग में फ्रंटएंड, डेटाबेस, मॉडल प्रदाता और बाहरी सेवाएँ अक्सर API से जुड़ती हैं।
ai_prompt_example: इम्प्लीमेंट करने से पहले GET /api/terms का API अनुबंध लिखो, जिसमें अनुरोध पैरामीटर,
  उत्तर के फ़ील्ड और त्रुटि स्थितियाँ हों।
common_mistake: API अनुबंध को उसे लागू करने वाले अंदरूनी कोड के समान समझ लेना।
status: draft
source_content_version: 1
