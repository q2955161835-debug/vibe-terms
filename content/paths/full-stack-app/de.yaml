locale: de
title: Eine Full-Stack-App entwickeln
summary: Eine vollständige Anwendung von Problem und Oberfläche über API und Datenhaltung bis zu Tests und sicherem Release
  planen
status: draft
source_content_version: 1
chapters:
- id: product-scope
  title: Produktumfang definieren
  summary: Wähle ein konkretes Nutzerproblem und halte fest, welche Funktionen in den ersten Release gehören und welche nicht.
  outcome: Ein begrenztes Produktbriefing.
  checkpoint: Anfragen außerhalb des Umfangs werden klar abgelehnt oder weitergeleitet.
- id: architecture
  title: Die Architektur festlegen
  summary: Dokumentiere Module, Systemgrenzen und Schnittstellen, bevor du Implementierungsdetails verbindest.
  outcome: Ein versioniertes Architekturdiagramm und ein Modulplan.
  checkpoint: Jede Änderung lässt sich einer begründeten Systemgrenze zuordnen.
- id: data-model
  title: Das Datenmodell definieren
  summary: Beschreibe Entitäten, Beziehungen, Constraints und die Lebensdauer der Daten.
  outcome: Ein nachvollziehbares Datenmodell.
  checkpoint: Ungültige oder unvollständige Daten werden an der passenden Grenze erkannt.
- id: api-design
  title: Die API entwerfen
  summary: Spezifiziere Anfragefelder, Antwortform, Statuscodes und Fehler-Payload vor dem Anschluss der Oberfläche.
  outcome: Ein Beispielvertrag für Anfrage und Antwort.
  checkpoint: Ungültige Eingaben liefern eine nützliche, dokumentierte Fehlerform.
- id: authentication
  title: Authentifizierung und Autorisierung prüfen
  summary: Lege fest, wer welche Operation ausführen darf, und beschreibe Token-, Sitzungs- und Fehlerverhalten.
  outcome: Ein dokumentiertes Berechtigungsmodell.
  checkpoint: Nicht autorisierte Anfragen werden ohne Datenleck abgewiesen.
- id: frontend-flow
  title: Den Frontend-Fluss bauen
  summary: Erstelle eine lesbare Oberfläche mit klaren Eingabe-, Lade-, Erfolgs-, Leer- und Fehlerzuständen.
  outcome: Ein zugänglicher Frontend-Nutzerfluss.
  checkpoint: Benutzer können Aktion, Ergebnis und laufende Verarbeitung unterscheiden.
- id: validation-and-errors
  title: Validierung und Fehler behandeln
  summary: Prüfe Eingaben an jeder Systemgrenze und gib wiederherstellbare, verständliche Fehler zurück.
  outcome: Ein Validierungs- und Fehlerkonzept.
  checkpoint: Ungültige Eingaben erreichen keine ungeschützte Datenoperation.
- id: testing
  title: Die Anwendung testen
  summary: Leite aus dem Vertrag repräsentative Unit-, Integrations- und End-to-End-Fälle ab.
  outcome: Ein kleiner wiederholbarer Testsatz.
  checkpoint: Die Tests unterscheiden erwartetes Verhalten von Fehlerfällen.
- id: deployment
  title: Den Release bereitstellen
  summary: Prüfe Build, Konfiguration und wichtigste Nutzerflüsse, bevor du einen kleinen Release ausrollst.
  outcome: Eine Release-Checkliste.
  checkpoint: Der bereitgestellte Release besteht die Kernprüfungen und zeigt bekannte Grenzen.
- id: iteration
  title: Mit Feedback iterieren
  summary: Sammle nur aufgabenbezogenes Feedback und übersetze es in überprüfbare nächste Änderungen.
  outcome: Ein begrenzter Verbesserungsplan.
  checkpoint: Jede Iteration nennt Problem, Änderung und Verifikation.
