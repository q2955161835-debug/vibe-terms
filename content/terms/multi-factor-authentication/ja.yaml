title: 多要素認証
short_definition: パスワードやデバイスの所有など、2 つ以上の独立した要素タイプからの証拠を必要とする認証。
analogy: 多要素認証は、ワークショップのセキュリティとプライバシーの部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査する必要があるかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: パスワードやデバイスの所有など、2 つ以上の独立した要素タイプからの証拠を必要とする認証。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: 多要素認証を知ることで、Vibe Codingの初心者は、セキュリティとプライバシーに関する懸念を正確に挙げて、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がテスト保護段階に到達したときに語彙チェックポイントとして 多要素認証を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: 多要素認証がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: 多要素認証 という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
