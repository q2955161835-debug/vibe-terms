title: Infrastructure as Code
short_definition: Managing infrastructure Konfiguration durch versioned, reviewable Code rather than manual console ändert.
analogy: Betrachte Infrastructure as Code als Orientierungsschild in deployment operations. Es weist auf die richtige technische
  Stelle, ersetzt aber weder die Implementierung noch deren Prüfung.
mechanism: Managing infrastructure Konfiguration durch versioned, reviewable Code rather than manual console ändert. In einem
  realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Infrastructure as Code versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in deployment operations
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Infrastructure as Code in der Phase deploy maintain als Lerncheckpoint: Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Infrastructure as Code in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Infrastructure as Code als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
