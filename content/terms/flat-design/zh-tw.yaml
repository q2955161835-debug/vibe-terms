title: "平面設計"
short_definition: "一種視覺風格，喜歡簡單的形狀、純色和最小的模擬深度或物理紋理。"
analogy: "在介面設計中，「平面設計」像畫面上的一個互動零件：它對應「一種視覺風格，喜歡簡單的形狀、純色和最小的模擬深度或物理紋理」，也要透過實際操作檢查。"
mechanism: "一種視覺風格，喜歡簡單的形狀、純色和最小的模擬深度或物理紋理。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解平面設計後，Vibe Coding 初學者可以準確指出相關的 UI/UX 與無障礙問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在設計體驗階段，將「平面設計」放進頁面、互動元件或設計稿中：檢查重點是「一種視覺風格，喜歡簡單的形狀、純色和最小的模擬深度或物理紋理」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「平面設計」為例，說明如何實現「一種視覺風格，喜歡簡單的形狀、純色和最小的模擬深度或物理紋理」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「平面設計」這個名稱就判定已經正確實作；請根據「一種視覺風格，喜歡簡單的形狀、純色和最小的模擬深度或物理紋理」檢查實際行為、資料流、錯誤情境與測試結果。"
