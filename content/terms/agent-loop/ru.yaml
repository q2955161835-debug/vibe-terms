title: Агент Петля
short_definition: Повторяющийся цикл, в котором агент наблюдает за состоянием, выбирает действие, выполняет его,
  оценивает результат и решает, продолжать ли.
analogy: 'Представьте «Цикл агента» как инструмент в наборе разработчика: он решает задачу в области «ИИ и Vibe
  Coding», но результат зависит от настройки.'
mechanism: 'Как работает «Цикл агента»: Повторяющийся цикл, в котором агент наблюдает за состоянием, выбирает действие,
  выполняет его, оценивает результат и решает, продолжать ли. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Агент Петля» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Цикл агента» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Цикл агента». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Цикл агента» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
