title: HTTP-заголовок
short_definition: Метаданные, прикрепленные к HTTP-запросу или ответу, которые содержат такую ​​информацию, как
  тип контента, кэширование, аутентификация или файлы cookie.
analogy: 'Проще представить «HTTP-заголовок» как правило работы в разделе «Web и сети»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «HTTP-заголовок»: Метаданные, прикрепленные к HTTP-запросу или ответу, которые содержат
  такую ​​информацию, как тип контента, кэширование, аутентификация или файлы cookie. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «HTTP-заголовок» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «HTTP-заголовок» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «HTTP-заголовок». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «HTTP-заголовок» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
