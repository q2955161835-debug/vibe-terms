title: Mockup
short_definition: Eine statische Darstellung mit höherer Wiedergabetreue, wie ein Bildschirm oder ein visuelles Design aussehen
  soll.
analogy: 'Ein praktischer Vergleich für Mockup: ein markiertes Werkzeug in Produkt & Anforderungen, dessen Zweck erst
  im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Eine statische Darstellung mit höherer Wiedergabetreue, wie ein Bildschirm oder ein visuelles Design aussehen soll.
  In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die
  konkrete Umsetzung.
why_it_matters: Wer Mockup versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Mockup in der Phase Anforderungen als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Mockup in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Mockup als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
