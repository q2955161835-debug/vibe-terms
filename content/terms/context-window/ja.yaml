title: コンテキストウィンドウ
short_definition: モデルが一度に参照できる文章やその他の入力の量にある上限。
analogy: 作業机のようなものです。机がいっぱいになると、新しい資料を置く前に古い資料を片付ける必要があります。
why_it_matters: 長いコーディングセッションでは、重要な要件がモデルの現在の文脈から押し出されることがあります。
ai_prompt_example: 続ける前に、現在の構成、制約、完了した作業、次のタスクを要約してください。
common_mistake: モデルが以前見たすべてのファイルや判断を永久に覚えていると思うこと。
status: draft
source_content_version: 1
