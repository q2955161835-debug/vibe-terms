title: Репозиторий
short_definition: База данных Git и рабочий проект, содержащие историю версий, ссылки, конфигурацию и отслеживаемый
  контент.
analogy: 'Представьте «Repository» как инструмент в наборе разработчика: он решает задачу в области «Git и совместная
  работа», но результат зависит от настройки.'
mechanism: 'Как работает «Repository»: База данных Git и рабочий проект, содержащие историю версий, ссылки, конфигурацию
  и отслеживаемый контент. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Репозиторий» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Repository» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Repository». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Repository» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
