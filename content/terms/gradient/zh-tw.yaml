title: "漸層"
short_definition: "沿方向或形狀的兩種或多種顏色或不透明度值之間的平滑過渡。"
analogy: "在前端實作中，可把「漸層」想成介面的一個可組合零件：它處理「沿方向或形狀的兩種或多種顏色或不透明度值之間的平滑過渡」，並與畫面狀態互相配合。"
mechanism: "沿方向或形狀的兩個或多個顏色或不透明度值之間的平滑過渡。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解漸層後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立介面與邏輯階段，將「漸層」放進頁面、元件或樣式規則中：檢查重點是「沿方向或形狀的兩種或多種顏色或不透明度值之間的平滑過渡」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「漸層」為例，說明如何實現「沿方向或形狀的兩種或多種顏色或不透明度值之間的平滑過渡」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「漸層」這個名稱就判定已經正確實作；請根據「沿方向或形狀的兩種或多種顏色或不透明度值之間的平滑過渡」檢查實際行為、資料流、錯誤情境與測試結果。"
