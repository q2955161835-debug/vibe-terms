title: Диаграмма Ганта
short_definition: Визуализация временной шкалы, которая показывает задачи или рабочие потоки в виде промежутков
  времени, часто с вехами и зависимостями.
analogy: 'Проще представить «Gantt Chart» как правило работы в разделе «Продукт и требования»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Gantt Chart»: Визуализация временной шкалы, которая показывает задачи или рабочие потоки
  в виде промежутков времени, часто с вехами и зависимостями. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Диаграмма Ганта» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Gantt Chart» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Gantt Chart». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Gantt Chart» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
