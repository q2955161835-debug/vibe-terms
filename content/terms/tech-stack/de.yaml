title: Tech-Stack
short_definition: Der Satz an Sprachen, Frameworks, Bibliotheken, Datenbanken und Infrastruktur, die zum Erstellen und Betreiben
  eines Produkts ausgewählt wurden.
analogy: 'Ein praktischer Vergleich für Tech-Stack: ein markiertes Werkzeug in Computer & Entwicklungsumgebung, dessen Zweck
  erst im Zusammenspiel mit Code, Daten und Nutzung sichtbar wird.'
mechanism: Der Satz an Sprachen, Frameworks, Bibliotheken, Datenbanken und Infrastruktur, die zum Erstellen und Betreiben
  eines Produkts ausgewählt wurden. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und
  Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Tech-Stack versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Computer & Entwicklungsumgebung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Tech-Stack in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Tech-Stack in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Tech-Stack als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
