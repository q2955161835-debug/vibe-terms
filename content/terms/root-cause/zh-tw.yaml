title: 根因原因
short_definition: 根因原因 是「測試與除錯」中的術語。目前為待人工審校的草稿。英文標準定義：The underlying condition or design flaw that produces a failure, rather than a downstream symptom.
analogy: 可以先把 根因原因 想成軟體開發工具箱裡一個有明確用途的標籤；真正使用時仍要結合所在程式碼、資料流與使用者情境判斷。
mechanism: 根因原因 是「測試與除錯」中的術語。目前為待人工審校的草稿。英文標準定義：The underlying condition or design flaw that produces a failure, rather than a downstream symptom.
why_it_matters: 理解 根因原因 後，你能更準確地告訴 AI 你指的是系統的哪一部分，並要求它提供可驗證的實作證據。
project_example: 理解 根因原因 後，你能更準確地告訴 AI 你指的是系統的哪一部分，並要求它提供可驗證的實作證據。
ai_prompt_example: 解釋 根因原因 在這個專案中的作用。指出涉及的檔案或系統邊界，只做最小必要修改，並給出我可以驗證結果的步驟。
common_mistake: 只記住 根因原因 這個名詞，卻沒有檢查它在目前專案裡的真實行為、資料流與失敗情況。
