title: AutoComplete
short_definition: Ein Text Eingabe die zeigt suggestions as die Benutzer types zu speed Auswahl oder entry.
analogy: Betrachte AutoComplete als Orientierungsschild in UI/UX & Barrierefreiheit. Es weist auf die richtige technische
  Stelle, ersetzt aber weder die Implementierung noch deren Prüfung.
mechanism: Ein Text Eingabe die zeigt suggestions as die Benutzer types zu speed Auswahl oder entry. In einem realen Projekt
  hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer AutoComplete versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient AutoComplete in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie AutoComplete in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff AutoComplete als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
