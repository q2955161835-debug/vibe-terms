title: Инструменты разработчика браузера
short_definition: Интегрированные в браузер инструменты для проверки DOM, CSS, сетевых запросов, хранилища, производительности,
  вывода на консоль и отладки.
analogy: '«Инструменты разработчика браузера» похож на понятную табличку на нужном ящике: она направляет, однако
  содержимое все равно нужно проверить.'
mechanism: 'Как работает «Инструменты разработчика браузера»: Интегрированные в браузер инструменты для проверки
  DOM, CSS, сетевых запросов, хранилища, производительности, вывода на консоль и отладки. На практике механизм зависит
  от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Инструменты разработчика браузера» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Инструменты разработчика браузера» в одном пользовательском потоке
  или тесте, зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Инструменты разработчика браузера». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Инструменты разработчика браузера» доказательством правильной
  реализации и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
