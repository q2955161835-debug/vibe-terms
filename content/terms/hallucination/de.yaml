title: Halluzination
short_definition: Eine von der KI generierte Behauptung, die plausibel klingt, aber nicht unterstützt, falsch oder erfunden
  ist.
analogy: 'Ein praktischer Vergleich für Halluzination: ein markiertes Werkzeug in KI & Vibe Coding, dessen Zweck erst im Zusammenspiel
