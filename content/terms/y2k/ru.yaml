title: 2000 год
short_definition: Ретро-футуристический визуальный стиль, вдохновленный цифровой культурой конца 1990-х — начала
  2000-х годов, металлическими поверхностями, глянцевым пластиком и яркими цветами.
analogy: 'Проще представить «Y2K» как правило работы в разделе «UI/UX и доступность»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Y2K»: Ретро-футуристический визуальный стиль, вдохновленный цифровой культурой конца 1990-х
  — начала 2000-х годов, металлическими поверхностями, глянцевым пластиком и яркими цветами. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «2000 год» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Y2K» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Y2K». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Y2K» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
