title: Multi-factor Authentifizierung
short_definition: Authentication die requires evidence aus zwei oder mehr independent factor types, such as password und device
  possession.
analogy: 'Ordne Multi-factor Authentifizierung im Bereich Sicherheit & Datenschutz als beschriftetes Werkzeug ein: Die Beschriftung
  grenzt den Prüfbereich ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Authentication die requires evidence aus zwei oder mehr independent factor types, such as password und device possession.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Multi-factor Authentifizierung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Sicherheit
  & Datenschutz benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Multi-factor Authentifizierung in der Phase test protect als Lerncheckpoint: Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Multi-factor Authentifizierung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien
  oder Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Multi-factor Authentifizierung als Beleg für eine korrekte Implementierung zu behandeln, ohne
  tatsächliches Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
