title: Organic Design
short_definition: 'Organic Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A visual direction using natural forms, earthy palettes, texture, asymmetry, and softer geometry.'
analogy: Organic Design можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Organic Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A visual direction using natural forms, earthy palettes, texture, asymmetry, and softer geometry.'
why_it_matters: Понимание Organic Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Organic Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Organic Design в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Organic Design доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
