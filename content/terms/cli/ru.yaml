title: CLI
short_definition: Интерфейс командной строки, который позволяет пользователям управлять программой, вводя команды
  и параметры вместо использования графического интерфейса.
analogy: 'Проще представить «CLI» как правило работы в разделе «Компьютеры и среда разработки»: название задает
  направление, а код показывает поведение.'
mechanism: 'Как работает «CLI»: Интерфейс командной строки, который позволяет пользователям управлять программой,
  вводя команды и параметры вместо использования графического интерфейса. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «CLI» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «CLI» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «CLI». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «CLI» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
