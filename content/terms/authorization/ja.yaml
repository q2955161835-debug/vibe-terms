title: 認可
short_definition: 認証されたアイデンティティまたは既知のアイデンティティがアクセスまたは実行を許可されるかを決定するプロセス。
analogy: 認可は、セキュリティとプライバシーの課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: 認証されたアイデンティティまたは既知のアイデンティティがアクセスまたは実行を許可されるかを決定するプロセス。実際のプロジェクトでは、周囲の技術、設定、データフローによって具体的な挙動が変わるため、ラベルだけで判断せず、実装を確認してください。
why_it_matters: 認可を知ると、Vibe Coding初心者でも、セキュリティとプライバシーの課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、認可をテストと保護の段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトで認可がどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「認可」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
