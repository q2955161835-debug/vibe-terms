title: Prompt
short_definition: Инструкция или контекст, который вы даете модели ИИ, чтобы направлять ее следующий ответ или действие.
analogy: '«Prompt» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «Prompt»: Инструкция или контекст, который вы даете модели ИИ, чтобы направлять ее следующий
  ответ или действие. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код
  и наблюдаемый результат.'
why_it_matters: Понимание термина «Prompt» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Prompt» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Prompt». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Prompt» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
