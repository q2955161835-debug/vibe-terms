title: 製品
short_definition: ユーザーの問題を解決し、発見、提供、改善のライフサイクルを通じて維持される、意図的に設計された製品。
analogy: 製品は、ワークショップの製品と要件の部分にあるラベル付きのツールであると考えてください。ラベルは、どの問題領域を検査する必要があるかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: ユーザーの問題を解決し、発見、提供、改善のライフサイクルを通じて維持される、意図的に設計された製品。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: 製品を知ることで、Vibe Codingの初心者は、それが意味する正確な製品と要件の懸念事項を指定し、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者が要件段階に達したときに語彙チェックポイントとして 製品を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: 製品がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: 製品 という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
