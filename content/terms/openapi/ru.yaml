title: OpenAPI
short_definition: Машиночитаемый формат спецификации для описания HTTP API, включая пути, схемы, аутентификацию
  и ответы.
analogy: 'Проще представить «OpenAPI» как правило работы в разделе «Бэкенд и API»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «OpenAPI»: Машиночитаемый формат спецификации для описания HTTP API, включая пути, схемы,
  аутентификацию и ответы. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «OpenAPI» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «OpenAPI» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «OpenAPI». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «OpenAPI» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
