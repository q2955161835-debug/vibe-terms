title: HTTP-метод
short_definition: Глагол, такой как GET, POST, PUT, PATCH или DELETE, который указывает предполагаемую операцию
  HTTP-запроса.
analogy: 'Представьте «HTTP-метод» как инструмент в наборе разработчика: он решает задачу в области «Web и сети»,
  но результат зависит от настройки.'
mechanism: 'Как работает «HTTP-метод»: Глагол, такой как GET, POST, PUT, PATCH или DELETE, который указывает предполагаемую
  операцию HTTP-запроса. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «HTTP-метод» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «HTTP-метод» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «HTTP-метод». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «HTTP-метод» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
