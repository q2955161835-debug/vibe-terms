title: Конфликт слияния
short_definition: Ситуация, когда Git не может автоматически согласовать конкурирующие изменения и требует, чтобы
  человек или инструмент выбрали желаемый результат.
analogy: '«Конфликт слияния» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно
  нужно проверить.'
mechanism: 'Как работает «Конфликт слияния»: Ситуация, когда Git не может автоматически согласовать конкурирующие
  изменения и требует, чтобы человек или инструмент выбрали желаемый результат. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Конфликт слияния» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Конфликт слияния» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Конфликт слияния». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Конфликт слияния» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
