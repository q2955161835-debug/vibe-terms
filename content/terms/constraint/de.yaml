title: Einschränkung
short_definition: Eine Grenze, die die Lösung respektieren muss, z. B. eine Plattform, ein Budget, eine Compliance-Regel,
  eine Leistungsgrenze oder eine feste Integration.
analogy: 'Für Zwang hilft ein Bild aus Produkt & Anforderungen: Das Etikett weist auf das Problemfeld, ersetzt aber weder
  den Code noch die Prüfung des Datenflusses.'
mechanism: Eine Grenze, die die Lösung respektieren muss, z. B. eine Plattform, ein Budget, eine Compliance-Regel, eine Leistungsgrenze
  oder eine feste Integration. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Zwang versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Zwang in der Phase Anforderungen als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Zwang in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Zwang als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
