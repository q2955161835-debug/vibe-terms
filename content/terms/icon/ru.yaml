title: Иконка
short_definition: Компактный графический символ, используемый для обозначения действия, объекта, статуса или значения
  навигации.
analogy: 'Проще представить «Icon» как правило работы в разделе «UI/UX и доступность»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Icon»: Компактный графический символ, используемый для обозначения действия, объекта,
  статуса или значения навигации. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Иконка» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Icon» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Icon». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Icon» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
source_content_version: 1
