mechanism: Ein string die identifiziert the location von a Datei oder Verzeichnis innerhalb a Datei System. In einem realen
  Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Pfad versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in computing env benennen und von einem
