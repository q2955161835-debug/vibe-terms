title: ReAct
short_definition: Ein Agent Muster die alternates reasoning about the nächste action mit acting durch Werkzeuge und observing
  the Ergebnis.
analogy: Betrachte ReAct als Orientierungsschild in ai vibe. Es weist auf die richtige technische Stelle, ersetzt aber weder
  die Implementierung noch deren Prüfung.
mechanism: Ein Agent Muster die alternates reasoning about the nächste action mit acting durch Werkzeuge und observing the
  Ergebnis. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer ReAct versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und von einem KI-Coding-Agenten
  eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient ReAct in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie ReAct in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff ReAct als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
