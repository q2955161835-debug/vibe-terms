title: Password Hashing
short_definition: 'Password Hashing — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Transforming passwords with a slow one-way password-hashing function so the original password is not stored directly.'
analogy: Password Hashing можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Password Hashing — термин из раздела «Безопасность и приватность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Transforming passwords with a slow one-way password-hashing function so the original password is not stored directly.'
why_it_matters: Понимание Password Hashing помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Password Hashing помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Password Hashing в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Password Hashing доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
