title: "不透明度"
short_definition: "元素透明的程度，範圍從完全不可看到完全不透明。"
analogy: "在前端實作中，可把「不透明度」想成介面的一個可組合零件：它處理「元素透明的程度，範圍從完全不可看到完全不透明」，並與畫面狀態互相配合。"
mechanism: "元素透明的程度，範圍從完全不可看到完全不透明。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解不透明度後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立介面與邏輯階段，將「不透明度」放進頁面、元件或樣式規則中：檢查重點是「元素透明的程度，範圍從完全不可看到完全不透明」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「不透明度」為例，說明如何實現「元素透明的程度，範圍從完全不可看到完全不透明」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「不透明度」這個名稱就判定已經正確實作；請根據「元素透明的程度，範圍從完全不可看到完全不透明」檢查實際行為、資料流、錯誤情境與測試結果。"
