title: Notification
short_definition: A message representing an event that may require awareness or action, often collected in a notification center.
analogy: 'Think of Notification as a labeled tool in the ui/ux & accessibility part of a workshop: the label tells you what problem area to inspect, but the real behavior still comes from the implementation.'
mechanism: A message representing an event that may require awareness or action, often collected in a notification center. In a real project, its exact behavior depends on the surrounding technology, configuration, and data flow, so verify the concrete implementation rather than relying on the label alone.
why_it_matters: Knowing Notification lets a Vibe Coding beginner name the exact ui/ux & accessibility concern they mean and ask an AI coding agent for a change plus evidence that the behavior is correct.
project_example: In Vibe Terms, use Notification as a vocabulary checkpoint when a learner reaches the design stage; connect the definition to one visible page, file, request, data structure, or verification step rather than teaching it in isolation.
ai_prompt_example: Explain how Notification applies to this project. Point to the exact files or system boundary involved, make only the smallest necessary change, and show the command or user flow I can use to verify the result.
common_mistake: Treating the term Notification as proof that an implementation is correct without checking actual behavior, data flow, permissions, failure cases, or the relevant test.
quiz:
- question: Which description best matches Notification?
  options:
  - A message representing an event that may require awareness or action, often collected in a notification center.
  - A visual decoration that has no effect on software behavior.
  - A guarantee that every implementation is secure and correct.
  answer: 0
- question: When an AI says it used Notification, what should you do next?
  options:
  - Accept the label as proof.
  - Check the concrete implementation and verify the relevant behavior.
  - Rename the files so the term appears in the project.
  answer: 1
- question: Which prompt is more useful for working with Notification?
  options:
  - “Make Notification better.”
  - “Explain where Notification appears, change the smallest necessary part, and show how to verify it.”
  - “Rewrite the whole project.”
  answer: 1
