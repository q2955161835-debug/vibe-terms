title: コンポーネント
short_definition: 目的、入力、状態、描画結果が定義された、再利用可能で自己完結したUI部品。
analogy: コンポーネントは、フロントエンド開発の課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: コンポーネントは入力や状態を受け取り、定義された描画結果を返します。実際のプロジェクトでは、責務、データの受け渡し、再利用範囲を確認してください。
why_it_matters: コンポーネントを知ると、Vibe Coding初心者でも、フロントエンド開発の課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、コンポーネントを画面とロジックの実装段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトでコンポーネントがどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「コンポーネント」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
