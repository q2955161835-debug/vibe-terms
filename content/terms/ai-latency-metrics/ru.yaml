title: Метрики задержки ИИ
short_definition: Такие измерения, как время появления первого токена и количество токенов в секунду, которые описывают,
  насколько быстро запускается и передается ответ ИИ.
analogy: '«Метрики задержки ИИ» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все
  равно нужно проверить.'
mechanism: 'Как работает «Метрики задержки ИИ»: Такие измерения, как время появления первого токена и количество
  токенов в секунду, которые описывают, насколько быстро запускается и передается ответ ИИ. На практике механизм
  зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Метрики задержки ИИ» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Метрики задержки ИИ» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Метрики задержки ИИ». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Метрики задержки ИИ» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
