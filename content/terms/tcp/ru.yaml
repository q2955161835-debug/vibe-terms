title: TCP
short_definition: 'TCP — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A connection-oriented transport protocol that provides ordered, reliable delivery of a byte stream between network endpoints.'
analogy: TCP можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'TCP — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A connection-oriented transport protocol that provides ordered, reliable delivery of a byte stream between network endpoints.'
why_it_matters: Понимание TCP помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание TCP помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль TCP в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название TCP доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
