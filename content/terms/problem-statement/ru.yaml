title: Формулировка проблемы
short_definition: Краткое описание проблемы пользователя или бизнеса, ее контекста и того, почему ее решение важно,
  без преждевременного указания решения.
analogy: 'Проще представить «Формулировка проблемы» как правило работы в разделе «Продукт и требования»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Формулировка проблемы»: Краткое описание проблемы пользователя или бизнеса, ее контекста
  и того, почему ее решение важно, без преждевременного указания решения. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Формулировка проблемы» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Формулировка проблемы» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Формулировка проблемы». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Формулировка проблемы» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
