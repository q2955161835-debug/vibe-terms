title: "首屏主視覺區（Hero）"
short_definition: "傳達頁面主要訊息、核心價值和下一步操作的起始頁面區域。"
analogy: "可以把首屏主視覺區（Hero）想成店面第一眼看到的招牌：它先說明這個頁面提供什麼，再引導訪客採取下一步。"
mechanism: "起始頁面區域，用於傳達頁面的主要訊息、核心價值和下一步操作。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解首屏主視覺區（Hero）後，Vibe Coding 初學者可以準確指出相關的 UI/UX 與無障礙問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在設計體驗階段，為首頁安排首屏主視覺區（Hero），用一句話說明產品價值，放上主要行動按鈕，再用桌面與手機畫面確認訊息層級。"
ai_prompt_example: "請檢查這個專案的首屏主視覺區（Hero），確認主要訊息、核心價值與行動按鈕是否清楚，僅修改必要的版面與文案，並提供桌面與手機的驗證流程。"
common_mistake: "把首屏主視覺區（Hero）塞滿標語和按鈕，卻沒有讓訪客快速理解產品價值，也沒有確認主要行動在不同螢幕尺寸下仍然可見。"
status: draft
