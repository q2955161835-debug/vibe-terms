title: Push
short_definition: Sending lokal Git commits und refs zu a remote repository.
analogy: 'Ordne Push im Bereich git collaboration als beschriftetes Werkzeug ein: Die Beschriftung grenzt den Prüfbereich
  ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Sending lokal Git commits und refs zu a remote repository. In einem realen Projekt hängt das genaue Verhalten von
  Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Push versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in git collaboration benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Push in der Phase environment als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Push in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Push als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten, Datenfluss,
  Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
