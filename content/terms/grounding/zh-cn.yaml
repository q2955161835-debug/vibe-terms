title: "Grounding（事实依据）"
short_definition: "将模型输出与提供的证据、检索到的来源或经过验证的数据连接起来，从而减少发明主张的可能性。"
analogy: "可以把“Grounding（事实依据）”理解为AI 与 Vibe Coding 中的一个概念：在项目里先找到它对应的页面、代码、配置或数据，再结合实际运行结果确认含义。"
mechanism: "实现上，这一概念会围绕“将模型输出与提供的证据、检索到的来源或经过验证的数据连接起来，从而减少发明主张的可能性。”在真实项目中落地；具体表现取决于技术栈、配置和数据流，应结合代码和运行结果验证。"
why_it_matters: "理解“Grounding（事实依据）”，有助于你在AI 与 Vibe Coding 语境中准确描述问题，指导 AI 检查具体实现，并要求用可复现的步骤验证结果。"
project_example: "在 Vibe Terms 的定义需求阶段，可以把“Grounding（事实依据）”放到一个真实项目中：围绕“将模型输出与提供的证据、检索到的来源或经过验证的数据连接起来，从而减少发明主张的可能性。”定位相关页面、文件、请求、数据结构或验证步骤。"
ai_prompt_example: "请说明“Grounding（事实依据）”在这个项目中的实现位置和边界。只做必要的最小改动，并用命令或用户操作验证“将模型输出与提供的证据、检索到的来源或经过验证的数据连接起来，从而减少发明主张的可能性”。"
common_mistake: "把 Grounding（事实依据）误认为模型已经有依据，而不检查实际引用的证据、检索来源、数据流和失败案例。"
