title: Обработчик запросов
short_definition: Код сервера, отвечающий за получение запроса, проверку или преобразование входных данных, вызов
  логики и создание ответа.
analogy: 'Представьте «Обработчик запроса» как инструмент в наборе разработчика: он решает задачу в области «Бэкенд
  и API», но результат зависит от настройки.'
mechanism: 'Как работает «Обработчик запроса»: Код сервера, отвечающий за получение запроса, проверку или преобразование
  входных данных, вызов логики и создание ответа. На практике механизм зависит от конфигурации, потока данных и
  границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Обработчик запросов» помогает точно назвать проблему в области «Бэкенд и API», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Обработчик запроса» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Обработчик запроса». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Обработчик запроса» доказательством правильной реализации и
  не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
