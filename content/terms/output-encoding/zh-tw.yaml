title: "輸出編碼"
short_definition: "轉義其輸出上下文的資料，以便將其視為資料而不是可執行的 HTML、JavaScript、SQL 或其他語言。"
analogy: "在安全設計中，「輸出編碼」像一道需要驗證的門檻：它涉及「轉義其輸出上下文的資料，以便將其視為資料而不是可執行的 HTML、JavaScript、SQL 或其他語言」，不能只看名稱就判定安全。"
mechanism: "轉義其輸出上下文的資料，以便將其視為資料而不是可執行的 HTML、JavaScript、SQL 或其他語言。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解輸出編碼後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「輸出編碼」放進登入流程、權限檢查或安全日誌中：檢查重點是「轉義其輸出上下文的資料，以便將其視為資料而不是可執行的 HTML、JavaScript、SQL 或其他語言」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「輸出編碼」為例，說明如何實現「轉義其輸出上下文的資料，以便將其視為資料而不是可執行的 HTML、JavaScript、SQL 或其他語言」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「輸出編碼」這個名稱就判定已經正確實作；請根據「轉義其輸出上下文的資料，以便將其視為資料而不是可執行的 HTML、JavaScript、SQL 或其他語言」檢查實際行為、資料流、錯誤情境與測試結果。"
