title: Deaktivierter Zustand
short_definition: Ein Zustand, in dem ein Steuerelement absichtlich nicht verfügbar ist und sowohl seinen Zustand als auch
  alle relevanten Gründe mitteilen muss.
analogy: Betrachte Behinderter Zustand als Orientierung in Frontend-Entwicklung. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Ein Zustand, in dem ein Steuerelement absichtlich nicht verfügbar ist und sowohl seinen Zustand als auch alle relevanten
  Gründe mitteilen muss. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Behinderter Zustand versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Behinderter Zustand in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe
  die Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Behinderter Zustand in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Behinderter Zustand als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
