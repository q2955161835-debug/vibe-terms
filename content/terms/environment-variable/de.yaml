title: Umgebungsvariable
short_definition: Ein benannter Wert, der von der Prozessumgebung bereitgestellt wird und häufig für Konfigurationen und Geheimnisse
  außerhalb des Quellcodes verwendet wird.
analogy: 'Ordne Umgebungsvariable im Bereich Computer & Entwicklungsumgebung als Werkzeug ein: Die Bezeichnung grenzt die
  Frage ein, doch erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Ein benannter Wert, der von der Prozessumgebung bereitgestellt wird und häufig für Konfigurationen und Geheimnisse
  außerhalb des Quellcodes verwendet wird. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Umgebungsvariable versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Computer & Entwicklungsumgebung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Umgebungsvariable in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Umgebungsvariable in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Umgebungsvariable als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
