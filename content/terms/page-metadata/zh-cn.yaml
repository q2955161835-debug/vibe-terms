title: "页面元数据"
short_definition: "有关页面的机器可读信息，例如标题、描述、规范 URL、共享数据和索引指令。"
analogy: "将页面元数据视为开发工作台前端工程部分中的带标签的工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自实现。"
mechanism: "有关页面的机器可读信息，例如标题、描述、规范 URL、共享数据和索引指令。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解页面元数据可以让 Vibe Coding 初学者说出他们所指的确切前端工程问题，并向 AI 编程代理请求更改以及行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者到达界面逻辑阶段时，使用页面元数据作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释页面元数据如何应用于该项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将术语“页面元数据”视为实现正确的证据，而不检查实际行为、数据流、权限、失败案例或相关测试。"
