title: Registerkarten
short_definition: Ein control die switches zwischen peer Inhalte panels while keeping them in the same Seite context.
analogy: Betrachte Registerkarten als Orientierungsschild in ui ux. Es weist auf die richtige technische Stelle, ersetzt aber
  weder die Implementierung noch deren Prüfung.
mechanism: Ein control die switches zwischen peer Inhalte panels while keeping them in the same Seite context. In einem realen
  Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Registerkarten versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Registerkarten in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Registerkarten in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Registerkarten als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
