title: Градиент
short_definition: Плавный переход между двумя или более цветами или значениями непрозрачности в направлении или
  форме.
analogy: 'Представьте «Gradient» как инструмент в наборе разработчика: он решает задачу в области «Фронтенд-разработка»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Gradient»: Плавный переход между двумя или более цветами или значениями непрозрачности
  в направлении или форме. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «Градиент» помогает точно назвать проблему в области «Фронтенд-разработка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Gradient» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Gradient». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Gradient» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
