title: Inline Bestätigung
short_definition: Ein compact confirmation Prompt placed near the triggering action, commonly verwendet vor a kleine destructive
  action.
analogy: 'Für Inline Bestätigung hilft ein Vergleich mit einem Werkzeug aus ui ux: Sein Etikett nennt das Problemfeld; verlässlich
  wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein compact confirmation Prompt placed near the triggering action, commonly verwendet vor a kleine destructive
  action. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb
  die konkrete Umsetzung.
why_it_matters: Wer Inline Bestätigung versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von
  einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Inline Bestätigung in der Phase Design als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Inline Bestätigung in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Inline Bestätigung als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
