title: CSRF
short_definition: クロスサイト リクエスト フォージェリ。被害者のブラウザに不要な認証済みリクエストを別のサイトに送信させる攻撃です。
analogy: CSRF は、ワークショップのセキュリティとプライバシーの部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査する必要があるかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: クロスサイト リクエスト フォージェリ。被害者のブラウザに不要な認証済みリクエストを別のサイトに送信させる攻撃です。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: CSRF を知ることで、Vibe Codingの初心者は、セキュリティとプライバシーに関する懸念を正確に挙げて、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がテスト保護段階に到達したときに語彙チェックポイントとして CSRF を使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: CSRF がこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: CSRF という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
