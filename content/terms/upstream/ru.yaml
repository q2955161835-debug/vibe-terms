title: вверх по течению
short_definition: Ветка или репозиторий, из которого локальная ветвь настроена для отслеживания или получения изменений.
analogy: 'Проще представить «Upstream» как правило работы в разделе «Git и совместная работа»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Upstream»: Ветка или репозиторий, из которого локальная ветвь настроена для отслеживания
  или получения изменений. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте
  код и наблюдаемый результат.'
why_it_matters: Понимание термина «вверх по течению» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Upstream» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Upstream». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Upstream» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
