title: コンテキストウィンドウ
short_definition: モデルが一度に考慮できるテキストおよびその他の入力の量は限られています。
analogy: '作業机: 机がいっぱいになると、新しい書類が収まる前に古い書類をどかさなければなりません。'
why_it_matters: コーディングセッションが長いと、重要な要件がモデルのアクティブなコンテキストから追い出される可能性があります。
ai_prompt_example: 続行する前に、現在のアーキテクチャ、制約、完了した作業、および次のタスクを要約します。
common_mistake: モデルが以前のすべてのファイルと決定を永久に記憶していると仮定します。
status: draft
source_content_version: 1
mechanism: Context Windowにはモデルが一度のリクエストで参照できる入力を収め、長すぎる履歴や文書は切り詰め・要約・分割して扱います。
project_example: Vibe Termsでは、用語ページからAIへ渡す説明量を考える際に、Context Windowと不要な履歴を区別します。
