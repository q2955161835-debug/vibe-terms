title: "Vibe Coding"
short_definition: "通过向人工智能编码助手描述结果并迭代其生成的内容来构建软件。"
analogy: "就像告诉一个非常快的初级开发人员你想要什么，然后检查每个交付。"
why_it_matters: "它可以让初学者创建真正的软件，但你仍然需要足够的词汇来判断人工智能改变了什么。"
ai_prompt_example: "逐步构建此功能。在编辑之前，请解释你将更改哪些文件以及我如何验证结果。"
common_mistake: "将“它运行”视为设计正确或安全的证据。"
status: draft
source_content_version: 1
