title: Accessibility
short_definition: 'Accessibility — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The practice of designing and engineering products so people with diverse abilities can perceive, understand, navigate, and operate them.'
analogy: Accessibility можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Accessibility — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The practice of designing and engineering products so people with diverse abilities can perceive, understand, navigate, and operate them.'
why_it_matters: Понимание Accessibility помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Accessibility помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Accessibility в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Accessibility доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
