title: "OpenAPI"
short_definition: "用於描述 HTTP API 的機器可讀規範格式，包括路徑、模式、驗證和回應。"
analogy: "在後端流程中，「OpenAPI」像服務之間的處理站：它負責「用於描述 HTTP API 的機器可讀規範格式，包括路徑、模式、驗證和回應」，結果要用 API 請求與回應確認。"
mechanism: "用於描述 HTTP API 的機器可讀規範格式，包括路徑、模式、驗證和回應。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 OpenAPI 後，Vibe Coding 初學者可以準確指出相關的後端與 API 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在串接資料與身分階段，將「OpenAPI」放進API 請求、回應或服務日誌中：檢查重點是「用於描述 HTTP API 的機器可讀規範格式，包括路徑、模式、驗證和回應」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「OpenAPI」為例，說明如何實現「用於描述 HTTP API 的機器可讀規範格式，包括路徑、模式、驗證和回應」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「OpenAPI」這個名稱就判定已經正確實作；請根據「用於描述 HTTP API 的機器可讀規範格式，包括路徑、模式、驗證和回應」檢查實際行為、資料流、錯誤情境與測試結果。"
