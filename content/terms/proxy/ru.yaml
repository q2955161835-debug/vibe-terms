title: Proxy
short_definition: 'Proxy — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An intermediary that forwards traffic between a client and another service, often for policy, caching, privacy, or routing.'
analogy: Proxy можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Proxy — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An intermediary that forwards traffic between a client and another service, often for policy, caching, privacy, or routing.'
why_it_matters: Понимание Proxy помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Proxy помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Proxy в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Proxy доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
