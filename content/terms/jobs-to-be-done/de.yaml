title: Jobs to Be Done
short_definition: Ein Framework für describing the progress a person is trying zu make in a situation rather than defining
  them nur by demographics.
analogy: 'Für Jobs to Be Done hilft ein Vergleich mit einem Werkzeug aus Produkt & Anforderungen: Sein Etikett nennt das Problemfeld;
  verlässlich wird die Aussage erst durch Code, Datenfluss und Nutzungskontext.'
mechanism: Ein Framework für describing the progress a person is trying zu make in a situation rather than defining them nur
  by demographics. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Jobs to Be Done versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Produkt & Anforderungen
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Jobs to Be Done in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Jobs to Be Done in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Jobs to Be Done als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
