title: Vorfall
short_definition: Ein unplanned event die degrades oder interrupts a Dienst und requires coordinated detection, mitigation,
  recovery, und learning.
analogy: Betrachte Vorfall als Orientierungsschild in deployment operations. Es weist auf die richtige technische Stelle,
  ersetzt aber weder die Implementierung noch deren Prüfung.
mechanism: Ein unplanned event die degrades oder interrupts a Dienst und requires coordinated detection, mitigation, recovery,
  und learning. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Vorfall versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in deployment operations benennen und
  von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Vorfall in der Phase deploy maintain als Lerncheckpoint: Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Vorfall in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Vorfall als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
