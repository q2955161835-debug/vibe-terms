title: Neo-Brutalism
short_definition: Ein bold digital style characterized by heavy borders, strong Farben, blunt typography, und deliberately
  hard shadows.
analogy: Betrachte Neo-Brutalism als Orientierungsschild in ui ux. Es weist auf die richtige technische Stelle, ersetzt aber
  weder die Implementierung noch deren Prüfung.
mechanism: Ein bold digital style characterized by heavy borders, strong Farben, blunt typography, und deliberately hard shadows.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Neo-Brutalism versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ui ux benennen und von einem
  KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Neo-Brutalism in der Phase Design als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Neo-Brutalism in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Neo-Brutalism als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
