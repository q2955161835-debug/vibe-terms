title: Design-Token
short_definition: Ein benannter, wiederverwendbarer Designwert, z. B. eine Farbe, eine Abstandseinheit, ein Radius oder eine
  Typografieeinstellung, die von allen Komponenten gemeinsam genutzt wird.
analogy: 'Ordne Design-Token im Bereich Frontend-Entwicklung als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch
  erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Ein benannter, wiederverwendbarer Designwert, z. B. eine Farbe, eine Abstandseinheit, ein Radius oder eine Typografieeinstellung,
  die von allen Komponenten gemeinsam genutzt wird. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Design-Token versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Design-Token in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Design-Token in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Design-Token als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
