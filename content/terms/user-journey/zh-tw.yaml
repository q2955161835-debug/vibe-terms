title: "使用者旅程"
short_definition: "更廣泛地瞭解使用者在不同階段、接觸點、目標、情緒和摩擦方面的體驗。"
analogy: "將使用者旅程視為工作坊產品和需求部分中的標籤工具：標籤告訴您要檢查哪些問題區域，但真正的行為仍然來自實作。"
mechanism: "更廣泛地瞭解使用者在不同階段、接觸點、目標、情緒和摩擦方面的體驗。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "瞭解使用者旅程讓 Vibe 編碼初學者說出他們所指的確切產品和要求，並向 AI 編碼代理請求修改以及行為正確的證據。"
project_example: "在 Vibe 術語中，當學習者達到需求階段時，使用使用者旅程作為術語檢查點；將定義連線到一個可見的頁面、檔案、請求、資料結構或驗證步驟，而不是孤立地教授它。"
ai_prompt_example: "解釋使用者旅程如何應用於該專案。指出所涉及的確切檔案或系統邊界，僅進行最小的必要修改，並顯示我可以用來驗證結果的命令或使用者流程。"
common_mistake: "將術語「使用者旅程」視為實作正確的證據，而不檢查實際行為、資料流、權限、失敗案例或相關測試。"
status: draft
