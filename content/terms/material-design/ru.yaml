title: Material Design
short_definition: 'Material Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Google''s design system using structured surfaces, motion, components, and platform guidance for digital interfaces.'
analogy: Material Design можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Material Design — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Google''s design system using structured surfaces, motion, components, and platform guidance for digital interfaces.'
why_it_matters: Понимание Material Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Material Design помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Material Design в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Material Design доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
