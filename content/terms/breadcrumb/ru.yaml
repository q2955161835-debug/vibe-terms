title: Хлебные крошки
short_definition: Иерархическая цепочка, показывающая текущее местоположение пользователя и ссылки на страницы
  вышестоящих разделов.
analogy: '«Хлебные крошки» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет
  проверку реализации.'
mechanism: 'Как работают «Хлебные крошки»: Иерархическая цепочка показывает текущее местоположение пользователя
  и ссылки на страницы вышестоящих разделов. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Хлебные крошки» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Хлебные крошки» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Хлебные крошки». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Хлебные крошки» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
