title: "CSRF"
short_definition: "跨站點請求偽造，這是一種導致受害者的瀏覽器向另一個站點傳送不需要的經過身分驗證的請求的攻擊。"
analogy: "在安全設計中，「CSRF」像一道需要驗證的門檻：它涉及「跨站點請求偽造，這是一種導致受害者的瀏覽器向另一個站點傳送不需要的經過身分驗證的請求的攻擊」，不能只看名稱就判定安全。"
mechanism: "跨站點請求偽造，一種導致受害者的瀏覽器向另一個站點傳送不需要的經過身分驗證的請求的攻擊。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解 CSRF 後，Vibe Coding 初學者可以準確指出相關的安全與隱私問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在測試與保護階段，將「CSRF」放進登入流程、權限檢查或安全日誌中：檢查重點是「跨站點請求偽造，這是一種導致受害者的瀏覽器向另一個站點傳送不需要的經過身分驗證的請求的攻擊」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「CSRF」為例，說明如何實現「跨站點請求偽造，這是一種導致受害者的瀏覽器向另一個站點傳送不需要的經過身分驗證的請求的攻擊」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「CSRF」這個名稱就判定已經正確實作；請根據「跨站點請求偽造，這是一種導致受害者的瀏覽器向另一個站點傳送不需要的經過身分驗證的請求的攻擊」檢查實際行為、資料流、錯誤情境與測試結果。"
