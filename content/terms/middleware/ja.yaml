title: ミドルウェア
short_definition: リクエストまたはアプリケーションのパイプラインで実行され、ログ、認証、解析、エラー処理などの共有動作を追加するコード。
analogy: ミドルウェアは、ワークショップのバックエンドおよび API 部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: リクエストまたはアプリケーションのパイプラインで実行され、ログ、認証、解析、エラー処理などの共有動作を追加するコード。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: ミドルウェアを知ることで、Vibe Codingの初心者は、バックエンドと API の関連する課題を正確に言語化し、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がデータ同一性段階に到達したときに語彙チェックポイントとして ミドルウェアを使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: ミドルウェアがこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー フローを示します。
common_mistake: ミドルウェア という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
