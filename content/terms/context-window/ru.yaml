title: Контекстное окно
short_definition: Ограниченный объём текста и других входных данных, который модель может учитывать одновременно.
analogy: 'Как рабочий стол: когда он заполнен, старые бумаги приходится убрать, чтобы положить новые.'
why_it_matters: Во время длинной сессии программирования важные требования могут выпасть из активного
  контекста модели.
ai_prompt_example: Перед продолжением кратко опиши текущую архитектуру, ограничения, выполненную работу
  и следующую задачу.
common_mistake: Считать, что модель навсегда помнит каждый ранее показанный файл и принятое решение.
status: draft
source_content_version: 1
