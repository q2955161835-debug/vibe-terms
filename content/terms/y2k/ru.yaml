title: Y2K
short_definition: 'Y2K — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A retro-futurist visual style inspired by late-1990s and early-2000s digital culture, metallic surfaces, glossy plastics, and bright colors.'
analogy: Y2K можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Y2K — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: A retro-futurist visual style inspired by late-1990s and early-2000s digital culture, metallic surfaces, glossy plastics, and bright colors.'
why_it_matters: Понимание Y2K помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Y2K помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Y2K в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Y2K доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
