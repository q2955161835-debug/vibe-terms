title: Brotkrümelnavigation
short_definition: Ein hierarchischer Pfad zeigt die Benutzer's aktuelle Ort und links zu übergeordnete übergeordnete Ebenen.
analogy: 'Ein praktisches Bild für Brotkrümelnavigation: ein markiertes Werkzeug in UI/UX & Barrierefreiheit, dessen Aufschrift
  die Frage schärft, aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: Ein hierarchischer Pfad zeigt die Benutzer's aktuelle Ort und links zu übergeordnete übergeordnete Ebenen. In einem
  realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Brotkrümelnavigation versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Brotkrümelnavigation in der Phase Design als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Brotkrümelnavigation in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Brotkrümelnavigation als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
