title: Dockerfile
short_definition: Ein declarative Text Datei containing ordered Anweisungen für Erstellen a container Bild.
analogy: 'Ordne Dockerfile im Bereich deployment operations als beschriftetes Werkzeug ein: Die Beschriftung grenzt den Prüfbereich
  ein, während erst die konkrete Implementierung das Verhalten festlegt.'
mechanism: Ein declarative Text Datei containing ordered Anweisungen für Erstellen a container Bild. In einem realen Projekt
  hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Dockerfile versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in deployment operations benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Dockerfile in der Phase deploy maintain als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Dockerfile in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Dockerfile als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
source_content_version: 1
