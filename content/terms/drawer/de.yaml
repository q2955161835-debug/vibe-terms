title: Drawer
short_definition: Ein Bereich, der von einer Kante her eingeschoben wird, um Details, Steuerelemente oder Navigation anzuzeigen
  und gleichzeitig den zugrunde liegenden Seitenkontext beizubehalten.
analogy: 'Für Schublade hilft ein Bild aus UI/UX & Barrierefreiheit: Das Etikett weist auf das Problemfeld, ersetzt aber weder
  den Code noch die Prüfung des Datenflusses.'
mechanism: Ein Bereich, der von einer Kante her eingeschoben wird, um Details, Steuerelemente oder Navigation anzuzeigen und
  gleichzeitig den zugrunde liegenden Seitenkontext beizubehalten. In einem realen Projekt hängt die genaue Ausprägung von
  Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Schublade versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in UI/UX & Barrierefreiheit benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Schublade in der Phase Design als Lerncheckpoint. Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Schublade in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Schublade als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
