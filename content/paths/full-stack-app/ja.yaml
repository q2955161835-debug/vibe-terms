locale: ja
title: フルスタックアプリを出荷する
summary: ブラウザーの画面、API、データモデル、テスト、運用をつなぎ、小さな製品を企画からデプロイまで通して進めます。
status: draft
source_content_version: 1
chapters:
- id: product-scope
  title: 製品の最初のスライスを定義する
  summary: 対象ユーザーに届ける成果を絞り、検証可能な受入基準を作成します。
  outcome: 受入基準を含む、範囲を定めた製品概要。
  checkpoint: 最初のリリースから意図的に除外したものを明記できます。
- id: architecture
  title: システム境界をマッピングする
  summary: ブラウザー、API、データの責任を描き、それぞれの重要なフローの方向に名前を付けます。
  outcome: 小さなアーキテクチャ図。
  checkpoint: 各責任には、重複するビジネスルールではなく、1つの所有レイヤーがあります。
- id: data-model
  title: 耐久性のあるデータをモデル化する
  summary: 書き込み操作を構築する前に、レコード、識別子、関係、制約を定義します。
  outcome: 文書化されたデータスキーマ。
  checkpoint: このモデルは、製品が許可してはならない重複データや孤立したデータを防ぎます。
- id: api-design
  title: APIを設計する
  summary: 製品フローのリソースルート、リクエスト検証、応答データ、ステータスコードを指定します。
  outcome: 例を含むAPIコントラクト。
  checkpoint: クライアントは、文書化されていないフィールドに依存せずにメインフローを完了できます。
- id: authentication
  title: ユーザーアクセスを保護する
  summary: サーバー境界で誰が行動し、ユーザーを認証し、認可を強制できるかを決定します。
  outcome: アクセスポリシーと保護されたエンドポイントフロー。
  checkpoint: 認証されていないリクエストまたは許可されていないリクエストは、保護されたデータを読み取ったり変更したりすることはできません。
- id: frontend-flow
  title: ブラウザフローを構築する
  summary: ロード、成功、空の状態が表示されるメインタスクを実装します。
  outcome: プライマリユーザーフローの作業画面。
  checkpoint: ブラウザの状態は、最新の正常なサーバー応答と一貫性を保ちます。
- id: validation-and-errors
  title: 失敗をアクション可能にする
  summary: 入力とサーバーの境界で検証し、修正または再試行できるものを人々に示します。
  outcome: フィールドエラーと回復可能なリクエストエラー。
  checkpoint: 不正なデータは拒否され、有用なメッセージが表示され、部分的な書き込みは行われません。
- id: testing
  title: 接続されたシステムをテストする
  summary: ビジネスルール、API境界、主要なブラウザー操作を、最小限で有用なテストセットでカバーします。
  outcome: 主要なフローの反復可能なテストスイート。
  checkpoint: メインフローで回帰が発生すると、関連する自動テストが失敗します。
- id: deployment
  title: 動作を確認してデプロイする
  summary: 非機密の環境名を構成し、検証を自動化し、リリース後に実行中のサービスを検査します。
  outcome: デプロイ手順とヘルスチェック。
  checkpoint: デプロイ済みアプリは、想定した構成で主要なフローを完了します。
- id: iteration
  title: 次の改善点を選択してください
  summary: 観察したフィードバックと測定した製品シグナルを使い、1つの小さなフォローアップ変更を優先します。
  outcome: 優先順位が付けられた次のイテレーションのメモ。
  checkpoint: 次の変更は、漠然とした機能リクエストではなく証拠につながります。
