title: Минимализм
short_definition: Визуальный подход, который удаляет несущественные украшения и опирается на иерархию, интервалы
  и небольшое количество сильных элементов.
analogy: 'Проще представить «Minimalism» как правило работы в разделе «UI/UX и доступность»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Minimalism»: Визуальный подход, который удаляет несущественные украшения и опирается на
  иерархию, интервалы и небольшое количество сильных элементов. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Минимализм» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Minimalism» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Minimalism». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Minimalism» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
