title: Git
short_definition: コードの変更履歴を記録し、ブランチを使って安全に作業できるバージョン管理システム。
analogy: 名前付きの保存地点を持つ、プロジェクト用のタイムマシンのようなものです。
why_it_matters: AIは多くのファイルを一度に変更できるため、Gitがあれば差分を確認し、必要なら確実に元へ戻せます。
ai_prompt_example: この機能だけを含む小さなコミットを作り、次へ進む前に差分を見せてください。
common_mistake: 関係のない複数のAI編集を、最後に一つの巨大なコミットへまとめること。
status: draft
source_content_version: 1
