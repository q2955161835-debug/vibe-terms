title: Социальное доказательство
short_definition: Свидетельства реальных пользователей, клиентов, использования, обзоров или признанных организаций,
  призванные повысить доверие.
analogy: '«Социальное доказательство» похож на маршрутную отметку в проекте: она помогает найти нужное место, но
  не заменяет проверку реализации.'
mechanism: 'Как работает «Социальное доказательство»: Свидетельства реальных пользователей, клиентов, использования,
  обзоров или признанных организаций, призванные повысить доверие. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Социальное доказательство» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Социальное доказательство» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Социальное доказательство». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Социальное доказательство» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
