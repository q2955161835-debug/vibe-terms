title: Serif vs Sans Serif
short_definition: zwei broad typeface categories distinguished by the presence oder absence von finishing strokes auf letterforms.
analogy: 'Ein praktisches Bild für Serif vs Sans Serif: ein markiertes Werkzeug in Frontend-Entwicklung, dessen Aufschrift
  die Frage schärft, aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: zwei broad typeface categories distinguished by the presence oder absence von finishing strokes auf letterforms.
  In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete
  Umsetzung.
why_it_matters: Wer Serif vs Sans Serif versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Serif vs Sans Serif in der Phase Oberflächenlogik als Lerncheckpoint: Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Serif vs Sans Serif in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder
  Systemgrenzen, ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Serif vs Sans Serif als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
