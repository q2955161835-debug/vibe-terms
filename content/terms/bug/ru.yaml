title: Ошибка
short_definition: Дефект, при котором фактическое поведение программного обеспечения отличается от запланированного
  или требуемого поведения.
analogy: '«Bug» похож на понятную табличку на нужном ящике: она направляет, однако содержимое все равно нужно проверить.'
mechanism: 'Как работает «Bug»: Дефект, при котором фактическое поведение программного обеспечения отличается от
  запланированного или требуемого поведения. На практике механизм зависит от конфигурации, потока данных и границы
  системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Ошибка» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Bug» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Bug». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Bug» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
