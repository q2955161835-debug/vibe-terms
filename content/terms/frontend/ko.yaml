title: 프런트엔드
short_definition: 사용자가 직접 보고 조작하는 애플리케이션의 부분.
analogy: 뒤쪽 창고가 아니라 손님이 직접 둘러보는 매장 앞쪽과 같습니다.
mechanism: 프런트엔드는 브라우저에서 화면을 렌더링하고 사용자 입력을 상태와 요청으로 변환해 서버 또는 로컬 저장소와 연결합니다.
why_it_matters: 화면과 관련된 Vibe Coding 요청은 대부분 프런트엔드 코드를 바꾸므로 이 용어를 알면 범위를 분명히 할 수 있습니다.
project_example: 이 프로젝트의 프런트엔드는 용어 검색, 로케일 전환, 학습 진행 및 접근 가능한 정적 페이지를 브라우저에서 처리합니다.
ai_prompt_example: 프런트엔드의 용어 카드 배치만 바꾸고 API 응답이나 데이터베이스 테이블은 수정하지 마세요.
common_mistake: 서버 작업도 필요한데 웹사이트 전체를 “프런트엔드”라고 부르는 것.
