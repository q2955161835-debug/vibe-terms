title: Интернет
short_definition: Глобальная сеть взаимосвязанных компьютерных сетей, которые обмениваются данными с помощью набора
  интернет-протоколов.
analogy: 'Проще представить «Internet» как правило работы в разделе «Web и сети»: название задает направление, а
  код показывает поведение.'
mechanism: 'Как работает «Internet»: Глобальная сеть взаимосвязанных компьютерных сетей, которые обмениваются данными
  с помощью набора интернет-протоколов. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Интернет» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Internet» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Internet». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Internet» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
