title: Наименьшие привилегии
short_definition: Принцип безопасности, заключающийся в предоставлении только разрешений, необходимых для выполнения
  задачи, и не более широкого доступа, чем необходимо.
analogy: 'Проще представить «Минимальные привилегии» как правило работы в разделе «Безопасность и приватность»:
  название задает направление, а код показывает поведение.'
mechanism: 'Как работает «Минимальные привилегии»: Принцип безопасности, заключающийся в предоставлении только разрешений,
  необходимых для выполнения задачи, и не более широкого доступа, чем необходимо. На практике механизм зависит от
  конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Наименьшие привилегии» помогает точно назвать проблему в области «Безопасность и приватность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Минимальные привилегии» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Минимальные привилегии». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Минимальные привилегии» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
