title: Root Cause
short_definition: 'Root Cause — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The underlying condition or design flaw that produces a failure, rather than a downstream symptom.'
analogy: Root Cause можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Root Cause — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The underlying condition or design flaw that produces a failure, rather than a downstream symptom.'
why_it_matters: Понимание Root Cause помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Root Cause помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Root Cause в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Root Cause доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
