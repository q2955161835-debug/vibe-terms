title: Apple HIG
short_definition: 'Apple HIG は「UI/UX とアクセシビリティ」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: Apple''s Human Interface Guidelines, a set of platform design principles and interaction conventions for Apple software.'
analogy: Apple HIG は、ソフトウェア開発の道具箱に付いた用途ラベルのように考えると理解しやすいです。実際にはコード、データの流れ、利用場面を確認します。
mechanism: 'Apple HIG は「UI/UX とアクセシビリティ」で使う用語です。現在の日本語本文はレビュー前の草稿です。英語の基準定義: Apple''s Human Interface Guidelines, a set of platform design principles and interaction conventions for Apple software.'
why_it_matters: Apple HIG を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
project_example: Apple HIG を理解すると、AI にどの層や責務を指しているかを明確に伝え、実装結果の検証方法まで要求できます。
