title: Artefakt
short_definition: Eine Ausgabe, die durch einen Build-, Test- oder Verpackungsprozess erzeugt wird, z. B. ein Bundle, eine
  ausführbare Datei, einen Bericht oder ein Archiv.
analogy: Betrachte Artefakt als Orientierung in Computer & Entwicklungsumgebung. Die Bezeichnung führt zur richtigen technischen
  Stelle, garantiert aber noch keine gute Umsetzung.
mechanism: Eine Ausgabe, die durch einen Build-, Test- oder Verpackungsprozess erzeugt wird, z. B. ein Bundle, eine ausführbare
  Datei, einen Bericht oder ein Archiv. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration
  und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Artefakt versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Computer & Entwicklungsumgebung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Artefakt in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition mit
  einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Artefakt in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Artefakt als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
