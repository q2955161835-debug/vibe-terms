title: Обратный прокси
short_definition: Сервер, который получает запросы от имени серверных служб и пересылает их на основе правил маршрутизации,
  безопасности или загрузки.
analogy: 'Проще представить «Обратный прокси» как правило работы в разделе «Web и сети»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Обратный прокси»: Сервер, который получает запросы от имени серверных служб и пересылает
  их на основе правил маршрутизации, безопасности или загрузки. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Обратный прокси» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Обратный прокси» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Обратный прокси». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Обратный прокси» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
