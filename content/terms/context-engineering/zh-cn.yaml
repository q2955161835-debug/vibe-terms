title: 上下文工程
short_definition: 上下文工程 是“AI 与 Vibe Coding”中的术语。当前为待人工审校的草稿。英文标准定义：The practice of selecting and organizing the instructions, history, files, tools, and results that a model needs for the current task.
analogy: 可以先把 上下文工程 想成软件开发工具箱里一个有明确用途的标签；真正使用时仍要结合所在代码、数据流和用户场景判断。
mechanism: 上下文工程 是“AI 与 Vibe Coding”中的术语。当前为待人工审校的草稿。英文标准定义：The practice of selecting and organizing the instructions, history, files, tools, and results that a model needs for the current task.
why_it_matters: 理解 上下文工程 后，你能更准确地告诉 AI 你指的是系统的哪一部分，并要求它给出可验证的实现证据。
project_example: 理解 上下文工程 后，你能更准确地告诉 AI 你指的是系统的哪一部分，并要求它给出可验证的实现证据。
ai_prompt_example: 解释 上下文工程 在这个项目中的作用。指出涉及的文件或系统边界，只做最小必要改动，并给出我可以验证结果的步骤。
common_mistake: 只记住 上下文工程 这个名词，却没有检查它在当前项目里的真实行为、数据流和失败情况。
