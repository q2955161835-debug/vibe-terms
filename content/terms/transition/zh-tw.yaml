why_it_matters: "了解轉場後，Vibe Coding 初學者可以準確指出相關的前端工程問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在建立介面與邏輯階段，將「轉場」放進頁面、元件或樣式規則中：檢查重點是「當狀態變更時在屬性值之間進行內插的 CSS 或動畫行為」，確認實際結果符合需求。"
