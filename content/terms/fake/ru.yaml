title: Фейк
short_definition: Облегченная рабочая реализация интерфейса, используемая в тестах вместо производственной зависимости.
analogy: 'Представьте «Fake» как инструмент в наборе разработчика: он решает задачу в области «Тестирование и отладка»,
  но результат зависит от настройки.'
mechanism: 'Как работает «Fake»: Облегченная рабочая реализация интерфейса, используемая в тестах вместо производственной
  зависимости. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Фейк» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Fake» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Fake». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Fake» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
status: draft
