title: "指数退避"
short_definition: "一种重试策略，可在每次失败后增加延迟，以减少不可用服务的压力。"
analogy: "将指数退避视为开发工作台后端和 API 部分中的带标签的工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自实现。"
mechanism: "一种重试策略，可在每次失败后增加延迟，以减少不可用服务的压力。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解指数退避让 Vibe Coding 初学者能够准确命名他们所指的后端和 API 关注点，并要求 AI 编程代理进行更改以及行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者达到数据同一性阶段时，使用指数退避作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释指数退避如何应用于该项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将术语“指数退避”视为实现正确的证据，而不检查实际行为、数据流、权限、失败案例或相关测试。"
