title: "包浩斯"
short_definition: "現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成。"
analogy: "在介面設計中，「包浩斯」像畫面上的一個互動零件：它對應「現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成」，也要透過實際操作檢查。"
mechanism: "現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解包浩斯後，Vibe Coding 初學者可以準確指出相關的 UI/UX 與無障礙問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在設計體驗階段，將「包浩斯」放進頁面、互動元件或設計稿中：檢查重點是「現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「包浩斯」為例，說明如何實現「現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「包浩斯」這個名稱就判定已經正確實作；請根據「現代主義設計傳統結合了幾何形狀、功能目的、減少裝飾和系統組成」檢查實際行為、資料流、錯誤情境與測試結果。"
