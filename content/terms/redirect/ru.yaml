title: Перенаправление
short_definition: HTTP-ответ или правило приложения, которое сообщает клиенту запросить другой URL-адрес.
analogy: 'Проще представить «Redirect» как правило работы в разделе «Web и сети»: название задает направление, а
  код показывает поведение.'
mechanism: 'Как работает «Redirect»: HTTP-ответ или правило приложения, которое сообщает клиенту запросить другой
  URL-адрес. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый
  результат.'
why_it_matters: Понимание термина «Перенаправление» помогает точно назвать проблему в области «Web и сети», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Redirect» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Redirect». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Redirect» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
