title: バックグラウンドジョブ
short_definition: 電子メールの送信やメディアの処理など、ユーザーのフォアグラウンド要求の外部で非同期に実行される作業。
analogy: バックグラウンドジョブは、ワークショップのバックエンドおよび API 部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: 電子メールの送信やメディアの処理など、ユーザーのフォアグラウンド要求の外部で非同期に実行される作業。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: バックグラウンドジョブを知ることで、Vibe Codingの初心者は、バックエンドと API の関連する課題を正確に言語化し、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がデータ同一性段階に到達したときに語彙チェックポイントとして バックグラウンドジョブを使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: バックグラウンドジョブがこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー
  フローを示します。
common_mistake: バックグラウンドジョブ という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
