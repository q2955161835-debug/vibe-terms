title: "客户评价"
short_definition: "来自客户或用户的来源声明，用作经验或价值的定性证据。"
analogy: "将客户评价视为开发工作台的 UI/UX 与无障碍部分中的带标签工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自于实现。"
mechanism: "来自客户或用户的来源声明，用作经验或价值的定性证据。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解客户评价后，Vibe Coding 初学者可以准确说出他们所指的 UI/UX 与无障碍问题，并要求 AI 编程代理进行更改以及证明行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者到达设计阶段时，使用客户评价作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释客户评价如何应用于该项目。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将术语“客户评价”视为实现正确的证据，而不检查实际行为、数据流、权限、故障案例或相关测试。"
