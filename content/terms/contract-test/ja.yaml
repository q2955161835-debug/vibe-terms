title: コントラクトテスト
short_definition: コンポーネントまたはサービス間のインターフェースが、合意したリクエスト、レスポンス、メッセージの契約に準拠することを検証するテスト。
analogy: コントラクトテストは、ワークショップのテストおよびデバッグ部分にあるラベル付きツールと考えてください。ラベルは、どの問題領域を検査するかを示しますが、実際の動作は依然として実装によって決まります。
mechanism: コンポーネントまたはサービス間のインターフェイスが、合意された要求、応答、またはメッセージ コントラクトに準拠していることを検証するテスト。実際のプロジェクトでは、その正確な動作は周囲のテクノロジー、構成、データフローに依存するため、ラベルだけに依存するのではなく、具体的な実装を確認してください。
why_it_matters: コントラクトテストを知ることで、Vibe Codingの初心者は、テストとデバッグに関する関連する課題を正確に言語化し、AIコーディングエージェントに変更を依頼し、動作が正しいことを示す証拠も求められます。
project_example: Vibe Termsでは、学習者がテスト保護段階に到達したときに語彙チェックポイントとして コントラクトテストを使用します。定義を個別に教えるのではなく、具体的な1つのページ、ファイル、リクエスト、データ構造、または検証ステップに接続します。
ai_prompt_example: コントラクトテストがこのプロジェクトにどのように適用されるかを説明してください。関係する正確なファイルまたはシステム境界を指定し、必要な最小限の変更のみを加え、結果の検証に使用できるコマンドまたはユーザー
  フローを示します。
common_mistake: コントラクトテスト という用語を、実際の動作、データフロー、権限、失敗例、または関連するテストを確認せずに、実装が正しいことを証明するものとして扱うこと。
