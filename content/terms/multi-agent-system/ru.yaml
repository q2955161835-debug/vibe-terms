title: Мультиагентная система
short_definition: Система, в которой несколько агентов с отдельными ролями или контекстами координируют свои действия
  для решения более крупной задачи.
analogy: '«Мультиагентная система» похож на понятную табличку на нужном ящике: она направляет, однако содержимое
  все равно нужно проверить.'
mechanism: 'Как работает «Мультиагентная система»: Система, в которой несколько агентов с отдельными ролями или
  контекстами координируют свои действия для решения более крупной задачи. На практике механизм зависит от конфигурации,
  потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Мультиагентная система» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Мультиагентная система» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Мультиагентная система». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Мультиагентная система» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
