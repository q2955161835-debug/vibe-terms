    - {id: fixed-rule, role: rule, label_key: fixed_rule, value: ".toolbar .save-button.is-ready { color: #0f766e; }"}
    - {id: preview, role: preview, label_key: preview, value: "Save changes"}
    - {id: computed-color, role: result, label_key: computed, value_from: color}
  relations: [{from: base-rule, to: computed-color}, {from: override-rule, to: computed-color}, {from: fixed-rule, to: computed-color}, {from: computed-color, to: preview}]
