title: Working Directory
short_definition: The directory a process or shell currently treats as the base for relative paths.
analogy: 'Think of Working Directory as a labeled tool in the computing & development environment part of a workshop: the label tells you what problem area to inspect, but the real behavior still comes from the implementation.'
mechanism: The directory a process or shell currently treats as the base for relative paths. In a real project, its exact behavior depends on the surrounding technology, configuration, and data flow, so verify the concrete implementation rather than relying on the label alone.
why_it_matters: Knowing Working Directory lets a Vibe Coding beginner name the exact computing & development environment concern they mean and ask an AI coding agent for a change plus evidence that the behavior is correct.
project_example: In Vibe Terms, use Working Directory as a vocabulary checkpoint when a learner reaches the environment stage; connect the definition to one visible page, file, request, data structure, or verification step rather than teaching it in isolation.
ai_prompt_example: Explain how Working Directory applies to this project. Point to the exact files or system boundary involved, make only the smallest necessary change, and show the command or user flow I can use to verify the result.
common_mistake: Treating the term Working Directory as proof that an implementation is correct without checking actual behavior, data flow, permissions, failure cases, or the relevant test.
quiz:
- question: Which description best matches Working Directory?
  options:
  - The directory a process or shell currently treats as the base for relative paths.
  - A visual decoration that has no effect on software behavior.
  - A guarantee that every implementation is secure and correct.
  answer: 0
- question: When an AI says it used Working Directory, what should you do next?
  options:
  - Accept the label as proof.
  - Check the concrete implementation and verify the relevant behavior.
  - Rename the files so the term appears in the project.
  answer: 1
- question: Which prompt is more useful for working with Working Directory?
  options:
  - “Make Working Directory better.”
  - “Explain where Working Directory appears, change the smallest necessary part, and show how to verify it.”
  - “Rewrite the whole project.”
  answer: 1
