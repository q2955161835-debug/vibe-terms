title: shadcn/ui
short_definition: Ein Sammlungs- und Verteilungsansatz zum Kopieren zugänglicher React-Komponentenquellen in ein Projekt,
  sodass die Anwendung Eigentümer des Codes ist und ihn anpasst.
analogy: 'Ordne shadcn/ui im Bereich Frontend-Entwicklung als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch erst
  die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Ein Sammlungs- und Verteilungsansatz zum Kopieren zugänglicher React-Komponentenquellen in ein Projekt, sodass
  die Anwendung Eigentümer des Codes ist und ihn anpasst. In einem realen Projekt hängt die genaue Ausprägung von Technologie,
  Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer shadcn/ui versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir shadcn/ui in der Phase Oberflächenlogik als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie shadcn/ui in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff shadcn/ui als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
