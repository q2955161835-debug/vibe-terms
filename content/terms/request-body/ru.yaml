title: Request Body
short_definition: 'Request Body — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The payload sent inside an HTTP request, commonly containing JSON, form data, or uploaded bytes.'
analogy: Request Body можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Request Body — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The payload sent inside an HTTP request, commonly containing JSON, form data, or uploaded bytes.'
why_it_matters: Понимание Request Body помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Request Body помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Request Body в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Request Body доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
