title: Pull request
short_definition: Рабочий процесс хостинга Git для предложения изменений ветки, их обсуждения, выполнения проверок
  и проверки перед интеграцией.
analogy: 'Представьте «Pull request» как инструмент в наборе разработчика: он решает задачу в области «Git и совместная
  работа», но результат зависит от настройки.'
mechanism: 'Как работает «Pull request»: Рабочий процесс хостинга Git для предложения изменений ветки, их обсуждения,
  выполнения проверок и проверки перед интеграцией. На практике механизм зависит от конфигурации, потока данных
  и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Pull request» помогает точно назвать проблему в области «Git и совместная работа», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Pull request» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Pull request». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Pull request» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
