title: Lockfile
short_definition: Eine generierte Datei, die exakt aufgelöste Abhängigkeitsversionen aufzeichnet, damit Installationen reproduziert
  werden können.
analogy: 'Für Sperrdatei hilft ein Bild aus Computer & Entwicklungsumgebung: Das Etikett weist auf das Problemfeld, ersetzt
  aber weder den Code noch die Prüfung des Datenflusses.'
mechanism: Eine generierte Datei, die exakt aufgelöste Abhängigkeitsversionen aufzeichnet, damit Installationen reproduziert
  werden können. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Sperrdatei versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Computer & Entwicklungsumgebung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Sperrdatei in der Phase Umgebung als Lerncheckpoint. Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Sperrdatei in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Sperrdatei als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
