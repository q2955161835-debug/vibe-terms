title: "代理"
short_definition: "在客户端和另一个服务之间转发流量的中介，通常用于策略、缓存、隐私或路由。"
analogy: "将 代理 视为开发工作台的网络与网络部分中的带标签工具：标签告诉你要检查哪些问题区域，但真正的行为仍然来自于实现。"
mechanism: "在客户端和另一个服务之间转发流量的中介，通常用于策略、缓存、隐私或路由。在实际项目中，其确切行为取决于周围的技术、配置和数据流，因此请验证具体实现，而不是仅依赖标签。"
why_it_matters: "了解 代理 可以让 Vibe Coding 初学者说出他们所指的确切网络与网络问题，并要求 AI 编程代理进行更改以及证明行为正确的证据。"
project_example: "在 Vibe Terms 中，当学习者到达环境阶段时，使用 代理 作为词汇检查点；将定义连接到一个可见的页面、文件、请求、数据结构或验证步骤，而不是孤立地教授它。"
ai_prompt_example: "解释一下代理如何应用到这个项目中。指出所涉及的确切文件或系统边界，仅进行最小的必要更改，并显示我可以用来验证结果的命令或用户流程。"
common_mistake: "将术语“代理”视为实现正确的证据，而不检查实际行为、数据流、权限、失败案例或相关测试。"
