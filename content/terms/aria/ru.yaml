title: ARIA
short_definition: Атрибуты и роли доступных полнофункциональных интернет-приложений, которые дополняют собственную
  семантику HTML, когда пользовательским виджетам требуется дополнительная информация о доступности.
analogy: '«ARIA» похож на маршрутную отметку в проекте: она помогает найти нужное место, но не заменяет проверку
  реализации.'
mechanism: 'Как работает «ARIA»: Атрибуты и роли доступных полнофункциональных интернет-приложений, которые дополняют
  собственную семантику HTML, когда пользовательским виджетам требуется дополнительная информация о доступности.
  На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «ARIA» помогает точно назвать проблему в области «UI/UX и доступность», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «ARIA» в одном пользовательском потоке или тесте, зафиксируйте вход,
  ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «ARIA». Укажи файлы и границу системы, внеси минимальное
  изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «ARIA» доказательством правильной реализации и не проверять фактическое
  поведение, данные, права доступа, ошибки и соответствующий тест.
