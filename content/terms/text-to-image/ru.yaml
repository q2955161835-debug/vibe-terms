title: Преобразование текста в изображение
short_definition: Генеративная задача, создающая изображение из текстового описания.
analogy: 'Проще представить «Text-to-Image» как правило работы в разделе «ИИ и Vibe Coding»: название задает направление,
  а код показывает поведение.'
mechanism: 'Как работает «Text-to-Image»: Генеративная задача, создающая изображение из текстового описания. На
  практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Преобразование текста в изображение» помогает точно назвать проблему в области «ИИ и Vibe Coding», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Text-to-Image» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Text-to-Image». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Text-to-Image» доказательством правильной реализации и не проверять
  фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
