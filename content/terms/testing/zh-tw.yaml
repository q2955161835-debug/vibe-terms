title: "測試"
short_definition: "系統地檢查軟體的行為是否符合預期，並在修改後繼續這樣做。"
analogy: "可以把測試想成顧客進入大樓前，用來發現壞門的檢查清單。"
why_it_matters: "了解測試後，Vibe Coding 初學者可以準確指出相關的測試與除錯問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
ai_prompt_example: "新增回歸測試，在錯誤修復之前失敗並在錯誤修復之後透過。"
common_mistake: "僅單擊一次快樂路徑並呼叫測試的功能。"
status: draft
source_content_version: 1
