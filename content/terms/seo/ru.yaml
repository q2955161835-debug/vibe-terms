title: SEO
short_definition: 'SEO — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The practice of making web content understandable, crawlable, and useful to search engines while serving real user intent.'
analogy: SEO можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'SEO — термин из раздела «Web и сети». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The practice of making web content understandable, crawlable, and useful to search engines while serving real user intent.'
why_it_matters: Понимание SEO помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание SEO помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль SEO в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название SEO доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
