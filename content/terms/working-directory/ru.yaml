title: Рабочий каталог
short_definition: Каталог, который процесс или оболочка в настоящее время рассматривает как основу для относительных
  путей.
analogy: 'Проще представить «Рабочий каталог» как правило работы в разделе «Компьютеры и среда разработки»: название
  задает направление, а код показывает поведение.'
mechanism: 'Как работает «Рабочий каталог»: Каталог, который процесс или оболочка в настоящее время рассматривает
  как основу для относительных путей. На практике механизм зависит от конфигурации, потока данных и границы системы;
  проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Рабочий каталог» помогает точно назвать проблему в области «Компьютеры и среда разработки», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Рабочий каталог» в одном пользовательском потоке или тесте, зафиксируйте
  вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Рабочий каталог». Укажи файлы и границу системы, внеси
  минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Рабочий каталог» доказательством правильной реализации и не
  проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
