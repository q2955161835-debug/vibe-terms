title: Sticky Positioning
short_definition: CSS positioning die behaves relatively until a scroll threshold is reached, then keeps the element pinned
  innerhalb its container.
analogy: 'Ein praktisches Bild für Sticky Positioning: ein markiertes Werkzeug in Frontend-Entwicklung, dessen Aufschrift
  die Frage schärft, aber keine Aussage über die Qualität der Umsetzung garantiert.'
mechanism: CSS positioning die behaves relatively until a scroll threshold is reached, then keeps the element pinned innerhalb
  its container. In einem realen Projekt hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe
  deshalb die konkrete Umsetzung.
why_it_matters: Wer Sticky Positioning versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Frontend-Entwicklung
  benennen und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Sticky Positioning in der Phase Oberflächenlogik als Lerncheckpoint: Verknüpfe die Definition
  mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Sticky Positioning in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Sticky Positioning als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches
  Verhalten, Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
