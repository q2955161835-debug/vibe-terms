title: Image
short_definition: 'Image — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Visual raster or vector content displayed in an interface with intentional sizing, crop behavior, and alternative text where needed.'
analogy: Image можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Image — термин из раздела «UI/UX и доступность». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: Visual raster or vector content displayed in an interface with intentional sizing, crop behavior, and alternative text where needed.'
why_it_matters: Понимание Image помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Image помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Image в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Image доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
