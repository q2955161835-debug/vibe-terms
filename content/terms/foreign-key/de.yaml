title: Fremdschlüssel
short_definition: Ein Feld oder eine Einschränkung, die auf einen Schlüssel in einer anderen Tabelle verweist, um eine Beziehung
  darzustellen und zu schützen.
analogy: 'Ordne Fremdschlüssel im Bereich Daten & Datenbanken als Werkzeug ein: Die Bezeichnung grenzt die Frage ein, doch
  erst die konkrete Implementierung zeigt, wie es sich verhält.'
mechanism: Ein Feld oder eine Einschränkung, die auf einen Schlüssel in einer anderen Tabelle verweist, um eine Beziehung
  darzustellen und zu schützen. In einem realen Projekt hängt die genaue Ausprägung von Technologie, Konfiguration und Datenfluss
  ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Fremdschlüssel versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in Daten & Datenbanken benennen
  und von einem KI-Coding-Agenten eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: In Vibe Terms begegnet dir Fremdschlüssel in der Phase Daten & Identität als Lerncheckpoint. Verknüpfe die
  Definition mit einer sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt.
ai_prompt_example: Erkläre, wie Fremdschlüssel in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Fremdschlüssel als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
