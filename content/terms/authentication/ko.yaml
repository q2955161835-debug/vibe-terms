title: 인증
short_definition: 사용자가 자신이 주장하는 바로 그 사람인지 확인하는 과정.
analogy: 입구에서 신분증을 보여 주어 어떤 계정이 본인 것인지 확인받는 것과 같습니다.
mechanism: 인증은 비밀번호, 패스키 또는 토큰 같은 증거를 검증해 요청 주체의 신원을 확인합니다.
why_it_matters: 로그인은 보안에 민감한 기능이므로 AI가 임의의 인증 방식을 만들게 해서는 안 됩니다.
project_example: 이 프로젝트의 익명 학습 흐름에는 계정 인증을 추가하지 않으며, 향후 도입 시 세션 경계를 별도로 검증해야 합니다.
ai_prompt_example: 기존 인증 제공업체를 사용하고 권한 검사는 서버에서 수행하세요. 자체 비밀번호 시스템은 만들지 마세요.
common_mistake: 인증인 “누구인가”와 인가인 “무엇을 할 수 있는가”를 혼동하는 것.
status: draft
