title: "短期記憶"
short_definition: "在工作階段或工作流程期間使用的暫時任務狀態，通常在之後丟棄或總結。"
analogy: "在 AI 協作中，可以把「短期記憶」看成一個檢查點：先確認「在工作階段或工作流程期間使用的暫時任務狀態，通常在之後丟棄或總結」，再用實際輸出檢查結果。"
mechanism: "在工作階段或工作流程期間使用的臨時任務狀態，通常在之後丟棄或匯總。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解短期記憶後，Vibe Coding 初學者可以準確指出相關的 AI 與 Vibe Coding 問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在定義需求階段，將「短期記憶」放進提示、模型輸出或評估紀錄中：檢查重點是「在工作階段或工作流程期間使用的暫時任務狀態，通常在之後丟棄或總結」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「短期記憶」為例，說明如何實現「在工作階段或工作流程期間使用的暫時任務狀態，通常在之後丟棄或總結」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「短期記憶」這個名稱就判定已經正確實作；請根據「在工作階段或工作流程期間使用的暫時任務狀態，通常在之後丟棄或總結」檢查實際行為、資料流、錯誤情境與測試結果。"
