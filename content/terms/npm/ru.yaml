title: npm
short_definition: 'npm — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The default package manager and script runner distributed with Node.js, commonly used to install JavaScript dependencies and run project commands.'
analogy: npm можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'npm — термин из раздела «Компьютеры и среда разработки». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: The default package manager and script runner distributed with Node.js, commonly used to install JavaScript dependencies and run project commands.'
why_it_matters: Понимание npm помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание npm помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль npm в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название npm доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
