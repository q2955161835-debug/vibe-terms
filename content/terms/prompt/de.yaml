title: Prompt
short_definition: Die Anweisung oder context you give an AI Modell zu guide its nächste Antwort oder action.
analogy: Betrachte Prompt als Orientierungsschild in ai vibe. Es weist auf die richtige technische Stelle, ersetzt aber weder
  die Implementierung noch deren Prüfung.
mechanism: Die Anweisung oder context you give an AI Modell zu guide its nächste Antwort oder action. In einem realen Projekt
  hängt das genaue Verhalten von Technologie, Konfiguration und Datenfluss ab; prüfe deshalb die konkrete Umsetzung.
why_it_matters: Wer Prompt versteht, kann als Vibe-Coding-Anfänger das konkrete Thema in ai vibe benennen und von einem KI-Coding-Agenten
  eine gezielte Änderung mit überprüfbaren Nachweisen verlangen.
project_example: 'In Vibe Terms dient Prompt in der Phase Anforderungen als Lerncheckpoint: Verknüpfe die Definition mit einer
  sichtbaren Seite, Datei, Anfrage, Datenstruktur oder einem Prüfschritt, statt sie isoliert zu lernen.'
ai_prompt_example: Erkläre, wie Prompt in diesem Projekt angewendet wird. Nenne die betroffenen Dateien oder Systemgrenzen,
  ändere nur das Nötigste und zeige den Befehl oder Nutzerfluss zur Verifikation.
common_mistake: Den Begriff Prompt als Beleg für eine korrekte Implementierung zu behandeln, ohne tatsächliches Verhalten,
  Datenfluss, Berechtigungen, Fehlerfälle und den relevanten Test zu prüfen.
status: draft
