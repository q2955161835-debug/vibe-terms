title: Фронтенд
short_definition: Часть приложения, которую пользователь видит и с которой взаимодействует напрямую.
analogy: Как торговый зал, по которому ходят покупатели, а не склад за ним.
why_it_matters: Большинство визуальных запросов в Vibe Coding меняют фронтенд, поэтому термин помогает
  точно ограничить задачу.
ai_prompt_example: Измени только расположение карточек терминов во фронтенде. Не меняй ответы API и таблицы
  базы данных.
common_mistake: Называть весь сайт «фронтендом», хотя задача требует и серверных изменений.
status: draft
source_content_version: 1
