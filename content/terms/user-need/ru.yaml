title: Потребность пользователя
short_definition: Ориентированное на пользователя заявление о цели, проблеме или возможностях, которые продукт должен
  помочь удовлетворить.
analogy: '«Потребность пользователя» похож на маршрутную отметку в проекте: она помогает найти нужное место, но
  не заменяет проверку реализации.'
mechanism: 'Как работает «Потребность пользователя»: Ориентированное на пользователя заявление о цели, проблеме
  или возможностях, которые продукт должен помочь удовлетворить. На практике механизм зависит от конфигурации, потока
  данных и границы системы; проверьте код и наблюдаемый результат.'
why_it_matters: Понимание термина «Потребность пользователя» помогает точно назвать проблему в области «Продукт и требования», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Потребность пользователя» в одном пользовательском потоке или тесте,
  зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Потребность пользователя». Укажи файлы и границу системы,
  внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Потребность пользователя» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
