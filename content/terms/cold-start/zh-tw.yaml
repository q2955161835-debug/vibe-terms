title: "冷啟動"
short_definition: "當按需執行時必須在處理請求之前初始化新執行個體時發生的啟動延遲。"
analogy: "在部署與維運中，「冷啟動」像發布流程上的控制點：它處理「當按需執行時必須在處理請求之前初始化新執行個體時發生的啟動延遲」，要用日誌、監控或回滾結果確認。"
mechanism: "當按需執行時必須在處理請求之前初始化新例項時發生的啟動延遲。在實際專案中，其確切行為取決於周圍的技術、設定和資料流，因此請驗證具體實作，而不是僅依賴標籤。"
why_it_matters: "了解冷啟動後，Vibe Coding 初學者可以準確指出相關的部署與維運問題，並要求 AI 編碼助理作出有針對性的修改，同時提供可驗證的結果。"
project_example: "在部署與維護階段，將「冷啟動」放進建置、部署或監控紀錄中：檢查重點是「當按需執行時必須在處理請求之前初始化新執行個體時發生的啟動延遲」，確認實際結果符合需求。"
ai_prompt_example: "請以專案中的「冷啟動」為例，說明如何實現「當按需執行時必須在處理請求之前初始化新執行個體時發生的啟動延遲」。請指出相關檔案與系統邊界，只做必要修改，並提供可執行的驗證命令或操作流程。"
common_mistake: "不要只因為看見「冷啟動」這個名稱就判定已經正確實作；請根據「當按需執行時必須在處理請求之前初始化新執行個體時發生的啟動延遲」檢查實際行為、資料流、錯誤情境與測試結果。"
