title: Unit Test
short_definition: 'Unit Test — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An automated test that verifies a small unit of logic in isolation from unnecessary external systems.'
analogy: Unit Test можно представить как подписанный инструмент в наборе разработчика; на практике всё равно нужно проверить код, поток данных и пользовательский сценарий.
mechanism: 'Unit Test — термин из раздела «Тестирование и отладка». Русский текст пока является черновиком до редакторской проверки. Эталонное определение на английском: An automated test that verifies a small unit of logic in isolation from unnecessary external systems.'
why_it_matters: Понимание Unit Test помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
project_example: Понимание Unit Test помогает точнее объяснить ИИ, какую часть системы вы имеете в виду, и потребовать проверяемые доказательства результата.
ai_prompt_example: Объясни роль Unit Test в этом проекте. Укажи затронутые файлы или границы системы, внеси минимально необходимое изменение и опиши способ проверки.
common_mistake: Считать само название Unit Test доказательством правильности реализации и не проверять поведение, поток данных и сценарии отказа.
