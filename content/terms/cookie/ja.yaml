title: Cookie
short_definition: Webサイトに関連付けられ、スコープ、セキュリティ、SameSiteルールに従って送信される、ブラウザー管理の小さなデータ。
analogy: Cookieは、セキュリティとプライバシーの課題を見つけるための目印にたとえられます。目印は確認すべき問題領域を示しますが、実際の挙動は実装によって決まります。
mechanism: Cookieはブラウザーが保存し、指定されたドメインやパス、属性に応じてリクエストへ付加します。実際のプロジェクトでは、HttpOnly、Secure、SameSiteなどの設定を確認してください。
why_it_matters: Cookieを知ると、Vibe Coding初心者でも、セキュリティとプライバシーの課題を正確に言葉にし、AIコーディングエージェントに変更を依頼して、動作が正しいことを示す証拠を求められます。
project_example: Vibe Termsでは、Cookieをテストと保護の段階の用語チェックポイントとして扱います。定義を単独で覚えるのではなく、具体的なページ、ファイル、リクエスト、データ構造、または検証手順のいずれかに結び付けます。
ai_prompt_example: このプロジェクトでCookieがどう使われるか説明してください。関係する正確なファイルまたはシステム境界を示し、必要最小限の変更だけを加え、結果の検証に使えるコマンドまたはユーザーフローを提示してください。
common_mistake: 「Cookie」という用語があるだけで実装を正しいとみなし、実際の挙動、データフロー、権限、失敗時のケース、関連するテストを確認しないことです。
