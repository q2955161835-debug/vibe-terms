title: Разработка через тестирование
short_definition: Рабочий процесс разработки, при котором сначала пишется неудачный тест, реализуется минимальный
  код для прохождения, а затем выполняется рефакторинг, сохраняя при этом тесты зелеными.
analogy: '«Разработка через тестирование» похож на маршрутную отметку в проекте: она помогает найти нужное место,
  но не заменяет проверку реализации.'
mechanism: 'Как работает «Разработка через тестирование»: Рабочий процесс разработки, при котором сначала пишется
  неудачный тест, реализуется минимальный код для прохождения, а затем выполняется рефакторинг, сохраняя при этом
  тесты зелеными. На практике механизм зависит от конфигурации, потока данных и границы системы; проверьте код и
  наблюдаемый результат.'
why_it_matters: Понимание термина «Разработка через тестирование» помогает точно назвать проблему в области «Тестирование и отладка», выбрать границу изменения и запросить у ИИ проверяемый результат до выпуска.
project_example: 'Пример в проекте: примените «Разработка через тестирование» в одном пользовательском потоке или
  тесте, зафиксируйте вход, ожидаемый результат и способ проверки; не оставляйте термин только названием.'
ai_prompt_example: Объясни, где в этом проекте используется «Разработка через тестирование». Укажи файлы и границу
  системы, внеси минимальное изменение и покажи команду или пользовательский сценарий проверки.
common_mistake: Частая ошибка — считать само слово «Разработка через тестирование» доказательством правильной реализации
  и не проверять фактическое поведение, данные, права доступа, ошибки и соответствующий тест.
